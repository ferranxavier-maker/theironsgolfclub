"""
parse_html_constants.py — extractor autocontenido en Python puro
Reemplaza a extract_constants.js (Node). Lee directamente el HTML del proyecto
Super ROC y devuelve un dict con todas las constantes JS necesarias para
construir el Excel maestro.

USO:
    from parse_html_constants import parse_html_constants
    constants = parse_html_constants(html_text)
    # constants tiene: RAW, HM, IC, RANKING_DATA, TORNEOS_DATA, TOUR_DATA,
    # ENTRENAMIENTOS_DATA, EQUIPO, EX_JUGADORES, CAMPOS, CRONICAS,
    # APODO_A_NOMBRES_IC, COLORS, HOYO_APODOS, TRAMOS_FIJOS,
    # ABANDONOS_REGISTRADOS, COPA
"""
import re, json


def _find_balanced(text, start_idx, open_ch, close_ch):
    """Devuelve (substring inclusivo, end_idx) del bloque balanceado que arranca
    en text[start_idx] == open_ch. Considera strings con comillas simples,
    dobles y backticks (no parsea su contenido para llaves)."""
    if text[start_idx] != open_ch:
        raise ValueError(f"se esperaba '{open_ch}' en {start_idx}, vi {text[start_idx]!r}")
    depth = 0
    i = start_idx
    in_str = None       # None | "'" | '"' | "`"
    escape = False
    while i < len(text):
        c = text[i]
        if in_str:
            if escape:
                escape = False
            elif c == '\\':
                escape = True
            elif c == in_str:
                in_str = None
        else:
            if c in ("'", '"', '`'):
                in_str = c
            elif c == open_ch:
                depth += 1
            elif c == close_ch:
                depth -= 1
                if depth == 0:
                    return text[start_idx:i+1], i+1
        i += 1
    raise ValueError(f"bloque balanceado no cerrado desde {start_idx}")


def _expand_array_from(s):
    """Expande Array.from({length:N},(_,i)=>(<tmpl>)) a un array literal con N elementos."""
    pattern = re.compile(
        r'Array\.from\(\s*\{\s*length\s*:\s*(\d+)\s*\}\s*,\s*\(_\s*,\s*i\s*\)\s*=>\s*\(',
        re.DOTALL
    )
    while True:
        m = pattern.search(s)
        if not m: break
        i = m.end()
        while i < len(s) and s[i].isspace(): i += 1
        if s[i] != '{': break
        block, end_block = _find_balanced(s, i, '{', '}')
        j = end_block
        while j < len(s) and s[j] in ' \t': j += 1
        if s[j] != ')': break
        j += 1
        while j < len(s) and s[j] in ' \t': j += 1
        if s[j] != ')': break
        j += 1
        n = int(m.group(1))
        items = []
        for k in range(n):
            item = re.sub(r'\bi\s*\+\s*1\b', str(k+1), block)
            item = re.sub(r'\bi\b', str(k), item)
            items.append(item)
        replacement = '[' + ','.join(items) + ']'
        s = s[:m.start()] + replacement + s[j:]
    return s


def _expand_map(s):
    """Expande [<lista>].map((m,i)=>({...usa m e i...})) a array literal expandido."""
    pattern = re.compile(r'\.map\s*\(\s*\(\s*m\s*,\s*i\s*\)\s*=>\s*\(', re.DOTALL)
    while True:
        m = pattern.search(s)
        if not m: break
        # Atrás está la lista entre []
        # Buscar el [ que abre la lista (justo antes del '.map')
        j = m.start() - 1
        while j >= 0 and s[j].isspace(): j -= 1
        if s[j] != ']': break
        # Encontrar el [ correspondiente
        depth = 0
        k = j
        while k >= 0:
            if s[k] == ']': depth += 1
            elif s[k] == '[':
                depth -= 1
                if depth == 0: break
            k -= 1
        if k < 0: break
        # Parsear la lista
        try:
            valores = json.loads(s[k:j+1])
        except Exception:
            break
        # Sacar el template del callback
        tpl_start = m.end()
        while tpl_start < len(s) and s[tpl_start].isspace(): tpl_start += 1
        if s[tpl_start] != '{': break
        block, end_block = _find_balanced(s, tpl_start, '{', '}')
        # Tras el bloque viene ')' y ')'
        p = end_block
        while p < len(s) and s[p].isspace(): p += 1
        if s[p] != ')': break
        p += 1
        while p < len(s) and s[p].isspace(): p += 1
        if s[p] != ')': break
        p += 1
        # Sustituir m e i en el template
        items = []
        for idx, val in enumerate(valores):
            it = re.sub(r'\bi\s*\+\s*1\b', str(idx+1), block)
            it = re.sub(r'\bm\b', json.dumps(val), it)
            it = re.sub(r'\bi\b', str(idx), it)
            items.append(it)
        replacement = '[' + ','.join(items) + ']'
        s = s[:k] + replacement + s[p:]
    return s


def _js_to_json(s):
    """Convierte JS a JSON. Estrategia: tokenizar strings primero a placeholders,
    aplicar transformaciones léxicas al esqueleto, restituir strings al final."""
    placeholders = []  # lista de strings JSON-válidos
    def emit_placeholder(content):
        idx = len(placeholders)
        placeholders.append(json.dumps(content))
        return f'\x00STR{idx}\x00'

    out = []
    i = 0
    while i < len(s):
        c = s[i]
        # Comentarios
        if c == '/' and i+1 < len(s) and s[i+1] == '/':
            j = s.find('\n', i); i = j if j != -1 else len(s); continue
        if c == '/' and i+1 < len(s) and s[i+1] == '*':
            j = s.find('*/', i); i = (j+2) if j != -1 else len(s); continue
        # Strings con comillas simples o dobles
        if c in ("'", '"'):
            quote = c
            j = i + 1
            content = []
            while j < len(s):
                if s[j] == '\\' and j+1 < len(s):
                    nxt = s[j+1]
                    # Escape secuences comunes
                    if nxt == 'n': content.append('\n')
                    elif nxt == 't': content.append('\t')
                    elif nxt == 'r': content.append('\r')
                    elif nxt in ('\\', '"', "'", '`'): content.append(nxt)
                    else: content.append(nxt)
                    j += 2
                    continue
                if s[j] == quote: break
                content.append(s[j])
                j += 1
            out.append(emit_placeholder(''.join(content)))
            i = j + 1
            continue
        # Template strings (backticks)
        if c == '`':
            j = i + 1
            content = []
            while j < len(s):
                if s[j] == '\\' and j+1 < len(s):
                    nxt = s[j+1]
                    if nxt == 'n': content.append('\n')
                    elif nxt == 't': content.append('\t')
                    elif nxt in ('\\','`','"',"'"): content.append(nxt)
                    else: content.append(nxt)
                    j += 2
                    continue
                if s[j] == '`': break
                content.append(s[j])
                j += 1
            out.append(emit_placeholder(''.join(content)))
            i = j + 1
            continue
        out.append(c)
        i += 1
    s2 = ''.join(out)
    # Transformaciones léxicas sobre el ESQUELETO (sin contenido de strings)
    s2 = _expand_array_from(s2)
    s2 = _expand_map(s2)
    s2 = re.sub(r'(?P<pre>[\{,\s])(?P<key>[\w$]+)\s*:', r'\g<pre>"\g<key>":', s2, flags=re.UNICODE)
    s2 = re.sub(r',(\s*[\}\]])', r'\1', s2)
    s2 = re.sub(r'\bundefined\b', 'null', s2)
    # Restituir placeholders por sus strings JSON
    def restore(m):
        idx = int(m.group(1))
        return placeholders[idx]
    s2 = re.sub(r'\x00STR(\d+)\x00', restore, s2)
    return s2


def _parse_js_block(s):
    """Convierte un bloque JS (array o objeto literal) a la estructura Python."""
    return json.loads(_js_to_json(s))


def _extract_decl(text, name, open_ch='[', close_ch=']'):
    """Localiza `const NAME = <open_ch>...<close_ch>` y devuelve el bloque parseado."""
    pat = re.compile(r'\bconst\s+' + re.escape(name) + r'\s*=\s*')
    m = pat.search(text)
    if not m: return None
    # Buscar el primer open_ch desde el final del match
    i = m.end()
    while i < len(text) and text[i] != open_ch: i += 1
    block, _ = _find_balanced(text, i, open_ch, close_ch)
    return _parse_js_block(block)


def _extract_pushes(text, var_name):
    """Recopila todos los .push(...) sobre var_name y devuelve lista parseada.
    Cada push() puede contener UNO O VARIOS objetos {...} separados por comas;
    se parsean todos (no solo el primero)."""
    items = []
    pat = re.compile(r'\b' + re.escape(var_name) + r'\s*\.\s*push\s*\(\s*')
    for m in pat.finditer(text):
        i = m.end()
        # Recorre todos los argumentos {...} de este push(), separados por comas,
        # hasta el ) de cierre. _find_balanced devuelve el índice tras el '}'.
        while i < len(text):
            while i < len(text) and text[i].isspace(): i += 1
            if i >= len(text) or text[i] == ')': break
            if text[i] == ',': i += 1; continue
            if text[i] != '{': break
            block, end = _find_balanced(text, i, '{', '}')
            try:
                items.append(_parse_js_block(block))
            except Exception:
                pass
            i = end
    return items


def _extract_copa(text):
    """Extrae const COPA_DATA = [...] global. Mantenida por compatibilidad —
    también la extrae directamente _extract_decl en el bucle principal."""
    return _extract_decl(text, 'COPA_DATA', '[', ']') or []


def parse_html_constants(html_text):
    """Devuelve dict con todas las constantes del proyecto Super ROC."""
    C = {}
    # Constantes simples (declaradas como const X = [...] o const X = {...})
    # Tuplas: (key dict, identificador JS en HTML, char open, char close).
    # Las constantes SR (RAW/HM/IC) llevan sufijo _DATA en el HTML para consistencia
    # con ENTRENAMIENTOS_DATA, RANKING_DATA, TORNEOS_DATA. Las keys del dict se mantienen
    # cortas para no impactar al builder.
    for key, js_name, ch_open, ch_close in [
        ('RAW',                 'RAW_DATA',             '[', ']'),
        ('HM',                  'HM_DATA',              '{', '}'),
        ('IC',                  'IC_DATA',              '{', '}'),
        ('RANKING_DATA',        'RANKING_DATA',         '[', ']'),
        ('TORNEOS_DATA',        'TORNEOS_DATA',         '[', ']'),
        ('TOUR_DATA',        'TOUR_DATA',         '[', ']'),
        ('EQUIPO',              'EQUIPO',               '[', ']'),
        ('CAMPOS',              'CAMPOS',               '[', ']'),
        ('CRONICAS',            'CRONICAS',             '{', '}'),
        ('APODO_A_NOMBRES_IC',  'APODO_A_NOMBRES_IC',   '{', '}'),
        ('HOYO_APODOS',         'HOYO_APODOS',          '{', '}'),
        ('TRAMOS_FIJOS',        'TRAMOS_FIJOS',         '{', '}'),
        ('ABANDONOS_REGISTRADOS','ABANDONOS_REGISTRADOS','[', ']'),
        ('ABANDONOS_GLOBAL',    'ABANDONOS_GLOBAL',     '[', ']'),
        ('COPA',                'COPA_DATA',            '[', ']'),
    ]:
        val = _extract_decl(html_text, js_name, ch_open, ch_close)
        if val is not None: C[key] = val

    # EX_JUGADORES: variable interna, también con `const ex = [...]` en algún sitio
    ex_v = _extract_decl(html_text, 'EX_JUGADORES', '[', ']')
    if ex_v is None:
        # alternativa: const ex = [...]
        ex_v = _extract_decl(html_text, 'ex', '[', ']')
    C['EX_JUGADORES'] = ex_v or []

    # ENTRENAMIENTOS_DATA: declarada como [] y luego pushed
    base = _extract_decl(html_text, 'ENTRENAMIENTOS_DATA', '[', ']') or []
    pushes = _extract_pushes(html_text, 'ENTRENAMIENTOS_DATA')
    C['ENTRENAMIENTOS_DATA'] = base + pushes

    # ── Recorridos por campo ──────────────────────────────────────────
    # En el HTML los recorridos NO están dentro del literal CAMPOS: se
    # asignan después con un forEach a partir de RECORRIDOS_DEFAULT y
    # RECORRIDOS_EXCEPCIONES. Aquí replicamos esa composición para que el
    # builder no tenga que mantener su propia lista (que se desincronizaba).
    rec_def = _extract_decl(html_text, 'RECORRIDOS_DEFAULT', '[', ']') or []
    rec_exc = _extract_decl(html_text, 'RECORRIDOS_EXCEPCIONES', '{', '}') or {}
    C['RECORRIDOS_DEFAULT'] = rec_def
    C['RECORRIDOS_EXCEPCIONES'] = rec_exc
    for _c in (C.get('CAMPOS') or []):
        _cid = _c.get('id', '')
        _c['recorridos'] = rec_exc.get(_cid, rec_def)

    # COPA: ya extraído arriba como COPA_DATA global. _extract_copa() sigue
    # disponible por compatibilidad pero no se necesita aquí.

    return C

    p = v.split('/')

    if isinstance(obj, dict):

import unicodedata as _ud
def _norm(s):
    """Normaliza: sin tildes, lowercase, trim."""
    if not s: return ''
    s = _ud.normalize('NFKD', s).encode('ascii', 'ignore').decode('ascii')
    return s.lower().strip()

def _first_two_tokens(s):
    toks = _norm(s).split()
    return ' '.join(toks[:2]) if toks else ''

    if key and key not in INDEX_2TOK:
        INDEX_2TOK[key] = apodo

def resolver_apodo(nombre):
    if not nombre: return nombre
    if nombre in APODO_ALIAS: return APODO_ALIAS[nombre]
    if nombre in NOMBRE_A_APODO: return NOMBRE_A_APODO[nombre]
    # Match por nombre + primer apellido normalizado (tolera tildes y typos en el resto)
    key = _first_two_tokens(nombre)
    if key in INDEX_2TOK: return INDEX_2TOK[key]
    # Fallback: substring parcial
    for full, apodo in NOMBRE_A_APODO.items():
        if full and (full in nombre or nombre in full):
            return apodo
    return nombre

# Helper para crear pestañas RAW_DATA
# ════════════════════════════════════════════════════════════════════
def crear_raw(name, filas, titulo, descripcion, cronicas_por_j=None):
    ws = wb.create_sheet(name)
    ws['A1'] = titulo
    ws['A1'].font = FONT_TITLE
    ws.merge_cells('A1:AE1')
    ws['A2'] = descripcion
    ws['A2'].font = FONT_NOTE
    ws['A2'].alignment = Alignment(wrap_text=True, vertical='top')
    ws.merge_cells('A2:AE2')
    ws.row_dimensions[2].height = 24

    set_header(ws, 3, COLS_RAW, freeze_below=False)
    ws.freeze_panes = 'D4'

    for i, r in enumerate(filas):
        excel_row = 4 + i
        ws.cell(row=excel_row, column=1, value=r['j'])
        ws.cell(row=excel_row, column=2, value=r.get('f','') or '')
        ws.cell(row=excel_row, column=3, value=r['jugador'])
        ws.cell(row=excel_row, column=4, value=r.get('campo','') or '')
        ws.cell(row=excel_row, column=5, value=r.get('recorrido','') or '')
        ws.cell(row=excel_row, column=6, value=r.get('tid','') or '')
        ws.cell(row=excel_row, column=7, value=bool(r.get('aband', False)))

        hoyos = r.get('hoyos') or [None]*18
        tiene = all(h is not None for h in hoyos)
        for k in range(18):
            if hoyos[k] is not None:
                ws.cell(row=excel_row, column=8+k, value=int(hoyos[k]))

        if tiene:
            ws.cell(row=excel_row, column=26, value=f'=SUM(H{excel_row}:Y{excel_row})-54')
            ws.cell(row=excel_row, column=27, value=f'=COUNTIF(H{excel_row}:Y{excel_row},"<=2")')
            ws.cell(row=excel_row, column=28, value=f'=COUNTIF(H{excel_row}:Y{excel_row},3)')
            ws.cell(row=excel_row, column=29, value=f'=COUNTIF(H{excel_row}:Y{excel_row},4)')
            ws.cell(row=excel_row, column=30, value=f'=COUNTIF(H{excel_row}:Y{excel_row},">=5")')
            for c in range(26,31):
                style_cell(ws.cell(row=excel_row, column=c), fill=FILL_FORMULA)
        else:
            if r.get('tot_hardcoded') is not None:
                ws.cell(row=excel_row, column=26, value=int(r['tot_hardcoded']))
                style_cell(ws.cell(row=excel_row, column=26))

        if cronicas_por_j:
            cr = cronicas_por_j.get(str(r['j'])) or cronicas_por_j.get(r['j'])
            if cr:
                cell_ae = ws.cell(row=excel_row, column=31, value=f'J{r["j"]}')
                comment = Comment(cr, 'Capi')
                comment.width = 600; comment.height = 400
                cell_ae.comment = comment
                style_cell(cell_ae)

        for c in range(1, 26):
            cell = ws.cell(row=excel_row, column=c)
            style_cell(cell, align=AL_LEFT if c in (2,3,4,5,6) else AL_CENTER)

    auto_w(ws, WIDTHS_RAW)

# Orden: fecha descendente (más reciente arriba). Clave robusta DD/MM/YYYY -> (Y,M,D).
# Desempate: jugador alfabético ascendente.
def _fkey_ent(r):
    partes = (r.get('f') or '').split('/')
    if len(partes) == 3:
        d, m, y = partes
        try:
            return (-int(y), -int(m), -int(d))
        except ValueError:
            pass
    return (0, 0, 0)

# Helper para crear pestañas SPEC con texto largo
# ════════════════════════════════════════════════════════════════════
def crear_spec(name, titulo, contenido):
    ws = wb.create_sheet(name)
    ws['A1'] = titulo
    ws['A1'].font = FONT_TITLE
    ws.merge_cells('A1:D1')
    ws['A3'] = contenido
    ws['A3'].font = FONT_CODE
    ws['A3'].alignment = AL_TOP
    n_lines = max(15, contenido.count('\n') + 3)
    ws.merge_cells(start_row=3, start_column=1, end_row=n_lines, end_column=4)
    ws.column_dimensions['A'].width = 110
    for col in 'BCD': ws.column_dimensions[col].width = 2
    ws.row_dimensions[3].height = 16

crear_spec('22_LOGICA_HCP_GLOBAL', '🏆 LÓGICA — HCP GLOBAL',

# ─── Validación cruzada de campos contra el catálogo CAMPOS ──────────
# Cada fila de las pestañas RAW_DATA tiene un valor en la col D (campo).
# Verificamos que ese nombre esté en el catálogo `CAMPOS` (nombre_coloquial).
# Si encontramos campos huérfanos (no listados en CAMPOS), los enumeramos
# como observación para que se vea en 99_VALIDACIONES.
_campos_catalogo = {c['nombre_coloquial'] for c in CAMPOS}
_campos_usados = {}  # {nombre: [(hoja, filas)]}
def _scan(filas_list, hoja, campo_key='campo'):
    for f in filas_list:
        camp = f.get(campo_key)
        if camp:
            _campos_usados.setdefault(camp, set()).add(hoja)
_scan(filas_sr,   '01_RAW_SR')
_scan(filas_ic,   '02_RAW_IC')
_scan(filas_par,  '03_RAW_IC_PAREJAS')
_scan(filas_rkg,  '04_RAW_RANKING')
_scan(filas_tor,  '05_RAW_TORNEO')
_scan(filas_ent,  '06_RAW_ENT')
_scan(filas_copa, '08_RAW_COPA')
_huerfanos = sorted([c for c in _campos_usados if c not in _campos_catalogo])
_validos   = sorted([c for c in _campos_usados if c in _campos_catalogo])
if _huerfanos:
    obs_huerf = f'⚠️ NO en catálogo: {", ".join(_huerfanos)}'
else:
    obs_huerf = f'✓ Los {len(_validos)} campos usados están en el catálogo'
vals.append(('Validación campos RAW vs CAMPOS', f'{len(_validos)} válidos / {len(_huerfanos)} huérfanos', obs_huerf))
for i, (k, v, o) in enumerate(vals):
    r = 5 + i
    ws.cell(row=r, column=1, value=k)
    ws.cell(row=r, column=2, value=v)
    ws.cell(row=r, column=3, value=o)
    for c in range(1,4):
        style_cell(ws.cell(row=r, column=c), align=AL_LEFT)
