  // ⏱️ Asistencia con CURVA DE RETORNOS DECRECIENTES sobre el nº de visitas.
  //    Fórmula: 1 − 0.5^visitas  (capeado a 1.0)
  //
  //    visitas → asistencia (0-1)
  //       0    → 0.00   (no vino nunca)
  //       1    → 0.50   (vino 1 vez, ya tiene la mitad)
  //       2    → 0.75
  //       3    → 0.875
  //       4    → 0.9375
  //       5+   → ~1.00
  //
  //    Ventaja sobre el ratio asistidas/total:
  //    NO penaliza al jugador por jornadas a las que no fue convocado.
  //    Premia haber venido (ya con 1 vez tiene mucho), pero recompensa
  //    venir más con retornos decrecientes (cada visita extra suma menos).
  function calcAsistenciaCampo(entreno, jugador){
    const visitas = entreno.jornadas
      .filter(jr => entreno.hm[`${jr.j}_${jugador}`] !== undefined).length;
    if(visitas === 0) return 0;
    return 1 - Math.pow(0.5, visitas);
  }

  // 📊 Forma últimos 5: media de delta de las 5 actuaciones más recientes
  //    mezclando RAW Super ROC + jornadas de TODOS los entrenamientos.
  //    Las pruebas IC no entran porque no tienen fecha exacta en el HTML.
  function _parseFecha(str){
    // "DD/MM/YYYY" → Date
    if(!str) return null;
    const parts = str.split('/');
    if(parts.length !== 3) return null;
    return new Date(+parts[2], +parts[1]-1, +parts[0]);
  }
  function calcFormaUltimos5(jugador){
    const actuaciones = [];
    // Super ROC (RAW global)
    if(typeof RAW_DATA !== 'undefined' && Array.isArray(RAW_DATA)){
      RAW_DATA.filter(r => r.jugador === jugador ).forEach(r => {
        const fecha = _parseFecha(r.f);
        if(fecha) actuaciones.push({ fecha, delta: r.total, src:'roc' });
      });
    }
    // Todos los entrenamientos (todos los bloques de ENTRENAMIENTOS)
    ENTRENAMIENTOS.forEach(ent => {
      ent.jornadas.forEach(jr => {
        const total = totalJornada(ent, jr.j, jugador);
        if(total !== null){
          const fecha = _parseFecha(jr.fecha);
          if(fecha) actuaciones.push({ fecha, delta: total - ENT_PAR_CAMPO, src:'ent' });
        }
      });
    });
    // Interclubs: solo cuando el jugador jugó como individual (su delta personal).
    // Las parejas no se cuentan: el delta de la pareja no es el delta personal del jugador.
    const variantes = APODO_A_NOMBRES_IC[jugador];
    if(variantes && typeof IC_DATA !== 'undefined'){
      const matchNombre = (n) => variantes.some(v => n && n.includes(v));
      Object.values(IC_DATA).forEach(yearData => {
        if(!yearData.pruebas) return;
        yearData.pruebas.forEach(prueba => {
          if(!prueba.fecha || prueba.total === null) return;
          const fecha = _parseFecha(prueba.fecha);
          if(!fecha) return;
          // Buscar si jugó individual y con qué score
          const indis = [];
          if(prueba.ind1) indis.push({n:prueba.ind1[0], s:prueba.ind1[1]}, {n:prueba.ind1[2], s:prueba.ind1[3]});
          if(prueba.ind2) indis.push({n:prueba.ind2[0], s:prueba.ind2[1]}, {n:prueba.ind2[2], s:prueba.ind2[3]});
          const yo = indis.find(x => matchNombre(x.n));
          if(yo) actuaciones.push({ fecha, delta: yo.s, src:'ic' });
        });
      });
    }
    if(actuaciones.length === 0) return null;
    actuaciones.sort((a,b) => b.fecha - a.fecha);
    const ult5 = actuaciones.slice(0, 5);
    return ult5.reduce((s,a) => s + a.delta, 0) / ult5.length;
  }

  // 🏆 Histórico Interclubs: % de podios (1º+2º+3º) sobre participaciones individuales.
  //    SOLO las dos temporadas más recientes (actual y anterior). Lo de hace años
  //    no es representativo del jugador actual.
  function calcHistoricoIC(jugador){
    const variantes = APODO_A_NOMBRES_IC[jugador];
    if(!variantes || typeof IC_DATA === 'undefined') return null;
    const matchNombre = (nombre) => variantes.some(v => nombre && nombre.includes(v));
    // Selecciona las dos claves de año más recientes
    const anios = Object.keys(IC_DATA).map(Number).filter(n => !isNaN(n)).sort((a,b)=>b-a);
    const aniosRecientes = anios.slice(0, 2);
    let participaciones = 0, podios = 0;
    aniosRecientes.forEach(anio => {
      const yearData = IC_DATA[anio];
      if(!yearData || !yearData.pruebas) return;
      yearData.pruebas.forEach(prueba => {
        if(!prueba.total) return;
        const all = [];
        if(prueba.ind1) all.push({n:prueba.ind1[0], s:prueba.ind1[1]}, {n:prueba.ind1[2], s:prueba.ind1[3]});
        if(prueba.ind2) all.push({n:prueba.ind2[0], s:prueba.ind2[1]}, {n:prueba.ind2[2], s:prueba.ind2[3]});
        const yo = all.find(x => matchNombre(x.n));
        if(!yo) return;
        participaciones++;
        const pos = all.filter(x => x.s < yo.s).length + 1;
        if(pos <= 3) podios++;
      });
    });
    if(participaciones === 0) return null;
    return (podios / participaciones) * 100;
  }

  // 🐦 Birdies por ronda: media de birdies (incluye HiO) por jornada en este campo.
  //    Señal clave para parejas (fourball): los picos ganan hoyos.
  function calcBirdiesPorRonda(entreno, jugador){
    const rondas = entreno.jornadas
      .map(jr => entreno.hm[`${jr.j}_${jugador}`])
      .filter(arr => arr !== undefined);
    if(rondas.length === 0) return null;
    const totalBirdies = rondas.reduce((sum, arr) => {
      return sum + arr.filter(v => v <= 2).length;
    }, 0);
    return totalBirdies / rondas.length;
  }

  // ── NUEVO scoring (mayo 2026): Capa 1 unificada + Capa 2 rol ─────────
  //
  // Capa 1 — Score Titular (100 pts, decide top 8 titulares vs 4 banquillo):
  //   · 50 HCP Global (normalizado dentro del equipo)
  //   · 10 Asist 6 sem (partidos jugados en últimas 6 semanas, normalizado)
  //   · 15 avg del campo (normalizado; jugadores sin datos campo = 0)
  //   · 25 visitas (min(visitas, V)/V × 100; V = max nº visitas alcanzado
  //                 por al menos 2 jugadores del equipo)
  //
  // Capa 2 — Sub-score Rol (de los 8 titulares, 4 a Indi y 4 a Pareja):
  //   · Sub-INDI    = 50% hcp_global + 50% Floor combinado
  //                   (Floor = peor delta; combinado = 50% campo + 50% global)
  //   · Sub-PAREJA  = 50% hcp_global + 50% Birdies combinado
  //                   (combinado = 50% campo + 50% global)
  //   · Top 4 sub-INDI → Indis. De los 4 restantes → Parejas.

  // Asistencia 6 semanas: nº de partidos jugados en cualquier contexto
  // (SR + ENT + IC + Torneos + Ranking) en los últimos 42 días.
  function calcAsist6Sem(jugador){
    const hoy = new Date();
    const hace6sem = new Date(hoy.getTime() - 42 * 24 * 60 * 60 * 1000);
    let count = 0;
    // Super ROC (RAW)
    if(typeof RAW_DATA !== 'undefined'){
      RAW_DATA.forEach(r => {
        if(r.jugador !== jugador) return;
        const [d,mo,y] = r.f.split('/');
        if(new Date(+y, +mo-1, +d) >= hace6sem) count++;
      });
    }
    // Entrenamientos
    if(typeof ENTRENAMIENTOS_DATA !== 'undefined'){
      ENTRENAMIENTOS_DATA.forEach(ent => ent.jornadas.forEach(jr => {
        if(!ent.hm[`${jr.j}_${jugador}`]) return;
        const [d,mo,y] = jr.fecha.split('/');
        if(new Date(+y, +mo-1, +d) >= hace6sem) count++;
      }));
    }
    // IC
    if(typeof IC_DATA !== 'undefined'){
      Object.values(IC_DATA).forEach(yd => {
        if(!yd.pruebas) return;
        yd.pruebas.forEach(p => {
          if(!p.fecha || p.total === null) return;
          const [d,mo,y] = p.fecha.split('/');
          if(new Date(+y, +mo-1, +d) < hace6sem) return;
          const indis = [];
          if(p.ind1) indis.push({n:p.ind1[0]}, {n:p.ind1[2]});
          if(p.ind2) indis.push({n:p.ind2[0]}, {n:p.ind2[2]});
          if(indis.some(x => apodoDesdeNombreIC(x.n) === jugador)) count++;
        });
      });
    }
    // Torneos
    if(typeof TORNEOS_DATA !== 'undefined'){
      TORNEOS_DATA.forEach(t => {
        if(!t.fecha) return;
        const [d,mo,y] = t.fecha.split('/');
        if(new Date(+y, +mo-1, +d) < hace6sem) return;
        (t.resultados || []).forEach(r => { if(r.jugador === jugador) count++; });
      });
    }
    // Ranking
    if(typeof RANKING_DATA !== 'undefined'){
      RANKING_DATA.forEach(r => {
        if(!r.fecha) return;
        const [d,mo,y] = r.fecha.split('/');
        if(new Date(+y, +mo-1, +d) < hace6sem) return;
        (r.resultados || []).forEach(rs => { if(rs.jugador === jugador) count++; });
      });
    }
    return count;
  }

  // Visitas del jugador a este campo del entreno.
  function calcVisitasCampo(entreno, jugador){
    return entreno.jornadas.filter(jr => entreno.hm[`${jr.j}_${jugador}`] !== undefined).length;
  }

  // Tope V = max nº de visitas alcanzado por al menos 2 jugadores del equipo
  // de entre la lista 'jugadores'. Si <2 jugadores tienen visitas, V=1 (evitar /0).
  function calcTopeVisitas(entreno, jugadores){
    const visitas = jugadores.map(j => calcVisitasCampo(entreno, j)).filter(v => v > 0).sort((a,b) => b-a);
    if(visitas.length < 2) return Math.max(1, visitas[0] || 1);
    // Mayor valor v tal que al menos 2 jugadores tienen visitas >= v.
    // En el array ordenado desc, eso es visitas[1].
    return Math.max(1, visitas[1]);
  }

  // 🌍 Adaptabilidad: nº de campos distintos en las últimas 10 actuaciones del
  //    HCP Global. Escala lineal:
  //      ≤2 campos → 0 pts (score 0)
  //       3 campos → 33.3 (= 3.3 pts con peso 10)
  //       4 campos → 66.7 (= 6.7 pts con peso 10)
  //      ≥5 campos → 100  (= 10 pts con peso 10)
  function calcCamposDistintosUltimas10(jugador){
    if(typeof calcHandicapGlobal !== 'function') return 0;
    const hg = calcHandicapGlobal(jugador);
    if(!hg.used || hg.used.length === 0) return 0;
    const campos = new Set(hg.used.map(a => a.campo).filter(Boolean));
    return campos.size;
  }
  function calcAdaptabilidadScore(camposDistintos){
    if(camposDistintos <= 2) return 0;
    if(camposDistintos >= 5) return 100;
    // lineal entre 3 → 33.33 y 5 → 100 (paso = 33.33)
    return (camposDistintos - 2) * (100/3);
  }

  // Floor en el campo del entreno (peor delta de las visitas que tenga).
  // Reutiliza calcFloorCampoDelta pero envuelto para devolver null si n=0.
  function calcFloorCampoEnEntreno(entreno, jugador){
    return calcFloorCampoDelta(entreno, jugador);
  }

  // Floor global: peor delta de las actuaciones que el HCP Global está usando
  // (últimas 10, ya ponderadas con CTX_INFO[src].ajuste). Devuelve null si no hay.
  function calcFloorGlobal(jugador){
    if(typeof calcHandicapGlobal !== 'function') return null;
    const hg = calcHandicapGlobal(jugador);
    if(!hg.used || hg.used.length === 0) return null;
    return hg.used.reduce((peor, a) => a.delta > peor ? a.delta : peor, -Infinity);
  }

  // Birdies/ronda global: promedio de birdies/ronda en las últimas 10 actuaciones
  // (campos SR + ENT + Torneos). IC y Ranking suelen no tener detalle por hoyo.
  // Calculamos de forma directa: contamos birdies en las rondas más recientes.
  function calcBirdiesGlobal(jugador, maxRondas){
    maxRondas = maxRondas || 10;
    const todas = [];
    // SR (RAW)
    if(typeof RAW_DATA !== 'undefined'){
      RAW_DATA.forEach(r => {
        if(r.jugador !== jugador || r.abandono) return;
        const [d,mo,y] = r.f.split('/');
        todas.push({ fecha: new Date(+y, +mo-1, +d), birdies: r.bir || 0 });
      });
    }
    // ENT
    if(typeof ENTRENAMIENTOS_DATA !== 'undefined'){
      ENTRENAMIENTOS_DATA.forEach(ent => ent.jornadas.forEach(jr => {
        const arr = ent.hm[`${jr.j}_${jugador}`];
        if(!arr) return;
        const [d,mo,y] = jr.fecha.split('/');
        const birds = arr.filter(v => v <= 2).length;
        todas.push({ fecha: new Date(+y, +mo-1, +d), birdies: birds });
      }));
    }
    // Torneos (si tienen hm por hoyos no tenemos acceso fácil; usamos bir si está)
    if(typeof TORNEOS_DATA !== 'undefined'){
      TORNEOS_DATA.forEach(t => {
        if(!t.fecha) return;
        const [d,mo,y] = t.fecha.split('/');
        const fecha = new Date(+y, +mo-1, +d);
        (t.resultados || []).forEach(r => {
          if(r.jugador !== jugador) return;
          if(r.bir !== undefined && r.bir !== null) todas.push({ fecha, birdies: r.bir });
        });
      });
    }
    if(todas.length === 0) return null;
    todas.sort((a,b) => b.fecha - a.fecha);
    const ult = todas.slice(0, maxRondas);
    return ult.reduce((s,a) => s + a.birdies, 0) / ult.length;
  }

  // Combinados (Capa 2): 50% campo + 50% global. Si falta uno, devuelve el otro.
  function calcFloorCombinado(entreno, jugador){
    const fc = calcFloorCampoEnEntreno(entreno, jugador);
    const fg = calcFloorGlobal(jugador);
    if(fc !== null && fg !== null) return (fc + fg) / 2;
    if(fc !== null) return fc;
    if(fg !== null) return fg;
    return null;
  }
  function calcBirdiesCombinado(entreno, jugador){
    const bc = calcBirdiesPorRonda(entreno, jugador);
    const bg = calcBirdiesGlobal(jugador);
    if(bc !== null && bg !== null) return (bc + bg) / 2;
    if(bc !== null) return bc;
    if(bg !== null) return bg;
    return null;
  }

  // Normalización RELATIVA AL EQUIPO (0-100, mayor = mejor).
  // 'menorEsMejor': true para deltas (HCP, avg, floor); false para conteos (birdies, asistencia, visitas).
  // Si todos tienen el mismo valor → 50 a todos (señal no discrimina).
  function _normEquipo(valores, valor, menorEsMejor){
    const vs = valores.filter(v => v !== null && v !== undefined && !isNaN(v));
    if(vs.length === 0 || valor === null || valor === undefined || isNaN(valor)) return 0;
    const min = Math.min(...vs);
    const max = Math.max(...vs);
    if(max === min) return 50;
    if(menorEsMejor){
      return 100 * (max - valor) / (max - min);
    } else {
      return 100 * (valor - min) / (max - min);
    }
  }

  // ── Normalización a escala 0-100 (mayor = mejor) ─────────────────────
  // Para deltas vs par: -3 → 100 puntos, +15 → 0 puntos (interpolación lineal).
  // Para asistencia (0-1): * 100. Para % podios: ya está en 0-100.
  function _normDelta(delta){
    if(delta === null || delta === undefined) return null;
    const MIN = -3, MAX = 15; // calibración: -3 = excelente, +15 = catastrófico
    const score = 100 - ((delta - MIN) / (MAX - MIN)) * 100;
    return Math.max(0, Math.min(100, score));
  }

  // Para birdies/ronda: 0 birdies = 0 puntos, 5+ birdies = 100 puntos.
  // En P3 par 54, 5 birdies por ronda es excelente.
  function _normBirdies(bpr){
    if(bpr === null || bpr === undefined) return null;
    return Math.max(0, Math.min(100, (bpr / 5) * 100));
  }

  // Datos crudos del jugador para el cálculo de scores (Capa 1 y Capa 2).
  // No normaliza ni asigna pesos: solo extrae los números base.
  function _calcDatosCrudos(entreno, jugador){
    const visitas = calcVisitasCampo(entreno, jugador);
    const avgCampo = visitas > 0 ? calcAvgCampoDeltaCrudo(entreno, jugador) : null;
    const avgCampoRegresado = visitas > 0 ? calcAvgCampoDelta(entreno, jugador) : null;
    const floorCampo = visitas > 0 ? calcFloorCampoEnEntreno(entreno, jugador) : null;
    const birdiesCampo = visitas > 0 ? calcBirdiesPorRonda(entreno, jugador) : null;
    // HCP usado SOLO para convocatoria — ponderado exponencial agresivo (α=0.7):
    // las actuaciones más recientes pesan mucho más que las antiguas. NO afecta al
    // HCP Global público, que sigue siendo media simple.
    const ALPHA_CONVOCATORIA = 0.7;
    const usaFallback = Array.isArray(entreno.hcpFallbackMedia) && entreno.hcpFallbackMedia.includes(jugador);
    let hg;
    if(typeof calcHandicapGlobal === 'function'){
      // Intento ponderado normal (n≥10). Si null y el jugador está en fallback,
      // recalculo permitiendo n<10 (con la misma α).
      const base = calcHandicapGlobal(jugador, undefined, false, ALPHA_CONVOCATORIA);
      hg = (usaFallback && base.hcp === null)
        ? calcHandicapGlobal(jugador, undefined, true, ALPHA_CONVOCATORIA)
        : base;
    } else {
      hg = { hcp:null };
    }
    const asist6 = calcAsist6Sem(jugador);
    const floorGlobal = calcFloorGlobal(jugador);
    const birdiesGlobal = calcBirdiesGlobal(jugador);
    const floorComb = calcFloorCombinado(entreno, jugador);
    const birdiesComb = calcBirdiesCombinado(entreno, jugador);
    // 🌍 Adaptabilidad: nº de campos distintos en las últimas 10 actuaciones
    // del HCP Global. Usa el `used` del hg ya resuelto (con fallback si aplica).
    const camposDistintos = (hg && Array.isArray(hg.used) && hg.used.length > 0)
      ? new Set(hg.used.map(a => a.campo).filter(Boolean)).size
      : 0;
    return {
      jugador, visitas,
      avgCampo, avgCampoRegresado, floorCampo, birdiesCampo,
      hg, hcpGlobal: hg.hcp, sigmaGlobal: hg.sigma,
      asist6,
      floorGlobal, birdiesGlobal,
      floorComb, birdiesComb,
      camposDistintos,
    };
  }

  // ─── Compromiso (asistencia real últimos 3 meses) ──────────────────────
  // Política definida con Capi: el equipo entero (12 jugadores) tiene una media
  // de partidas en los últimos 3 meses. Si alguien está por debajo:
  //
  //   - Si tiene MENOS DEL 50% de la media → BANQUILLO AUTOMÁTICO (no titular).
  //   - Si está entre 50% y 100% → su score se penaliza proporcionalmente al
  //     déficit, con factor 0.5. Fórmula: lastre = (déficit / media) × 0.5
  //     Score final = score × (1 − lastre).
  //   - Si está por encima de la media → sin penalización.
  //
  // "Partida" = cualquier entry de RAW (Super ROC) o cualquier
  // jornada de cualquier ENTRENAMIENTOS_DATA, dentro de los últimos 90 días.
  // Las partidas IC no entran porque no tienen fecha exacta en el HTML.
  const COMPROMISO_VENTANA_DIAS = 90;     // últimos 3 meses
  const COMPROMISO_UMBRAL_HARD  = 0.50;   // < 50% media → banquillo automático
  const COMPROMISO_FACTOR_LASTRE = 0.5;   // factor del lastre proporcional

  function calcCompromisoEquipo(){
    const hoy = new Date();
    const desde = new Date(hoy.getTime() - COMPROMISO_VENTANA_DIAS * 24 * 60 * 60 * 1000);
    const partidasPorJugador = {};
    ENT_JUGADORES.forEach(j => partidasPorJugador[j] = 0);

    // Super ROC
    if(typeof RAW_DATA !== 'undefined' && Array.isArray(RAW_DATA)){
      RAW_DATA.forEach(r => {
        if(!ENT_JUGADORES.includes(r.jugador)) return;
        const f = _parseFecha(r.f);
        if(f && f >= desde && f <= hoy) partidasPorJugador[r.jugador]++;
      });
    }
    // Entrenamientos (todos los bloques)
    if(typeof ENTRENAMIENTOS_DATA !== 'undefined' && Array.isArray(ENTRENAMIENTOS_DATA)){
      ENTRENAMIENTOS_DATA.forEach(ent => {
        ent.jornadas.forEach(jr => {
          const f = _parseFecha(jr.fecha);
          if(!f || f < desde || f > hoy) return;
          ENT_JUGADORES.forEach(jug => {
            if(ent.hm[`${jr.j}_${jug}`] !== undefined) partidasPorJugador[jug]++;
          });
        });
      });
    }
    const totales = Object.values(partidasPorJugador);
    const media = totales.reduce((s,v) => s+v, 0) / totales.length;
    return { partidasPorJugador, media };
  }

  // Devuelve { partidas, media, deficit, factor, banquilloAuto, descripcion }
  // factor: multiplicador 0-1 a aplicar al score del jugador.
  // banquilloAuto: true si está por debajo del umbral hard (banquillo forzado).
  function calcCompromiso(jugador, datosEquipo){
    const partidas = datosEquipo.partidasPorJugador[jugador] || 0;
    const media = datosEquipo.media;
    if(media === 0) return { partidas, media, deficit:0, factor:1.0, banquilloAuto:false, descripcion:'Sin datos del equipo' };

    if(partidas >= media){
      return { partidas, media, deficit:0, factor:1.0, banquilloAuto:false, descripcion:`✅ ${partidas}/${media.toFixed(1)} (≥ media)` };
    }

    const ratio = partidas / media;
    if(ratio < COMPROMISO_UMBRAL_HARD){
      return {
        partidas, media,
        deficit: media - partidas,
        factor: 0,
        banquilloAuto: true,
        descripcion: `🚫 ${partidas}/${media.toFixed(1)} (< 50% media — banquillo auto)`,
      };
    }
    // Lastre proporcional al déficit
    const deficit = media - partidas;
    const lastre = (deficit / media) * COMPROMISO_FACTOR_LASTRE;
    const factor = 1 - lastre;
    return {
      partidas, media, deficit, factor,
      banquilloAuto: false,
      descripcion: `⚠️ ${partidas}/${media.toFixed(1)} (lastre ${(lastre*100).toFixed(0)}%)`,
    };
  }

  function calcConvocatoria(entreno){
    // Datos de compromiso del equipo (últimos 3 meses) — sigue usándose para
    // BAJAS HARD (banquilloAuto) si un jugador tiene < 50% de la media.
    const datosEquipo = calcCompromisoEquipo();

    // Bajas de última hora declaradas en el bloque (entreno.bajas) — array de apodos.
    const bajasSet = new Set(Array.isArray(entreno.bajas) ? entreno.bajas : []);

    // 1) Datos crudos por jugador
    //    Solo miembros del equipo: los socios no son convocables al Interclubs,
    //    así que no entran en la convocatoria ni siquiera como banquillo. Sus
    //    resultados siguen contando en el resto de la pestaña.
    const _convocables = ENT_JUGADORES.filter(j => fichadoIC(j));
    const crudos = _convocables.map(j => _calcDatosCrudos(entreno, j));
    const tope = calcTopeVisitas(entreno, _convocables);

    // 2) Capa 1: Score Titular (unificado, 100 pts)
    //    35 hcp_global + 10 asist_6sem + 25 avg_campo + 20 visitas + 10 adaptabilidad
    const hcps = crudos.map(c => c.hcpGlobal);
    const asists = crudos.map(c => c.asist6);
    const avgs = crudos.map(c => c.avgCampoRegresado);

    const datosJugadores = crudos.map(c => {
      const compromiso = calcCompromiso(c.jugador, datosEquipo);
      const esBaja = bajasSet.has(c.jugador);
      // Normalización (relativa al equipo)
      const sHcp = _normEquipo(hcps, c.hcpGlobal, true);   // menor delta = mejor
      const sAsist = _normEquipo(asists, c.asist6, false); // más actividad = mejor
      const sAvg = c.avgCampoRegresado !== null ? _normEquipo(avgs, c.avgCampoRegresado, true) : 0;
      const sVis = tope > 0 ? Math.min(c.visitas, tope) / tope * 100 : 0;
      const sAdapt = calcAdaptabilidadScore(c.camposDistintos);
      // Score Titular (Capa 1)
      const pHcp = sHcp * PESO_HCP_GLOBAL / 100;
      const pAsi = sAsist * PESO_ASIST_6SEM / 100;
      const pAvg = sAvg * PESO_AVG_CAMPO / 100;
      const pVis = sVis * PESO_VISITAS / 100;
      const pAdapt = sAdapt * PESO_ADAPTABILIDAD / 100;
      const scoreTitularCrudo = pHcp + pAsi + pAvg + pVis + pAdapt;
      const scoreTitular = Math.round(scoreTitularCrudo * compromiso.factor * 10) / 10;

      // Capa 2: Sub-scores rol
      //   subIndi = 50% sHcp + 50% sFloor + bonus_consistencia (±2.5 pts)
      //   subPareja = 50% sHcp + 50% sBird (sin tocar — para parejas la consistencia es menos relevante)
      const floorAll = crudos.map(x => x.floorComb);
      const birdAll = crudos.map(x => x.birdiesComb);
      const sigAll = crudos.map(x => x.sigmaGlobal);
      const sFloor = c.floorComb !== null ? _normEquipo(floorAll, c.floorComb, true) : null;
      const sBird = c.birdiesComb !== null ? _normEquipo(birdAll, c.birdiesComb, false) : null;
      const sConsist = c.sigmaGlobal !== null && c.sigmaGlobal !== undefined ? _normEquipo(sigAll, c.sigmaGlobal, true) : null;
      // Bonus consistencia: rango ±2.5 (lineal sobre sConsist 0-100, neutro en 50).
      const bonusConsist = sConsist !== null ? (sConsist - 50) * 0.05 : 0;
      const subIndi = sFloor !== null
        ? (sHcp * 0.5 + sFloor * 0.5 + bonusConsist)
        : (sHcp * 0.5 + bonusConsist);
      const subPareja = sBird !== null ? (sHcp * 0.5 + sBird * 0.5) : sHcp * 0.5;

      return {
        jugador: c.jugador,
        esBaja,
        n: c.visitas,
        sinDatosCampo: c.visitas === 0,
        sigmaGlobal: c.sigmaGlobal,  // para tie-breaker de consistencia en Capa 2
        scoreTitular,
        scoreTitularCrudo: Math.round(scoreTitularCrudo * 10) / 10,
        // Compatibilidad con el render existente:
        scoreIndi: scoreTitular,
        scorePareja: scoreTitular,
        scoreIndiCrudo: Math.round(scoreTitularCrudo * 10) / 10,
        scoreParejaCrudo: Math.round(scoreTitularCrudo * 10) / 10,
        subIndi: Math.round(subIndi * 10) / 10,
        subPareja: Math.round(subPareja * 10) / 10,
        scoreBanquillo: scoreTitular,  // ya no hay carril separado
        compromiso,
        eligible: !esBaja,
        camposDistintos: c.camposDistintos,  // usado por Capa 2 (filtro 4º indi)
        // Breakdown unificado
        breakdown: {
          avgDelta:      c.avgCampoRegresado,
          avgDeltaCrudo: c.avgCampo,
          visitas:       c.visitas,
          tope:          tope,
          floorDelta:    c.floorCampo,
          floorGlobal:   c.floorGlobal,
          floorComb:     c.floorComb,
          birdiesRonda:  c.birdiesCampo,
          birdiesGlobal: c.birdiesGlobal,
          birdiesComb:   c.birdiesComb,
          hcpGlobal:     c.hcpGlobal,
          hcpTrend:      c.hg.trend,
          hcpN:          c.hg.n,
          asist6:        c.asist6,
          // Señales normalizadas (0-100) para mostrar
          sHcp:    Math.round(sHcp * 10) / 10,
          sAsist:  Math.round(sAsist * 10) / 10,
          sAvg:    c.avgCampoRegresado !== null ? Math.round(sAvg * 10) / 10 : null,
          sVis:    Math.round(sVis * 10) / 10,
          sAdapt:  Math.round(sAdapt * 10) / 10,
          camposDistintos: c.camposDistintos,
          sFloor:  sFloor !== null ? Math.round(sFloor * 10) / 10 : null,
          sBird:   sBird !== null ? Math.round(sBird * 10) / 10 : null,
          // Puntos efectivos aportados (de los 100 totales)
          pHcp:    Math.round(pHcp * 10) / 10,
          pAsi:    Math.round(pAsi * 10) / 10,
          pAvg:    Math.round(pAvg * 10) / 10,
          pVis:    Math.round(pVis * 10) / 10,
          pAdapt:  Math.round(pAdapt * 10) / 10,
          puntos: [
            { key:'hcp_global',    peso:PESO_HCP_GLOBAL,    score100:Math.round(sHcp*10)/10,   puntos:Math.round(pHcp*10)/10 },
            { key:'asist6',        peso:PESO_ASIST_6SEM,    score100:Math.round(sAsist*10)/10, puntos:Math.round(pAsi*10)/10 },
            { key:'avg',           peso:PESO_AVG_CAMPO,     score100:Math.round(sAvg*10)/10,   puntos:Math.round(pAvg*10)/10 },
            { key:'visitas',       peso:PESO_VISITAS,       score100:Math.round(sVis*10)/10,   puntos:Math.round(pVis*10)/10 },
            { key:'adaptabilidad', peso:PESO_ADAPTABILIDAD, score100:Math.round(sAdapt*10)/10, puntos:Math.round(pAdapt*10)/10 },
          ],
        },
        breakdownPareja: null, // ya no se usa (todo en breakdown)
      };
    });

    // 3) Filtrar bajas / banquillo automático
    const elegibles = datosJugadores.filter(p => !p.esBaja && !p.compromiso.banquilloAuto);

    // 4) Ordenar por scoreTitular → top 8 = titulares
    const ordTitulares = [...elegibles].sort((a,b) => b.scoreTitular - a.scoreTitular);
    const titulares = ordTitulares.slice(0, 8);

    // ════════════════════════════════════════════════════════════════════════
    // 5) CAPA 2 — Asignación de roles dentro de los 8 titulares
    // ════════════════════════════════════════════════════════════════════════
    // Filosofía: INDI = sólido (no se rompe) · PAREJA = explosiva (birdies).
    //
    // Paso A: Top 3 por subI entre los 8 titulares     → primeros 3 INDIS
    // Paso B: Top 2 por subP entre los 5 restantes     → PAREJA FUERTE
    // Paso C: 4º INDI entre los 3 sobrantes, con filtro escalonado por
    //           campos distintos en las used del HCP ponderado:
    //             intento 1: ≥3 campos → top 1 por subI
    //             si nadie:  ≥2 campos → top 1 por subI
    //             si nadie:  ≥1 campos → top 1 por subI (todos compiten)
    // Paso D: Los 2 que sobran → PAREJA DÉBIL (orden por subP descendente)
    //
    // Fallback (menos de 8 titulares): top 4 por subI = indis, resto parejas.
    let indis, parejas;
    if(titulares.length >= 8){
      // FILTRO HARD DE CAMPO PARA INDI:
      // quien tiene 0 visitas al campo puede ser titular, pero NUNCA indi.
      // Si no hubiera 4 titulares con datos del campo, se rellena con los que
      // no los tienen (mejor subI) para no romper la alineacion.
      const conCampo = titulares.filter(p => !p.sinDatosCampo);
      const sinCampo = titulares.filter(p => p.sinDatosCampo);
      const poolIndi = [
        ...[...conCampo].sort((a,b) => b.subIndi - a.subIndi),
        ...[...sinCampo].sort((a,b) => b.subIndi - a.subIndi),
      ];

      // Paso A — Primeros 3 INDIS por subI (los que han pisado el campo primero)
      const ordSubI = poolIndi;
      const indis1a3 = ordSubI.slice(0, 3);
      const setIndis1a3 = new Set(indis1a3.map(p => p.jugador));

      // Paso B — Pareja fuerte: top 2 por subP entre los 5 restantes
      const resto5 = titulares.filter(p => !setIndis1a3.has(p.jugador));
      const resto5OrdSubP = [...resto5].sort((a,b) => b.subPareja - a.subPareja);
      const parejaFuerte = resto5OrdSubP.slice(0, 2);
      const setParejaFuerte = new Set(parejaFuerte.map(p => p.jugador));

      // Paso C — 4º INDI con filtro escalonado por campos distintos
      const resto3 = resto5.filter(p => !setParejaFuerte.has(p.jugador));
      let indi4 = null;
      let umbralAplicado = null;
      const resto3ConCampo = resto3.filter(p => !p.sinDatosCampo);
      const resto3Pool = resto3ConCampo.length > 0 ? resto3ConCampo : resto3;
      for(const minCampos of [3, 2, 1]){
        const elegibles = resto3Pool.filter(p => (p.camposDistintos || 0) >= minCampos);
        if(elegibles.length > 0){
          indi4 = [...elegibles].sort((a,b) => b.subIndi - a.subIndi)[0];
          umbralAplicado = minCampos;
          break;
        }
      }
      // Garantía de seguridad: si por alguna razón no hubo elegible, tomar
      // simplemente el mejor por subI entre los 3 sobrantes.
      if(!indi4){
        indi4 = [...resto3Pool].sort((a,b) => b.subIndi - a.subIndi)[0];
        umbralAplicado = 0;
      }

      // Paso D — Pareja débil: los 2 sobrantes, orden por subP desc
      const parejaDebil = resto3
        .filter(p => p.jugador !== indi4.jugador)
        .sort((a,b) => b.subPareja - a.subPareja);

      indis = [
        ...indis1a3.map(p => ({...p, slotScore: p.scoreTitular, slot:'indi'})),
        {...indi4, slotScore: indi4.scoreTitular, slot:'indi', indi4Umbral: umbralAplicado},
      ];
      parejas = [
        ...parejaFuerte.map(p => ({...p, slotScore: p.scoreTitular, slot:'pareja', pareja:'fuerte'})),
        ...parejaDebil.map(p => ({...p, slotScore: p.scoreTitular, slot:'pareja', pareja:'debil'})),
      ];
    } else {
      // Fallback: menos de 8 titulares
      const ordIndi = [
        ...titulares.filter(p => !p.sinDatosCampo).sort((a,b) => b.subIndi - a.subIndi),
        ...titulares.filter(p => p.sinDatosCampo).sort((a,b) => b.subIndi - a.subIndi),
      ];
      indis = ordIndi.slice(0, 4).map(p => ({...p, slotScore: p.scoreTitular, slot:'indi'}));
      const indisSet = new Set(indis.map(p => p.jugador));
      parejas = titulares.filter(p => !indisSet.has(p.jugador))
        .sort((a,b) => b.subPareja - a.subPareja)
        .map(p => ({...p, slotScore: p.scoreTitular, slot:'pareja'}));
    }

    // 6) Banquillo: resto de elegibles + bajas/banquilloAuto
    const yaUsados = new Set([...indis, ...parejas].map(p => p.jugador));
    const banquillo = datosJugadores
      .filter(p => !yaUsados.has(p.jugador))
      .sort((a,b) => b.scoreTitular - a.scoreTitular)
      .map(p => ({...p, slotScore: p.scoreTitular, slot:'banquillo'}));

    return { indis, parejas, banquillo };
  }

  function fmtDelta(d){
    if(d === null || d === undefined) return '—';
    const r = Math.round(d * 10) / 10;
    if(r === 0) return 'PAR';
    const str = (r % 1 === 0) ? `${Math.abs(r)}` : `${Math.abs(r).toFixed(1)}`;
    return r > 0 ? `+${str}` : `−${str}`;
  }

  function fmtDeltaInt(d){
    if(d === null) return '—';
    if(d === 0) return 'PAR';
    return d > 0 ? `+${d}` : `−${Math.abs(d)}`;
  }

  function renderScoreCell(v){
    if(v === null || v === undefined) return '<span style="color:#ccc;font-size:11px">—</span>';
    // Mismo esquema visual que Tabla SR + Torneos
    if(v <= 2){
      return `<span style="display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#65d000;color:#fff;font-weight:700;font-size:11px">${v}</span>`;
    }
    if(v === 3){
      return `<span style="color:#333;font-weight:400;font-size:11px">3</span>`;
    }
    if(v === 4){
      return `<span style="display:inline-block;width:18px;height:18px;line-height:18px;border-radius:3px;background:#06b6d4;color:#fff;font-weight:600;font-size:11px">4</span>`;
    }
    const txt = v === 5 ? '5' : 'X';
    return `<span style="display:inline-block;width:18px;height:18px;line-height:18px;border-radius:3px;background:#1e3a8a;color:#fff;font-weight:700;font-size:11px">${txt}</span>`;
  }

  function renderPlayers(blockEl, entreno){
    const indisEl     = blockEl.querySelector('[data-role="indis"]');
    const parejasEl   = blockEl.querySelector('[data-role="parejas"]');
    const banquilloEl = blockEl.querySelector('[data-role="banquillo"]');

    const fmtSign = (x, dec=1) => {
      if(x === null || x === undefined) return '—';
      const r = Math.round(x * Math.pow(10,dec)) / Math.pow(10,dec);
      if(r === 0) return 'PAR';
      return (r > 0 ? '+' : '') + (Number.isInteger(r) ? r : r.toFixed(dec));
    };

    const buildCard = (p, badge, attenuated) => {
      const b = p.breakdown || {};
      // Sin visitas al campo → tarjeta especial con HCP global + asist 6sem
      if(p.sinDatosCampo){
        const hcpStr = (b.hcpGlobal === null || b.hcpGlobal === undefined) ? '—' : fmtSign(b.hcpGlobal);
        const sigmaStr = (p.compromiso && p.compromiso.partidas !== undefined)
          ? `📅 ${b.asist6 || 0} en 6 sem` : `📅 ${b.asist6 || 0} en 6 sem`;
        const popData = JSON.stringify({
          tipo: 'normal',
          jugador: p.jugador,
          slot: p.slot,
          n: 0,
          scoreIndi: p.scoreTitular,
          scorePareja: p.scoreTitular,
          subIndi: p.subIndi,
          subPareja: p.subPareja,
          avgDelta: '—',
          avgDeltaCrudo: '—',
          visitas: 0,
          tope: b.tope || 0,
          floorDelta: '—',
          floorGlobal: fmtSign(b.floorGlobal),
          floorComb: fmtSign(b.floorComb),
          birdiesRonda: '—',
          birdiesGlobal: b.birdiesGlobal !== null && b.birdiesGlobal !== undefined ? b.birdiesGlobal.toFixed(1) : '—',
          birdiesComb: b.birdiesComb !== null && b.birdiesComb !== undefined ? b.birdiesComb.toFixed(1) : '—',
          asist6: b.asist6 || 0,
          hcpGlobal: hcpStr,
          puntosIndi: b.puntos || [],
          compromiso: p.compromiso ? {
            partidas: p.compromiso.partidas,
            media: p.compromiso.media.toFixed(1),
            descripcion: p.compromiso.descripcion,
            scoreCrudoIndi: p.scoreIndiCrudo,
            scoreCrudoPareja: p.scoreParejaCrudo,
          } : null,
        }).replace(/"/g,'&quot;');
        const badgeHtml = badge ? `<span class="ent-badge">${badge}</span>` : '';
        const clsSD = attenuated ? 'pcard pcard-sindatos pcard-attenuated' : 'pcard pcard-sindatos';
        return `
          <div class="${clsSD}" data-pop="${popData}" onclick="window.__entTogglePop(this, event)">
            ${badgeHtml}
            <div class="name">${p.jugador}</div>
            <div class="delta delta-sindatos">${hcpStr}</div>
            <div class="ent-mini">⭐${p.scoreTitular} · ${sigmaStr}</div>
          </div>`;
      }
      if(!p.eligible){
        return `
          <div class="pcard empty">
            <div class="name">${p.jugador}</div>
            <div class="delta delta-empty">—</div>
          </div>`;
      }
      // Clase de color del delta-avg → según el AVG REAL del campo (lo que el jugador hizo).
      // El avg efectivo (regresado al HCP exponencial) se muestra solo en el popover.
      let deltaCls = 'delta-zero';
      if(b.avgDeltaCrudo < 0) deltaCls = 'delta-neg';
      else if(b.avgDeltaCrudo > 0) deltaCls = 'delta-pos';

      // Línea pequeña con score titular + visitas + birdies/ronda
      const scoreSlot = p.slotScore !== undefined && p.slotScore !== null ? p.slotScore : p.scoreTitular;
      const hasBird = b.birdiesRonda !== null && b.birdiesRonda !== undefined;
      const visStr = b.tope ? `${b.visitas}/${b.tope}` : `${b.visitas}`;
      const miniLine = [
        `⭐${scoreSlot}`,
        `⏱️${visStr}`,
        hasBird ? `🐦${b.birdiesRonda.toFixed(1)}` : null,
      ].filter(Boolean).join(' ');

      const hcpStr = (b.hcpGlobal === null || b.hcpGlobal === undefined)
        ? `${b.hcpN || 0}/10 partidas`
        : fmtSign(b.hcpGlobal);
      const compromisoData = p.compromiso ? {
        partidas: p.compromiso.partidas,
        media: p.compromiso.media.toFixed(1),
        descripcion: p.compromiso.descripcion,
        scoreCrudoIndi: p.scoreIndiCrudo,
        scoreCrudoPareja: p.scoreParejaCrudo,
      } : null;
      const popData = JSON.stringify({
        tipo: 'normal',
        jugador: p.jugador,
        slot: p.slot,
        n: p.n,
        scoreIndi: p.scoreTitular,
        scorePareja: p.scoreTitular,
        subIndi: p.subIndi,
        subPareja: p.subPareja,
        avgDelta: fmtSign(b.avgDelta),
        avgDeltaCrudo: fmtSign(b.avgDeltaCrudo),
        visitas: b.visitas,
        tope: b.tope || 0,
        floorDelta: fmtSign(b.floorDelta),
        floorGlobal: fmtSign(b.floorGlobal),
        floorComb: fmtSign(b.floorComb),
        birdiesRonda: hasBird ? b.birdiesRonda.toFixed(1) : '—',
        birdiesGlobal: b.birdiesGlobal !== null && b.birdiesGlobal !== undefined ? b.birdiesGlobal.toFixed(1) : '—',
        birdiesComb: b.birdiesComb !== null && b.birdiesComb !== undefined ? b.birdiesComb.toFixed(1) : '—',
        asist6: b.asist6 || 0,
        hcpGlobal: hcpStr,
        puntosIndi: b.puntos || [],
        compromiso: compromisoData,
      }).replace(/"/g,'&quot;');
      const badgeHtml = badge ? `<span class="ent-badge">${badge}</span>` : '';
      // Avg regresado para mostrar entre paréntesis al lado del crudo (tamaño de mini)
      const regStr = (b.avgDelta !== null && b.avgDelta !== undefined)
        ? ` <span class="delta-reg">(${fmtSign(Math.round(b.avgDelta * 10) / 10)})</span>`
        : '';

      const cls = attenuated ? 'pcard pcard-attenuated' : 'pcard';
      return `
        <div class="${cls}" data-pop="${popData}" onclick="window.__entTogglePop(this, event)">
          ${badgeHtml}
          <div class="name">${p.jugador}</div>
          <div class="delta ${deltaCls}">${fmtSign(b.avgDeltaCrudo)}${regStr}</div>
          <div class="ent-mini">${miniLine}</div>
        </div>`;
    };

    // Calcular convocatoria sugerida con score compuesto
    const conv = calcConvocatoria(entreno);

    // Orden visual por química (opcional): si el entreno define `salidas`,
    // reordenamos indis y parejas para que cada dúo "salga junto" en pantalla.
    // No afecta a la lógica de convocatoria (slot indi/pareja se mantiene).
    const aplicarOrdenSalidas = (arr) => {
      if(!Array.isArray(entreno.salidas) || entreno.salidas.length === 0) return arr;
      const pos = new Map();
      entreno.salidas.flat().forEach((j, i) => pos.set(j, i));
      return [...arr].sort((a, b) => {
        const pa = pos.has(a.jugador) ? pos.get(a.jugador) : Infinity;
        const pb = pos.has(b.jugador) ? pos.get(b.jugador) : Infinity;
        return pa - pb;
      });
    };
    const indisVisual = aplicarOrdenSalidas(conv.indis);
    const parejasVisual = aplicarOrdenSalidas(conv.parejas);

    // INDIS: los 4 jugadores son titulares por igual. No hay atenuación visual.
    // (En el formato Interclubs, el peor de los 4 es "descartable" pero a priori juegan los 4.)
    const indisHtml = indisVisual.map((p,i) => {
      return buildCard(p, null, false);
    }).join('');

    // PAREJAS: sin badge P1/P2. La P2 (3º y 4º de la lista) atenuada porque es la pareja
    // descartable en el formato Interclubs (peor pareja no puntúa).
    const parejasHtml = parejasVisual.map((p,i) => {
      const numPareja = Math.floor(i/2) + 1;
      const attenuated = numPareja === 2;
      return buildCard(p, null, attenuated);
    }).join('');

    // BANQUILLO: sin badge; los sin datos atenuados
    const banquilloHtml = conv.banquillo.map(p => buildCard(p, null, !p.eligible)).join('');

    const empty = '<div style="color:var(--ent-ink-dim);font-size:12px;padding:12px;">Sin jugadores</div>';
    indisEl.innerHTML     = indisHtml     || empty;
    parejasEl.innerHTML   = parejasHtml   || empty;
    banquilloEl.innerHTML = banquilloHtml || empty;

    // ──────────────────────────────────────────────────────────────────
    // Score equipo simulado: 3 cuadritos con peor / promedio / mejor caso.
    // La SELECCIÓN (qué 3 indis cuentan, qué pareja cuenta) se hace SIEMPRE
    // por avg (es la convocatoria sugerida = los 3 indis con menor avg + pareja
    // con menor avg fourball ≈ min). Los 3 escenarios miden cómo rendirían
    // ESOS mismos jugadores en distintas condiciones:
    //   · Peor caso:  cada uno con su peor jornada en el campo (max delta)
    //   · Promedio:   cada uno con su avg
    //   · Mejor caso: cada uno con su mejor jornada (min delta)
    // Pareja en fourball ≈ avg del mejor jugador de la pareja (conservador).
    const scoreEl = blockEl.querySelector('[data-role="score-equipo"]');
    if(scoreEl){
      // Helper: lista de deltas (ya con el cap del contexto) de un jugador en este campo
      const jornadasJ = (jug) => {
        const out = [];
        entreno.jornadas.forEach(jr => {
          const arr = entreno.hm[`${jr.j}_${jug}`];
          if(arr) out.push(sumaHoyos(arr, ENT_CTX) - ENT_PAR_CAMPO);
        });
        return out;
      };

      // Helper: deltas de PAREJA en fourball (mejor bola hoyo a hoyo) sobre las
      // jornadas donde AMBOS jugaron. Cada hoyo cuenta min(j1[h],j2[h]) con el cap del contexto.
      const fourballJ = (j1, j2) => {
        const out = [];
        entreno.jornadas.forEach(jr => {
          const a = entreno.hm[`${jr.j}_${j1}`];
          const b = entreno.hm[`${jr.j}_${j2}`];
          if(a && b){
            let tot = 0;
            for(let h=0; h<N_HOYOS; h++){
              tot += Math.min(capHoyo(ENT_CTX, a[h]), capHoyo(ENT_CTX, b[h]));
            }
            out.push(tot - ENT_PAR_CAMPO);
          }
        });
        return out;
      };

      // ── Referencia de un jugador PARA ESTE CAMPO ───────────────────────────
      // Prioridad: 1) su media real en el campo (avgDelta)
      //            2) si nunca lo ha jugado, su HCP Global como prior
      //            3) si no hay ninguna de las dos, null = desconocido
      // OJO: nunca dejar que un null entre en una suma o en un Math.min. En JS
      // `x + null` da `x` y `Math.min(null, 5.8)` da 0, o sea que el jugador
      // acaba contando como PAR. Ese era el bug del pronóstico.
      const refDelta = (p) => {
        const b = (p && p.breakdown) || {};
        if(b.avgDelta  !== null && b.avgDelta  !== undefined) return b.avgDelta;
        if(b.hcpGlobal !== null && b.hcpGlobal !== undefined) return b.hcpGlobal;
        return null;
      };
      // Al ordenar, un jugador sin referencia va al FINAL, no al principio.
      const refOrden = (p) => { const v = refDelta(p); return v === null ? Infinity : v; };
      // ¿Tira de prior (HCP Global) por no haber pisado nunca este campo?
      const usaPrior = (p) => {
        const b = (p && p.breakdown) || {};
        return (b.avgDelta === null || b.avgDelta === undefined) && refDelta(p) !== null;
      };

      // 3 mejores indis por HCP regresivo (prior bayesiano hacia HCP exponencial)
      const indisOk = conv.indis.filter(p => p.eligible && p.breakdown && refDelta(p) !== null);
      const tres = [...indisOk].sort((a,b) => refOrden(a) - refOrden(b)).slice(0, 3);

      // Mejor pareja por avg fourball REAL (mejor bola hoyo a hoyo sobre jornadas
      // compartidas). Fallback a min(ref1,ref2) si nunca coincidieron.
      const par1 = conv.parejas.slice(0, 2).filter(p => p.eligible && p.breakdown);
      const par2 = conv.parejas.slice(2, 4).filter(p => p.eligible && p.breakdown);
      const avgFourball = par => {
        if(par.length !== 2) return null;
        const fb = fourballJ(par[0].jugador, par[1].jugador);
        if(fb.length) return fb.reduce((s,v)=>s+v,0) / fb.length;
        // Fallback: nunca coincidieron → min de las referencias individuales
        const v1 = refDelta(par[0]), v2 = refDelta(par[1]);
        if(v1 === null || v2 === null) return null;
        return Math.min(v1, v2);
      };
      const aP1 = avgFourball(par1);
      const aP2 = avgFourball(par2);
      let parejaGanadora = null;
      if(aP1 !== null && aP2 !== null) parejaGanadora = aP1 <= aP2 ? par1 : par2;
      else if(aP1 !== null) parejaGanadora = par1;
      else if(aP2 !== null) parejaGanadora = par2;

      // Nº de individuales que puntúan en Interclubs (de los 4 que salen).
      const TOP_INDIS = 3;

      if(indisOk.length >= TOP_INDIS && parejaGanadora){
        const calcEsc = (modo) => {
          const reduce = modo === 'peor' ? Math.max : modo === 'mejor' ? Math.min : null;
          const valor = (p) => {
            const base = refDelta(p);
            if(reduce){
              const ds = jornadasJ(p.jugador);
              return ds.length ? reduce(...ds) : base;
            }
            return base;
          };
          // ── Descarte del 4º indi: se recalcula EN CADA ESCENARIO ────────
          // En Interclubs salen 4 individuales y solo puntúan los 3 mejores
          // DEL DÍA. Por eso el descarte NO puede congelarse por media: en el
          // escenario "peor" puede caerse un jugador distinto que en el
          // "mejor". Se valoran los 4 candidatos y se suman los 3 mejores
          // resultados de esa lista, que es la regla real de la competición.
          const vals = [];
          for(const p of indisOk){
            const v = valor(p);
            if(v !== null) vals.push(v);
          }
          if(vals.length < TOP_INDIS) return null;
          vals.sort((a,b) => a - b);
          const sumaInd = vals.slice(0, TOP_INDIS).reduce((acc,v) => acc + v, 0);
          // Pareja en fourball REAL (mejor bola hoyo a hoyo) sobre jornadas compartidas:
          //   · avg   = media de los deltas fourball
          //   · peor  = peor jornada fourball (max)
          //   · mejor = mejor jornada fourball (min)
          // Fallback (nunca coincidieron): min/max de las referencias individuales.
          const fbDeltas = fourballJ(parejaGanadora[0].jugador, parejaGanadora[1].jugador);
          let par;
          if(fbDeltas.length){
            if(modo === 'peor')       par = Math.max(...fbDeltas);
            else if(modo === 'mejor') par = Math.min(...fbDeltas);
            else                      par = fbDeltas.reduce((s,v)=>s+v,0) / fbDeltas.length;
          } else {
            const v1 = valor(parejaGanadora[0]);
            const v2 = valor(parejaGanadora[1]);
            if(v1 === null || v2 === null) return null;
            par = (modo === 'peor') ? Math.max(v1, v2) : Math.min(v1, v2);
          }
          return sumaInd + par;
        };
        const peor  = calcEsc('peor');
        const avg   = calcEsc('avg');
        const mejor = calcEsc('mejor');

        const fmt = v => {
          const r = Math.round(v * 10) / 10;
          if(r === 0) return 'PAR';
          return (r > 0 ? '+' : '') + (Number.isInteger(r) ? r : r.toFixed(1));
        };

        if(peor === null || avg === null || mejor === null){
          scoreEl.innerHTML = '';
        } else {
          const pronostico = 0.6 * avg + 0.2 * peor + 0.2 * mejor;
          const sinDatos = indisOk.filter(usaPrior).map(p => p.jugador);
          // Se listan los 4 candidatos: el descarte real depende del escenario.
          const indisNombres = [...indisOk]
            .sort((a,b) => refOrden(a) - refOrden(b))
            .map(p => usaPrior(p) ? p.jugador + '*' : p.jugador).join(', ');
          const parejaNombres = parejaGanadora.map(p => p.jugador).join(' + ');
          const aviso = sinDatos.length
            ? `\n⚠️ ${sinDatos.join(', ')} sin partidos en este campo: se estima con su HCP Global (marcados con *).`
            : '';
          const tipPron = `Pronóstico Claudio (60% avg + 20% peor + 20% mejor)\n· Indis candidatos (puntúan los ${TOP_INDIS} mejores de cada escenario): ${indisNombres}\n· Pareja: ${parejaNombres}\n· Avg: ${fmt(avg)}  ·  Peor: ${fmt(peor)}  ·  Mejor: ${fmt(mejor)}${aviso}`;

          scoreEl.innerHTML = `
            <span class="ese-box ese-pronostico" title="${tipPron}">
              <span class="ese-label">🔮 Pronóstico</span><span class="ese-val">${fmt(pronostico)}${sinDatos.length ? '*' : ''}</span>
            </span>`;
        }
      } else {
        scoreEl.innerHTML = '';
      }
    }
  }

  function renderJornadas(blockEl, entreno){
    const cont = blockEl.querySelector('[data-role="jornadas"]');

    if(entreno.jornadas.length === 0){
      cont.innerHTML = `
        <div class="empty-state">
          <div class="ico">⛳</div>
          <h3>Aún no hay partidos</h3>
          <p>Cuando juguéis la primera jornada aparecerá aquí.</p>
        </div>`;
      return;
    }

    const ordenadas = [...entreno.jornadas].sort((a,b) => b.j - a.j);
    const headersHoyos = Array.from({length:18}, (_,i) => `<th>${i+1}</th>`).join('');

    cont.innerHTML = ordenadas.map(jr => {
      const filasData = ENT_JUGADORES
        .map(jug => ({
          jug,
          arr: entreno.hm[`${jr.j}_${jug}`],
          tot: totalJornada(entreno, jr.j, jug),
          cnt: countScores(entreno, jr.j, jug)
        }))
        .filter(x => x.tot !== null)
        .sort((a,b) => a.tot - b.tot);

      const filas = filasData.map(({jug, arr, tot, cnt}) => {
        const delta = tot - ENT_PAR_CAMPO;
        const celdas = Array.from({length:18}, (_,i) => `<td>${renderScoreCell(arr[i])}</td>`).join('');
        const stat = (n, cls) => `<td class="col-stat ${cls} ${n === 0 ? 'zero' : ''}">${n}</td>`;

        return `
          <tr>
            <td class="col-jug">${jug}</td>
            ${celdas}
            <td class="col-tot">${fmtDeltaInt(delta)}</td>
            ${stat(cnt.bir, 'bir')}
            ${stat(cnt.par, 'par')}
            ${stat(cnt.bog, 'bog')}
            ${stat(cnt.dbl, 'dbl')}
          </tr>`;
      }).join('');

      return `
        <div class="jornada">
          <div class="jornada-header">
            <div class="jornada-title">Jornada <em>${jr.j}</em></div>
            <div class="jornada-fecha">${jr.fecha || ''}</div>
          </div>
          <div class="table-wrap">
            <table class="scorecard">
              <thead>
                <tr>
                  <th class="col-jug">Jugador</th>
                  ${headersHoyos}
                  <th class="col-tot">Tot</th>
                  <th class="col-stat col-stat-bir">🐦</th>
                  <th class="col-stat">✅</th>
                  <th class="col-stat col-stat-bog">✗</th>
                  <th class="col-stat col-stat-dbl">✗✗</th>
                </tr>
              </thead>
              <tbody>${filas}</tbody>
            </table>
          </div>
        </div>`;
    }).join('');
  }

  function renderEntrenoBlock(entreno, expanded){
    return `
      <details class="entreno-block" data-entreno-id="${entreno.id}"${expanded ? ' open' : ''}>
        <summary>
          <div class="entreno-meta">
            <div class="eyebrow">Entrenamiento · ${entreno.jornadaInterclubs}ª Jornada Interclubs</div>
            <div class="titulo">${entreno.campo} <span class="entreno-score-equipo" data-role="score-equipo"></span></div>
          </div>
          <div class="entreno-fecha">${entreno.fecha}</div>
          <div class="entreno-chevron">▾</div>
        </summary>
        <div class="entreno-body">
          <div class="ent-section-title">Indis</div>
          <div class="players-grid grid-2" data-role="indis"></div>

          <div class="ent-section-title">Parejas</div>
          <div class="players-grid grid-2" data-role="parejas"></div>

          <div class="ent-section-title">Banquillo</div>
          <div class="players-grid" data-role="banquillo"></div>

          <div class="ent-section-title">Resultados por jornada</div>
          <div data-role="jornadas"></div>
        </div>
      </details>`;
  }

  window.renderEntrenamiento = function(el){
    if(ENTRENAMIENTOS.length === 0){
      el.innerHTML = `
        <div class="ent-wrap">
          <div class="empty-state">
            <div class="ico">🎯</div>
            <h3>Aún no hay entrenamientos</h3>
            <p>Cuando juguéis el primer entreno preparatorio aparecerá aquí.</p>
          </div>
        </div>`;
      return;
    }

    // Parsear fecha "dd/mm/aaaa" → Date (para ordenar y agrupar por año)
    const parseFecha = (f) => {
      if(!f) return new Date(0);
      const [d,mo,y] = f.split('/');
      return new Date(+y, +mo-1, +d);
    };
    // Si el entrenamiento aún no tiene fecha, se agrupa por su campo `anio`.
    const getYear = (e) => e.anio ? Number(e.anio) : parseFecha(e.fecha).getFullYear();

    // Agrupar por temporada (año) y ordenar dentro de cada grupo por fecha desc
    const porTemporada = {};
    ENTRENAMIENTOS.forEach(e => {
      const y = getYear(e);
      if(!porTemporada[y]) porTemporada[y] = [];
      porTemporada[y].push(e);
    });
    Object.values(porTemporada).forEach(arr =>
      arr.sort((a,b) => parseFecha(b.fecha) - parseFecha(a.fecha))
    );

    // Años de más reciente a más antiguo; el más reciente abierto por defecto
    const anios = Object.keys(porTemporada).map(Number).sort((a,b) => b - a);

    const html = anios.map((anio, idxAnio) => {
      const lista = porTemporada[anio];
      const bloques = lista.map((e, i) =>
        renderEntrenoBlock(e, idxAnio === 0 && i === 0)
      ).join('');
      const label = lista.length === 1 ? '1 entrenamiento' : `${lista.length} entrenamientos`;
      return `
        <details class="temporada-block" data-temporada="${anio}"${idxAnio === 0 ? ' open' : ''}>
          <summary>
            <span class="temporada-titulo">🏆 Temporada ${anio}</span>
            <span class="temporada-count">${label}</span>
            <span class="temporada-chevron">▾</span>
          </summary>
          <div class="temporada-body">
            ${bloques}
          </div>
        </details>`;
    }).join('');

    el.innerHTML = `
      <div class="ent-wrap">
        ${html}
        <div class="ent-foot">Roc &amp; Roll <span>·</span> Entreno</div>
      </div>`;

    // Inyectar contenido dinámico (cuadraditos + tablas) en cada bloque
    ENTRENAMIENTOS.forEach(entreno => {
      const blockEl = el.querySelector(`[data-entreno-id="${entreno.id}"]`);
      if(blockEl){
        renderPlayers(blockEl, entreno);
        renderJornadas(blockEl, entreno);
      }
    });
  };
})();

// Sistema de popover fijo al click para los cuadraditos de Entrenamiento.
// Click en card → abre popover anclado, marca card activa.
// Click en otra card → cierra anterior y abre nueva.
// Click fuera → cierra.
(function(){
  // Renderiza una mini-tabla con el desglose de puntos aportados por cada señal
  // a un score (INDI o PAREJA). `puntos` es la lista [{key, peso, score100, puntos}].
  const SIGNAL_LABELS = {
    avg:'🎯 Avg-campo', asist:'⏱️ Asistencia', floor:'🛡️ Floor',
    bir:'🐦 Birdies/ronda', hcp_global:'🌐 HCP exponencial', hist:'🏆 Hist IC',
    asist6:'📅 Asist 6 sem', visitas:'⏱️ Visitas',
  };
  function renderPuntosBreakdown(titulo, puntos, scoreTotal){
    if(!Array.isArray(puntos) || puntos.length === 0) return '';
    const filas = puntos.map(p => `
      <div class="pop-row" style="font-size:10.5px">
        <span class="pop-label">${SIGNAL_LABELS[p.key] || p.key}</span>
        <span class="pop-value"><b>${p.puntos}</b> / ${p.peso} <span style="color:#888">(${p.score100})</span></span>
      </div>`).join('');
    return `
      <div style="margin-top:6px;padding-top:5px;border-top:1px solid #ece6c8">
        <div style="font-weight:600;color:#9a3412;font-size:11px;margin-bottom:3px">⭐ Desglose ${titulo} (puntos / max)</div>
        ${filas}
        <div class="pop-row" style="font-size:10.5px;font-weight:700;color:#15803d;border-top:1px dashed #ddd;margin-top:3px;padding-top:3px">
          <span class="pop-label">Total</span>
          <span class="pop-value">${scoreTotal} / 100</span>
        </div>
      </div>`;
  }
  function closePop(){
    const open = document.querySelector('#tab-entrenamiento .pcard-popover');
    if(open) open.remove();
    document.querySelectorAll('#tab-entrenamiento .pcard.pcard-active').forEach(c => c.classList.remove('pcard-active'));
  }
  window.__entTogglePop = function(card, ev){
    if(ev) ev.stopPropagation();
    const yaActiva = card.classList.contains('pcard-active');
    closePop();
    if(yaActiva) return; // segundo click sobre la misma cierra
    let data;
    try { data = JSON.parse(card.getAttribute('data-pop').replace(/&quot;/g,'"')); }
    catch(e){ return; }

    const compromisoBlock = data.compromiso ? `
      <div style="margin-top:6px;padding-top:5px;border-top:1px solid #ece6c8;">
        <div class="pop-row"><span class="pop-label">🤝 Compromiso</span><span class="pop-value">${data.compromiso.descripcion}</span></div>
        ${data.compromiso.scoreCrudoIndi !== null && data.compromiso.scoreCrudoIndi !== data.scoreIndi ? `<div class="pop-row" style="font-size:10px;color:#888"><span class="pop-label">Score crudo</span><span class="pop-value">${data.compromiso.scoreCrudoIndi}/100 → ${data.scoreIndi}</span></div>` : ''}
      </div>` : '';

    const sinDatos = !data.visitas || data.visitas === 0;
    const visStr = sinDatos ? '0' : (data.tope ? `${data.visitas} / ${data.tope} (tope)` : `${data.visitas}`);
    const subtitulo = sinDatos
      ? `<span style="font-weight:400;color:#888">· slot ${data.slot} · sin datos del campo</span>`
      : `<span style="font-weight:400;color:#888">· slot ${data.slot} · ${data.visitas} ${data.visitas===1?'visita':'visitas'}</span>`;

    const html = `
      <div class="pop-title">${data.jugador} ${subtitulo}</div>
      <span class="pop-close" onclick="window.__entTogglePop(this.closest('.pcard'), event)">×</span>

      <div class="pop-row"><span class="pop-label">⭐ Score Titular</span><span class="pop-value"><b>${data.scoreIndi}/100</b></span></div>

      <div style="margin-top:6px;padding-top:5px;border-top:1px solid #ece6c8">
        <div style="font-weight:600;color:#9a3412;font-size:11px;margin-bottom:3px">📊 Datos del jugador</div>
        <div class="pop-row"><span class="pop-label">🌐 HCP exponencial</span><span class="pop-value">${data.hcpGlobal}</span></div>
        <div class="pop-row"><span class="pop-label">📅 Asist 6 sem</span><span class="pop-value">${data.asist6} partidos</span></div>
        ${!sinDatos ? `
        <div class="pop-row"><span class="pop-label">🎯 Avg campo</span><span class="pop-value">${data.avgDeltaCrudo}</span></div>
        <div class="pop-row" style="font-size:10px;color:#888"><span class="pop-label">↳ HCP regresivo (avg + HCP exp)</span><span class="pop-value">${data.avgDelta}</span></div>
        <div class="pop-row"><span class="pop-label">⏱️ Visitas</span><span class="pop-value">${visStr}</span></div>
        <div class="pop-row"><span class="pop-label">🛡️ Floor campo</span><span class="pop-value">${data.floorDelta}</span></div>
        <div class="pop-row"><span class="pop-label">🐦 Birdies/ronda campo</span><span class="pop-value">${data.birdiesRonda}</span></div>` : ''}
        <div class="pop-row"><span class="pop-label">🛡️ Floor global (últ 10)</span><span class="pop-value">${data.floorGlobal}</span></div>
        <div class="pop-row"><span class="pop-label">🐦 Birdies/ronda global (últ 10)</span><span class="pop-value">${data.birdiesGlobal}</span></div>
      </div>

      <div style="margin-top:6px;padding-top:5px;border-top:1px solid #ece6c8">
        <div style="font-weight:600;color:#5b21b6;font-size:11px;margin-bottom:3px">🎭 Sub-scores rol (Capa 2)</div>
        <div class="pop-row"><span class="pop-label">⭐ Sub-INDI (50% HCP + 50% Floor comb.)</span><span class="pop-value"><b>${data.subIndi || 0}/100</b></span></div>
        <div class="pop-row"><span class="pop-label">⭐ Sub-PAREJA (50% HCP + 50% Bir comb.)</span><span class="pop-value"><b>${data.subPareja || 0}/100</b></span></div>
        <div class="pop-row" style="font-size:10px;color:#888"><span class="pop-label">Floor combinado</span><span class="pop-value">${data.floorComb}</span></div>
        <div class="pop-row" style="font-size:10px;color:#888"><span class="pop-label">Birdies combinado</span><span class="pop-value">${data.birdiesComb}</span></div>
      </div>

      ${renderPuntosBreakdown('Score Titular', data.puntosIndi, data.scoreIndi)}
      ${compromisoBlock}
    `;
    const pop = document.createElement('div');
    pop.className = 'pcard-popover';
    pop.innerHTML = html;
    pop.addEventListener('click', e => e.stopPropagation());
    card.classList.add('pcard-active');
    card.appendChild(pop);
    // Reposicionar si el popover se sale por los bordes del viewport.
    // Por defecto está centrado bajo la card (translateX(-50%)). Si se desborda
    // por la derecha (cards de la última columna) o por la izquierda (primera
    // columna en móvil), lo desplazamos justo lo necesario para que entre en
    // pantalla. La flechita ::before sigue apuntando al centro de la card, lo
    // cual queda bien porque indica de qué card sale.
    requestAnimationFrame(() => {
      const rect = pop.getBoundingClientRect();
      const margin = 8;
      const vw = window.innerWidth;
      let shift = 0;
      if(rect.right > vw - margin){
        shift = -(rect.right - (vw - margin));   // mover a la izquierda
      } else if(rect.left < margin){
        shift = margin - rect.left;              // mover a la derecha
      }
      if(shift !== 0){
        pop.style.transform = `translateX(calc(-50% + ${shift}px))`;
      }
    });
  };
  // Click fuera cierra el popover
  document.addEventListener('click', function(e){
    if(!e.target.closest('#tab-entrenamiento')) return;
    if(e.target.closest('.pcard') || e.target.closest('.pcard-popover')) return;
    closePop();
  });
  // Cerrar al cambiar de pestaña
  if(typeof window.__entCloseOnTabSwitch === 'undefined'){
    window.__entCloseOnTabSwitch = true;
    document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', closePop));
  }
})();

// Modal de las 10 últimas actuaciones del Hándicap Global
window.__mostrarTarjetasGlobal = function(jugador){
  const data = calcHandicapGlobal(jugador);
  if(!data.used || data.used.length === 0) return;

  // Iconos y labels: alias directo de CTX_INFO (fuente única).
  const SRC_INFO = CTX_INFO;
  const fmtFecha = (d) => {
    const dd = String(d.getDate()).padStart(2,'0');
    const mm = String(d.getMonth()+1).padStart(2,'0');
    return dd+'/'+mm+'/'+d.getFullYear();
  };
  const fmtNum = (n, decs) => {
    const v = +n.toFixed(decs);
    return (v > 0 ? '+' : '') + (Number.isInteger(v) ? v : v.toFixed(decs));
  };
  const fmtAjuste = (n) => {
    if(!n || n === 0) return '0';
    return (n > 0 ? '+' : '') + (Number.isInteger(n) ? n : n.toFixed(2));
  };

  let filas = '';
  data.used.forEach((a, i) => {
    const info = SRC_INFO[a.src] || { icon:'?', label:a.src };
    // Los campos ajusteCampo, ajusteContexto y deltaEfectivo ya vienen calculados
    // desde calcHandicapGlobal cuando hay >=10 actuaciones.
    const ajCampo = (a.ajusteCampo !== undefined) ? a.ajusteCampo : 0;
    const ajCtx   = (a.ajusteContexto !== undefined) ? a.ajusteContexto : 0;
    const deltaEf = (a.deltaEfectivo !== undefined) ? a.deltaEfectivo : a.delta + ajCampo + ajCtx;
    const ajusteTxt = `${fmtAjuste(ajCampo)} <span style="color:#cbd5e1">·</span> ${fmtAjuste(ajCtx)}`;
    filas += `
      <tr style="border-bottom:1px solid #f0f0f0">
        <td style="padding:6px 8px;font-size:11px;color:#6b7280;text-align:center">${i+1}</td>
        <td style="padding:6px 8px;font-size:12px;color:#374151;white-space:nowrap">${fmtFecha(a.fecha)}</td>
        <td style="padding:6px 8px;font-size:11px;text-align:center" title="${info.label}">${info.icon}</td>
        <td style="padding:6px 8px;font-size:11px;color:#6b7280">${a.campo || '—'}</td>
        <td style="padding:6px 8px;font-size:13px;font-weight:700;color:${a.delta<=0?'#15803d':'#991b1b'};text-align:right;font-family:'Fraunces',serif">${fmtNum(a.delta, 0)}</td>
        <td style="padding:6px 8px;font-size:10px;color:#9ca3af;text-align:right;white-space:nowrap" title="ajuste campo · ajuste contexto">${ajusteTxt}</td>
        <td style="padding:6px 8px;font-size:13px;font-weight:700;color:${deltaEf<=0?'#15803d':'#991b1b'};text-align:right;font-family:'Fraunces',serif">${fmtNum(deltaEf, 2)}</td>
      </tr>`;
  });

  const fmtH = (h) => {
    if(h === null || h === undefined) return '—';
    const r = Math.round(h * 100) / 100;
    if(r === 0) return 'PAR';
    return (r > 0 ? '+' : '') + r.toFixed(2);
  };
  const sigmaTxt = data.sigma !== null ? data.sigma.toFixed(2) : '—';
  const camposTxt = data.camposDistintos > 1
    ? `${data.camposDistintos} campos · −${(data.descuentoAdapt*100).toFixed(1)}% (${fmtH(data.hcp * data.factorVar)})`
    : '1 campo · sin bonus';
  const inactivTxt = data.daysOff > DIAS_GRACIA_OXIDACION
    ? `${data.daysOff} días inactivo · penaliza +${data.penalAdd.toFixed(2)}`
    : `activo (${data.daysOff} días)`;

  // Mejor / peor posición histórica en las FOTOS DE DOMINGO.
  // Recorre la rejilla de domingos (_calcHistoricoN1Global) y, para cada foto en
  // la que el jugador aparece (n≥10 ese domingo), anota su puesto en el ranking.
  // Guarda el mínimo (mejor) y el máximo (peor) de todo el histórico semanal.
  let posTxt = '';
  const _histPos = _calcHistoricoN1Global(UMBRAL_N1);
  if(_histPos){
    let mejorPos = null, peorPos = null, mejorHcp = null, peorHcp = null;
    _histPos.historialN1.forEach(row => {
      const idx = row.ranking.findIndex(r => r.jugador === jugador);
      if(idx === -1) return;            // ese domingo no tenía n≥10
      const pos = idx + 1;
      const hcpEseDia = row.ranking[idx].hcp;
      // Mejor posición: menor puesto. Si repite puesto, nos quedamos con el mejor (menor) HCP.
      if(mejorPos === null || pos < mejorPos){ mejorPos = pos; mejorHcp = hcpEseDia; }
      else if(pos === mejorPos && hcpEseDia < mejorHcp){ mejorHcp = hcpEseDia; }
      // Peor posición: mayor puesto. Si repite puesto, nos quedamos con el mejor (menor) HCP.
      if(peorPos === null || pos > peorPos){ peorPos = pos; peorHcp = hcpEseDia; }
      else if(pos === peorPos && hcpEseDia < peorHcp){ peorHcp = hcpEseDia; }
    });
    if(mejorPos !== null){
      posTxt = `<span style="margin:0 10px;color:#d1d5db">·</span><span>mejor ${mejorPos}ª (${fmtH(mejorHcp)}) · peor ${peorPos}ª (${fmtH(peorHcp)})</span>`;
    }
  }

  document.getElementById('hcpg-titulo').textContent = `🏆 ${jugador} · HCP global ${fmtH(data.hcp)}`;
  document.getElementById('hcpg-meta').innerHTML =
    `<span>σ ${sigmaTxt}</span>` +
    `<span style="margin:0 10px;color:#d1d5db">·</span><span>${camposTxt}</span>` +
    `<span style="margin:0 10px;color:#d1d5db">·</span><span>${inactivTxt}</span>` +
    posTxt;
  document.getElementById('hcpg-tabla').innerHTML = `
    <table style="width:100%;border-collapse:collapse;font-family:Inter,system-ui,sans-serif">
      <thead>
        <tr style="background:#f9fafb;border-bottom:2px solid #e5e7eb">
          <th style="padding:8px;font-size:10px;font-weight:600;color:#6b7280;text-align:center;width:30px">#</th>
          <th style="padding:8px;font-size:10px;font-weight:600;color:#6b7280;text-align:left">FECHA</th>
          <th style="padding:8px;font-size:10px;font-weight:600;color:#6b7280;text-align:center">TIPO</th>
          <th style="padding:8px;font-size:10px;font-weight:600;color:#6b7280;text-align:left">CAMPO</th>
          <th style="padding:8px;font-size:10px;font-weight:600;color:#6b7280;text-align:right">DELTA</th>
          <th style="padding:8px;font-size:10px;font-weight:600;color:#9ca3af;text-align:right">FACT</th>
          <th style="padding:8px;font-size:10px;font-weight:600;color:#6b7280;text-align:right">EFECTIVO</th>
        </tr>
      </thead>
      <tbody>${filas}</tbody>
    </table>`;
  document.getElementById('hcpg-overlay').style.display = 'flex';
};
window.__cerrarTarjetasGlobal = function(){
  document.getElementById('hcpg-overlay').style.display = 'none';
};

// Modal de detalle de una ventana de la Progresión del equipo (Miscelánea).
// Muestra las 10 jornadas que componen la ventana, con la media efectiva de
// cada una y el desglose jugador a jugador. Los datos vienen de
// window.__PROG_VENTANAS, que rellena renderMiscelania.
window.__mostrarVentanaProg = function(idx, titulo){
  const vents = window.__PROG_VENTANAS || [];
  const v = vents[idx];
  if(!v) return;
  const SRC_INFO = CTX_INFO;
  const fF  = d => `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
  const sg  = (n, decs) => (n > 0 ? '+' : '') + (Number.isInteger(n) ? n : n.toFixed(decs));
  const col = n => n <= 0 ? '#15803d' : (n <= 5 ? '#c2410c' : '#991b1b');

  let filas = '';
  v.jornadas.forEach((jr, i) => {
    const info = SRC_INFO[jr.src] || { icon:'?', label:jr.src };
    const det = jr.jugadores.map(p =>
        `<span style="display:inline-block;background:${COLORS[p.jugador]||'#f3f4f6'};border-radius:4px;padding:1px 5px;margin:1px 2px 1px 0;font-size:10px;color:#333;white-space:nowrap">${p.jugador} ${sg(p.delta,0)}<span style="color:#6b7280"> → ${sg(p.efectivo,2)}</span></span>`
      ).join('');
    filas += `
      <tr style="border-bottom:1px solid #f0f0f0">
