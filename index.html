</style>

<div class="tj-wrap">

  <div class="tj-card tj-head">
    ${logo?'<img class="tj-logo" src="'+logo+'" alt="The Irons">':'<div class="tj-logo"></div>'}
    <div class="tj-fields">
      <input id="tjFecha" type="date" value="${isoHoy}">
      <select id="tjCampo">
        <option value="">Campo…</option>
        ${CAMP.map(c=>'<optgroup label="'+c.campo+'">'
            +c.recs.map(r=>'<option value="'+c.campo+'|'+r+'"'
              +(c.campo===CAMPO_SR&&r===RECORRIDO_DEF?' selected':'')+'>'+c.campo+' · '+r+'</option>').join('')
          +'</optgroup>').join('')}
      </select>
    </div>
    <div class="tj-badge"><b id="tjMejor">—</b><span>MEJOR</span></div>
  </div>

  <div class="tj-card">
    <div class="tj-lbl">JUGADORES</div>
    <div class="tj-chips" id="tjChips">
      ${JUGS.map(j=>'<button type="button" class="tj-chip" data-j="'+j+'">'+j+'</button>').join('')}
    </div>
  </div>

  <div class="tj-card">
    <div class="tj-lbl">HOLES 1–18</div>
    <div class="tj-scroll"><table class="tj-grid" id="tjG"></table></div>
  </div>

  <div class="tj-pad">
    <div class="tj-now" id="tjNow">Elige jugadores para empezar</div>
    <div class="tj-step">
      <button type="button" id="tjMenos">−</button>
      <div class="tj-val vacio" id="tjVal">—</div>
      <button type="button" id="tjMas">+</button>
    </div>
    <div class="tj-nav">
      <button type="button" id="tjAnt">← Ant</button>
      <button type="button" class="del" id="tjDel">✕</button>
      <button type="button" id="tjSig">Sig →</button>
    </div>
    <div class="tj-acc">
      <button type="button" class="tj-new" id="tjNew">Tarjeta nueva</button>
      <button type="button" class="tj-fin" id="tjFin">Finalizar ronda</button>
    </div>
    <div class="tj-msg" id="tjMsg"></div>
  </div>

  <textarea class="tj-out" id="tjOut" readonly placeholder="Al finalizar la ronda aparecerá aquí la tarjeta."></textarea>
  <button type="button" class="tj-copy" id="tjCopy" disabled>Copiar tarjeta</button>

</div>`;

  // Contexto de la tarjeta virtual: de él salen el cap y cómo se pinta.
  const TJ_CTX = 'roc';

  const $ = s => el.querySelector(s);
  const msg=$('#tjMsg'), out=$('#tjOut'), btnCopy=$('#tjCopy');

  // Copia al portapapeles. navigator.clipboard falla fuera de HTTPS y en
  // algunos navegadores móviles, así que hay fallback por selección + execCommand.
  function copiarTarjeta(){
    if(!out.value) return;
    const ok = () => {
      btnCopy.classList.add('done'); btnCopy.textContent='Copiado ✓';
      setTimeout(()=>{ btnCopy.classList.remove('done'); btnCopy.textContent='Copiar tarjeta'; }, 1600);
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(out.value).then(ok).catch(()=>{ legacy(); });
    } else { legacy(); }
    function legacy(){
      out.removeAttribute('readonly');
      out.focus(); out.select(); out.setSelectionRange(0, out.value.length);
      let hecho=false;
      try{ hecho=document.execCommand('copy'); }catch(e){}
      out.setAttribute('readonly','');
      if(hecho) ok();
      else { btnCopy.textContent='Selecciona y copia a mano'; setTimeout(()=>{btnCopy.textContent='Copiar tarjeta';},2200); }
    }
  }
  btnCopy.addEventListener('click', copiarTarjeta);

  function tablaHTML(){
    if(!sel.length) return '<tr><td class="tj-empty">Sin jugadores seleccionados.</td></tr>';
    let h='<tr><th class="tj-corner">Hole</th>';
    for(let i=0;i<18;i++){
      h+='<th class="tj-hh'+(act&&act.h===i?' on':'')+'">'+(i+1)+'</th>';
    }
    h+='<th class="tj-hh tot">TOT</th></tr>';
    sel.forEach(jug=>{
      const col = (typeof COLORS!=='undefined' && COLORS[jug]) ? COLORS[jug] : '#eef0f4';
      h+='<tr><td class="tj-who" style="background:'+col+'">'+jug+'</td>';
      for(let i=0;i<18;i++){
        const v=G[jug][i];
        let cls='tj-cel';
        if(act && act.jug===jug && act.h===i) cls+=' act';
        if(v!==null){ if(v<=UMBRAL_BIR)cls+=' bir'; else if(v===UMBRAL_BOG)cls+=' bog'; else if(v>=UMBRAL_DBL)cls+=' dbl'; }
        h+='<td><button type="button" class="'+cls+'" data-j="'+jug+'" data-h="'+i+'">'
          +(v===null?'':pintaHoyo(TJ_CTX,v))+'</button></td>';
      }
      const s=suma(jug);
      h+='<td class="tj-sum">'+(s===null?'—':s)+'</td></tr>';
    });
    return h;
  }

  function pinta(){
    $('#tjG').innerHTML=tablaHTML();
    el.querySelectorAll('.tj-chip').forEach(c=>c.classList.toggle('on', sel.includes(c.dataset.j)));
    el.querySelectorAll('.tj-cel').forEach(b=>b.addEventListener('click',()=>{
      act={jug:b.dataset.j,h:+b.dataset.h}; pinta();
    }));
    const tot = sel.filter(completo).map(suma);
    $('#tjMejor').textContent = tot.length ? Math.min(...tot) : '—';
    $('#tjNow').innerHTML = act
      ? '<b>'+act.jug+'</b> · hoyo <b>'+(act.h+1)+'</b>'
      : (sel.length ? 'Toca una casilla para empezar' : 'Elige jugadores para empezar');
    const v = act ? G[act.jug][act.h] : null;
    const box=$('#tjVal');
    box.textContent = pintaHoyo(TJ_CTX, v);
    box.classList.toggle('vacio', v===null);
  }

  function mover(d){
    if(!act || !sel.length) return;
    let idx=sel.indexOf(act.jug), h=act.h+d;
    if(h>17){ h=0; idx=(idx+1)%sel.length; }
    if(h<0){ h=17; idx=(idx-1+sel.length)%sel.length; }
    act={jug:sel[idx],h}; pinta();
  }

  function bump(d){
    if(!act){ msg.className='tj-msg'; msg.textContent='Toca primero una casilla.'; return; }
    msg.textContent='';
    const v=G[act.jug][act.h];
    if(v===null){ G[act.jug][act.h]=3; }              // primer toque → par
    else { G[act.jug][act.h]=Math.max(1,Math.min(6,v+d)); }
    pinta();
  }

  el.querySelectorAll('.tj-chip').forEach(c=>c.addEventListener('click',()=>{
    const j=c.dataset.j;
    if(sel.includes(j)){
      sel=sel.filter(x=>x!==j);
      G[j]=new Array(18).fill(null);
      if(act && act.jug===j) act = sel.length ? {jug:sel[0],h:0} : null;
    }else{
      sel.push(j);
      if(!act) act={jug:j,h:0};
    }
    pinta();
  }));

  $('#tjMas').addEventListener('click',()=>bump(1));
  $('#tjMenos').addEventListener('click',()=>bump(-1));
  $('#tjAnt').addEventListener('click',()=>mover(-1));
  $('#tjSig').addEventListener('click',()=>mover(1));
  $('#tjDel').addEventListener('click',()=>{ if(act){G[act.jug][act.h]=null;pinta();} });

  $('#tjNew').addEventListener('click',()=>{
    sel=[]; act=null; JUGS.forEach(j=>G[j]=new Array(18).fill(null));
    out.value=''; btnCopy.disabled=true; msg.className='tj-msg'; msg.textContent=''; pinta();
  });

  $('#tjFin').addEventListener('click',()=>{
    if(!sel.length){ msg.className='tj-msg'; msg.textContent='No hay ningún jugador en la tarjeta.'; out.value=''; btnCopy.disabled=true; return; }
    const campoVal=$('#tjCampo').value;
    if(!campoVal){ msg.className='tj-msg'; msg.textContent='Elige el campo.'; out.value=''; btnCopy.disabled=true; return; }
    const [campo, recorrido] = campoVal.split('|');
    const faltan=sel.filter(j=>!completo(j));
    if(faltan.length){
      msg.className='tj-msg';
      msg.textContent='Faltan hoyos: '+faltan.map(j=>j+' ('+G[j].filter(v=>v===null).length+')').join(', ');
      out.value=''; btnCopy.disabled=true; return;
    }
    const iso=$('#tjFecha').value;
    const fecha = iso ? iso.slice(8,10)+'/'+iso.slice(5,7)+'/'+iso.slice(0,4) : '';
    const orden=[...sel].sort((a,b)=>suma(a)-suma(b));
    const L=['=== TARJETA INICIO ===','fecha='+fecha,'campo='+campo,'recorrido='+recorrido,''];
    orden.forEach(j=>L.push('jugador='+j+' hoyos='+G[j].map(capN).join(' ')));
    L.push('=== TARJETA FIN ===');
    out.value=L.join('\n');
    msg.className='tj-msg ok'; msg.textContent='Tarjeta generada.';
    btnCopy.disabled=false;
    copiarTarjeta();
  });

  pinta();
}

function renderComandos(el){
  el.innerHTML=`
  <div style="max-width:600px">
    <div style="font-weight:600;font-size:13px;color:#1a1a1a;margin-bottom:14px">⚙️ Comandos Claude — The Irons</div>

    <!-- PROMPT INTERNO: cálculo de probabilidad de resultado -->
    <div style="background:#eef2ff;border:1px solid #c7d2fe;border-radius:12px;padding:14px 16px;margin-bottom:12px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
        <span style="font-size:18px">🎲</span>
        <span style="font-weight:600;font-size:13px;color:#3730a3">PROBABILIDAD DE RESULTADO — método (prompt para Claudio)</span>
      </div>
      <div style="background:#fff;border-radius:8px;padding:12px 14px;border:1px solid #ddd6fe;font-size:12px;color:#1a1a1a;line-height:1.6">
        Cuando Capi pregunte <b>"¿qué % tiene X de hacer Y o mejor?"</b>, calcularlo así (NO usar frecuencia empírica cruda, da 0% falsos):
        <ol style="margin:8px 0 0 0;padding-left:18px">
          <li>Coger las <b>10 últimas actuaciones</b> del jugador desde 01/01/2026 vía <code style="background:#f5f3ff;padding:1px 4px;border-radius:3px">_recopilarActuacionesGlobal(jugador)</code>, ordenadas reciente→antiguo.</li>
          <li>Usar los <b>deltas CRUDOS</b> (a.delta, el resultado real de la tarjeta) — NO los efectivos con ajustes, porque la pregunta es sobre el golpe real.</li>
          <li><b>Ponderación exponencial</b> igual que en convocatoria de entrenamientos: peso_i = <b>α^i</b> con α=<b>0.7</b>, i=0 la más reciente (lo reciente pesa mucho más).</li>
          <li><b>Media ponderada</b> μ = Σ(δ_i·w_i)/Σw_i. &nbsp; <b>σ ponderada</b> con corrección de sesgo: var = [Σw_i·(δ_i−μ)²/Σw_i] · (Σw)²/((Σw)²−Σw²), σ=√var.</li>
          <li><b>P(objetivo o mejor)</b> = Φ((umbral−μ)/σ) → normal acumulada (cola inferior, porque "mejor" = delta menor). Con esto ningún jugador queda en 0%.</li>
          <li>Si Capi pide comparar varios jugadores o superar a otro: aplicar la misma fórmula a cada uno; para "batir a Z" simular el HCP Global resultante (ventana de 10 con la actuación añadida) y comparar HCPs.</li>
        </ol>
        <div style="margin-top:8px;color:#6b7280">Nota: "+2 o mejor" es cola acumulada (incluye +1, 0, −1…), no un valor único. Es normal que un jugador en forma tenga ~50% si su media ponderada ronda el umbral.</div>
      </div>
    </div>

    <!-- PROMPT INTERNO: qué resultado necesita para adelantar a otro -->
    <div style="background:#ecfdf5;border:1px solid #a7f3d0;border-radius:12px;padding:14px 16px;margin-bottom:12px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
        <span style="font-size:18px">🎯</span>
        <span style="font-weight:600;font-size:13px;color:#065f46">RESULTADO PARA ADELANTAR — método (prompt para Claudio)</span>
      </div>
      <div style="background:#fff;border-radius:8px;padding:12px 14px;border:1px solid #d1fae5;font-size:12px;color:#1a1a1a;line-height:1.6">
        Cuando Capi pregunte <b>"¿qué resultado tiene que hacer X el próximo día en [Super ROC / torneo / entrenamiento] para adelantar a Z en el HCP Global?"</b>, calcularlo así:
        <ol style="margin:8px 0 0 0;padding-left:18px">
          <li>Identificar el <b>contexto</b> de esa jornada y su <b>src</b>: Super ROC→<code style="background:#f0fdf4;padding:1px 4px;border-radius:3px">roc</code>, torneo oficial (Mulligans, Can Rafel B, Badalona)→<code style="background:#f0fdf4;padding:1px 4px;border-radius:3px">oficial</code>, entrenamiento→<code style="background:#f0fdf4;padding:1px 4px;border-radius:3px">ent</code>, ranking→<code style="background:#f0fdf4;padding:1px 4px;border-radius:3px">rkg</code>. Y el <b>campo</b> real (ROC 3, Teià, Can Rafel…) con su recorrido, porque de ahí salen los ajustes.</li>
          <li>El <b>efectivo</b> = delta + ajuste_contexto (CTX_INFO[src].ajuste, con su vigencia por fecha) + ajuste_campo (<code style="background:#f0fdf4;padding:1px 4px;border-radius:3px">_ajusteCampoGlobal(campo,recorrido)</code>). Esto lo aplica ya <code style="background:#f0fdf4;padding:1px 4px;border-radius:3px">calcHandicapGlobal</code> internamente.</li>
          <li><b>Simular</b>: parchear temporalmente <code style="background:#f0fdf4;padding:1px 4px;border-radius:3px">_recopilarActuacionesGlobal(X)</code> para añadir una actuación en la fecha del próximo día con {src, campo, recorrido, delta} y recalcular <code style="background:#f0fdf4;padding:1px 4px;border-radius:3px">calcHandicapGlobal(X).hcp</code>. Restaurar la función después.</li>
          <li><b>Z</b>: si Z también juega, simular su HCP con su delta previsto; si <b>no juega</b>, su HCP queda congelado (usar su valor actual; recordar la penalización por inactividad de 0.03/día tras 12 días).</li>
          <li>Probar deltas de X (de −3 a +8) y encontrar el <b>umbral</b>: el peor resultado con el que <code style="background:#f0fdf4;padding:1px 4px;border-radius:3px">hcp_X &lt; hcp_Z</code> (menor HCP = mejor/adelanta). Responder ese umbral y mostrar 2-3 filas alrededor.</li>
        </ol>
        <div style="margin-top:8px;color:#6b7280">Ojo: un resultado NO baja el HCP 1:1 (ventana de 10 → cada golpe mueve ~0.09-0.10). Por eso hay que simular la media completa, no restar a ojo.</div>
      </div>

      </div>

      </div>

        <b>2.</b> Ordenar desc → los <b>8 primeros</b> son los titulares para IC.<br>
        <b>3.</b> Para esos 8, calcular <b>Sub-INDI</b> y <b>Sub-PAREJA</b> (Capa 2).<br>
        <b>4.</b> <b>Top 3 por Sub-INDI</b> → primeros 3 <b>Indis</b> (los más sólidos).<br>
        <b>5.</b> Entre los 5 restantes, <b>top 2 por Sub-PAREJA</b> → <b>Pareja fuerte</b> (la más explosiva).<br>
        <b>6.</b> <b>4º Indi</b>: entre los 3 sobrantes, filtro escalonado por campos distintos en used:
        <span style="color:#888;font-size:11px">≥3 campos → si nadie ≥2 → si nadie ≥1 → top 1 por Sub-INDI entre los elegibles.</span><br>
        <b>7.</b> Los 2 que sobran → <b>Pareja débil</b> (orden por Sub-PAREJA).<br>
        <b>8.</b> Resto (4 jugadores) → <b>Banquillo</b>.<br>
        <span style="color:#9a3412;font-size:11px;font-weight:600">Filosofía: indi = sólido (no se rompe), pareja = explosiva (birdies). El filtro de campos en el 4º indi asegura que quien va de individual ha demostrado nivel fuera de ROC 3.</span>
      </div>

      <div style="margin-top:10px;font-weight:600;font-size:12px;color:#9a3412">🧪 Normalización</div>
      <div style="font-size:12px;color:#374151;line-height:1.6;margin-top:2px">
        <b>Relativa al equipo</b>: en cada señal, el mejor del equipo = 100, el peor = 0, intermedios proporcionales (no escala absoluta). Si todos empatan → 50 a todos (señal no discrimina y su peso se diluye).<br>
        <b>Visitas</b>: min(v, V)/V × 100, con V = mayor nº de visitas alcanzado por al menos 2 jugadores. Esto evita que un solo outlier desvíe la escala.
      </div>

      <div style="margin-top:10px;font-weight:600;font-size:12px;color:#9a3412">⚡ Implicación clave</div>
      <div style="font-size:12px;color:#374151;line-height:1.6;margin-top:2px">

      </div>
    </div>

  </div>`;

// ── Modal de crónica ──
function openCronica(j){
  const cronica=CRONICAS[j];
  if(!cronica)return;
  const fecha=(RAW_DATA.find(r=>r.j===j)||{}).f||'';
  const overlay=document.getElementById('cronica-overlay');
  const titulo=document.getElementById('cronica-titulo');
  const cuerpo=document.getElementById('cronica-cuerpo');
  titulo.textContent=`📰 Crónica · J${j} · ${fecha}`;
  // Parseo markdown ligero: **bold**, líneas vacías como párrafos, - como bullets
  let html=cronica
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/\*([^*]+)\*/g,'<i>$1</i>');
  // Bullets simples: líneas que empiezan por -
  const lineas=html.split('\n');
  const out=[];
  let inList=false;
  lineas.forEach(l=>{
    const t=l.trim();
    if(/^-\s+/.test(t)){
      if(!inList){out.push('<ul style="margin:8px 0 8px 18px;padding:0">');inList=true;}
      out.push(`<li style="margin-bottom:4px">${t.replace(/^-\s+/,'')}</li>`);
    } else {
      if(inList){out.push('</ul>');inList=false;}
      if(t==='')out.push('<div style="height:8px"></div>');
      else out.push(`<div style="margin-bottom:6px">${t}</div>`);
    }
  });
  if(inList)out.push('</ul>');
  // Foto de la jornada (si existe en CRONICA_FOTOS)
  const foto=(typeof CRONICA_FOTOS!=='undefined')?CRONICA_FOTOS[j]:null;
  if(foto&&foto.src){
    out.push(`<img src="${foto.src}" alt="Foto crónica J${j}" style="width:100%;height:auto;border-radius:8px;margin-top:12px;display:block">`);

  Finestres: ['Quim Pallares', 'Quim Pallarès'],

// Resuelve un nombre completo de tarjeta IC → apodo del equipo.
// Base automática: nombre + primer apellido de cada ficha de EQUIPO, comparados
// sin tildes ni mayúsculas (por eso "Alvaro Jimenez-Asenjo" encuentra a Alvaro).
// APODO_A_NOMBRES_IC queda solo para variantes que no se derivan del nombre
// oficial. Un fichaje nuevo NO necesita tocar nada aquí.
function _normIC(s){
  return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
}
function apodoDesdeNombreIC(name){
  if(!name) return null;
  const n = _normIC(name);
  for(const apo of Object.keys(APODO_A_NOMBRES_IC)){
    if(APODO_A_NOMBRES_IC[apo].some(v => n.includes(_normIC(v)))) return apo;
  }
  for(const j of EQUIPO){
    const t = _normIC(j.nombre).split(/\s+/);
    if(t.length >= 2 && n.includes(t[0] + ' ' + t[1])) return j.apodo;
  }
  return null;
}

function renderRanking(el){
  if(RANKING_DATA.length === 0){
    el.innerHTML = `
      <div class="ent-wrap">
        <div class="empty-state">
          <div class="ico">📊</div>
          <h3>Aún no hay ranking</h3>
          <p>Cuando Capi alimente el primer ranking, aparecerá aquí.</p>
        </div>
      </div>`;
    return;
  }

  // Parsear fecha "dd/mm/aaaa" → Date (para ordenar y agrupar por año)
  const parseFecha = (f) => {
    if(!f) return new Date(0);
    const [d,mo,y] = f.split('/');
    return new Date(+y, +mo-1, +d);
  };
  // Si la jornada aún no tiene fecha, se agrupa por su campo `anio`.
  const getYear = (jor) => jor.anio ? Number(jor.anio) : parseFecha(jor.fecha).getFullYear();

  // Agrupar por temporada (año) y ordenar dentro de cada grupo por fecha desc
  const porTemporada = {};
  RANKING_DATA.forEach(jor => {
    const y = getYear(jor);
    if(!porTemporada[y]) porTemporada[y] = [];
    porTemporada[y].push(jor);
  });
  // De más reciente a más antigua. Sin fecha (jornadas aún por jugar) manda el
  // número de jornada, también descendente.
  Object.values(porTemporada).forEach(arr =>
    arr.sort((a,b) => (parseFecha(b.fecha) - parseFecha(a.fecha)) || ((b.j||0) - (a.j||0)))
  );

  // Años de más reciente a más antiguo; el más reciente abierto por defecto
  const anios = Object.keys(porTemporada).map(Number).sort((a,b) => b - a);

  // Construir tarjeta resumen para una temporada: tabla con jugador × jornadas + media
  // REGLA (solo esta clasificación; no afecta al HCP global):
  //  · Una jornada no jugada (de las YA DISPUTADAS) cuenta como AUSENCIA → se muestra "X"
  //    y vale delta 0 (ni penaliza ni mejora; es candidata natural a descarte).
  //  · La media descarta las 2 peores. Por tanto hasta 2 ausencias son absorbibles.
  //  · Con ≥ 3 ausencias ya no quedan descartes para tapar el tercer 0 → SIN media:
  //    el jugador "no juega" esta clasificación, aparece con sus deltas pero sin media,
  //    y se agrupa al fondo de la tabla.
  //  · Todos los jugadores que hayan tocado el ranking aparecen (no se oculta a nadie).
  const buildResumenTemporada = (anio, jornadas) => {
    // Jornadas ordenadas asc por j para columnas J1...J8
    const jornadasAsc = [...jornadas].sort((a,b) => a.j - b.j);
    const maxJ = 8;  // Ranking federación catalana: 8 jornadas totales

    // Números de jornada REALMENTE disputadas hasta la fecha (para contar ausencias
    // solo sobre las disputadas, no sobre las 8 del calendario).
    const jugadasNums = jornadasAsc.map(jor => jor.j);

    // Recopilar jugadores que han jugado al menos una jornada
    const jugadoresSet = new Set();
    jornadasAsc.forEach(jor => Object.keys(jor.hm).forEach(p => jugadoresSet.add(p)));
    const jugadores = [...jugadoresSet];

    // Para cada jugador: array de deltas indexado por número de jornada (1..maxJ).
    //  · Jornada jugada → delta real.
    //  · Jornada disputada NO jugada → AUSENCIA: delta 0 (marcada aparte para pintar "X").
    //  · Jornada aún no disputada → null (celda vacía).
    const datos = jugadores.map(p => {
      const deltas = new Array(maxJ + 1).fill(null);   // index 1..8
      const ausente = new Array(maxJ + 1).fill(false); // true si jornada disputada no jugada
      jugadasNums.forEach(jNum => {
        const jor = jornadasAsc.find(x => x.j === jNum);
        const arr = jor.hm[p];
        if(arr && arr.length === 18){
          deltas[jNum] = arr.reduce((s,v) => s+v, 0) - 54;
        } else {
          deltas[jNum] = 0;      // ausencia computa 0
          ausente[jNum] = true;  // se mostrará como "X"
        }
      });

      const nAusencias = jugadasNums.filter(j => ausente[j]).length;

      // MODELO DE DESCARTES (siempre 2 descartes en total):
      //  · Cada ausencia (X) es un descarte fijo y ocupa una de las 2 plazas.
      //  · Las plazas de descarte que queden se llenan con los PEORES resultados
      //    jugados (mayor delta).
      //  · La media promedia SOLO los resultados jugados que NO caen en descarte.
      //  · Con ≥ 3 ausencias no caben en 2 plazas → descalificado (sin media).
      const jugadasReales = jugadasNums.filter(j => !ausente[j]); // nums con delta real
      const plazasDescartePorJugado = Math.max(0, 2 - nAusencias); // 0, 1 o 2
      // Ordenar jornadas jugadas por delta desc (peores primero) para elegir descartes
      const jugadasOrdPeor = [...jugadasReales].sort((a,b) => deltas[b] - deltas[a]);
      const descartadosJugados = new Set(jugadasOrdPeor.slice(0, plazasDescartePorJugado));

      // Set de jornadas descartadas (para pintar): todas las X + los peores jugados elegidos
      const descartadasJornadas = new Set();
      jugadasNums.forEach(j => { if(ausente[j]) descartadasJornadas.add(j); });
      descartadosJugados.forEach(j => descartadasJornadas.add(j));

      let media = null;
      if(nAusencias <= 2){
        // Jornadas jugadas que cuentan = jugadas − descartadas
        const cuentan = jugadasReales.filter(j => !descartadosJugados.has(j));
        if(cuentan.length > 0){
          media = cuentan.reduce((s,j) => s + deltas[j], 0) / cuentan.length;
        }
      }
      return { jugador: p, deltas, ausente, nAusencias, media, descartadasJornadas };
    });

    // Orden: primero los que TIENEN media (mejor media arriba); debajo, los SIN media
    // (agrupados al fondo, ordenados entre sí por nº de jornadas jugadas desc y nombre).
    datos.sort((a,b) => {
      const am = a.media !== null, bm = b.media !== null;
      if(am !== bm) return am ? -1 : 1;          // con media antes que sin media
      if(am && bm) return a.media - b.media;      // ambos con media: mejor primero
      // ambos sin media: más jornadas jugadas primero, luego alfabético
      const aj = jugadasNums.length - a.nAusencias;
      const bj = jugadasNums.length - b.nAusencias;
      if(aj !== bj) return bj - aj;
      return a.jugador.localeCompare(b.jugador);
    });

    // Formato de celda:
    //  · null (no disputada) → "·"
    //  · ausencia (X) → se muestra "X"; se pinta como descarte (gris tachado)
    //  · delta real → "+N" / "-N" / "0"
    const fmtCell = (d, esAusente) => {
      if(d === null) return '<span class="rkg-empty">·</span>';
      if(esAusente) return 'X';
      return d >= 0 ? `+${d}` : `${d}`;
    };
    const fmtMedia = (m) => m === null ? '—' : (m >= 0 ? `+${m.toFixed(1)}` : `${m.toFixed(1)}`);

    // Construir cabecera J1..J8 + Media
    const headerJornadas = Array.from({length: maxJ}, (_,i) => `<th>J${i+1}</th>`).join('');

    const filas = datos.map(d => {
      const colorFondo = (typeof COLORS !== 'undefined' && COLORS[d.jugador]) ? COLORS[d.jugador] : '#f3f4f6';
      const filaCls = d.media === null ? ' class="rkg-row-sinmedia"' : '';
      const celdas = [];
      for(let j = 1; j <= maxJ; j++){
        let cls = 'rkg-cell';
        if(d.deltas[j] === null){
          cls = 'rkg-cell rkg-cell-empty';
        } else if(d.descartadasJornadas.has(j)){
          // Ausencia o peor jugada descartada: mismo estilo gris tachado
          cls = 'rkg-cell rkg-cell-discarded';
        }
        celdas.push(`<td class="${cls}">${fmtCell(d.deltas[j], d.ausente[j])}</td>`);
      }
      return `<tr${filaCls}>
        <td class="rkg-name" style="background:${colorFondo}">${d.jugador}</td>
        ${celdas.join('')}
        <td class="rkg-media">${fmtMedia(d.media)}</td>
      </tr>`;
    }).join('');

    return `
      <div class="entreno-block rkg-resumen" open>
        <div class="entreno-head">
          <div class="entreno-eyebrow">Clasificación · Temporada ${anio}</div>
          <div class="titulo">📊 Resumen Ranking</div>
        </div>
        <div class="entreno-body">
          <div class="rkg-resumen-table-wrap">
            <table class="rkg-resumen-table">
              <thead>
                <tr>
                  <th class="rkg-name-h">Jugador</th>
                  ${headerJornadas}
                  <th class="rkg-media-h">Media</th>
                </tr>
              </thead>
              <tbody>${filas}</tbody>
            </table>
          </div>
        </div>
      </div>`;
  };

  const html = anios.map((anio, idxAnio) => {
    const lista = porTemporada[anio];
    const bloques = lista.map((jor, i) => renderJornadaCard({
      id: jor.id,
      eyebrow: `Ranking · J${jor.j}`,
      titulo: jor.campo,
      fecha: jor.fecha,
      bodyHtml: renderScorecardTable(jor.hm),
      expanded: idxAnio === 0 && i === 0,
    })).join('');
    const resumen = buildResumenTemporada(anio, lista);
    const label = lista.length === 1 ? '1 jornada' : `${lista.length} jornadas`;
    return `
      <details class="temporada-block" data-temporada="${anio}"${idxAnio === 0 ? ' open' : ''}>
        <summary>
          <span class="temporada-titulo">🏆 Temporada ${anio}</span>
          <span class="temporada-count">${label}</span>
          <span class="temporada-chevron">▾</span>
        </summary>
        <div class="temporada-body">
          ${resumen}
          ${bloques}
        </div>
      </details>`;
  }).join('');

  el.innerHTML = `
    <div class="ent-wrap">
      ${html}
      <div class="ent-foot">Roc &amp; Roll <span>·</span> Ranking · Millor Jugador de l'Any</div>
    </div>`;
}

// Clasificación de la Liga: para cada jornada se ordena por total (con
// el cap del contexto ya aplicado) y se reparten puntos por posición. Los
// empatados comparten posición y se llevan los mismos puntos; la siguiente
// posición se salta tantos puestos como empatados hubo.
function _clasificacionSL(){
  const acts = (typeof _recopilarActuacionesGlobal === 'function' ? _recopilarActuacionesGlobal() : [])
    .filter(a => a.src === 'sl' && !a.abandono);
  const porJornada = {};
  acts.forEach(a => { (porJornada[a.j] = porJornada[a.j] || []).push(a); });

  const jornadas = Object.keys(porJornada).map(Number).sort((a,b) => a-b).map(j => {
    const lista = porJornada[j].slice().sort((a,b) => a.delta - b.delta);
    let pos = 0, vistos = 0, deltaPrev = null;
    const filas = lista.map(a => {
      vistos++;
      if(deltaPrev === null || a.delta !== deltaPrev){ pos = vistos; deltaPrev = a.delta; }
      return { jugador:a.jugador, delta:a.delta, total:a.delta + PAR_CAMPO,
               pos, puntos:puntosSL(pos), fecha:a.fecha, campo:a.campo };
    });
    return { j, fecha:filas.length?filas[0].fecha:null, campo:filas.length?filas[0].campo:null, filas };
  });

  const general = {};
  jornadas.forEach(jr => jr.filas.forEach(f => {
    const g = general[f.jugador] = general[f.jugador] || { jugador:f.jugador, puntos:0, jugadas:0, victorias:0, mejor:null, sumaDelta:0 };
    g.puntos += f.puntos;
    g.jugadas++;
    if(f.pos === 1) g.victorias++;
    g.sumaDelta += f.delta;
    if(g.mejor === null || f.delta < g.mejor) g.mejor = f.delta;
  }));
  const tabla = Object.values(general)
    .map(g => ({ ...g, media: g.jugadas ? g.sumaDelta / g.jugadas : null }))
    .sort((a,b) => b.puntos - a.puntos || a.media - b.media || a.mejor - b.mejor);

  return { jornadas, tabla };
}

// solo cambian los rótulos. cfg trae icono, textos y pie.
function _renderListaTorneos(el, DATOS, cfg){
  if(!Array.isArray(DATOS) || DATOS.length === 0){
    el.innerHTML = `
      <div class="ent-wrap">
        <div class="empty-state">
          <div class="ico">${cfg.icono}</div>
          <h3>${cfg.vacioTitulo}</h3>
          <p>${cfg.vacioTexto}</p>
        </div>
      </div>`;
    return;
  }

  // Helper: fecha "más reciente" del torneo (para ordenar y mostrar en el header)
  const fechaMasReciente = (t) => {
    if(Array.isArray(t.jornadas) && t.jornadas.length > 0){
      return [...t.jornadas].sort((a,b) => {
        const pa = (a.fecha||'').split('/').reverse().join('-');
        const pb = (b.fecha||'').split('/').reverse().join('-');
        return pb.localeCompare(pa);
      })[0].fecha;
    }
    return t.fecha;
  };

  // Orden de tarjetas:
  //   1) `orden` manual si está definido (menor primero) — manda sobre todo
  //   2) fijados arriba
  //   3) por fecha más reciente desc
  const ordenados = [...DATOS].sort((a,b) => {
    const oa = (typeof a.orden === 'number') ? a.orden : Infinity;
    const ob = (typeof b.orden === 'number') ? b.orden : Infinity;
    if(oa !== ob) return oa - ob;
    if(!!a.fijado !== !!b.fijado) return a.fijado ? -1 : 1;
    const pa = (fechaMasReciente(a) || '').split('/').reverse().join('-');
    const pb = (fechaMasReciente(b) || '').split('/').reverse().join('-');
    return pb.localeCompare(pa);
  });

  const bloques = ordenados.map((t, i) => {
    if(Array.isArray(t.jornadas)){
      // Torneo recurrente (multi-jornada). Si aún no tiene jornadas, se
      // muestra la tarjeta pinned con un estado vacío.
      if(t.jornadas.length === 0){
        return renderJornadaCard({
          id: t.id,
          eyebrow: cfg.eyebrow,
          titulo: t.nombre,
          fecha: '—',
          bodyHtml: `<div style="color:#9ca3af;font-size:12px;padding:6px 0">Sin jornadas registradas todavía.</div>`,
          expanded: false,
        });
      }
      // Multi-jornada: UNA tarjeta con todas las jornadas dentro
      const jornadasOrd = [...t.jornadas].sort((a,b) => {
        const pa = (a.fecha||'').split('/').reverse().join('-');
        const pb = (b.fecha||'').split('/').reverse().join('-');
        return pb.localeCompare(pa);
      });
      const sub = jornadasOrd.map((jr, idx) => {
        const hmJornada = {};
        Object.entries(t.hm || {}).forEach(([k, v]) => {
          const sep = k.indexOf('_');
          if(sep > 0 && +k.slice(0, sep) === jr.j) hmJornada[k.slice(sep + 1)] = v;
        });
        const sepStyle = idx === 0 ? '' : 'margin-top:18px;padding-top:14px;border-top:1px dashed #e5e7eb;';
        return `
          <div style="${sepStyle}">
            <div style="font-weight:600;font-size:12px;color:#9a3412;margin-bottom:8px">J${jr.j} · ${jr.fecha}${(jr.campo || t.campo) ? ' · ' + (jr.campo || t.campo) : ''}${jr.evento ? ' · ' + jr.evento : ''}</div>
            ${renderScorecardTable(hmJornada)}
          </div>`;
      }).join('');
      return renderJornadaCard({
        id: t.id,
        eyebrow: cfg.eyebrow,
        titulo: t.nombre,
        fecha: fechaMasReciente(t),
        bodyHtml: sub,
        expanded: i === 0,
      });
    }
    // Torneo plano (legacy: 1 sola fecha)
    return renderJornadaCard({
      id: t.id,
      eyebrow: cfg.eyebrowPlano,
      titulo: `${t.nombre} · ${t.campo}`,
      fecha: t.fecha,
      bodyHtml: renderScorecardTable(t.hm),
      expanded: i === 0,
    });
  }).join('');

  el.innerHTML = `
    <div class="ent-wrap">
      ${bloques}
      <div class="ent-foot">Roc &amp; Roll <span>·</span> ${cfg.pie}</div>
    </div>`;
}

  //    con k=3 (constante de regresión).
  //

  //    nivel reciente del jugador. Con poca muestra (n bajo), tira el HCP
  //    exponencial. Con muchos partidos en el campo, el avg-campo domina y el

  //

  //    crudo (sin regresión), porque no hay "prior" con el que mezclar.
  const REGRESION_K = 3;
  const ALPHA_REGRESION = 0.7;  // mismo α que la convocatoria (HCP exponencial)
  function calcAvgCampoDelta(entreno, jugador){
    const s = statsJugador(entreno, jugador);

      if(hg && hg.hcp !== null && hg.hcp !== undefined){

      }

  function calcAvgCampoDeltaCrudo(entreno, jugador){
    const s = statsJugador(entreno, jugador);
    return s.delta;

  // 🛡️ Floor = peor delta del jugador en este campo (max delta).
  function calcFloorCampoDelta(entreno, jugador){
    const totales = entreno.jornadas
      .map(jr => totalJornada(entreno, jr.j, jugador))
      .filter(t => t !== null);
