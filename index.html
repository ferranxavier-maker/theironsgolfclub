// ── HÁNDICAP GLOBAL ──
// Para cada jugador, recoge sus actuaciones de TODOS los contextos (Super ROC RAW + Entrenamientos +
// Interclubs como individual + futuros Torneos Oficiales y Ranking), las ordena por fecha desc.
//
// Cada delta se ajusta por SUMA FIJA de golpes (no porcentaje), con dos componentes:
//   delta_efectivo = delta + ajuste_campo + ajuste_contexto
//
// 1) ajuste_campo:    dificultad relativa del campo vs ROC 3 (referencia 0).
//                     Definido en CAMPOS[i].eppa. Ej.: ROC 3 +1, Canal Olímpic +1,
//                     Can Rafel 0, Badalona 0, resto +1.
// 2) ajuste_contexto: rigor/mérito de la modalidad. Igual para todos, no depende del delta.
//                     · IC        = 0     (referencia, medal play oficial)
//                     · Ranking   = 0     (Millor Jugador de l'Any)
//                     · Oficial   = 0.5   (Mulligans, etc.)
//                     · Entreno   = 0.75  (entrenamientos en otros campos)
//                     · Super ROC = 1     (martes en ROC 3)
//
// ──────────────────────────────────────────────────────────────────────
// _recopilarActuacionesGlobal(jugador) — fuente única de actuaciones
// ──────────────────────────────────────────────────────────────────────
// Devuelve TODAS las actuaciones de un jugador (o de todos los activos si
// jugador es null/undefined), unificando las 5 fuentes: RAW/HM (SR),
// ENTRENAMIENTOS_DATA, TORNEOS_DATA, RANKING_DATA, IC.
//
// Esta función es la ÚNICA fuente de verdad para las actuaciones del HCP
// Global. Tanto `calcHandicapGlobal` como `renderTablaGlobal` la consumen.
// Si quieres añadir una nueva fuente de actuaciones, modifícala aquí.
//
// Cada actuación devuelta:
//   { fecha:Date, src:'roc'|'ent'|'ic'|'rkg'|'oficial'|'sptr'|'copa',
//     campo:string, jugador:string, delta:number,
//     hoyos:number[18]|null, bir:number, par:number, bog:number, dbl:number,
//     j:number|null, abandono:boolean }
function _recopilarActuacionesGlobal(jugador){
  const acts = [];
  // Helper para parsear fecha 'dd/mm/yyyy' a Date local
  const _parseF = (s) => { if(!s) return null; const [d,m,y]=s.split('/'); return new Date(+y,+m-1,+d); };
  // Helper para contar estadísticas hoyo a hoyo
  const _stats = (hoyos) => {
    let bir=0, par=0, bog=0, dbl=0;
    hoyos.forEach(v => { if(v<=2) bir++; else if(v===3) par++; else if(v===4) bog++; else if(v>=5) dbl++; });
    return { bir, par, bog, dbl };
  };

  // ── SR (RAW + HM) ──
  if(typeof RAW_DATA !== 'undefined' && Array.isArray(RAW_DATA)){
    RAW_DATA.forEach(r => {
      if(jugador && r.jugador !== jugador) return;
      const f = _parseF(r.f);
      if(!f) return;
      const hmKey = `${r.j}_${r.jugador}`;
      const hoyos = (typeof HM_DATA !== 'undefined' && HM_DATA[hmKey]) ? HM_DATA[hmKey].slice() : null;
      acts.push({
        fecha:f, src:'roc', campo:CAMPO_SR, jugador:r.jugador,
        delta:r.total, hoyos:hoyos,
        bir:r.bir, par:r.par, bog:r.bog, dbl:r.dbl,
        j:r.j, abandono:!!r.abandono,
        recorrido: r.recorrido || 'FCPP',
      });
    });
  }

  // ── Entrenamientos ──
  if(typeof ENTRENAMIENTOS_DATA !== 'undefined' && Array.isArray(ENTRENAMIENTOS_DATA)){
    ENTRENAMIENTOS_DATA.forEach(ent => {
      (ent.jornadas||[]).forEach(jr => {
        Object.keys(ent.hm||{}).forEach(key => {
          const [jStr, apo] = key.split('_');
          if(+jStr !== jr.j) return;
          if(jugador && apo !== jugador) return;
          const arr = ent.hm[key];
          if(!arr) return;
          const f = _parseF(jr.fecha);
          if(!f) return;
          const tot = sumaHoyos(arr, 'ent');
          const st = _stats(arr);
          acts.push({
            fecha:f, src:'ent', campo:ent.campo, jugador:apo,
            delta:tot - PAR_CAMPO, hoyos:arr.slice(),
            bir:st.bir, par:st.par, bog:st.bog, dbl:st.dbl,
            j:jr.j, abandono:false,
            recorrido: jr.recorrido || ent.recorrido || 'FCPP',
          });
        });
      });
    });
  }

  // ── Torneos oficiales ──
  if(typeof TORNEOS_DATA !== 'undefined' && Array.isArray(TORNEOS_DATA)){
    TORNEOS_DATA.forEach(t => {
      if(!t.hm) return;
      // Por defecto un torneo es oficial (+0.5). Una entrada puede declarar su
      // propio `src`: el antiguo TOUR vive aquí como 'can_mascaro' y mantiene
      // src:'sptr' para conservar el +1 de sus jornadas ya jugadas.
      const _srcTorneo = t.src || 'oficial';
      if(Array.isArray(t.jornadas) && t.jornadas.length > 0){
        t.jornadas.forEach(jr => {
          Object.keys(t.hm).forEach(key => {
            const [jStr, apo] = key.split('_');
            if(+jStr !== jr.j) return;
            if(jugador && apo !== jugador) return;
            const arr = t.hm[key];
            const f = _parseF(jr.fecha);
            if(!f || !arr) return;
            const tot = sumaHoyos(arr, _srcTorneo);
            const st = _stats(arr);
            acts.push({
              fecha:f, src:_srcTorneo, torneoId:t.id, campo:jr.campo || t.campo, jugador:apo,
              delta:tot - PAR_CAMPO, hoyos:arr.slice(),
              bir:st.bir, par:st.par, bog:st.bog, dbl:st.dbl,
              j:jr.j, abandono:false,
              recorrido: jr.recorrido || t.recorrido || 'FCPP',
            });
          });
        });
      } else {
        Object.keys(t.hm).forEach(apo => {
          if(jugador && apo !== jugador) return;
          const arr = t.hm[apo];
          const f = _parseF(t.fecha);
          if(!f || !arr) return;
          const tot = sumaHoyos(arr, _srcTorneo);
          const st = _stats(arr);
          acts.push({
            fecha:f, src:_srcTorneo, torneoId:t.id, campo:t.campo, jugador:apo,
            delta:tot - PAR_CAMPO, hoyos:arr.slice(),
            bir:st.bir, par:st.par, bog:st.bog, dbl:st.dbl,
            j:null, abandono:false,
            recorrido: t.recorrido || 'FCPP',
          });
        });
      }
    });
  }

  // ── Liga (miércoles, por puntos) ──
  // Misma estructura que TOUR_DATA, con src 'sl' (+0.5 y cap 5).
  if(typeof LIGA_DATA !== 'undefined' && Array.isArray(LIGA_DATA)){
    LIGA_DATA.forEach(t => {
      if(!t.hm) return;
      (Array.isArray(t.jornadas) ? t.jornadas : []).forEach(jr => {
        Object.keys(t.hm).forEach(key => {
          const sep = key.indexOf('_'); if(sep < 0) return;
          const jStr = key.slice(0, sep), apo = key.slice(sep+1);
          if(+jStr !== jr.j) return;
          if(jugador && apo !== jugador) return;
          const arr = t.hm[key];
          const f = _parseF(jr.fecha);
          if(!f || !arr) return;
          const tot = sumaHoyos(arr, 'sl');
          const st = _stats(arr);
          acts.push({
            fecha:f, src:'sl', torneoId:t.id, campo:jr.campo || t.campo, jugador:apo,
            delta:tot - PAR_CAMPO, hoyos:arr.slice(),
            bir:st.bir, par:st.par, bog:st.bog, dbl:st.dbl,
            j:jr.j, abandono:false,
            recorrido: jr.recorrido || t.recorrido || 'FCPP',
          });
        });
      });
    });
  }

  // ── Tour (quedadas internas) ──
  // Misma estructura que TORNEOS_DATA pero src 'sptr' (+1 en vez de +0.5).
  if(typeof TOUR_DATA !== 'undefined' && Array.isArray(TOUR_DATA)){
    TOUR_DATA.forEach(t => {
      if(!t.hm) return;
      (Array.isArray(t.jornadas) ? t.jornadas : []).forEach(jr => {
        Object.keys(t.hm).forEach(key => {
          const [jStr, apo] = key.split('_');
          if(+jStr !== jr.j) return;
          if(jugador && apo !== jugador) return;
          const arr = t.hm[key];
          const f = _parseF(jr.fecha);
          if(!f || !arr) return;
          const tot = sumaHoyos(arr, 'sptr');
          const st = _stats(arr);
          acts.push({
            fecha:f, src:'sptr', torneoId:t.id, campo:jr.campo || t.campo, jugador:apo,
            delta:tot - PAR_CAMPO, hoyos:arr.slice(),
            bir:st.bir, par:st.par, bog:st.bog, dbl:st.dbl,
            j:jr.j, abandono:false,
            recorrido: jr.recorrido || t.recorrido || 'FCPP',
          });
        });
      });
    });
  }

  // ── Ranking ──
  if(typeof RANKING_DATA !== 'undefined' && Array.isArray(RANKING_DATA)){
    RANKING_DATA.forEach(jr => {
      Object.keys(jr.hm||{}).forEach(apo => {
        if(jugador && apo !== jugador) return;
        const arr = jr.hm[apo];
        const f = _parseF(jr.fecha);
        if(!f || !arr) return;
        const tot = sumaHoyos(arr, 'rkg');
        const st = _stats(arr);
        acts.push({
          fecha:f, src:'rkg', campo:jr.campo, jugador:apo,
          delta:tot - PAR_CAMPO, hoyos:arr.slice(),
          bir:st.bir, par:st.par, bog:st.bog, dbl:st.dbl,
          j:jr.j || null, abandono:false,
          recorrido: jr.recorrido || 'FCPP',
        });
      });
    });
  }

  // ── Interclubs (solo individuales) ──
  if(typeof IC_DATA !== 'undefined' && typeof APODO_A_NOMBRES_IC !== 'undefined'){
    Object.values(IC_DATA).forEach(yd => {
      (yd.pruebas||[]).forEach((p, pi) => {
        if(!p.fecha || p.total === null) return;
        const f = _parseF(p.fecha);
        if(!f) return;
        const indis = [];
        if(p.ind1) indis.push({n:p.ind1[0], s:p.ind1[1]}, {n:p.ind1[2], s:p.ind1[3]});
        if(p.ind2) indis.push({n:p.ind2[0], s:p.ind2[1]}, {n:p.ind2[2], s:p.ind2[3]});
        indis.forEach(({n, s}) => {
          // ¿Quién es este nombre? EQUIPO + variantes de APODO_A_NOMBRES_IC.
          const apo = apodoDesdeNombreIC(n);
          if(!apo) return;
          if(jugador && apo !== jugador) return;
          // ¿Tenemos hoyo a hoyo? Mira p.hm[apo]
          const hoyos = (p.hm && p.hm[apo]) ? p.hm[apo].slice() : null;
          const st = hoyos ? _stats(hoyos) : { bir:0, par:0, bog:0, dbl:0 };
          acts.push({
            fecha:f, src:'ic', campo:p.camp, jugador:apo,
            delta:s, hoyos:hoyos,
            bir:st.bir, par:st.par, bog:st.bog, dbl:st.dbl,
            j:pi+1, abandono:false,
            recorrido: p.recorrido || 'FCPP',
          });
        });
      });
    });
  }

  
  // ── Copa ──
  // Estructura COPA_DATA: edición.jugadores[].{n, f:[h1..h9], b:[delta_front, h10..h18]}.
  // b[0] es el delta acumulado del front-9 (info redundante), no es un hoyo real.
  // Los 18 hoyos = f.concat(b.slice(1)). Medal play sin cap.
  if(typeof COPA_DATA !== 'undefined' && Array.isArray(COPA_DATA)){
    COPA_DATA.forEach(ed => {
      if(!ed.fecha) return;
      const f = _parseF(ed.fecha);
      if(!f) return;
      (ed.jugadores || []).forEach(p => {
        const apo = p.n;
        if(jugador && apo !== jugador) return;
        const front = Array.isArray(p.f) ? p.f.slice() : [];
        const backRaw = Array.isArray(p.b) ? p.b.slice() : [];
        // b puede tener 10 (delta + 9 hoyos) o más (con desempates). Tomamos b[1..9].
        const back = backRaw.length >= 10 ? backRaw.slice(1, 10) : [];
        if(front.length !== 9 || back.length !== 9) return;
        const hoyos = front.concat(back);
        const tot = sumaHoyos(hoyos, 'copa');
        const st = _stats(hoyos);
        acts.push({
          fecha:f, src:'copa', campo: ed.campo || 'ROC 3', jugador:apo,
          delta:tot - PAR_CAMPO, hoyos:hoyos,
          bir:st.bir, par:st.par, bog:st.bog, dbl:st.dbl,
          j:1, abandono:false,
          recorrido: p.recorrido || ed.recorrido || 'FCPP',
        });
      });
    });
  }

return acts;
}

// Días de gracia sin jugar antes de que el HCP empiece a oxidarse, y tasa de
// penalización por cada día a partir de ahí. Las dos las usan calcHandicapGlobal
// y la leyenda visual de Oxidación: si se tocan aquí, cambian en ambos sitios.
const DIAS_GRACIA_OXIDACION = 12;
const TASA_OXIDACION_DIA = 0.03;

// Segunda capa: penalización por VENTANA ESTIRADA en el tiempo. Si las 10
// últimas actuaciones del jugador abarcan más de UMBRAL_DISPERSION_DIAS, se
// añade TASA_DISPERSION_DIA por cada día por encima. Mide si tu HCP descansa
// sobre datos demasiado viejos aunque no te hayas oxidado (jugaste hace 13
// días, pero tu ventana de 10 ocupa 4 meses).
const UMBRAL_DISPERSION_DIAS = 60;
const TASA_DISPERSION_DIA   = 0.01;

// ════════════════════════════════════════════════════════════════════════
// _calcHistoricoN1Global — FUENTE ÚNICA del histórico de nº1 HCP Global
// ════════════════════════════════════════════════════════════════════════
// Calcula al vuelo (desde las 6 fuentes vía calcHandicapGlobal) la lista de
// fechas en las que se cumple el umbral (≥N jugadores con n≥10) y, para cada
// una, quién era nº1 y el ranking completo. Es la fuente única que consumen:
//   · renderHandicapGlobal  — card del nº1 actual + lista HISTÓRICO + popup
//   · renderBitacoraGlobal  — tablas detalladas por jornada
// Devuelve {fechasValidas, historialN1, numUnoCalc} o null si no hay datos.

// Cuántos jugadores con 10 actuaciones hacen falta para que arranque la foto
// semanal del HCP Global: el nº1, el podio y La Carrera usan todos este umbral.
const UMBRAL_N1 = 6;

// ════════════════════════════════════════════════════
// IRON RACE — premio anual al hándicap
// ════════════════════════════════════════════════════
// Cada domingo a medianoche se congela el HCP Global y los 5 primeros reparten
// 5-4-3-2-1. Los puntos se acumulan toda la temporada. No arranca hasta que 6
// jugadores tengan 10 actuaciones; desde ahí ya no puede bajar de 6, solo crecer.
//
// Desempate, en cascada y siempre sobre las MISMAS 10 actuaciones que forman el
// hándicap de esa foto:
//   1. HCP a 3 decimales
//   2. más birdies (2 golpes o menos en par 3)
//   3. más campos distintos
// Si aún así empatan, posición compartida y mismos puntos para los dos.
const CARRERA_PUNTOS = [5, 4, 3, 2, 1];
const CARRERA_UMBRAL = UMBRAL_N1;

// Claves de desempate de un jugador en una foto, a partir de sus `used`.
function _carreraClaves(d){
  let bir = 0;
  const campos = {};
  (d.used || []).forEach(a => {
    if(Array.isArray(a.hoyos)) a.hoyos.forEach(sc => { if(sc !== null && sc !== undefined && sc <= 2) bir++; });
    if(a.campo) campos[a.campo] = 1;
  });
  return { hcp3: Math.round(d.hcp * 1000), bir: bir, campos: Object.keys(campos).length };
}

// Devuelve null mientras no haya arrancado. Si no, la clasificación acumulada.
function calcCarrera(){
  const hist = (typeof _calcHistoricoN1Global === 'function') ? _calcHistoricoN1Global(CARRERA_UMBRAL) : null;
  if(!hist || !hist.historialN1 || !hist.historialN1.length) return null;

  const acum = {};       // jugador → { puntos, semanas, posiciones{} }
  const semanas = [];    // foto a foto, para poder auditarlo

  hist.historialN1.forEach(row => {
    const rk = (row.ranking || []).map(d => ({ jugador:d.jugador, hcp:d.hcp, ..._carreraClaves(d) }));
    if(!rk.length) return;

    // Orden por la cascada completa
    rk.sort((a,b) => (a.hcp3 - b.hcp3) || (b.bir - a.bir) || (b.campos - a.campos));

    // Posición = 1 + cuántos son estrictamente mejores (empate = compartida)
    const mejorQue = (x,y) => (x.hcp3 !== y.hcp3) ? (x.hcp3 < y.hcp3)
                            : (x.bir !== y.bir)   ? (x.bir > y.bir)
                            : (x.campos !== y.campos) ? (x.campos > y.campos)
                            : false;
    const filas = rk.map(r => {
      const pos = 1 + rk.filter(o => mejorQue(o, r)).length;
      const pts = (pos <= CARRERA_PUNTOS.length) ? CARRERA_PUNTOS[pos-1] : 0;
      return { jugador:r.jugador, hcp:r.hcp, pos:pos, pts:pts };
    });

    filas.forEach(f => {
      if(f.pts <= 0) return;
      if(!acum[f.jugador]) acum[f.jugador] = { jugador:f.jugador, puntos:0, semanas:0, posiciones:{} };
      acum[f.jugador].puntos  += f.pts;
      acum[f.jugador].semanas += 1;
      acum[f.jugador].posiciones[f.pos] = (acum[f.jugador].posiciones[f.pos] || 0) + 1;
    });

    semanas.push({ ts:row.ts, filas:filas.filter(f => f.pts > 0) });
  });

  if(!semanas.length) return null;

  // Clasificación: puntos, y a igualdad más primeros, más segundos, etc.
  const tabla = Object.values(acum).sort((a,b) => {
    if(b.puntos !== a.puntos) return b.puntos - a.puntos;
    for(let pos = 1; pos <= CARRERA_PUNTOS.length; pos++){
      const d = (b.posiciones[pos] || 0) - (a.posiciones[pos] || 0);
      if(d) return d;
    }
    return a.jugador.localeCompare(b.jugador);
  });

  return { tabla:tabla, semanas:semanas, cierres:semanas.length };
}

function _calcHistoricoN1Global(umbral){
  const UMBRAL = (typeof umbral === 'number' && umbral > 0) ? umbral : UMBRAL_N1;

  // ── FOTO SEMANAL (Opción A) ────────────────────────────────────────────
  // En vez de coronar en cada fecha de actuación (lo que inflaba el contador
  // cuando una semana tenía varios entrenamientos), se toma UNA foto del HCP
  // Global cada DOMINGO a las 23:59. El nº1 de la semana es quien tiene el
  // HCP más bajo en ese instante. Una semana = una foto = como mucho una marca.
  //
  // Primera foto: domingo 05/04/2026 23:59 (primer domingo que cumple el umbral
  // de ≥5 jugadores con n≥10). De ahí en adelante, un domingo tras otro hasta
  // el último domingo ≤ hoy. Cada domingo cuenta SIEMPRE (se haya jugado o no),
  // porque el HCP Global puede cambiar igualmente (inactividad, ventana, etc.).
  //
  // NOTA: esto NO toca el cálculo del HCP en sí (calcHandicapGlobal intacto) ni
  // el popup de "últimas 10 jornadas". La foto solo determina posiciones semanales.
  // Primera foto = el primer domingo posterior a la primera actuación registrada.
  // Antes estaba clavada al 05/04/2026; con el club nuevo se calcula sola.
  let _primeraAct = null;
  PLAYERS.forEach(j => {
    (_recopilarActuacionesGlobal(j) || []).forEach(a => {
      if(a && a.fecha instanceof Date && (!_primeraAct || a.fecha < _primeraAct)) _primeraAct = a.fecha;
    });
  });
  if(!_primeraAct) return null;
  const FECHA_PRIMERA_FOTO = (() => {
    const d = new Date(_primeraAct.getFullYear(), _primeraAct.getMonth(), _primeraAct.getDate(), 23, 59, 0);
    d.setDate(d.getDate() + ((7 - d.getDay()) % 7));   // avanza al domingo
    return d;
  })();
  // Tope: hoy a las 23:59:59. Comparamos contra el FINAL del día de hoy para que
  // el domingo EN CURSO (si hoy es domingo) ya cuente, sin esperar a las 23:59
  // reales del reloj. La foto del domingo se cierra el propio domingo.
  const _now = new Date();
  const hoy = new Date(_now.getFullYear(), _now.getMonth(), _now.getDate(), 23, 59, 59);

  // Generar la rejilla de domingos 23:59 desde la primera foto hasta hoy.
  const fechasUnicas = [];
  for(let d = new Date(FECHA_PRIMERA_FOTO); d <= hoy; d.setDate(d.getDate() + 7)){
    fechasUnicas.push(new Date(d.getFullYear(), d.getMonth(), d.getDate(), 23, 59, 0));
  }

  // Filtrar fechas válidas: ≥UMBRAL jugadores con n≥10 ese domingo
  const fechasValidas = [];
  const historialN1 = [];
  const numUnoMap = {};

  fechasUnicas.forEach(fc => {
    const ranking = PLAYERS.map(j => ({ jugador:j, ...calcHandicapGlobal(j, fc) }))
      .filter(d => d.n >= 10 && d.hcp !== null)
      .sort((a,b) => a.hcp - b.hcp);
    if(ranking.length < UMBRAL) return;

    fechasValidas.push(fc);
    const minHcp = ranking[0].hcp;
    const minRound = Math.round(minHcp * 100);
    const n1sFecha = ranking.filter(r => Math.round(r.hcp*100) === minRound).map(r => r.jugador);
    n1sFecha.forEach(j => {
      if(!numUnoMap[j]) numUnoMap[j] = [];
      numUnoMap[j].push(fc.getTime());
    });
    historialN1.push({ ts:fc.getTime(), n1s:n1sFecha, hcp:minHcp, ranking });
  });

  if(fechasValidas.length === 0) return null;

  // Para cada jugador que ha sido nº1, calcular jornadas totales y maxConsec
  const numUnoCalc = Object.entries(numUnoMap).map(([jugador, ts]) => {
    const sorted = ts.slice().sort((a,b) => a-b);
    const idxOf = (t) => fechasValidas.findIndex(f => f.getTime() === t);
    let maxConsec = 1, cur = 1;
    for(let i = 1; i < sorted.length; i++){
      if(idxOf(sorted[i]) === idxOf(sorted[i-1]) + 1){ cur++; maxConsec = Math.max(maxConsec, cur); }
      else cur = 1;
    }
    let actualConsec = 1;
    for(let i = sorted.length - 1; i > 0; i--){
      if(idxOf(sorted[i]) === idxOf(sorted[i-1]) + 1) actualConsec++;
      else break;
    }
    const ultima = fechasValidas[fechasValidas.length-1].getTime();
    if(sorted[sorted.length-1] !== ultima) actualConsec = 0;
    return { jugador, jornadas: sorted.length, maxConsec, actualConsec };
  }).sort((a,b) => b.jornadas - a.jornadas);

  return { fechasValidas, historialN1, numUnoCalc, umbral: UMBRAL };
}

// Cuanto más "blando" el contexto o más fácil el campo, más se suma. Premia mérito (IC
// y Ranking sin ajuste de contexto); penaliza informalidad (SR en Canal Olímpic suma +1+1 = +2).
//
//   · Si n >= 10: hcp = media simple de los 10 últimos deltas efectivos
//   · Si n <  10: hcp = null (sin HCP hasta completar la ventana de 10 partidas)
//   · Si n == 0: hcp = null
// `camposExcluidos` (opcional): array de nombres de campo que quedan fuera del
// cálculo. Si no se pasa, el comportamiento es el de siempre (nada excluido).
// Lo usa la Progresión del jugador de Miscelánea para dejar fuera Canal Olímpic.
function calcHandicapGlobal(jugador, fechaCorte, forzarMediaParcial, alphaWeight, camposExcluidos, ventana){
  // `ventana` = cuántas actuaciones entran en la media. Por defecto VENTANA
  // (10), que es el HCP Global oficial. Pasando 20 o 30 se obtiene el mismo
  // cálculo sobre una ventana más larga (ficha del jugador).
  const VENT = (typeof ventana === 'number' && ventana > 0) ? Math.floor(ventana) : VENTANA;
  const acts = [];

  // Ajuste por contexto (modalidad): suma fija de golpes igual para todos los resultados.
  // IC y Ranking son la referencia limpia (mérito puro). El resto suma según
  // mérito relativo: a más informalidad, más golpes.
  //   ic      → 0     (referencia, medal play oficial)
  //   rkg     → 0     (Ranking — Millor Jugador de l'Any)
  //   copa    → 0     (Copa, medal play sin cap)
  //   oficial → 0.5   (Torneos oficiales tipo Mulligans)
  //   ent     → 0.75  (entrenamientos en otros campos)
  //   sptr    → 1     (Tour)
  //   roc     → 1     (Super ROC, los martes)
  // Ejemplos:
  //   · SR delta=+6 en ROC 3      → +6 + 1 + 1     = +8
  //   · SR delta=−2 en ROC 3      → −2 + 1 + 1     = 0
  //   · ENT delta=0 Canal Olímpic → 0 + 1 + 0.75   = +1.75
  //   · IC delta=−3 cualquier campo → −3 + ajuste_campo + 0
  // Los valores NO se declaran aquí: salen de CTX_INFO (fuente única).

  // Helper: ajuste de dificultad de campo. Reglas (asumiendo salidas FCPP por
  // defecto en ENT, IC y SR; y recorrido B en Can Rafel):
  //   · El ajuste se lee de CAMPOS[*].recorridos según el recorrido que jugó
  //     el jugador (FCPP por defecto si no se ha registrado recorrido).
  //   · Centralizado en `ajusteRecorrido(campoId, recorridoId)`.
  function _ajusteCampoGlobal(nombreCampo, recorrido){
    return ajusteRecorrido(nombreCampo, recorrido);
  }

  // Super ROC + Entrenamientos + Torneos + Ranking + Interclubs:
  // todas las fuentes ahora vienen de _recopilarActuacionesGlobal.
  const _actsRaw = _recopilarActuacionesGlobal(jugador);
  _actsRaw.forEach(a => acts.push({ fecha:a.fecha, delta:a.delta, src:a.src, campo:a.campo, recorrido:a.recorrido, torneoId:a.torneoId }));

  if(acts.length === 0){
    return { hcp:null, n:0, trend:0, totalActs:0, daysOff:0, penalAdd:0, diasVentana:0, penalDispersion:0, sigma:null, used:[], camposDistintos:0, descuentoAdapt:0 };
  }

  // El HCP Global arranca el 01/01/2026. Las actuaciones anteriores no cuentan.
  const FECHA_INICIO_GLOBAL_CALC = new Date(2026, 0, 1);
  let actsFiltradas = acts.filter(a => a.fecha >= FECHA_INICIO_GLOBAL_CALC);

  // Filtrado opcional por fecha corte (para "jornadas como nº1")
  if(fechaCorte instanceof Date){
    actsFiltradas = actsFiltradas.filter(a => a.fecha <= fechaCorte);
  }
  // Filtrado opcional por campo excluido (por defecto no se excluye nada)
  if(Array.isArray(camposExcluidos) && camposExcluidos.length){
    actsFiltradas = actsFiltradas.filter(a => !camposExcluidos.includes(a.campo));
  }
  if(actsFiltradas.length === 0){
    return { hcp:null, n:0, trend:0, totalActs:0, daysOff:0, penalAdd:0, diasVentana:0, penalDispersion:0, sigma:null, used:[], camposDistintos:0, descuentoAdapt:0 };
  }

  actsFiltradas.sort((a,b) => b.fecha - a.fecha);

  // Calcular hcp aplicando suma fija de ajustes (campo + contexto), media simple.
  // Solo se calcula si hay 10 o más actuaciones; con menos se devuelve null.
  // Excepción: si forzarMediaParcial=true, se calcula con lo disponible (≥1).
  // Si alphaWeight está definido (0 < α < 1), aplica media ponderada exponencial:
  //   peso_i = α^i, con i=0 la más reciente. α=0.7 = agresiva (sólo cuenta lo reciente),
  //   α=0.9 = suave. El alphaWeight NO se usa en el HCP Global público, sólo en la
  //   convocatoria de entrenamientos.
  let used, hcp;
  const minimo = forzarMediaParcial ? 1 : VENT;
  if(actsFiltradas.length >= minimo){
    used = actsFiltradas.slice(0, Math.min(VENT, actsFiltradas.length));
    used.forEach(a => {
      const ajCampo    = _ajusteCampoGlobal(a.campo, a.recorrido);
      // Contexto: siempre desde CTX_INFO. Se pasa la actuación entera, no solo
      // el src, porque el ajuste puede haber cambiado con el tiempo y cada
      // vuelta conserva el que estaba vigente el día que se jugó.
      const ajContexto = ajusteContexto(a);
      const deltaEfectivo = a.delta + ajCampo + ajContexto;
      a.ajusteCampo    = ajCampo;
      a.ajusteContexto = ajContexto;
      a.deltaEfectivo  = deltaEfectivo;
    });
    if(typeof alphaWeight === 'number' && alphaWeight > 0 && alphaWeight < 1){
      // Media ponderada exponencial: peso_i = α^i, i=0 la más reciente.
      let sumP = 0, sumW = 0;
      used.forEach((a, i) => {
        const w = Math.pow(alphaWeight, i);
        sumP += a.deltaEfectivo * w;
        sumW += w;
      });
      hcp = sumW > 0 ? sumP / sumW : null;
    } else {
      // Media simple (default)
      let sumDeltaEf = 0;
      used.forEach(a => { sumDeltaEf += a.deltaEfectivo; });
      hcp = sumDeltaEf / used.length;
    }
  } else {
    used = actsFiltradas.slice(0, actsFiltradas.length);
    hcp = null;
  }

  // σ (desviación estándar) sobre los deltas EFECTIVOS de las used, con la
  // misma ponderación exponencial que el HCP de convocatoria (α=0.7): la
  // actuación más reciente pesa 25 veces más que la décima. Se centra en la
  // media ponderada y corrige el sesgo de los pesos. Es la σ única del
  // proyecto: la consumen el badge de refugio (🏰🏠🎪📦), el tie-breaker de
  // consistencia de la Capa 2 y la sección 🎰 El Metrónomo de Miscelánea.
  // No depende de alphaWeight: siempre ponderada, para que todos los
  // consumidores vean el mismo número.
  // Fiabilidad estándar a partir de 10 partidas. Excepción: cuando
  // forzarMediaParcial=true (jugadores en hcpFallbackMedia del bloque), se
  // calcula también con n≥4 — para que el tie-breaker de consistencia de
  // Capa 2 pueda comparar todos los titulares en cualquier escenario.
  let sigma = null;
  const minSigma = forzarMediaParcial ? 4 : 10;
  if(used.length >= minSigma){
    const ALPHA_SIGMA = 0.7;
    let sumW = 0, sumW2 = 0, sumP = 0;
    used.forEach((a, i) => {
      const w = Math.pow(ALPHA_SIGMA, i);
      sumW += w; sumW2 += w*w; sumP += a.deltaEfectivo * w;
    });
    const mediaPond = sumP / sumW;
    let acc = 0;
    used.forEach((a, i) => { acc += Math.pow(ALPHA_SIGMA, i) * Math.pow(a.deltaEfectivo - mediaPond, 2); });
    const den = (sumW * sumW) - sumW2;
    sigma = den > 0 ? Math.sqrt((acc / sumW) * ((sumW * sumW) / den)) : 0;
  }

  // Tendencia: media ponderada (más recientes pesan más por posición) vs media simple del periodo.
  // Independiente de los pesos de tipo (mide solo la curva temporal).
  let trend = 0;
  if(used.length >= 4){
    const n = used.length;
    let twD = 0, twW = 0;
    used.forEach((a, i) => {
      const peso = n - i;
      twD += a.delta * peso;
      twW += peso;
    });
    const ponderada = twD / twW;
    const simple = used.reduce((s,a) => s + a.delta, 0) / n;
    const diff = ponderada - simple;
    if(diff < -1.0) trend = -2;
    else if(diff < -0.3) trend = -1;
    else if(diff > 1.0) trend = 2;
    else if(diff > 0.3) trend = 1;
    else trend = 0;
  }

  // Penalización por inactividad
  //   dentro de la gracia → sin penalización
  //   a partir de ahí      → +TASA_OXIDACION_DIA al hcp por cada día de más
  //   tope:     hcp máximo +18
  let daysOff = 0, penalAdd = 0;
  const masReciente = actsFiltradas[0].fecha; // actsFiltradas ya está ordenado desc
  const hoy = (fechaCorte instanceof Date) ? fechaCorte : new Date();
  daysOff = Math.max(0, Math.floor((hoy - masReciente) / (1000*60*60*24)));
  if(daysOff > DIAS_GRACIA_OXIDACION && hcp !== null){
    const diasPenalizados = daysOff - DIAS_GRACIA_OXIDACION;
    penalAdd = diasPenalizados * TASA_OXIDACION_DIA;
    let hcpPenalizado = hcp + penalAdd;
    if(hcpPenalizado > 18){
      hcpPenalizado = 18;
      penalAdd = 18 - hcp;   // ajustar penalAdd al tope efectivo
    }
    hcp = hcpPenalizado;
  }

  // Penalización por VENTANA ESTIRADA
  //   Mide los días que abarcan las 10 actuaciones de used (de la más antigua
  //   a la más reciente). Si supera UMBRAL_DISPERSION_DIAS, suma TASA_DISPERSION_DIA
  //   por cada día por encima. Tope global del HCP: +18.
  let diasVentana = 0, penalDispersion = 0;
  if(used.length >= 2 && hcp !== null){
    diasVentana = Math.max(0, Math.floor((used[0].fecha - used[used.length-1].fecha) / (1000*60*60*24)));
    // El umbral escala con la ventana: UMBRAL_DISPERSION_DIAS para 10
    // actuaciones, el doble para 20 y el triple para 30. Si no, una ventana más larga se penalizaría solo por
    // ser más larga y los tres HCP no serían comparables.
    const _umbralDisp = UMBRAL_DISPERSION_DIAS * (VENT / VENTANA);
    if(diasVentana > _umbralDisp){
      penalDispersion = (diasVentana - _umbralDisp) * TASA_DISPERSION_DIA;
      let hcpConDisp = hcp + penalDispersion;
      if(hcpConDisp > 18){
        hcpConDisp = 18;
        penalDispersion = 18 - hcp;
      }
      hcp = hcpConDisp;
    }
  }

  // Premio por variedad de campos en la ventana usada (últimas 10).
  // Métrica: media geométrica con raíz 1/(n−1) (más estricta que 1/n):
  //   producto       = a × b × c × …  (vueltas en cada campo distinto)
  //   mejor_posible  = producto del balance más igualado posible para n campos en N vueltas
  //   ratio          = (producto / mejor_posible)^(1/(n−1))   ∈ [0, 1]
  //   factor         = min(n − 1, 4)   ← TOPE: el premio se congela a partir de 5 campos
  //   descuento      = 0.030 × factor × ratio
  //   hcp_final      = hcp × (1 − descuento)
  // Descuento MÁXIMO posible = 0.030 × 4 × 1 = 12%.
  // El tope a 5 campos evita que un "turismo extremo" (jugar 7+ campos distintos)
  // arrastre el HCP a niveles irreales. Más allá de 5 campos, el premio ya no
  // crece (ratio sigue siendo el balance, pero el factor está capado).
  const cuentas = {};
  used.forEach(a => { if(a.campo) cuentas[a.campo] = (cuentas[a.campo]||0) + 1; });
  const valores = Object.values(cuentas);
  const camposDistintos = valores.length;
  const N = used.length;
  let descuentoAdapt = 0;
  if(camposDistintos > 1 && N > 0){
    const producto = valores.reduce((p,c) => p*c, 1);
    const floorDiv = Math.floor(N / camposDistintos);
    const resto    = N % camposDistintos;
    const mejorPosible = Math.pow(floorDiv + 1, resto) * Math.pow(floorDiv, camposDistintos - resto);
    const ratio    = mejorPosible > 0 ? Math.pow(producto / mejorPosible, 1 / (camposDistintos - 1)) : 0;
    const factor   = Math.min(camposDistintos - 1, 4);
    descuentoAdapt = 0.030 * factor * ratio;
    if(hcp !== null) hcp = hcp * (1 - descuentoAdapt);
  }
  const factorVar = descuentoAdapt > 0 ? 1 / (1 - descuentoAdapt) : 1.0;

  return {
    hcp,
    n: used.length,
    trend,
    totalActs: actsFiltradas.length,
    daysOff,
    penalAdd,
    diasVentana,        // span de días entre la 1ª y la 10ª de used
    penalDispersion,    // golpes añadidos por ventana estirada (>UMBRAL_DISPERSION_DIAS)
    sigma,
    camposDistintos,
    factorVar,
    descuentoAdapt,
    used,            // las 10 actuaciones usadas (o las que haya si <10)
  };
}

// Helper local para parsear "DD/MM/YYYY"
function _parseFechaGlobal(str){
  if(!str) return null;
  const parts = str.split('/');
  if(parts.length !== 3) return null;
  return new Date(+parts[2], +parts[1]-1, +parts[0]);
}

function renderHandicapGlobal(el){
  const ACTIVOS = EQUIPO.map(j => j.apodo);
  const datos = ACTIVOS.map(j => ({ jugador:j, ...calcHandicapGlobal(j) }));

  // Ordenar de mejor (hcp menor) a peor (hcp mayor); los sin hcp al final
  const conHcp = datos.filter(d => d.hcp !== null).sort((a,b) => a.hcp - b.hcp);
  const sinHcp = datos.filter(d => d.hcp === null);
  const ordenados = conHcp.concat(sinHcp);

  const fmtHcp = (h) => {
    if(h === null || h === undefined) return '—';
    const r = Math.round(h * 10) / 10;
    if(r === 0) return 'PAR';
    return (r > 0 ? '+' : '') + r.toFixed(1);
  };

  // 5 niveles de tendencia con flechas SVG estilo "sticker": cuerpo grueso, contorno negro fino, color sólido.
  //   -2 = mejora fuerte (verde brillante, arriba) │ -1 = mejora (verde, diagonal arriba)
  //    0 = estable (amarillo, recta)
  //   +1 = empeora (naranja, diagonal abajo) │ +2 = empeora fuerte (rojo, abajo)
  const trendIcon = (t) => {
    const SIZE = 28;
    const stroke = '#1a1a1a', sw = 1.5;
    const wrap = (svgInner, title) =>
      `<span style="display:inline-flex;align-items:center;margin-left:6px;line-height:1" title="${title}">` +
      `<svg width="${SIZE}" height="${SIZE}" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">${svgInner}</svg>` +
      `</span>`;

    // Flecha base "vertical hacia arriba" (cabeza arriba, cuerpo abajo)
    // Se rota con transform según el caso para mantener idéntica forma en los 5 niveles.
    const flechaPath = 'M16 3 L26 14 L21 14 L21 28 L11 28 L11 14 L6 14 Z';

    if(t === -2){
      // Verde brillante, vertical ARRIBA
      return wrap(
        `<path d="${flechaPath}" fill="#22c55e" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/>`,
        'Mejorando fuerte'
      );
    }
    if(t === -1){
      // Verde claro, diagonal ARRIBA-DERECHA (rotación -45° desde "arriba")
      return wrap(
        `<g transform="rotate(45 16 16)"><path d="${flechaPath}" fill="#22d3ee" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/></g>`,
        'Mejorando suave'
      );
    }
    if(t === 0){
      // Amarillo, horizontal DERECHA (rotación 90°)
      return wrap(
        `<g transform="rotate(90 16 16)"><path d="${flechaPath}" fill="#facc15" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/></g>`,
        'Estable'
      );
    }
    if(t === 1){
      // Naranja, diagonal ABAJO-DERECHA (rotación 135°)
      return wrap(
        `<g transform="rotate(135 16 16)"><path d="${flechaPath}" fill="#f97316" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/></g>`,
        'Empeorando suave'
      );
    }
    // t === 2: rojo, vertical ABAJO (rotación 180°)
    return wrap(
      `<g transform="rotate(180 16 16)"><path d="${flechaPath}" fill="#ef4444" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/></g>`,
      'Empeorando fuerte'
    );
  };

  let h = '<div style="max-width:600px"><div style="padding:14px 12px 6px"><div style="font-size:13px;color:#374151;margin-bottom:10px;font-weight:600">🏆 Hándicap global</div></div>';

  h += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 12px 16px">';
  ordenados.forEach((d) => {
    const tieneHcp = d.hcp !== null;
    // Fondo: color del jugador si tiene hcp completo; gris si sin hcp (n<10)
    const bg =
      !tieneHcp ? '#f3f4f6' :
                  (COLORS[d.jugador] || '#f3f4f6');
    const valColor =
      !tieneHcp ? '#9ca3af' :
      d.hcp <= 0 ? '#15803d' :
      d.hcp <= 5 ? '#1e3a8a' :
      d.hcp <= 10 ? '#92400e' :
      '#991b1b';
    const opacity = !tieneHcp ? '0.55' : '1';
    const border = '1px solid rgba(0,0,0,0.06)';
    let subText;
    if(d.n === 0) {
      subText = `sin actuaciones`;
    } else if(!tieneHcp) {
      subText = `${d.n}/10 partidas`;
    } else {
      // Delta de HCP respecto a la actuación anterior: recalcular con fecha de corte
      // justo antes de la última actuación del jugador y comparar con el HCP actual.
      let deltaTxt = '';
      const _actsJ = _recopilarActuacionesGlobal(d.jugador)
        .filter(a => a.fecha >= new Date(2026, 0, 1))
        .sort((a,b) => b.fecha - a.fecha);
      if(_actsJ.length >= 2){
        const _corte = new Date(_actsJ[1].fecha.getTime()); // 2ª más reciente = antes de la última
        const _prev = calcHandicapGlobal(d.jugador, _corte);
        if(_prev && _prev.hcp !== null){
          const _delta = d.hcp - _prev.hcp;
          const _r = Math.round(_delta * 10) / 10;
          if(_r !== 0){
            const _signo = _r > 0 ? '+' : '−';
            deltaTxt = ` <span style="color:${_r > 0 ? '#991b1b' : '#15803d'}">(${_signo}${Math.abs(_r).toFixed(1)})</span>`;
          }
        }
      }
      subText = `${d.totalActs} part.${deltaTxt}`;
    }
    // Icono de consistencia (σ) en esquina superior izquierda. 4 niveles de "refugio" según volatilidad:
    //   σ < 2.5  → 🏰 castillo        (sólido, te aguanta cualquier tormenta)
    //   2.5-5.0  → 🏠 casa            (algo expuesto)
    //   5.0-7.0  → 🎪 carpa           (frágil)
    //   σ ≥ 7.0  → 📦 caja            (errático, durmiendo en la acera)
    let sigmaBadge = '';
    if(d.sigma !== null && d.sigma !== undefined){
      let icon, label;
      if(d.sigma < 2.5)      { icon = '🏰'; label = `Castillo — sólido (σ ${d.sigma.toFixed(2)})`; }
      else if(d.sigma < 5.0) { icon = '🏠'; label = `Casa — algo expuesto (σ ${d.sigma.toFixed(2)})`; }
      else if(d.sigma < 7.0) { icon = '🎪'; label = `Carpa — frágil (σ ${d.sigma.toFixed(2)})`; }
      else                   { icon = '📦'; label = `Caja — errático, en la acera (σ ${d.sigma.toFixed(2)})`; }
      sigmaBadge = `<span style="font-size:16px;line-height:1;margin-left:4px" title="${label}">${icon}</span>`;
    }
    h += `
      <div onclick="${d.totalActs > 0 ? `window.__mostrarTarjetasGlobal('${d.jugador}')` : ''}" style="position:relative;background:${bg};border-radius:14px;padding:12px 8px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:108px;opacity:${opacity};border:${border};${d.totalActs > 0 ? 'cursor:pointer;transition:transform 0.1s' : ''}" ${d.totalActs > 0 ? 'onmouseenter="this.style.transform=\'scale(1.02)\'" onmouseleave="this.style.transform=\'scale(1)\'"' : ''}>
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:#1a1a1a;margin-bottom:6px">${d.jugador}</div>
        <div style="display:flex;align-items:center;justify-content:center">
          <span style="font-family:'Fraunces',serif;font-size:40px;font-weight:700;color:${valColor};line-height:1;letter-spacing:-0.5px">${fmtHcp(d.hcp)}</span>
          ${tieneHcp ? trendIcon(d.trend) : ''}
          ${sigmaBadge}
        </div>
        <div style="font-size:9px;color:#6b7280;margin-top:6px;letter-spacing:0.2px">${subText}</div>
      </div>`;
  });
  h += '</div>';

  // ───────────── Semanas como nº 1 (HCP Global) ─────────────
  // Lee del helper único _calcHistoricoN1Global (foto semanal de cada domingo).
  // Umbral: ≥5 jugadores con n≥10 (mismo criterio que la pestaña Bitácora).
  const _hist = _calcHistoricoN1Global(UMBRAL_N1);

  // La estructura se monta siempre, haya fotos o no: sin datos cada bloque
  // enseña su estado vacío en lugar de desaparecer.
  {
    const { fechasValidas, historialN1, numUnoCalc } =
      _hist || { fechasValidas:[], historialN1:[], numUnoCalc:[] };
    const fmtF = (t) => {
      const d = new Date(t);
      return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');
    };
    const inicioFmt = fechasValidas.length ? fmtF(fechasValidas[0].getTime()) : '—';
    const _sinFotos = '<div style="font-size:11px;color:#9ca3af;padding:6px 0">Arranca cuando '
      + UMBRAL_N1 + ' jugadores lleguen a 10 actuaciones en HCP Global.</div>';

    // Card del nº 1 ACTUAL (HCP más bajo hoy)
    const ordenadosHoy = PLAYERS.map(j => ({ jugador:j, ...calcHandicapGlobal(j) }))
      .filter(d => d.hcp !== null)
      .sort((a,b) => a.hcp - b.hcp);
    const n1Hoy = ordenadosHoy[0];
    if(!n1Hoy){
      h += '<div style="margin:0 12px 10px;padding:14px 16px;background:linear-gradient(135deg, #fef9c3, #fef3c7);border:1px solid #fde68a;border-radius:12px;display:flex;align-items:center;gap:14px">'
         + '<div style="font-size:30px;line-height:1;opacity:.45">👑</div>'
         + '<div style="flex:1">'
         + '<div style="font-size:10px;color:#854d0e;font-weight:600;text-transform:uppercase;letter-spacing:0.6px">Nº 1 actual</div>'
         + '<div style="font-size:13px;color:#92400e;margin-top:3px">Nadie tiene hándicap todavía</div>'
         + '</div></div>';
    }
    if(n1Hoy){
      const datosN1 = numUnoCalc.find(p => p.jugador === n1Hoy.jugador);
      const jornadasN1Hoy = datosN1?.jornadas ?? 0;
      const recordConsec = datosN1?.maxConsec ?? 0;
      h += `<div style="margin:0 12px 10px;padding:14px 16px;background:linear-gradient(135deg, #fef9c3, #fef3c7);border:1px solid #fde68a;border-radius:12px;display:flex;align-items:center;gap:14px">`;
      h += `<div style="font-size:30px;line-height:1">👑</div>`;
      h += `<div style="flex:1">`;
      h += `<div style="font-size:10px;color:#854d0e;font-weight:600;text-transform:uppercase;letter-spacing:0.6px">Nº 1 actual</div>`;
      h += `<div style="font-size:18px;font-weight:700;color:#1a1a1a;margin-top:2px">${n1Hoy.jugador} <span style="font-size:13px;color:#854d0e;font-weight:500">· HCP ${(n1Hoy.hcp>=0?'+':'')+n1Hoy.hcp.toFixed(2)}</span></div>`;
      h += `<div style="font-size:11px;color:#92400e;margin-top:2px;font-weight:600">${jornadasN1Hoy} (${recordConsec})</div>`;
      h += `</div>`;
      h += `</div>`;
    }

    // ───────── 🏁 IRON RACE — puntos por foto semanal ─────────
    const _carrera = (typeof calcCarrera === 'function') ? calcCarrera() : null;
    h += '<div style="margin:0 12px 14px;padding:12px 14px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px">';
    h += '<div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px">'
       + '<span style="font-size:11px;font-weight:800;letter-spacing:0.7px;color:#1a1a1a;text-transform:uppercase">🏁 Iron Race</span>'
       + '<span style="font-size:10.5px;color:#94a3b8">'
       + CARRERA_PUNTOS.join('-') + ' a los cinco primeros de cada domingo'
       + (_carrera ? ' · ' + _carrera.cierres + ' cierres' : '')
       + '</span></div>';
    if(!_carrera){
      h += '<div style="font-size:11px;color:#9ca3af">Arranca cuando ' + CARRERA_UMBRAL
         + ' jugadores lleguen a 10 actuaciones en HCP Global.</div>';
    } else {
      _carrera.tabla.forEach(function(p, i){
        const c = COLORS[p.jugador] || '#eee';
        const oros = p.posiciones[1] || 0;
        h += '<div style="display:flex;align-items:center;gap:8px;padding:5px 8px;background:#fff;border-radius:8px;margin-bottom:4px;font-size:12px">'
           + '<div style="width:18px;text-align:right;font-weight:700;color:' + (i===0 ? '#15803d' : '#9ca3af') + '">' + (i+1) + '</div>'
           + '<div style="width:20px;height:20px;border-radius:5px;background:' + c + '"></div>'
           + '<div style="flex:1;font-weight:500">' + p.jugador + '</div>'
           + '<div style="font-size:10.5px;color:#94a3b8">' + (oros ? oros + '×🥇 · ' : '') + p.semanas + ' sem</div>'
           + '<div style="font-weight:700;color:#0f766e;min-width:38px;text-align:right">' + p.puntos + '</div>'
           + '</div>';
      });
    }
    h += '</div>';

    // Título HISTÓRICO + lista de jugadores que han sido nº1 con jornadas (maxConsec)
    h += `<div style="margin:0 12px 14px"><div style="font-weight:500;color:#555;margin:8px 0 6px;font-size:12px"><span onclick="window._showHistoricoN1Popup()" style="cursor:pointer;text-decoration:underline;color:#1e3a8a" title="Ver semana a semana">HISTÓRICO</span> <span style="font-size:10px;color:#aaa;font-weight:400">(desde ${inicioFmt})</span></div>`;
    if(numUnoCalc.length === 0){
      h += `<div style="font-size:11px;color:#9ca3af;padding:6px 0">Aún no ha sido nº1 nadie.</div>`;
    } else {
      numUnoCalc.forEach(p => {
        const c = COLORS[p.jugador] || '#eee';
        h += `<div style="display:flex;align-items:center;gap:8px;padding:6px 10px;background:#fff;border-radius:8px;margin-bottom:3px;border:1px solid #e5e7eb;font-size:12px">
          <div style="width:22px;height:22px;border-radius:5px;background:${c};display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;color:#333;flex-shrink:0">${p.jugador.slice(0,3)}</div>
          <div style="flex:1;font-weight:500">${p.jugador}</div>
          <div style="font-weight:700;color:#0f766e">${p.jornadas} <span style="font-weight:400;color:#888;font-size:11px">(${p.maxConsec})</span></div>
        </div>`;
      });
    }
    h += '</div>';

    // ───────── 🏆 TOP 3 — semanas en el podio ─────────
    // Reutiliza el `ranking` completo que ya guarda cada foto semanal de
    // _calcHistoricoN1Global. Empates = posición compartida (regla del proyecto):
    // la posición de un jugador es 1 + nº de jugadores con HCP estrictamente mejor.
    const _top3Map = {};
    const _historialTop3 = [];
    historialN1.forEach(row => {
      const rk = row.ranking || [];
      const podio = [];
      rk.forEach(r => {
        const mejores = rk.filter(o => Math.round(o.hcp*100) < Math.round(r.hcp*100)).length;
        const pos = mejores + 1;
        if(pos <= 3) podio.push({ jugador:r.jugador, hcp:r.hcp, pos });
      });
      podio.forEach(p => {
        if(!_top3Map[p.jugador]) _top3Map[p.jugador] = { oro:0, plata:0, bronce:0 };
        if(p.pos === 1) _top3Map[p.jugador].oro++;
        else if(p.pos === 2) _top3Map[p.jugador].plata++;
        else _top3Map[p.jugador].bronce++;
      });
      _historialTop3.push({ ts:row.ts, podio });
    });
    const _top3Calc = Object.entries(_top3Map).map(([jugador,m]) => ({
      jugador, oro:m.oro, plata:m.plata, bronce:m.bronce, total:m.oro+m.plata+m.bronce
    })).sort((a,b) => b.total - a.total || b.oro - a.oro || b.plata - a.plata || a.jugador.localeCompare(b.jugador));

    h += `<div style="margin:0 12px 14px"><div style="font-weight:500;color:#555;margin:8px 0 6px;font-size:12px"><span onclick="window._showTop3Popup()" style="cursor:pointer;text-decoration:underline;color:#1e3a8a" title="Ver podio semana a semana">🏆 SEMANAS EN EL TOP 3</span> <span style="font-size:10px;color:#aaa;font-weight:400">(desde ${inicioFmt})</span></div>`;
    if(_top3Calc.length === 0){
      h += `<div style="font-size:11px;color:#9ca3af;padding:6px 0">Aún no ha pisado el podio nadie.</div>`;
    } else {
      h += `<div style="display:flex;align-items:center;gap:8px;padding:2px 10px 4px;font-size:10px;color:#9ca3af;font-weight:600">
        <div style="width:22px;flex-shrink:0"></div>
        <div style="flex:1"></div>
        <div style="width:26px;text-align:center">🥇</div>
        <div style="width:26px;text-align:center">🥈</div>
        <div style="width:26px;text-align:center">🥉</div>
        <div style="width:34px;text-align:right">TOP3</div>
      </div>`;
      _top3Calc.forEach(p => {
        const c = COLORS[p.jugador] || '#eee';
        const dim = (v) => v > 0 ? '#374151' : '#d1d5db';
        h += `<div style="display:flex;align-items:center;gap:8px;padding:6px 10px;background:#fff;border-radius:8px;margin-bottom:3px;border:1px solid #e5e7eb;font-size:12px">
          <div style="width:22px;height:22px;border-radius:5px;background:${c};display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;color:#333;flex-shrink:0">${p.jugador.slice(0,3)}</div>
          <div style="flex:1;font-weight:500">${p.jugador}</div>
          <div style="width:26px;text-align:center;font-weight:600;color:${dim(p.oro)}">${p.oro}</div>
          <div style="width:26px;text-align:center;font-weight:600;color:${dim(p.plata)}">${p.plata}</div>
          <div style="width:26px;text-align:center;font-weight:600;color:${dim(p.bronce)}">${p.bronce}</div>
          <div style="width:34px;text-align:right;font-weight:700;color:#0f766e">${p.total}</div>
        </div>`;
      });
    }
    h += '</div>';

    // Popup: podio semana a semana
    const _fmtFechaTop3 = (ts) => {
      const d = new Date(ts);
      return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
    };
    const _MEDALLA = { 1:'🥇', 2:'🥈', 3:'🥉' };
    const filasTop3 = _historialTop3.slice().reverse().map((row, i) => {
      const bg = i % 2 === 0 ? '#f0fdfa' : '#fff';
      const lineas = row.podio.map(p => {
        const c = COLORS[p.jugador] || '#eee';
        const hcpStr = (p.hcp >= 0 ? '+' : '') + p.hcp.toFixed(2);
        return `<div style="display:flex;align-items:center;gap:8px;margin-top:3px">
          <div style="font-size:12px;width:16px">${_MEDALLA[p.pos] || ''}</div>
          <div style="width:20px;height:20px;border-radius:5px;background:${c};display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:600;color:#333;flex-shrink:0">${p.jugador.slice(0,3)}</div>
          <div style="flex:1;font-size:12px;font-weight:600;color:#1a1a1a">${p.jugador}</div>
          <div style="font-size:11px;font-weight:700;color:#0f766e;font-family:monospace">${hcpStr}</div>
        </div>`;
      }).join('');
      return `<div style="padding:8px 10px;background:${bg};border-radius:8px;margin-bottom:4px;border:1px solid #99f6e444">
        <div style="font-size:11px;color:#666;font-family:monospace">${_fmtFechaTop3(row.ts)}</div>
        ${lineas}
      </div>`;
    }).join('');
    h += `<div id="top3-popup" onclick="this.style.display='none'" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:9999;align-items:center;justify-content:center">
      <div onclick="event.stopPropagation()" style="background:#fff;border-radius:16px;padding:20px;max-width:380px;width:90%;max-height:80vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,0.3)">
        <div style="font-weight:700;font-size:14px;color:#1a1a1a;margin-bottom:14px">🏆 Podio Global — semana a semana</div>
        <div style="max-height:400px;overflow-y:auto;padding-right:4px">${filasTop3 || '<div style="font-size:12px;color:#9ca3af;padding:10px 0">Aún no hay datos.</div>'}</div>
        <div onclick="document.getElementById('top3-popup').style.display='none'" style="margin-top:14px;text-align:center;padding:8px;background:#f3f4f6;border-radius:8px;font-size:12px;color:#555;cursor:pointer">Cerrar</div>
      </div>
    </div>`;
    window._showTop3Popup = function(){ const p=document.getElementById('top3-popup'); if(p) p.style.display='flex'; };
    // ───────── Fin TOP 3 ─────────

    // ───────── Popup: histórico jornada a jornada del nº 1 Global ─────────
    const fmtFechaCompleta = (ts) => {
      const d = new Date(ts);
      return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
    };
    const filasHistorico = historialN1.slice().reverse().map((row, i) => {
      const fecha = fmtFechaCompleta(row.ts);
      const jug = row.n1s.join(' & ');
      const colorTile = COLORS[row.n1s[0]] || '#eee';
      const hcpStr = (row.hcp >= 0 ? '+' : '') + row.hcp.toFixed(2);
      const bg = i % 2 === 0 ? '#fef9c3' : '#fff';
      return `<div style="display:flex;align-items:center;gap:10px;padding:8px 10px;background:${bg};border-radius:8px;margin-bottom:4px;border:1px solid #fde68a44">
        <div style="font-size:11px;color:#666;font-family:monospace;min-width:74px">${fecha}</div>
        <div style="width:22px;height:22px;border-radius:5px;background:${colorTile};display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;color:#333;flex-shrink:0">${row.n1s[0].slice(0,3)}</div>
        <div style="flex:1;font-size:12px;font-weight:600;color:#1a1a1a">${jug}</div>
        <div style="font-size:12px;font-weight:700;color:#854d0e;font-family:monospace">${hcpStr}</div>
      </div>`;
    }).join('');
    h += `<div id="historico-n1-popup" onclick="this.style.display='none'" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:9999;align-items:center;justify-content:center">
      <div onclick="event.stopPropagation()" style="background:#fff;border-radius:16px;padding:20px;max-width:380px;width:90%;max-height:80vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,0.3)">
        <div style="font-weight:700;font-size:14px;color:#1a1a1a;margin-bottom:14px">👑 Nº 1 Global — semana a semana</div>
        <div style="max-height:400px;overflow-y:auto;padding-right:4px">${filasHistorico || '<div style="font-size:12px;color:#9ca3af;padding:10px 0">Aún no hay datos.</div>'}</div>
        <div onclick="document.getElementById('historico-n1-popup').style.display='none'" style="margin-top:14px;text-align:center;padding:8px;background:#f3f4f6;border-radius:8px;font-size:12px;color:#555;cursor:pointer">Cerrar</div>
      </div>
    </div>`;
    window._showHistoricoN1Popup = function(){ const p=document.getElementById('historico-n1-popup'); if(p) p.style.display='flex'; };
  }
  // ───────── Fin Jornadas como nº 1 ─────────

  // ─────── LEYENDA: Consistencia σ + Tendencia ───────
  h += '<div style="margin:0 0 14px;box-sizing:border-box;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px">';

  // Bloque 1 — iconos σ (consistencia)
  h += '<div style="background:#fafaf5;border:1px solid #e5e7eb;border-radius:8px;padding:8px 10px">';
  h += '<div style="font-size:11px;font-weight:600;color:#374151;margin-bottom:6px">🧱 Consistencia (σ)</div>';
  h += '<div style="font-size:11px;color:#555;line-height:1.6">';
  h += '<div>🏰 <b>Castillo</b> · σ &lt; 2.5 · sólido, te aguanta cualquier tormenta</div>';
  h += '<div>🏠 <b>Casa</b> · σ 2.5–5 · algo expuesto</div>';
  h += '<div>🎪 <b>Carpa</b> · σ 5–7 · frágil, se mueve con el viento</div>';

  h += '<table style="width:100%;border-collapse:collapse;font-size:11.5px;margin-bottom:6px">';
  h += '<thead><tr style="background:#f3f4f6;color:#374151"><th style="text-align:left;padding:6px 8px;border:1px solid #e5e7eb">Campo</th><th style="text-align:center;padding:6px 8px;border:1px solid #e5e7eb">Ajuste campo</th><th style="text-align:right;padding:6px 8px;border:1px solid #e5e7eb">+6 cuenta como…</th></tr></thead>';
  h += '<tbody>';
  // Filas generadas desde RECORRIDOS_DEFAULT + CAMPOS[*].recorridos.
  // Solo se listan los ajustes != 0: un recorrido que suma 0 no aporta nada
  // a una tabla de ajustes (p. ej. FCPP, o el Verd de Badalona).
  const SVG_EPPA = '<svg width="20" height="14" viewBox="0 0 22 15" style="vertical-align:middle;margin-right:5px;border-radius:1px"><rect width="22" height="15" fill="#003399"/><g fill="#FFCC00"><circle cx="11" cy="3" r="0.9"/><circle cx="13.5" cy="3.67" r="0.9"/><circle cx="15.33" cy="5.5" r="0.9"/><circle cx="16" cy="8" r="0.9"/><circle cx="15.33" cy="10.5" r="0.9"/><circle cx="13.5" cy="12.33" r="0.9"/><circle cx="11" cy="13" r="0.9"/><circle cx="8.5" cy="12.33" r="0.9"/><circle cx="6.67" cy="10.5" r="0.9"/><circle cx="6" cy="8" r="0.9"/><circle cx="6.67" cy="5.5" r="0.9"/><circle cx="8.5" cy="3.67" r="0.9"/></g></svg>';
  const CAMPO_ICONO = { canal_olimpic:'🌊', can_rafel:'🌳', badalona:'🌳' };
  const filasCampo = [];
  // 1) Recorridos por defecto (aplican a casi todos los campos)
  RECORRIDOS_DEFAULT.forEach(function(r){
    if(r.ajuste === 0) return;
    const et = (r.id === 'eppa') ? (SVG_EPPA + 'EPPAS <span style="color:#9ca3af">· recorrido corto</span>')
                                 : (r.id + ' <span style="color:#9ca3af">· por defecto</span>');
    filasCampo.push({ et, aj:r.ajuste });
  });
  // 2) Excepciones: solo las que difieren del default y suman algo
  const _defMap = {};
  RECORRIDOS_DEFAULT.forEach(function(r){ _defMap[r.id] = r.ajuste; });
  Object.keys(RECORRIDOS_EXCEPCIONES).forEach(function(cid){

  filasCampo.sort(function(a,b){ return a.aj - b.aj; });
  filasCampo.forEach(function(f){

  h += '</div>';

  // ─── Sección 2: Oxidación por inactividad ───
  h += '<div style="margin-top:14px;padding-top:12px;border-top:1px dashed #d1d5db">';
  h += '<div style="font-weight:600;color:#1a1a1a;margin-bottom:6px">🛢️ Oxidación por inactividad</div>';
  h += `<div style="color:#6b7280;font-size:11px;margin-bottom:8px">Si pasa tiempo desde tu última partida, el HCP sube. Los primeros <b>${DIAS_GRACIA_OXIDACION} días son gratis</b> (período de gracia). A partir del día ${DIAS_GRACIA_OXIDACION+1}: <code style="background:#f3f4f6;padding:1px 5px;border-radius:3px">hcp += ${TASA_OXIDACION_DIA.toFixed(2)} × (días − 14)</code>. Tope: <b>+18</b>.</div>`;
  h += '<table style="width:100%;border-collapse:collapse;font-size:11.5px;margin-bottom:6px">';
  h += '<thead><tr style="background:#f3f4f6;color:#374151"><th style="text-align:left;padding:6px 8px;border:1px solid #e5e7eb">Días sin jugar</th><th style="text-align:center;padding:6px 8px;border:1px solid #e5e7eb">Penalización</th><th style="text-align:right;padding:6px 8px;border:1px solid #e5e7eb">HCP base 6.0 →</th></tr></thead>';
  h += '<tbody>';
  // Tabla calculada al vuelo desde TASA_OXIDACION_DIA. Si cambia la tasa, se actualiza sola.
  const _HCP_BASE_OX = 6.0;
  const _PENAL_TOPE = 18 - _HCP_BASE_OX;   // = 12 para base 6.0
  const _DIAS_TOPE = Math.ceil(_PENAL_TOPE / TASA_OXIDACION_DIA) + DIAS_GRACIA_OXIDACION;
  const _filasOx = [
    { dias: 0,   etiq: '0–' + DIAS_GRACIA_OXIDACION + ' <span style="color:#16a34a;font-size:10px">(gracia)</span>' },
    { dias: 21,  etiq: '21 (3 sem)' },
    { dias: 30,  etiq: '30 (1 mes)' },
    { dias: 60,  etiq: '60 (2 meses)' },
    { dias: 90,  etiq: '90 (3 meses)' },
    { dias: 180, etiq: '180 (6 meses)' },
    { dias: 365, etiq: '365 (1 año)' },
  ];
  _filasOx.forEach(f => {
    const penal = Math.min(Math.max(0, f.dias - DIAS_GRACIA_OXIDACION) * TASA_OXIDACION_DIA, _PENAL_TOPE);
    const hcp = _HCP_BASE_OX + penal;
    h += `<tr><td style="padding:5px 8px;border:1px solid #e5e7eb">${f.etiq}</td>`+
         `<td style="text-align:center;padding:5px 8px;border:1px solid #e5e7eb">+${penal.toFixed(2)}</td>`+
         `<td style="text-align:right;padding:5px 8px;border:1px solid #e5e7eb;font-family:monospace">${hcp.toFixed(2)}</td></tr>`;
  });
  h += `<tr style="background:#fef3c7"><td style="padding:5px 8px;border:1px solid #e5e7eb"><b>${_DIAS_TOPE}+</b> <span style="color:#a16207;font-size:10px">(tope)</span></td>`+
       `<td style="text-align:center;padding:5px 8px;border:1px solid #e5e7eb;font-family:monospace"><b>+${_PENAL_TOPE.toFixed(2)}</b></td>`+
       `<td style="text-align:right;padding:5px 8px;border:1px solid #e5e7eb;font-family:monospace"><b>18.00</b></td></tr>`;
  h += '</tbody></table>';
  h += `<div style="font-size:10.5px;color:#888;font-style:italic">El HCP se queda capado en +18, sea cual sea el HCP original. Para un base 6.0 eso ocurre tras ~${_DIAS_TOPE} días sin jugar.</div>`;
  h += '</div>';

  // ─── Sección 2.b: Ventana estirada (dispersión temporal) ───
  h += '<div style="margin-top:14px;padding-top:12px;border-top:1px dashed #d1d5db">';
  h += '<div style="font-weight:600;color:#1a1a1a;margin-bottom:6px">📏 Ventana estirada</div>';

  const _filasDisp = [
    { dias: 69,  etiq: '60–69' },

    { dias: 90 },
    { dias: 120 },
  ];
  _filasDisp.forEach(f => {
    const penal = Math.max(0, f.dias - UMBRAL_DISPERSION_DIAS) * TASA_DISPERSION_DIA;
    const bg = penal === 0 ? '#f0fdf4' : '#fef9c3';
    h += `<tr style="background:${bg}"><td style="padding:5px 8px;border:1px solid #e5e7eb;font-family:monospace">${f.etiq || f.dias}</td>`+
         `<td style="text-align:center;padding:5px 8px;border:1px solid #e5e7eb;font-family:monospace">${penal===0 ? '—' : '+'+penal.toFixed(2)}</td></tr>`;
  });
  h += '</tbody></table>';
  h += '<div style="font-size:10.5px;color:#888;font-style:italic">Pensado para penalizar a quien nunca se "oxida" (siempre dentro de la gracia) pero juega tan poco que sus datos son antiguos.</div>';
  h += '</div>';

  // ─── Sección 3: Adaptabilidad de campo ───
  h += '<div style="margin-top:14px;padding-top:12px;border-top:1px dashed #d1d5db">';
  h += '<div style="font-weight:600;color:#1a1a1a;margin-bottom:6px">⛳ Adaptabilidad de campo</div>';
  h += '<div style="color:#6b7280;font-size:11px;margin-bottom:8px">Premio por <b>rotación REAL</b>. Métrica: media geométrica con raíz <code style="background:#f3f4f6;padding:1px 5px;border-radius:3px">1/(n−1)</code>: <code style="background:#f3f4f6;padding:1px 5px;border-radius:3px">ratio = (producto / mejor_posible)^(1/(n−1))</code>. Sustracción: <code style="background:#f3f4f6;padding:1px 5px;border-radius:3px">descuento = 0.030 × min(n−1, 4) × ratio · HCP × (1−descuento)</code>. Tope: 5 campos. Máx descuento: 12%.</div>';
  h += '<div style="color:#6b7280;font-size:11px;margin-bottom:8px">Rangos de descuento por número de campos distintos (<code style="background:#f3f4f6;padding:1px 5px;border-radius:3px">n</code>) en las últimas 10 actuaciones. <b>Ejemplo</b> con HCP base +5.00:</div>';
  h += '<table style="width:100%;border-collapse:collapse;font-size:11.5px;margin-bottom:6px">';
  h += '<thead><tr style="background:#f3f4f6;color:#374151"><th style="text-align:center;padding:6px 8px;border:1px solid #e5e7eb;width:18%">n</th><th style="text-align:center;padding:6px 8px;border:1px solid #e5e7eb">mín</th><th style="text-align:center;padding:6px 8px;border:1px solid #e5e7eb">máx</th></tr></thead>';
  h += '<tbody>';
  // Tabla compacta mín/máx por n, calculada al vuelo desde la fórmula real
  // (coef 0.030, tope min(n-1, 4)). Si cambia algún parámetro arriba, se actualiza sola.
  const COEF_EJEMPLO = 0.030;
  const TOPE_EJEMPLO = 4;
  const HCP_BASE_EJEMPLO = 5.00;
  const _calcEj = (reparto) => {
    const n = reparto.length;
    const N = reparto.reduce((a,b)=>a+b, 0);
    const prod = reparto.reduce((p,c) => p*c, 1);
    const flr = Math.floor(N/n), rest = N%n;
    const mejor = Math.pow(flr+1, rest) * Math.pow(flr, n-rest);
    const ratio = n>1 ? Math.pow(prod/mejor, 1/(n-1)) : 0;
    const factor = Math.min(n-1, TOPE_EJEMPLO);
    const desc = COEF_EJEMPLO * factor * ratio;
    return { ratio, desc, hcp: HCP_BASE_EJEMPLO * (1 - desc) };
  };
  // Reparto más descompensado posible (un campo acumula casi todo) y reparto balanceado ideal.
  const _peor  = (n, N) => [N - n + 1, ...Array(n-1).fill(1)];
  const _mejor = (n, N) => {
    const flr = Math.floor(N/n), rest = N%n;
    return [...Array(rest).fill(flr+1), ...Array(n-rest).fill(flr)];
  };
  const N_REF = 10;
  [2, 3, 4, 5].forEach(n => {
    const cMin = _calcEj(_peor(n, N_REF));
    const cMax = _calcEj(_mejor(n, N_REF));
    const resaltar = (n === 5);
    const bg = resaltar ? ' style="background:#f0fdf4"' : '';
    const nLbl = resaltar ? `<b>${n}</b>` : `${n}`;
    h += `<tr${bg}><td style="text-align:center;padding:5px 8px;border:1px solid #e5e7eb;font-weight:600">${nLbl}</td>`+
         `<td style="text-align:center;padding:5px 8px;border:1px solid #e5e7eb">${(cMin.desc*100).toFixed(2)}% <span style="color:#9ca3af;font-family:monospace">(→ +${cMin.hcp.toFixed(2)})</span></td>`+
         `<td style="text-align:center;padding:5px 8px;border:1px solid #e5e7eb">${(cMax.desc*100).toFixed(2)}% <span style="color:#9ca3af;font-family:monospace">(→ +${cMax.hcp.toFixed(2)})</span></td></tr>`;
  });
  h += '</tbody></table>';
  h += '<div style="font-size:10.5px;color:#888;font-style:italic">Mín = reparto más descompensado posible (1 vuelta en todos los campos menos uno). Máx = reparto equilibrado. Desde n=5 el factor queda topado a 4 (máx 12%).</div>';
  h += '</div>';

  h += '</div>';
  // ─────── FIN BLOQUE EXPLICATIVO ───────

  h += '</div>'; // cierra wrapper max-width:600px
  el.innerHTML = h;
}

// Sub-tab dentro de la pestaña 🏆 Hándicap Global, entre Ranking y Tabla.
// Muestra el primer día en que se "coronó" un campeón del HCP Global aplicando
// un umbral más estricto que el oficial: ≥5 jugadores con n≥10 (en vez de ≥3).
// Todo el cálculo es dinámico desde las 6 fuentes (RAW_DATA, ENTRENAMIENTOS_DATA,
// IC_DATA, RANKING_DATA, TORNEOS_DATA, COPA_DATA) vía calcHandicapGlobal.
function renderBitacoraGlobal(el){
  const UMBRAL = UMBRAL_N1;

  // que coincide con la lista de la pestaña Hándicap Global.
  const hist = _calcHistoricoN1Global(UMBRAL);

  const fmtFecha = (d) => String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
  const fmtHcp = (v) => (v>=0?'+':'') + v.toFixed(2);

  let h = '<div style="max-width:720px;margin:0 auto;padding:20px 16px">';
  h += '<div style="font-size:11px;color:#6b7280;text-transform:uppercase;letter-spacing:0.6px;font-weight:600;margin-bottom:6px">📓 Bitácora · HCP Global</div>';
  h += `<div style="font-size:14px;color:#374151;margin-bottom:18px">Foto semanal del HCP Global: cada <b>domingo a las 23:59</b> (desde el 05/04/2026) se toma una instantánea y se corona al nº1 de la semana. Solo cuenta si hay <b>≥${UMBRAL} jugadores</b> con n≥10 actuaciones globales.</div>`;

  if(!hist){
    h += '<div style="padding:24px;background:#fef9c3;border:1px solid #fde68a;border-radius:10px;text-align:center;font-size:13px;color:#854d0e">Aún no se ha alcanzado el umbral de ≥'+UMBRAL+' jugadores con n≥10. Sigue jugando.</div>';

  }

  // Reconstruir jornadas a partir del histórico devuelto por el helper

  // Helper: render de una tabla por jornada

    t += '<th style="text-align:center;padding:8px 6px;border-bottom:1px solid #e5e7eb" title="Días desde la última actuación">Días off</th>';

    t += '<th style="text-align:right;padding:8px 6px;border-bottom:1px solid #e5e7eb">HCP final</th>';
    t += '</tr></thead><tbody>';
    const ts = fecha.getTime();
    ranking.forEach((r, i) => {
      const c = COLORS[r.jugador] || '#eee';
      const hcpBase = r.hcp - (r.penalAdd || 0) - (r.penalDispersion || 0);
      const hcpFinal = r.hcp;
      const esCampeon = i === 0;

      t += `<td style="text-align:left;padding:8px 6px"><div style="display:flex;align-items:center;gap:8px"><div style="width:24px;height:24px;border-radius:5px;background:${c};display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#333">${r.jugador.slice(0,3)}</div><span style="font-weight:${esCampeon?700:500}">${r.jugador}</span>${esCampeon?' <span style="margin-left:4px">👑</span>':''}</div></td>`;
      t += `<td style="text-align:center;padding:8px 6px;color:#6b7280">${r.n}</td>`;
      t += `<td style="text-align:right;padding:8px 6px;font-family:monospace;color:#374151">${fmtHcp(hcpBase)}</td>`;
      t += `<td style="text-align:center;padding:8px 6px;color:#6b7280">${r.daysOff||0}</td>`;
      t += `<td style="text-align:right;padding:8px 6px;font-family:monospace;color:${(r.penalAdd||0)>0?'#dc2626':'#9ca3af'}">+${(r.penalAdd||0).toFixed(2)}</td>`;
      t += `<td style="text-align:center;padding:8px 6px;color:#6b7280">${r.diasVentana||0}</td>`;
      t += `<td style="text-align:right;padding:8px 6px;font-family:monospace;color:${(r.penalDispersion||0)>0?'#dc2626':'#9ca3af'}">+${(r.penalDispersion||0).toFixed(2)}</td>`;
      t += `<td style="text-align:right;padding:8px 6px;font-family:monospace;font-weight:700;color:${esCampeon?'#854d0e':'#1a1a1a'}">${fmtHcp(hcpFinal)}</td>`;
      t += '</tr>';

    t += '</tbody></table>';
    t += '</div>';
    return t;
  };

  // Render en orden inverso: más reciente arriba, 1ª (más antigua) abajo
  for(let k = jornadas.length - 1; k >= 0; k--){
    h += renderTablaJornada(k+1, jornadas[k].fecha, jornadas[k].ranking);
  }

  // Popup flotante suelto (sin overlay oscurecedor)
  h += `<div id="bitacora-ventana-popup" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border-radius:14px;padding:20px;max-width:680px;width:94%;max-height:85vh;overflow:hidden;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,0.25),0 0 0 1px rgba(0,0,0,0.08);z-index:9999">
    <div onclick="document.getElementById('bitacora-ventana-popup').style.display='none'" style="position:absolute;top:10px;right:14px;font-size:18px;color:#9ca3af;cursor:pointer;line-height:1;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#f3f4f6">×</div>
    <div id="bitacora-ventana-popup-body" style="overflow-y:auto;padding-right:4px;padding-top:4px"></div>

  // Función global que rellena y abre el popup con la ventana de 10 partidas del jugador

  window._showBitacoraVentanaPopup = function(jugador, tsCorte){
    const fechaCorte = new Date(tsCorte);
