<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;font-size:13px;background:#fff;color:#1a1a1a}
.tabs{display:flex;flex-direction:column;border-bottom:1px solid #ddd;padding:0 12px;background:#fff;position:sticky;top:0;z-index:10}
.tab-row{display:flex;flex-wrap:wrap}
.tab-row.tab-row-2{border-top:1px solid #f0f0f0}
.tab{padding:8px 12px;font-size:12px;font-weight:500;color:#888;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:#1a1a1a;border-bottom-color:#1a1a1a}
.subtabs{display:flex;gap:4px;background:#fafafa;padding:6px 12px;border-bottom:1px solid #eee;flex-wrap:wrap}
.subtab{padding:5px 10px;font-size:11px;font-weight:500;color:#888;cursor:pointer;border-radius:6px;white-space:nowrap;transition:background 0.15s,color 0.15s}
.subtab:hover{background:#f0f0f0;color:#555}
.subtab.active{background:#1a1a1a;color:#fff}
.hdr{padding:8px 12px 0;border-bottom:1px solid #ddd}
.htitle{font-size:13px;font-weight:500;margin-bottom:6px}
.content{padding:12px}
table{border-collapse:collapse;font-size:11px}
th,td{padding:3px 4px;border:1px solid #e5e7eb;white-space:nowrap}
th{background:#f9fafb;font-weight:500;text-align:center}
input,select{font-size:11px;padding:3px 6px;border:1px solid #d1d5db;border-radius:5px;background:#fff;color:#1a1a1a;height:26px}

/* ============================================================
   ENTRENAMIENTO — scoped bajo #tab-entrenamiento
   ============================================================ */
#tab-entrenamiento, #tab-torneos, #tab-tour, #tab-ranking {
  --ent-bg: #ffffff;
  --ent-paper: #ffffff;
  --ent-paper-2: #fafaf9;
  --ent-border: #e7e5e4;
  --ent-border-strong: #d6d3d1;
  --ent-ink: #1c1917;
  --ent-ink-soft: #44403c;
  --ent-ink-muted: #78716c;
  --ent-ink-dim: #a8a29e;
  --ent-accent: #ea580c;
  --ent-birdie: #22c55e;
  --ent-hio:    #9d174d;
  --ent-bogey:  #22d3ee;
  --ent-doble:  #1e3a8a;
  --ent-tot:    #1e3a8a;
  background: var(--ent-bg);
  color: var(--ent-ink);
  font-family: 'DM Sans', sans-serif;
  -webkit-font-smoothing: antialiased;
  padding: 32px 20px 80px;
}
#tab-entrenamiento .ent-wrap, #tab-torneos .ent-wrap, #tab-tour .ent-wrap, #tab-ranking .ent-wrap { max-width:630px; }

#tab-entrenamiento .temporada-block, #tab-ranking .temporada-block {
  margin-bottom: 28px;
  border-radius: 16px;
  background: transparent;
}
#tab-entrenamiento .temporada-block summary, #tab-ranking .temporada-block summary {
  list-style: none;
  cursor: pointer;
  display: flex;
  align-items: baseline;
  gap: 14px;
  padding: 12px 4px 14px;
  border-bottom: 2px solid var(--ent-border-strong);
  user-select: none;
  margin-bottom: 18px;
  transition: border-color 0.15s;
}
#tab-entrenamiento .temporada-block summary::-webkit-details-marker, #tab-ranking .temporada-block summary::-webkit-details-marker { display: none; }
#tab-entrenamiento .temporada-block summary::marker, #tab-ranking .temporada-block summary::marker { content: ''; }
#tab-entrenamiento .temporada-block summary:hover, #tab-ranking .temporada-block summary:hover { border-bottom-color: var(--ent-accent); }
#tab-entrenamiento .temporada-titulo, #tab-ranking .temporada-titulo {
  font-family: 'Fraunces', serif;
  font-weight: 900;
  font-size: clamp(20px, 2.4vw, 26px);
  color: var(--ent-accent);
  letter-spacing: -0.3px;
  flex: 0 0 auto;
}
#tab-entrenamiento .temporada-count, #tab-ranking .temporada-count {
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--ent-muted, #8a7a5c);
  font-weight: 600;
  flex: 1 1 auto;
}
#tab-entrenamiento .temporada-chevron, #tab-ranking .temporada-chevron {
  font-size: 18px;
  color: var(--ent-accent);
  transition: transform 0.2s;
  flex: 0 0 auto;
}
#tab-entrenamiento .temporada-block[open] .temporada-chevron, #tab-ranking .temporada-block[open] .temporada-chevron { transform: rotate(180deg); }
#tab-entrenamiento .temporada-body, #tab-ranking .temporada-body { padding: 0 2px; }

/* Tarjeta resumen Ranking (clasificación por temporada) */
#tab-ranking .rkg-resumen { margin-bottom: 22px; }
#tab-ranking .rkg-resumen .entreno-head { padding-left: 14px; padding-right: 14px; }
#tab-ranking .rkg-resumen .entreno-body { padding-left: 10px; padding-right: 10px; }

}

#tab-ranking .rkg-name {

  background: #e5e7eb;

#tab-ranking .rkg-media {
  font-weight: 700;
  color: var(--ent-accent, #c2410c);
  font-size: 13px;
}

#tab-entrenamiento .entreno-block, #tab-torneos .entreno-block, #tab-tour .entreno-block, #tab-ranking .entreno-block {

#tab-entrenamiento .entreno-block summary::marker, #tab-torneos .entreno-block summary::marker, #tab-tour .entreno-block summary::marker, #tab-ranking .entreno-block summary::marker { content: ''; }

}
#tab-entrenamiento .entreno-score-equipo, #tab-torneos .entreno-score-equipo, #tab-tour .entreno-score-equipo, #tab-ranking .entreno-score-equipo {

#tab-entrenamiento .entreno-score-equipo .ese-avg, #tab-torneos .entreno-score-equipo .ese-avg, #tab-tour .entreno-score-equipo .ese-avg, #tab-ranking .entreno-score-equipo .ese-avg {

#tab-entrenamiento .entreno-score-equipo .ese-pronostico .ese-val, #tab-torneos .entreno-score-equipo .ese-pronostico .ese-val, #tab-tour .entreno-score-equipo .ese-pronostico .ese-val, #tab-ranking .entreno-score-equipo .ese-pronostico .ese-val {

  font-family: 'JetBrains Mono', monospace;

  color: var(--ent-ink-muted);
  letter-spacing: 0.5px;
  text-transform: uppercase;
  white-space: nowrap;
  font-weight: 500;
}
#tab-entrenamiento .entreno-chevron, #tab-torneos .entreno-chevron, #tab-tour .entreno-chevron, #tab-ranking .entreno-chevron {
  width: 32px;

}

#tab-entrenamiento .players-grid.grid-2 .pcard .delta .delta-reg, #tab-torneos .players-grid.grid-2 .pcard .delta .delta-reg, #tab-tour .players-grid.grid-2 .pcard .delta .delta-reg, #tab-ranking .players-grid.grid-2 .pcard .delta .delta-reg {

#tab-entrenamiento .pcard, #tab-torneos .pcard, #tab-tour .pcard, #tab-ranking .pcard {
  background: var(--ent-paper);
  border: 2px solid var(--ent-border-strong);

/* Ficha del jugador: foto a la izquierda y, a la derecha, handicaps + titulos
   apilados. Las dos columnas se estiran igual, y Titulos crece hasta cuadrar
   por abajo con la tarjeta de la foto. La tarjeta de juego va suelta debajo. */
.ficha-grid{
  display:grid;
  grid-template-columns:250px minmax(280px,1fr);
  gap:18px;
  align-items:stretch;
}
.ficha-col{ display:flex; flex-direction:column; gap:14px; }
.ficha-col > .ficha-crece{ flex:1 1 auto; }
.ficha-suelta{ width:250px; max-width:100%; margin-top:14px; }
/* Altura unica de fila: asi las filas de la tarjeta de la foto coinciden
   visualmente con las de Titulos. Los bloques de filas se anclan abajo
   (margin-top:auto) para que las dos listas cuadren linea a linea. */
.ficha-fila{
  display:flex;
  align-items:center;
  gap:10px;
  min-height:30px;
  padding:0;
  border-bottom:1px solid #f3f4f6;
}
.ficha-tarjeta{ display:flex; flex-direction:column; }
/* Distribucion de golpes: filas mas estrechas, tarjeta mas compacta. No toca
   las otras dos tarjetas, que siguen cuadrando entre ellas a 30px. */
.ficha-compacta .ficha-fila{ min-height:27px; }
/* Fila inferior: tarjeta de distribucion + grafico, a la misma altura. */
.ficha-abajo{ display:flex; gap:18px; align-items:stretch; flex-wrap:wrap; margin-top:14px; }
.ficha-abajo > .ficha-suelta{ margin-top:0; flex:0 0 250px; }
.ficha-abajo > .ficha-grafico{ flex:1 1 260px; min-width:240px; }
@media (max-width:640px){
  .ficha-abajo > .ficha-suelta{ flex:1 1 100%; }
  .ficha-abajo > .ficha-grafico{ flex:1 1 100%; }
}
.ficha-filas{ margin-top:auto; }
@media (max-width:640px){
  .ficha-grid{ grid-template-columns:1fr; }
  .ficha-grid > *{ max-width:100%; }
  .ficha-suelta{ width:100%; }
}

// Ediciones y ganadores. Una línea por TEMPORADA, no por año natural: la Liga
// y el Tour arrancan en otoño y terminan al año siguiente, como en el fútbol.
// `anio` = año en que cierra la temporada; sirve para ordenar y para casar con
// COPA_DATA. `temporada` = la etiqueta que se muestra. null = aún sin decidir.
// La Copa se deja en 'auto' porque su ganador ya vive en COPA_DATA.
const PALMARES = [
  // `inicio`/`fin` acotan la temporada para repartir las jornadas ganadas. El
  // corte lo marca Capi cada año, no es fijo. `fin` en null = temporada abierta.
  { anio:2027, temporada:'2026/27', inicio:'15/10/2026', fin:null,
    race:null, sl:null, tour:null, mp:null, copa:'auto', rkg:null },
];

// Ganador de la Copa de un año, leído de COPA_DATA.
function _ganadorCopa(anio){
  if(typeof COPA_DATA === 'undefined') return null;
  const ed = COPA_DATA.find(e => Number(e['año'] !== undefined ? e['año'] : e.anio) === Number(anio));
  return (ed && ed.ganador) ? ed.ganador : null;
}

// Palmarés resuelto: por año, qué competiciones hubo y quién ganó cada una.
function palmaresResuelto(){
  return PALMARES.map(function(fila){
    const comps = TITULOS_COMPETICIONES
      .filter(function(c){ return fila[c.id] !== undefined; })
      .map(function(c){
        let g = fila[c.id];
        if(g === 'auto') g = (c.id === 'copa') ? _ganadorCopa(fila.anio) : null;
        return { id:c.id, icon:c.icon, label:c.label, ganador:g || null };
      });
    return { anio:fila.anio, temporada:fila.temporada || String(fila.anio), comps:comps };
  }).sort(function(a,b){ return b.anio - a.anio; });
}

// Índice inverso para la ficha del jugador: apodo → competición → [años].
// Se calcula al pedirlo, no al cargar: COPA_DATA se declara más abajo y en
// tiempo de carga todavía no existe.
function titulosAnios(){
  const out = {};
  palmaresResuelto().forEach(function(f){
    f.comps.forEach(function(c){
      if(!c.ganador) return;
      out[c.ganador] = out[c.ganador] || {};
      (out[c.ganador][c.id] = out[c.ganador][c.id] || []).push(f.temporada);
    });
  });
  Object.values(out).forEach(function(comp){
    Object.values(comp).forEach(function(a){ a.sort(); });
  });
  return out;
}

function titulosData(){
  return Object.fromEntries(
    Object.entries(titulosAnios()).map(([j,comp]) => [j,
      Object.fromEntries(Object.entries(comp).map(([c,a]) => [c, (a||[]).length]))])
  );
}

function tipoJugador(apodo){
  const j = EQUIPO.find(x => x.apodo === apodo);

// Tramos fijos del campo. Los nombres se quedan así por estabilidad —
// si los datos dicen que otro tramo es peor/mejor, cambiar a mano.
// Tramos POSICIONALES: son los mismos en cualquier campo porque los define
// dónde están, no lo duros que sean.
const TRAMOS_FIJOS={
  arranque:{label:'H1-H2-H3',idxs:[0,1,2]},
  sprintFinal:{label:'H16-H17-H18',idxs:[15,16,17]},
  front:{label:'H1-H9',idxs:[0,1,2,3,4,5,6,7,8]},

};

// Tramos por DIFICULTAD: se calculan campo por campo. El Amen Corner son los
// 3 hoyos consecutivos donde más se suma, y el Camino de rosas donde menos.
// En cada campo caen donde caen — nada de heredar los de ROC 3.
function _tramosDificultad(S){
  if(!S || !S.holes) return null;
  const ventanas=[];
  for(let i=0;i<=N_HOYOS-3;i++){
    const idxs=[i,i+1,i+2];
    const sum=idxs.reduce((a,k)=>a+S.holes[k].sum,0);
    const tot=idxs.reduce((a,k)=>a+S.holes[k].total,0);
    if(!tot) continue;
    ventanas.push({idxs, label:'H'+(i+1)+'-H'+(i+2)+'-H'+(i+3), avg:sum/tot});
  }
  if(!ventanas.length) return null;
  const orden=[...ventanas].sort((a,b)=>a.avg-b.avg);
  return { caminoRosas:orden[0], amenCorner:orden[orden.length-1] };
}

const HM_DATA={};

const RAW_DATA=[];

// ── Recalcular total/front/back/bir/par/bog/dbl como FÓRMULA derivada de HM ──
// HM es la única fuente de verdad. RAW se sincroniza automáticamente.
(function syncRAWfromHM(){
  // Precomputar set de jornadas presentes en HM (cualquier jugador) para detectar typos de apodo
  const jornadasEnHM=new Set();
  Object.keys(HM_DATA).forEach(k=>{const j=parseInt(k.split('_')[0],10);if(!isNaN(j))jornadasEnHM.add(j);});
  RAW_DATA.forEach(r=>{
    const arr=HM_DATA[r.j+'_'+r.jugador];
    if(!arr){
      // Si la jornada SÍ está en HM para otros jugadores pero no para éste → probable typo en apodo.
      // Si la jornada entera no está en HM (datos antiguos pre-HM), silencio.
      if(jornadasEnHM.has(r.j)){
        console.warn('[syncRAWfromHM] Falta HM["'+r.j+'_'+r.jugador+'"] pero J'+r.j+' sí está en HM para otros jugadores. ¿Typo en el apodo?');
      }
      return;
    }
    const played=arr.filter(x=>x!==null&&x!==undefined);
    if(!played.length)return;
    // Conteos siempre desde HM
    r.bir=played.filter(v=>v<=UMBRAL_BIR).length;
    r.par=played.filter(v=>v===PAR_HOYO).length;
    r.bog=played.filter(v=>v===UMBRAL_BOG).length;
    r.dbl=played.filter(v=>v>=UMBRAL_DBL).length;
    if(played.length===N_HOYOS){
      r.total=arr.reduce((s,v)=>s+v,0)-PAR_CAMPO;
      r.front=arr.slice(0,N_HOYOS/2).reduce((s,v)=>s+v,0)-PAR_NUEVE;
      r.back=arr.slice(N_HOYOS/2,N_HOYOS).reduce((s,v)=>s+v,0)-PAR_NUEVE;
    }
  });
})();

const HCP_DATA = {};

// === HCP SR DINÁMICO — todo se recalcula desde RAW_DATA, NADA hardcoded ===
// Fórmula: HCP en jornada J = media aritmética de los totales de las últimas
// hasta 10 partidas del jugador (hasta J inclusive), redondeada a 2 decimales.
// RAW.total ya viene con cap 5 aplicado por hoyo, y representa el delta vs par 54.
function calcHcpSR(jugador, hastaJ){
  const partidas=RAW_DATA
    .filter(r=>r.jugador===jugador && r.j<=hastaJ)
    .sort((a,b)=>a.j-b.j);
  if(partidas.length===0)return null;
  const ultimas=partidas.slice(-VENTANA);
  const suma=ultimas.reduce((s,r)=>s+r.total,0);
  return Math.round((suma/ultimas.length)*100)/100;
}

// ─── HCP_DATA totalmente dinámico desde RAW ─────────────────────────────
// Filosofía Excel: HCP_DATA es una FÓRMULA, no datos guardados. Al abrir el
// HTML se construye desde cero leyendo RAW_DATA + HM_DATA. Cuando se añade
// una jornada nueva, automáticamente queda reflejada en HCP_DATA sin tocar
// nada más. El HCP_DATA literal del HTML es solo "semilla" — se sobrescribe.
(function recalcHCP(){
  PLAYERS.forEach(p=>{
    if(!HCP_DATA[p]) HCP_DATA[p]={n:0,current:null,best:null,best_f:null,history:[]};
    const d=HCP_DATA[p];

    // Partidos del jugador en RAW (sin abandono), ordenados asc por jornada
    const partidos=RAW_DATA.filter(r=>r.jugador===p&&!r.abandono).sort((a,b)=>a.j-b.j);

    // n = total filas en RAW del jugador (incluye abandonos para conteo display)
    d.n=RAW_DATA.filter(r=>r.jugador===p).length;

    // history: regenerado ENTERO desde cero. Una entrada {j,hcp} por jornada jugada.
    // Esto garantiza que jornadas nuevas en RAW aparecen automáticamente sin tocar
    // HCP_DATA. Lo anterior se descarta — RAW es la única fuente de verdad.
    d.history=partidos.map(r=>({j:r.j,hcp:calcHcpSR(p,r.j)}));

    // current = último hcp del history regenerado
    const histValidos=d.history.filter(x=>x.hcp!==null);
    d.current=histValidos.length?histValidos[histValidos.length-1].hcp:null;

    // best y best_f: mínimo total real en RAW (sin abandono) y su fecha
    if(partidos.length){
      const mejor=partidos.reduce((m,r)=>r.total<m.total?r:m,partidos[0]);
      d.best=mejor.total;
      d.best_f=mejor.f;
    }else{
      d.best=null;d.best_f=null;
    }
  });
})();

const HCPGLOBAL_TABS = ['handicapglobal','tablaglobal','versus','recordsglobal','miscelania','rendimientoglobal','statsglobal','primeglobal','bitacoraglobal'];

function showTab(t,ev){
  // Ocultar todos los content
  document.querySelectorAll('.content').forEach(el=>el.style.display='none');
  // Limpiar active de TODOS los tabs y subtabs
  document.querySelectorAll('.tabs .tab, .subtabs .subtab').forEach(x=>x.classList.remove('active'));

  // Mostrar el contenido pedido
  const el = document.getElementById('tab-'+t);
  if(!el) return;
  el.style.display='block';
  if(!el.dataset.rendered){renderTab(t);el.dataset.rendered='1';}

  // Activar el botón correspondiente y la sub-barra si procede
  if(HCPGLOBAL_TABS.includes(t)){
    const padre = document.querySelector('.tabs .tab[data-tab="handicapglobal"]');
    if(padre) padre.classList.add('active');
    document.getElementById('subtabs-handicapglobal').style.display = 'flex';
    const sub = document.querySelector(`.subtabs[id="subtabs-handicapglobal"] .subtab[data-tab="${t}"]`);
    if(sub) sub.classList.add('active');
  } else {
    document.getElementById('subtabs-handicapglobal').style.display = 'none';
    const btn = document.querySelector(`.tabs .tab[data-tab="${t}"]`);
    if(btn) btn.classList.add('active');
  }
}

// IC declarado como global para que el IIFE de entrenamiento pueda calcular histórico Interclubs.
const IC_DATA={};

function renderInterclubs(el){
  function abrev(name){const p=name.split(' ');return p.length<=1?name:p[0]+' '+p[p.length-1];}

  // Convierte un nombre completo (como aparece en IC_DATA) al apodo corto del equipo.
  // Reverse-lookup en APODO_A_NOMBRES_IC. Si no hay apodo (jugador histórico ajeno
  // al equipo, p.ej. Jose Martín), cae al nombre abreviado.
  function apodoIC(name){
    if(!name) return name;
    if(typeof apodoDesdeNombreIC !== 'undefined'){
      const apo = apodoDesdeNombreIC(name);
      if(apo) return apo;
    }
    return abrev(name);
  }

  // ── Normalizar nombre de campos (acento) ──
  function normCamp(c){return c==='El Valles'||c==='El Vallés'?'El Vallès':c;}

  // ── Calcular playerStats automáticamente desde IC — solo individuales ──
  const playerStatsMap={};
  Object.values(IC_DATA).forEach(yearData=>{
    yearData.pruebas.forEach(prueba=>{
      if(!prueba.total)return;
      // Los 4 individuales con sus scores
      const all=[];
      if(prueba.ind1){all.push({name:prueba.ind1[0],score:prueba.ind1[1]},{name:prueba.ind1[2],score:prueba.ind1[3]});}
      if(prueba.ind2){all.push({name:prueba.ind2[0],score:prueba.ind2[1]},{name:prueba.ind2[2],score:prueba.ind2[3]});}
      // Registrar participación
      all.forEach(({name})=>{
        if(!playerStatsMap[name])playerStatsMap[name]={name,p1:0,p2:0,p3:0,p4:0,total:0,totalInd:0};
        playerStatsMap[name].total++;
        playerStatsMap[name].totalInd++;
      });
      // Asignar posiciones con empates: todos los del mismo score comparten posición
      all.forEach(({name,score})=>{
        if(!playerStatsMap[name])playerStatsMap[name]={name,p1:0,p2:0,p3:0,p4:0,total:0,totalInd:0};
        const pos=all.filter(x=>x.score<score).length+1;
        if(pos===1)playerStatsMap[name].p1++;

        }
        if(p.par1){
          const wP=Math.min(p.par1[2],p.par2[2]);
          h+='<div style="padding:5px 7px;border-top:1px solid #f0f0f0;background:#fff">';
          h+='<div style="font-size:11px;color:#aaa;font-weight:600;margin-bottom:3px;text-transform:uppercase">Parejas</div>';

            h+='</div>';

        const indSorted=[...allInd].sort((a,b)=>a[1]-b[1]);
        h+=`<div id="${popupId}" onclick="this.style.display='none'" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.55);z-index:9999;align-items:center;justify-content:center">
          <div onclick="event.stopPropagation()" style="background:#fff;border-radius:16px;padding:0;max-width:400px;width:92%;box-shadow:0 24px 64px rgba(0,0,0,0.3);overflow:hidden">
            <div style="background:#4a6fa5;padding:14px 18px;display:flex;align-items:center;justify-content:space-between">
              <div>
                <div style="font-size:16px;font-weight:700;color:#fff">${p.camp} · ${year}</div>
                <div style="font-size:12px;color:#cbd5e1;margin-top:2px">Prueba ${pi+1} · Total equipo: <b style="color:#fff">${p.total>=0?'+'+p.total:p.total}</b></div>
              </div>
              <div onclick="document.getElementById('${popupId}').style.display='none'" style="cursor:pointer;font-size:20px;color:#fff;padding:4px 8px">✕</div>
            </div>
            <div style="padding:16px 18px">
              <div style="font-size:11px;font-weight:700;color:#4a6fa5;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px">Individuales</div>
              ${indSorted.map(([n,s],i)=>{
                const pos=allInd.filter(([,ss])=>ss<s).length+1;
                const medal=pos===1?'🥇':pos===2?'🥈':pos===3?'🥉':'4️⃣';
                const bg=pos===1?'#f0fdf4':pos===2?'#eff6ff':pos===3?'#fff7ed':'#fafafa';
                return `<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:${bg};border-radius:9px;margin-bottom:6px">
                  <div style="font-size:20px">${medal}</div>
                  <div style="flex:1;font-size:13px;font-weight:500;color:#222">${n}</div>
                  <div style="font-size:18px;font-weight:700;color:${s<0?'#15803d':s===0?'#6b7280':'#1e3a8a'}">${s>=0?'+'+s:s}</div>
                </div>`;
              }).join('')}
              ${p.par1?`<div style="font-size:11px;font-weight:700;color:#4a6fa5;text-transform:uppercase;letter-spacing:0.5px;margin:14px 0 10px">Parejas</div>
              ${[p.par1,p.par2].sort((a,b)=>a[2]-b[2]).map((par,i)=>{
                const isW=par[2]===Math.min(p.par1[2],p.par2[2]);
                return `<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:${isW?'#f0fdf4':'#fafafa'};border-radius:9px;margin-bottom:6px">
                  <div style="font-size:20px">${i===0?'🥇':'🥈'}</div>
                  <div style="flex:1;font-size:13px;font-weight:500;color:#222">${par[0].split(' ')[0]} & ${par[1].split(' ')[0]}</div>
                  <div style="font-size:18px;font-weight:700;color:${par[2]<0?'#15803d':par[2]===0?'#6b7280':'#1e3a8a'}">${par[2]>=0?'+'+par[2]:par[2]}</div>
                </div>`;
              }).join('')}`:''}
            </div>
          </div>
        </div>`;
      }
    });
    h+='</div>';

    if(data.clas){
      h+='<div style="border-radius:10px;border:1px solid #e5e7eb;overflow:hidden;overflow-x:auto">';
      h+='<div style="padding:6px 12px;background:#f9fafb;border-bottom:1px solid #e5e7eb;font-size:11px;font-weight:600;color:#555">Clasificación final '+year+'</div>';
      h+='<table style="border-collapse:collapse;width:100%;font-size:11px"><thead><tr>';
      h+='<th style="padding:5px 8px;background:#f3f4f6;color:#888;font-weight:600;text-align:center;white-space:nowrap">Pos</th>';
      h+='<th style="padding:5px 8px;background:#f3f4f6;color:#888;font-weight:600;text-align:left;white-space:nowrap">Equip</th>';
      for(let i=1;i<=8;i++) h+='<th style="padding:5px 6px;background:#f3f4f6;color:#888;font-weight:600;text-align:center;white-space:nowrap">'+i+'</th>';
      h+='<th style="padding:5px 8px;background:#f3f4f6;color:#888;font-weight:600;text-align:center;white-space:nowrap">Total</th>';
      h+='</tr></thead><tbody>';
      data.clas.forEach((c,i)=>{
        const isRoc=c.roc===true;
        const bg=isRoc?'#fef9c3':i%2===0?'#fff':'#fafafa';
        const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':'';
        h+='<tr style="background:'+bg+'">';
        h+='<td style="padding:4px 8px;text-align:center;font-weight:'+(isRoc?700:400)+';color:#555">'+medal+(medal?'':i+1)+'</td>';
        h+='<td style="padding:4px 8px;font-weight:'+(isRoc?700:400)+';color:'+(isRoc?'#854d0e':'#333')+';white-space:nowrap">'+c.equip+(isRoc?' ⭐':'')+'</td>';
        c.proves.forEach(pts=>{
          h+='<td style="padding:4px 6px;text-align:center;font-weight:'+(pts===100?600:400)+';color:'+(pts===100?'#15803d':pts>=80?'#1e40af':'#555')+'">'+(pts||'—')+'</td>';
        });
        h+='<td style="padding:4px 8px;text-align:center;font-weight:700;color:'+(isRoc?'#854d0e':'#1e3a8a')+'">'+c.pts+'</td>';
        h+='</tr>';
      });
      h+='</tbody></table></div>';
    }
    h+='</div>';
  });

  window._showICPopup=function(id){const p=document.getElementById(id);if(p)p.style.display='flex';};

  el.innerHTML='<div style="max-width:600px">'+h+'</div>';
  renderICTable();
}

function renderMatchPlay(el){
  let h = '<div style="max-width:1100px;margin:0 auto">';

    h += '<div style="font-size:12px;color:#6b7280;background:#fafafa;border:1px solid #f0f0f0;border-radius:10px;padding:16px;line-height:1.7">'

function renderCopa(el){

  function hCell(v){
    if(v===null||v===undefined)return'<td style="text-align:center;padding:2px 3px;color:#ccc">—</td>';
    const s=v<=2?{bg:'#65d000',col:'#fff',fw:700,round:true}:v===3?{bg:'transparent',col:'#333',fw:400}:v===4?{bg:'#06b6d4',col:'#fff',fw:600}:{bg:'#1e3a8a',col:'#fff',fw:700};
    const inner=s.round
      ?`<span style="display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:${s.bg};color:${s.col};font-weight:${s.fw};font-size:11px">${v}</span>`
      :`<span style="display:inline-block;width:18px;height:18px;line-height:18px;text-align:center;border-radius:3px;background:${s.bg};color:${s.col};font-weight:${s.fw};font-size:11px">${v}</span>`;
    return`<td style="text-align:center;padding:2px 1px">${inner}</td>`;
  }

  function totCell(v){
    const bg=v<0?'#65d000':v===0?'#6b7280':v<=6?'#1e3a8a':'#991b1b';
    const txt=v<0?String(v):v===0?'PAR':'+'+v;
    return`<td style="text-align:center;padding:2px 6px;font-weight:700;font-size:12px;color:#fff;background:${bg};border-radius:4px">${txt}</td>`;
  }

  let h=`<div style="max-width:600px">`;
  h+=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:20px">
    <span style="font-size:28px">🏆</span>
    <div>
      <div style="font-size:16px;font-weight:700;color:#1a1a1a">Copa</div>
      <div style="font-size:11px;color:#aaa">Campeonato anual individual — todos contra todos</div>
    </div>
  </div>`;

  COPA_DATA.forEach(ed=>{

    const birdieLider=ed.jugadores.reduce((a,b)=>b.bir>a.bir?b:a);
    h+=`<div style="border:2px solid #fde68a;border-radius:14px;margin-bottom:20px;overflow:hidden">
      <div style="background:linear-gradient(135deg,#78350f,#92400e);padding:10px 16px">
        <div style="font-size:12px;font-weight:700;color:#fde68a;letter-spacing:1px;text-transform:uppercase">🏅 Cuadro de Honor</div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:0">
        <div style="padding:14px 16px;border-right:1px solid #fde68a22;border-bottom:1px solid #fde68a22">
          <div style="font-size:10px;font-weight:600;color:#92400e;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px">Año</div>
          <div style="font-size:22px;font-weight:700;color:#1a1a1a">${ed.año}</div>
          <div style="font-size:10px;color:#aaa;margin-top:2px">${ed.fecha}</div>
        </div>
        <div style="padding:14px 16px;border-right:1px solid #fde68a22;border-bottom:1px solid #fde68a22;background:#fef9c3">
          <div style="font-size:10px;font-weight:600;color:#92400e;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px">🥇 Campeón</div>
          <div style="font-size:20px;font-weight:700;color:#78350f">${ed.ganador}</div>
          <div style="display:inline-block;margin-top:4px;padding:2px 8px;background:${COLORS[ed.ganador]||'#eee'};border-radius:8px;font-size:10px;color:#333;font-weight:500">ganador</div>
        </div>
        <div style="padding:14px 16px;border-bottom:1px solid #fde68a22">
          <div style="font-size:10px;font-weight:600;color:#92400e;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px">🐦 Más birdies</div>
          <div style="font-size:20px;font-weight:700;color:#854d0e">${birdieLider.n}</div>
          <div style="font-size:13px;font-weight:600;color:#854d0e;margin-top:2px">${birdieLider.bir} birdies</div>
        </div>
      </div>
    </div>`;

    // ── Tarjeta edición ──
    h+=`<div style="border:2px solid #fde68a;border-radius:14px;margin-bottom:24px;overflow:hidden">`;

    // Cabecera edición
    h+=`<div style="background:linear-gradient(135deg,#92400e,#b45309);padding:12px 16px;display:flex;align-items:center;justify-content:space-between">
      <div>
        <div style="font-size:15px;font-weight:700;color:#fff">🏆 Copa ${ed.año}</div>
        <div style="font-size:11px;color:#fde68a;margin-top:2px">${ed.fecha}</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:11px;color:#fde68a;margin-bottom:2px">Campeón</div>
        <div style="font-size:20px;font-weight:700;color:#fff">🥇 ${ed.ganador}</div>
      </div>
    </div>`;

    h+=`<div style="padding:12px 14px;overflow-x:auto">
      <div style="font-size:11px;font-weight:600;color:#555;margin-bottom:8px">Scorecard completo</div>
      <table style="border-collapse:collapse;font-size:11px;min-width:600px">
        <thead>
          <tr style="background:#f9fafb">
            <th style="padding:4px 8px;text-align:left;font-weight:600;color:#555;white-space:nowrap">Jugador</th>
            ${Array.from({length:9},(_,i)=>`<th style="padding:3px 2px;text-align:center;color:#888;font-weight:500;width:22px">${i+1}</th>`).join('')}
            <th style="padding:3px 5px;text-align:center;color:#1e40af;font-weight:700;font-size:10px">OUT</th>
            ${Array.from({length:9},(_,i)=>`<th style="padding:3px 2px;text-align:center;color:#888;font-weight:500;width:22px">${i+10}</th>`).join('')}
            <th style="padding:3px 5px;text-align:center;color:#1e40af;font-weight:700;font-size:10px">IN</th>
            <th style="padding:3px 6px;text-align:center;color:#fff;font-weight:700;font-size:10px;background:#1e3a8a;border-radius:4px">TOT</th>
            <th style="padding:3px 4px;text-align:center;color:#854d0e;font-size:10px">🐦</th>
            <th style="padding:3px 4px;text-align:center;color:#555;font-size:10px">✅</th>
            <th style="padding:3px 4px;text-align:center;color:#c2410c;font-size:10px">❌</th>
            <th style="padding:3px 4px;text-align:center;color:#991b1b;font-size:10px">❌❌</th>
          </tr>
        </thead>
        <tbody>`;

    ed.jugadores.forEach((p,i)=>{
      const bg=i%2===0?'#fff':'#fafafa';
      const isWinner=p.n===ed.ganador;
      const frontSum=p.f.reduce((s,v)=>s+(v||0),0);
      const backSum=p.b.slice(1).reduce((s,v)=>s+(v||0),0); // skip front subtotal col
      const nameBg=COLORS[p.n]||'#e5e7eb';
      h+=`<tr style="background:${isWinner?'#fef9c3':bg}">
        <td style="padding:4px 8px;font-weight:${isWinner?700:500};background:${nameBg};white-space:nowrap">${isWinner?'🥇 ':''  }${p.n}</td>
        ${p.f.map(v=>hCell(v)).join('')}
        <td style="text-align:center;padding:2px 5px;font-weight:700;color:#1e40af;font-size:11px">${p.b[0]>=0?'+'+p.b[0]:p.b[0]}</td>

        <td style="text-align:center;padding:2px 4px;color:#555">${p.par}</td>

        <td style="text-align:center;padding:2px 4px;color:#991b1b;font-weight:${p.dbl>3?600:400}">${p.dbl}</td>
      </tr>`;
    });

    h+=`</tbody></table></div>`;

    // Desempate
    if(ed.desempate){
      const d=ed.desempate;
      h+=`<div style="margin:0 14px 14px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:10px 14px">
        <div style="font-size:11px;font-weight:600;color:#1e40af;margin-bottom:8px">⚡ Desempate — ${d.resultado}</div>
        <table style="border-collapse:collapse;font-size:11px">
          <thead><tr>
            <th style="padding:3px 8px;text-align:left;color:#555">Jugador</th>
            <th style="padding:3px 8px;text-align:center;color:#555">H1</th>
            <th style="padding:3px 8px;text-align:center;color:#555">H2</th>
            <th style="padding:3px 8px;text-align:center;color:#555">H3</th>
          </tr></thead>
          <tbody>
            ${d.jugadores.map((jug,i)=>{
              const isW=jug===ed.ganador;
              const h3cell=i===1
                ?`<td style="text-align:center;padding:2px 8px;font-size:11px;color:#7c3aed;font-weight:600;font-style:italic">levanta</td>`
                :hCell(3);
              return`<tr style="background:${isW?'#fef9c3':'#fff'}">
                <td style="padding:4px 8px;font-weight:${isW?700:500};background:${COLORS[jug]||'#eee'}">${isW?'🥇 ':''}${jug}</td>
                ${hCell(d.hoyo1[i])}
                ${hCell(d.hoyo2[i])}
                ${h3cell}
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>`;
    }

    h+=`</div>`;
  });

  h+=`</div>`;
  el.innerHTML=h;
}

// ──────────────────────────────────────────────────────────────────────
// CTX_INFO — FUENTE ÚNICA de los contextos (modalidades) del HCP Global.
// Cada clave es un `src` de actuación. Reúne en un solo sitio lo que antes
// estaba duplicado en 5 constantes distintas (AJUSTE_CONTEXTO, AJUSTE_CTX,
// ctxBadge, CTX_LABEL, SRC_INFO), que se desincronizaban entre sí.
//
//   · ajuste : suma fija de golpes al delta crudo (rigor/mérito de la
//              modalidad). No depende del delta ni del jugador.
//   · icon   : icono del modal "10 últimas actuaciones".
//   · lbl    : etiqueta corta del badge (tabla + filtro por contexto).
//   · label  : nombre largo (Records, tooltips).
//   · bg/col : colores del badge.
//
// Ordenado de MÁS exigente (ajuste 0 = referencia) a MÁS informal.
// Para añadir un contexto nuevo: una línea aquí y nada más.
// ──────────────────────────────────────────────────────────────────────
const CTX_INFO = {
  ic:      { ajuste:0,    cap:null, icon:'🌍',  lbl:'IC',   label:'Interclubs',       bg:'#fef3c7', col:'#92400e' },
  rkg:     { ajuste:0,    cap:null, icon:'📊',  lbl:'RKG',  label:'Ranking',          bg:'#f3e8ff', col:'#6b21a8' },
  copa:    { ajuste:0,    cap:null, icon:'🏆',  lbl:'COPA', label:'Copa',    bg:'#fce7f3', col:'#9d174d' },
  sl:      { ajuste:0.5,  cap:5,    icon:'🥇',  lbl:'SL',   label:'Liga',       bg:'#e0e7ff', col:'#3730a3' },
  oficial: { ajuste:0.5,  cap:5,    icon:'🎖️', lbl:'OFI',  label:'Torneo Oficial',   bg:'#ffe4e6', col:'#9f1239' },
  // `historico`: ajustes que estuvieron vigentes ANTES de un cambio. Una vuelta
  // jugada hasta esa fecha (incluida) usa ese ajuste; a partir del día siguiente
  // rige el `ajuste` de arriba. Cambiar la regla no reescribe el pasado.
  sptr:    { ajuste:0.5,  cap:5,    icon:'🔥',  lbl:'SPE',  label:'Tour',          bg:'#cffafe', col:'#0e7490',
             historico:[{ hasta:'2026-09-08', ajuste:1 }] },
  ent:     { ajuste:0.75, cap:5,    icon:'🏋️', lbl:'ENT',  label:'Entrenamiento',    bg:'#dcfce7', col:'#15803d' },
  // `activo:false` = contexto cerrado: ya no se juega, pero sus partidas
  // siguen en el histórico, con su badge y su filtro. No aparece en las
  // tablas explicativas de cómo se calcula el HCP de aquí en adelante.
  roc:     { ajuste:1,    cap:5,    activo:false, icon:'🎯',  lbl:'SR',   label:'Super ROC',        bg:'#dbeafe', col:'#1e40af' },
};

// Helper único: ajuste de contexto de una actuación (o de un src suelto).
// Si el contexto tiene `historico`, el ajuste depende de la fecha de la vuelta:
// una jornada ya jugada conserva el ajuste que tenía cuando se jugó.
function ajusteContexto(srcOrAct){
  const esObj = srcOrAct && typeof srcOrAct === 'object';
  const s = esObj ? srcOrAct.src : srcOrAct;
  const ci = CTX_INFO[s];
  if(!ci || typeof ci.ajuste !== 'number') return 0;
  if(esObj && Array.isArray(ci.historico) && srcOrAct.fecha){
    const f = srcOrAct.fecha instanceof Date ? srcOrAct.fecha : new Date(srcOrAct.fecha);
    if(!isNaN(+f)){
      const tramo = ci.historico
        .slice()
        .sort((a,b) => new Date(a.hasta) - new Date(b.hasta))
        .find(t => f <= new Date(t.hasta + 'T23:59:59'));
      if(tramo) return tramo.ajuste;
    }
  }
  return ci.ajuste;
}

// ───────────────────────────────────────────────────────────────────
// Cap de golpes por hoyo. NO es global: es una propiedad del contexto
// (CTX_INFO[src].cap). Los contextos de competición pura — Interclubs,
// Ranking y Copa — llevan cap:null y anotan los golpes reales. El resto
// topan en 5. Para cambiarlo: una línea en CTX_INFO y nada más.
// ───────────────────────────────────────────────────────────────────

// Contextos vivos: los que aún se juegan. Un contexto cerrado (activo:false)
// conserva su histórico, su badge y su filtro, pero no se lista como opción
// de aquí en adelante.
function ctxActivos(){
  return Object.fromEntries(Object.entries(CTX_INFO).filter(([k,v]) => v.activo !== false));
}

// Cap del contexto: número, o null si ese contexto no capa.
function capContexto(srcOrAct){
  const s = (srcOrAct && typeof srcOrAct === 'object') ? srcOrAct.src : srcOrAct;
  const c = CTX_INFO[s] && CTX_INFO[s].cap;
  return (typeof c === 'number') ? c : null;
}

// Valor de un hoyo ya topado según su contexto.
function capHoyo(srcOrAct, v){
  if(v === null || v === undefined) return v;
  const c = capContexto(srcOrAct);
  return (c === null) ? v : Math.min(v, c);
}

// Suma de una tarjeta (array de 18 hoyos) aplicando el cap del contexto.
function sumaHoyos(arr, srcOrAct){
  if(!arr) return null;
  return arr.reduce((s,v) => s + (capHoyo(srcOrAct, v) || 0), 0);
}

// Cómo se PINTA un hoyo: por encima del cap se muestra 'X'; el valor
// exacto del cap se muestra tal cual. Sin cap, siempre el número.
function pintaHoyo(srcOrAct, v){
  if(v === null || v === undefined) return '—';
  const c = capContexto(srcOrAct);
  return (c !== null && v > c) ? 'X' : String(v);
}

// ──────────────────────────────────────────────────────────────────────
// Recorridos por campo. Cada campo tiene un array `recorridos` con
// {id, ajuste}. El ajuste se suma al delta crudo en el HCP Global.
// Esto centraliza los ajustes: la función render de la pestaña Campos
// y el cálculo del HCP Global leen de aquí (no hardcodean valores).
// ──────────────────────────────────────────────────────────────────────
const RECORRIDOS_DEFAULT = [
  { id:'FCPP', ajuste:0 },
  { id:'eppa', ajuste:1 },
];
const RECORRIDOS_EXCEPCIONES = {
  canal_olimpic: [
    { id:'FCPP', ajuste:2 },

  ],
  can_rafel: [

    { id:'B',    ajuste:1 },
  ],
  badalona: [
    { id:'FCPP', ajuste:0 },
    { id:'eppa', ajuste:1 },
    { id:'Verd', ajuste:0 },
  ],
};
CAMPOS.forEach(c => {
  c.recorridos = RECORRIDOS_EXCEPCIONES[c.id] || RECORRIDOS_DEFAULT;
});

// Devuelve el ajuste de campo según campo + recorrido jugado.
// Si no hay match, devuelve 0 (recorrido desconocido = sin ajuste).
function ajusteRecorrido(campoIdOrNombre, recorridoId){
  if(!campoIdOrNombre) return 0;
  if(typeof CAMPOS === 'undefined' || !Array.isArray(CAMPOS)) return 0;
  const c = CAMPOS.find(x => x.id === campoIdOrNombre || x.nombre_coloquial === campoIdOrNombre);
  if(!c || !Array.isArray(c.recorridos)) return 0;
  const recId = recorridoId || 'FCPP';
  const r = c.recorridos.find(x => x.id === recId);
  return r ? r.ajuste : 0;
}

// Campo abierto en la pestaña Campos (null = listado). Se conserva entre
// renders para poder volver al listado sin perder el sitio.
let _campoAbierto = null;

// Modo de la tabla "Media por hoyo": 'u10' = las 10 últimas vueltas de cada
// jugador en ese campo, 'hist' = todas. Se conserva entre renders.
let _mediaHoyoModo = 'u10';

window.__setMediaHoyoModo = function(modo){
  if(modo !== 'u10' && modo !== 'hist') return;
  if(_mediaHoyoModo === modo) return;
  _mediaHoyoModo = modo;
  const el = document.getElementById('tab-campos') || document.querySelector('[data-tab-content="campos"]');
  if(el) renderCampos(el);
};

function _abrirCampo(campoKey){
  _campoAbierto = campoKey || null;
  const el = document.getElementById('tab-campos') || document.querySelector('[data-tab-content="campos"]');
  if(el) renderCampos(el);
  window.scrollTo(0,0);
}

// ════════════════════════════════════════════════════════════════
// PALMARÉS — quién ganó qué y cuándo.
// Todo sale de PALMARES (y de COPA_DATA para la Copa). La ficha del jugador
// lee el mismo sitio, así que no hay dos verdades.
// ════════════════════════════════════════════════════════════════
function renderPalmares(el){
  const filas = palmaresResuelto();

  let h = '<div style="max-width:900px;margin:0 auto">';
  h += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">';
  h += '<div style="font-weight:700;font-size:16px">🏆 Palmarés</div></div>';
  h += '<div style="font-size:12px;color:#6b7280;margin-bottom:18px">Los campeones de cada temporada. Una casilla sin nombre es una competición aún por decidir.</div>';

  // ── Matriz: competiciones en filas, años en columnas ──
  const anios = filas.map(function(f){ return f.temporada; });     // ya vienen de más nueva a más vieja
  const ganadorDe = function(anio, compId){
    const f = filas.find(function(x){ return x.temporada === anio; });
    if(!f) return undefined;
    const c = f.comps.find(function(x){ return x.id === compId; });
    return c ? c.ganador : undefined;   // undefined = esa competición no existía ese año
  };

  h += '<div style="overflow-x:auto;border:1px solid #e5e7eb;border-radius:14px;background:#fff">';
  h += '<table style="border-collapse:collapse;width:100%;min-width:'+(160 + anios.length*130)+'px">';
  h += '<thead><tr style="background:#fafafa">';
  h += '<th style="text-align:left;padding:10px 14px;font-size:11px;font-weight:600;color:#6b7280;border-bottom:1px solid #f0f0f0">Competición</th>';
  anios.forEach(function(a){
    h += '<th style="text-align:center;padding:10px 12px;font-family:Fraunces,serif;font-size:19px;font-weight:700;color:#1a1a1a;border-bottom:1px solid #f0f0f0;border-left:1px solid #f6f6f6">'+a+'</th>';
  });
  h += '</tr></thead><tbody>';

  TITULOS_COMPETICIONES.forEach(function(c, ci){
    h += '<tr style="background:'+(ci%2 ? '#fafafa' : '#fff')+'">';
    h += '<td style="padding:12px 14px;font-size:12.5px;font-weight:700;color:#1a1a1a;white-space:nowrap;border-bottom:1px solid #f6f6f6">'+c.icon+' '+c.label+'</td>';
    anios.forEach(function(a){
      const g = ganadorDe(a, c.id);
      let cel;
      if(g === undefined){
        cel = '<span style="color:#e5e7eb">·</span>';                       // no se disputó
      } else if(!g){
        cel = '<span style="font-size:11px;color:#d1d5db;font-style:italic">por decidir</span>';
      } else {
        cel = '<span style="display:inline-flex;align-items:center;gap:7px">'
            + '<span style="display:inline-block;width:16px;height:16px;border-radius:4px;background:'+(COLORS[g]||'#f3f4f6')+'"></span>'
            + '<span style="font-size:13px;font-weight:700;color:#1a1a1a">'+g+'</span></span>';
      }
      h += '<td style="padding:12px;text-align:center;border-bottom:1px solid #f6f6f6;border-left:1px solid #f6f6f6">'+cel+'</td>';
    });
    h += '</tr>';
  });
  h += '</tbody></table></div>';

  // ── Resumen por jugador ──
  const _tAnios = titulosAnios();
  const resumen = Object.entries(titulosData())
    .map(function(e){
      return { jugador:e[0], total:Object.values(e[1]).reduce(function(a,b){ return a+b; }, 0), comp:e[1] };
    })
    .sort(function(a,b){ return b.total - a.total; });

  if(resumen.length){
    h += '<div style="border:1px solid #e5e7eb;border-radius:14px;overflow:hidden;background:#fff;margin-top:20px">';
    h += '<div style="padding:10px 14px;background:#fafafa;border-bottom:1px solid #f0f0f0;font-size:13px;font-weight:700">🏅 Títulos por jugador</div>';
    resumen.forEach(function(r){
      const det = TITULOS_COMPETICIONES
        .filter(function(c){ return r.comp[c.id]; })
        .map(function(c){ return c.icon+' '+_tAnios[r.jugador][c.id].join(', '); })
        .join(' · ');
      h += '<div style="display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid #f6f6f6">'
        + '<span style="display:inline-block;width:18px;height:18px;border-radius:4px;background:'+(COLORS[r.jugador]||'#f3f4f6')+'"></span>'
        + '<span style="font-size:13px;font-weight:700;min-width:90px">'+r.jugador+'</span>'
        + '<span style="font-size:17px;font-weight:700;color:#b45309;min-width:26px">'+r.total+'</span>'
        + '<span style="font-size:11px;color:#9ca3af">'+det+'</span></div>';
    });
    h += '</div>';
  }

  h += '</div>';
  el.innerHTML = h;
}

function renderCampos(el){
  el.id = el.id || 'tab-campos';

  // ── Vista de detalle: la radiografía de un campo ──
  if(_campoAbierto){
    const V = _campoVueltasDe(_campoAbierto);
    const jugs = {};
    V.forEach(v => { jugs[v.jugador] = (jugs[v.jugador]||0) + 1; });
    const conVentana = Object.values(jugs).filter(n => n >= VENTANA).length;

    let hd = '<div style="max-width:1200px;margin:0 auto">';
    hd += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">';
    hd += '<button onclick="_abrirCampo(null)" style="font-size:12px;padding:5px 12px;border:1px solid #e5e7eb;background:#fff;border-radius:7px;cursor:pointer;color:#374151">← Campos</button>';
    hd += '<div style="font-weight:700;font-size:15px;color:#15803d">' + _campoAbierto + '</div>';
    hd += '<div style="font-size:11px;color:#9ca3af">' + V.length + ' vueltas · ' +
          Object.keys(jugs).length + ' jugadores · ' + conVentana + ' con ventana completa</div>';
    hd += '</div>';
    hd += '<div id="campo-radio"></div></div>';
    el.innerHTML = hd;
    renderRadiografia(document.getElementById('campo-radio'), V, _campoAbierto);
    return;
  }

  // ── Listado ──
  // Orden alfabético por nombre coloquial
  const ordenados = [...CAMPOS].sort((a,b) => a.nombre_coloquial.localeCompare(b.nombre_coloquial, 'ca'));

  // Vueltas registradas por campo+recorrido, para saber qué fichas son
  // clicables y con cuántas vueltas cuenta cada una.
  const _cuenta = {};
  ((typeof _recopilarActuacionesGlobal==='function' ? _recopilarActuacionesGlobal() : []) || [])
    .filter(a => !a.abandono && Array.isArray(a.hoyos) && a.hoyos.length===N_HOYOS && a.fecha instanceof Date)
    .forEach(a => { const k=_campoKey(a); if(k) _cuenta[k]=(_cuenta[k]||0)+1; });

  let h = `<div style="max-width:1200px;margin:0 auto">
    <div style="font-size:13px;color:#555;margin-bottom:14px">
      <b>${CAMPOS.length}</b> campos de Pitch &amp; Putt registrados
      <span style="margin-left:8px;color:#888;font-size:11px">(par 54 · 18 hoyos cada uno)</span>
    </div>`;

  // Helper: renderiza una sola tabla horizontal con los 18 hoyos seguidos.
  // Filas H, M y eppa se muestran SIEMPRE (con — si falta el dato).
  // Fila B (stroke index) se muestra solo si:
  //   - el campo es Can Rafel (donde la usamos como referencia), o
  //   - hay al menos un hoyo con dato de B (compatibilidad futura).
  // La fila Apodo solo aparece si al menos un hoyo tiene apodo definido.
  const renderTabla18 = (hoyos18, campoId) => {
    const hayNombre = hoyos18.some(h => h.nombre);
    const hayHcp    = hoyos18.some(h => h.hcp !== null && h.hcp !== undefined);
    const mostrarB  = campoId === 'can_rafel' || hayHcp;
    const mostrarVerd = hoyos18.some(h => h.verd !== null && h.verd !== undefined);

    const headers = hoyos18.map(h => `<td style="text-align:center;padding:3px 2px;font-weight:600;color:#15803d;font-size:9.5px;background:#dcfce7">${h.num}</td>`).join('');
    let html = `<div style="overflow-x:auto;-webkit-overflow-scrolling:touch">
      <table style="border-collapse:collapse;background:#fafaf5;border-radius:5px;overflow:hidden;font-family:Inter,system-ui,sans-serif;width:100%">
        <tr><td style="padding:3px 4px;font-weight:600;color:#15803d;font-size:9.5px;background:#dcfce7;text-align:left">H</td>${headers}<td style="text-align:center;padding:3px 4px;font-weight:600;color:#15803d;font-size:9.5px;background:#dcfce7">Σ</td></tr>`;

    if(hayNombre){
      const apodos = hoyos18.map(h => `<td style="text-align:center;padding:2px 2px;font-size:9px;color:#1f2937;line-height:1.15">${h.nombre || '<span style="color:#d1d5db">—</span>'}</td>`).join('');
      html += `<tr><td style="padding:2px 4px;font-weight:500;color:#6b7280;font-size:9.5px;text-align:left">Apodo</td>${apodos}<td style="text-align:center;padding:2px 4px;color:#d1d5db;font-size:9px">—</td></tr>`;
    }
    // M (metros) — siempre, label FCPP. Ajuste leído de CAMPOS[*].recorridos.
    {
      const valores = hoyos18.map(h => `<td style="text-align:center;padding:2px 2px;font-size:10px;color:#1a1a1a">${h.metros !== null && h.metros !== undefined ? h.metros : '<span style="color:#d1d5db">—</span>'}</td>`).join('');
      const suma = hoyos18.reduce((s,h)=>s+(h.metros||0),0);
      const aj = ajusteRecorrido(campoId, 'FCPP');
      const fcppN = (aj >= 0 ? '+' : '') + aj;
      const plusFcpp = `<span title="Ajuste FCPP al delta crudo en HCP Global." style="color:#c2410c;font-weight:700;font-size:8.5px;margin-left:2px">${fcppN}</span>`;
      html += `<tr><td style="padding:2px 2px 2px 4px;font-weight:500;color:#6b7280;font-size:9.5px;text-align:left;white-space:nowrap">FCPP${plusFcpp}</td>${valores}<td style="text-align:center;padding:2px 4px;font-weight:600;color:#15803d;font-size:10px">${suma||'—'}</td></tr>`;
    }
    // eppa — siempre. Ajuste leído de CAMPOS[*].recorridos.
    {
      const valores = hoyos18.map(h => {
        if(h.eppa === null || h.eppa === undefined) return `<td style="text-align:center;padding:2px 2px;font-size:10px;color:#d1d5db">—</td>`;
        const distinto = h.metros !== null && h.eppa !== h.metros;
        const style = distinto ? 'color:#c2410c;font-weight:500' : 'color:#6b7280';
        return `<td style="text-align:center;padding:2px 2px;font-size:10px;${style}">${h.eppa}</td>`;
      }).join('');
      const suma = hoyos18.reduce((s,h)=>s+(h.eppa||0),0);
      const aj = ajusteRecorrido(campoId, 'eppa');
      const eppaN = (aj >= 0 ? '+' : '') + aj;
      const plus1 = `<span title="Ajuste eppa (recorrido EPPA) al delta crudo en HCP Global." style="color:#c2410c;font-weight:700;font-size:8.5px;margin-left:2px">${eppaN}</span>`;
      html += `<tr><td style="padding:2px 2px 2px 4px;font-weight:500;color:#6b7280;font-size:9.5px;text-align:left;white-space:nowrap">eppa${plus1}</td>${valores}<td style="text-align:center;padding:2px 4px;font-weight:600;color:#c2410c;font-size:10px">${suma||'—'}</td></tr>`;
    }
    // B (recorrido B, ajuste leído de CAMPOS[*].recorridos si existe)
    if(mostrarB){
      const valores = hoyos18.map(h => `<td style="text-align:center;padding:2px 2px;font-size:10px;color:#1a1a1a">${h.hcp !== null && h.hcp !== undefined ? h.hcp : '<span style="color:#d1d5db">—</span>'}</td>`).join('');
      const ajB = ajusteRecorrido(campoId, 'B');
      const plusB = (campoId === 'can_rafel' && ajB !== 0)
        ? `<span title="Recorrido B: +${ajB} al delta crudo en HCP Global." style="color:#c2410c;font-weight:700;font-size:8.5px;margin-left:2px">+${ajB}</span>`
        : '';
      html += `<tr><td style="padding:2px 2px 2px 4px;font-weight:500;color:#6b7280;font-size:9.5px;text-align:left;white-space:nowrap">B${plusB}</td>${valores}<td style="text-align:center;padding:2px 4px;color:#d1d5db;font-size:10px">—</td></tr>`;
    }
    // VERD (recorrido Verd, solo si algún hoyo tiene dato verd; ajuste leído de CAMPOS[*].recorridos)
    if(mostrarVerd){
      const valores = hoyos18.map(h => `<td style="text-align:center;padding:2px 2px;font-size:10px;color:#1a1a1a">${h.verd !== null && h.verd !== undefined ? h.verd : '<span style="color:#d1d5db">—</span>'}</td>`).join('');
      const suma = hoyos18.reduce((s,h)=>s+(h.verd||0),0);
      const ajV = ajusteRecorrido(campoId, 'Verd');
      const vN = (ajV >= 0 ? '+' : '') + ajV;
      const plusV = `<span title="Recorrido Verd: ${vN} al delta crudo en HCP Global." style="color:#c2410c;font-weight:700;font-size:8.5px;margin-left:2px">${vN}</span>`;
      html += `<tr><td style="padding:2px 2px 2px 4px;font-weight:500;color:#6b7280;font-size:9.5px;text-align:left;white-space:nowrap">VERD${plusV}</td>${valores}<td style="text-align:center;padding:2px 4px;font-weight:600;color:#15803d;font-size:10px">${suma||'—'}</td></tr>`;
    }

    html += `</table></div>`;
    return html;
  };

  ordenados.forEach((c) => {
    // Recorridos de este campo con vueltas suficientes → botones de entrada
    const recs = Object.keys(_cuenta)
      .filter(k => k.indexOf(c.nombre_coloquial + ' · ') === 0)
      .sort((a,b) => _cuenta[b] - _cuenta[a]);
    const botones = recs.map(k => {
      const n = _cuenta[k];
      const ok = n >= MIN_VUELTAS_CAMPO;
      const rec = k.split(' · ')[1];
      return ok
        ? '<button onclick="_abrirCampo(\'' + k.replace(/'/g,"\\'") + '\')" style="font-size:10px;font-weight:600;padding:3px 9px;border:1px solid #bbf7d0;background:#f0fdf4;color:#15803d;border-radius:6px;cursor:pointer;margin-right:4px">⛳ ' + rec + ' · ' + n + '</button>'
        : '<span title="Faltan ' + (MIN_VUELTAS_CAMPO-n) + ' vueltas para la radiografía" style="font-size:10px;padding:3px 9px;border:1px solid #f3f4f6;background:#fafafa;color:#cbd5e1;border-radius:6px;margin-right:4px">' + rec + ' · ' + n + '</span>';
    }).join('');

    h += `<div style="background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap">
      <div style="flex:0 0 160px;min-width:140px">
        <div style="font-weight:700;font-size:13px;color:#15803d;line-height:1.2">${c.nombre_coloquial}</div>
        <div style="font-size:10px;color:#6b7280;margin-top:2px;line-height:1.25">${c.nombre_oficial}</div>
        <div style="font-size:10px;color:#9ca3af;margin-top:2px">📍 ${c.localidad}</div>
        ${botones ? `<div style="margin-top:6px">${botones}</div>` : ''}
        <div style="margin-top:5px;display:inline-block;font-size:9.5px;color:#15803d;font-weight:600;background:#dcfce7;padding:2px 6px;border-radius:4px">par ${c.par} · 18h</div>
      </div>
      <div style="flex:1;min-width:0">${renderTabla18(c.hoyos, c.id)}</div></div>`;
  });

  h += `</div>`;
  el.innerHTML = h;
}

// Jugador cuya ficha está abierta (null = listado del equipo).
let _fichaAbierta = null;

// Ventana activa de la tarjeta "Distribución de golpes": un número de vueltas
// o 'hist' (todas). Se conserva entre renders de la ficha.
let _fichaDistVentana = VENTANA;

window.__setFichaDist = function(v){
  const val = (v === 'hist' || v === 'prime') ? v : Math.floor(Number(v));
  if(val !== 'hist' && val !== 'prime' && !(val > 0)) return;
  if(_fichaDistVentana === val) return;
  _fichaDistVentana = val;
  const el = document.getElementById('tab-equipo');
  if(el && _fichaAbierta) renderFichaJugador(el, _fichaAbierta);
};

function _abrirFicha(apodo){
  _fichaAbierta = apodo || null;
  const el = document.getElementById('tab-equipo');
  if(el) renderEquipo(el);
  window.scrollTo(0,0);
}

// ════════════════════════════════════════════════════════════════
// FICHA DEL JUGADOR
// ════════════════════════════════════════════════════════════════
// La foto es opcional: campo `foto` en la ficha de EQUIPO, con la imagen en
// base64 (data:image/jpeg;base64,...) porque el HTML es un único fichero y no
// hay carpeta de imágenes. Sin foto se pinta un círculo con las iniciales y el
// color del jugador, así que la ficha funciona ya y las fotos se van añadiendo.
function renderFichaJugador(el, apodo){
  const p = EQUIPO.find(x => x.apodo === apodo);
  if(!p){ _fichaAbierta = null; return renderEquipo(el); }

  let edad = '—';
  if(p.nac){
    const hoy=new Date(), n=new Date(p.nac);
    let e=hoy.getFullYear()-n.getFullYear();
    if(hoy<new Date(hoy.getFullYear(),n.getMonth(),n.getDate())) e--;
    edad = e;
  }

  const g = (typeof calcHandicapGlobal==='function') ? calcHandicapGlobal(apodo) : null;
  const hcp = (g && typeof g.hcp === 'number') ? g.hcp : null;
  const fmtH = v => v===null ? '—'
    : (Math.round(v*10)/10===0 ? 'PAR' : (v>0?'+':'−')+Math.abs(Math.round(v*10)/10).toFixed(1));

  const acts = ((typeof _recopilarActuacionesGlobal==='function' ? _recopilarActuacionesGlobal(apodo) : []) || [])
    .filter(a => !a.abandono);
  const color = COLORS[apodo] || (typeof COLOR_DEFAULT!=='undefined' ? COLOR_DEFAULT : '#e5e7eb');
  const iniciales = apodo.slice(0,2).toUpperCase();
  const esEq = (typeof esDelEquipo==='function') ? esDelEquipo(apodo) : true;

  const foto = p.foto
    ? '<img src="'+p.foto+'" alt="'+apodo+'" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;display:block">'
    : '<div style="width:100%;aspect-ratio:1;border-radius:12px;background:'+color+';display:flex;align-items:center;justify-content:center">'
      + '<span style="font-family:Fraunces,serif;font-size:56px;font-weight:700;color:#1a1a1a;opacity:0.5;letter-spacing:-1px">'+iniciales+'</span></div>';

  const dato = (k,v,extra) => '<div class="ficha-fila" style="justify-content:space-between">'
    + '<span style="font-size:11px;color:#6b7280">'+k+'</span>'
    + '<span style="font-size:12px;font-weight:600;color:#1a1a1a;text-align:right;'+(extra||'')+'">'+v+'</span></div>';

  let h = '<div style="max-width:1100px;margin:0 auto">';
  h += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap">';
  h += '<button onclick="_abrirFicha(null)" style="font-size:12px;padding:5px 12px;border:1px solid #e5e7eb;background:#fff;border-radius:7px;cursor:pointer;color:#374151">← Equipo</button>';
  h += '<div style="font-weight:700;font-size:16px">'+apodo+'</div>';
  h += '<span style="font-size:10px;font-weight:600;padding:2px 8px;border-radius:8px;background:'+(esEq?'#dcfce7':'#faf5ff')+';color:'+(esEq?'#15803d':'#6d28d9')+'">'+(esEq?'EQUIPO':'SOCIO')+'</span>';
  h += '</div>';

  h += '<div class="ficha-grid">';

  // FILA 1 · izquierda — foto y datos personales
  h += '<div class="ficha-tarjeta" style="border:1px solid #e5e7eb;border-radius:14px;padding:14px 14px 10px;background:#fff;box-sizing:border-box">';
  // Foto algo mas pequena que el ancho de la tarjeta: asi la tarjeta baja de
  // alto y Titulos no tiene que estirarse tanto para cuadrar por abajo.
  h += '<div style="max-width:200px;margin:0 auto;width:100%">' + foto + '</div>';
  h += '<div class="ficha-filas" style="padding-top:12px">';
  h += dato('Nombre', p.nombre || '—');
  h += dato('Licencia', p.licencia || '—', 'font-family:monospace;color:#6b7280');
  h += dato('Edad', edad);
  // Clic en el año: enseña la fecha exacta del alta (el bautizo) y vuelve.
  if(p.alta){
    h += dato('Desde',
      '<span onclick="this.dataset.on=this.dataset.on?\'\':\'1\';'
      + 'this.textContent=this.dataset.on?this.dataset.alta:this.dataset.anio"'
      + ' data-alta="' + p.alta + '" data-anio="' + (p.desde || '—') + '"'
      + ' title="Fecha de alta en el club"'
      + ' style="cursor:pointer;border-bottom:1px dotted #cbd5e1">' + (p.desde || '—') + '</span>');
  } else {
    h += dato('Desde', p.desde || '—');
  }
  h += dato('Vueltas', acts.length);
  h += '</div></div>';

  // Prime: el mejor HCP Global que ha llegado a tener en un cierre de domingo.
  let prime = null, primeTs = null;
  const _hist = (typeof _calcHistoricoN1Global==='function') ? _calcHistoricoN1Global(UMBRAL_N1) : null;
  if(_hist && _hist.historialN1){
    _hist.historialN1.forEach(row => {
      (row.ranking||[]).forEach(r => {
        if(r.jugador === apodo && (prime === null || r.hcp < prime)){ prime = r.hcp; primeTs = row.ts; }
      });
    });
  }
  const fFecha = ts => { const d=new Date(ts);
    return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear(); };

  const linea = (titulo, valor, pie, col) =>
      '<div class="ficha-fila">'
    + '<span style="font-size:11px;color:#6b7280;min-width:110px">'+titulo+'</span>'
    + '<span style="font-size:17px;font-weight:700;color:'+col+'">'+valor+'</span>'
    + '<span style="font-size:10.5px;color:#9ca3af">'+pie+'</span></div>';

  // Columna derecha — hándicaps arriba, títulos debajo
  h += '<div class="ficha-col">';
  h += '<div style="border:1px solid #e5e7eb;border-radius:12px;padding:6px 14px 10px;background:#fff;box-sizing:border-box">';
  h += linea('Hándicap actual', fmtH(hcp), '',
        hcp!==null && hcp<0 ? '#15803d' : '#1a1a1a');
  h += linea('Prime', prime!==null ? fmtH(prime) : '—', '', '#15803d');
  // Mismo cálculo que el HCP Global oficial, pero sobre ventanas más largas.
  // La lista manda: añadir un número aquí crea la línea, sin tocar nada más.
  VENTANAS_FICHA.forEach(function(v){
    const gv = (typeof calcHandicapGlobal==='function')
      ? calcHandicapGlobal(apodo, null, false, null, null, v) : null;
    const hv = (gv && typeof gv.hcp === 'number') ? gv.hcp : null;
    const faltan = gv ? Math.max(0, v - gv.totalActs) : v;
    h += linea('Hándicap ' + v, fmtH(hv),
      hv === null ? (faltan > 0 ? 'faltan ' + faltan + ' vueltas' : '') : 'últimas ' + v,
      hv !== null && hv < 0 ? '#15803d' : '#1a1a1a');
  });

  // Jornadas ganadas: veces que ha firmado el mejor total de una jornada
  // (mismo día, mismo campo y mismo contexto, con al menos 2 jugadores).
  // Los empates cuentan como victoria para todos los empatados.
  let ganadas = 0;
  const _victorias = [];   // { src, fecha } de cada jornada que ha ganado
  if(typeof _recopilarActuacionesGlobal === 'function'){
    const grupos = {};
    (_recopilarActuacionesGlobal() || [])
      .filter(a => !a.abandono && a.fecha instanceof Date && typeof a.delta === 'number')
      .forEach(a => {
        const k = a.fecha.toISOString().slice(0,10)+'|'+a.campo+'|'+a.src;
        (grupos[k] = grupos[k] || []).push(a);
      });
    Object.values(grupos).forEach(g => {
      if(g.length < 2) return;
      const mejor = Math.min.apply(null, g.map(x => x.delta));
      const mia = g.find(x => x.jugador === apodo && x.delta === mejor);
      if(mia){ ganadas++; _victorias.push({ src:mia.src, fecha:mia.fecha }); }
    });
  }
  h += '</div>';

  // Títulos: crece para cuadrar por abajo con la tarjeta de la foto
  h += '<div class="ficha-crece ficha-tarjeta" style="border:1px solid #e5e7eb;border-radius:12px;padding:6px 14px 10px;background:#fff;box-sizing:border-box">';
  h += '<div style="font-size:10px;font-weight:800;letter-spacing:0.7px;color:#1a1a1a;text-transform:uppercase;padding:8px 0 4px">Títulos</div>';
  h += '<div class="ficha-filas">';
  const _tAnios = titulosAnios();

  // Temporadas del palmarés, de más nueva a más vieja, con sus fechas de corte.
  const _pFecha = (f) => { if(!f) return null; const [d,m,y]=String(f).split('/'); return new Date(+y,+m-1,+d); };
  const _temps = (typeof PALMARES !== 'undefined' ? PALMARES : [])
    .slice()
    .sort((a,b) => (b.anio||0) - (a.anio||0))
    .map(f => ({ label:f.temporada || String(f.anio), ini:_pFecha(f.inicio), fin:_pFecha(f.fin) }));

  // Jornadas ganadas de una competición, en una temporada o en total.
  const _jorDe = (src, t) => {
    if(!src) return null;                       // la IRON RACE no tiene jornadas
    return _victorias.filter(v => v.src === src
      && (!t || ((!t.ini || v.fecha >= t.ini) && (!t.fin || v.fecha <= t.fin)))).length;
  };
  // Posición en la IRON RACE de una temporada, a partir de las fotos semanales.
  const _race = (typeof calcCarrera === 'function') ? calcCarrera() : null;
  const _racePos = (t) => {
    if(!_race) return null;
    const dentro = _race.semanas.filter(w => (!t.ini || w.ts >= t.ini.getTime())
                                          && (!t.fin || w.ts <= t.fin.getTime()));
    if(!dentro.length) return null;
    const pts = {};
    dentro.forEach(w => w.filas.forEach(f => { pts[f.jugador] = (pts[f.jugador]||0) + f.pts; }));
    if(!(apodo in pts)) return null;
    return 1 + Object.keys(pts).filter(j => pts[j] > pts[apodo]).length;
  };
  const _posTemps = _temps.map(_racePos);
  const _raceOros = _posTemps.filter(p => p === 1).length;

  const _celda = (n, jor, fuerte) => {
    const col = n > 0 ? '#b45309' : '#d1d5db';
    return '<td style="text-align:center;padding:0 6px;white-space:nowrap">'
      + '<span style="font-size:'+(fuerte?'15px':'13px')+';font-weight:700;color:'+col+'">'+n+'</span>'
      + (jor !== null ? '<span style="font-size:10px;color:#9ca3af"> ('+jor+')</span>' : '')
      + '</td>';
  };

  h += '<table style="width:100%;border-collapse:collapse">';
  h += '<tr><th></th>'
     + '<th style="font-size:9.5px;color:#6b7280;text-transform:uppercase;letter-spacing:0.5px;padding:0 6px 4px">Total</th>'
     + _temps.map(t => '<th style="font-size:9.5px;color:#9ca3af;padding:0 6px 4px;white-space:nowrap">'+t.label+'</th>').join('')
     + '</tr>';

  TITULOS_COMPETICIONES.forEach(function(c){
    const lista = (_tAnios[apodo] && _tAnios[apodo][c.id]) ? _tAnios[apodo][c.id] : [];
    let celdas;
    if(c.id === 'race'){
      // La IRON RACE no tiene jornadas: cada temporada enseña el puesto en que
      // acabó, y el total cuenta las veces que lo ganó.
      celdas = _celda(_raceOros, null, true)
             + _posTemps.map(pos => '<td style="text-align:center;padding:0 6px;white-space:nowrap">'
                 + '<span style="font-size:13px;font-weight:700;color:'+(pos===1?'#b45309':(pos?'#6b7280':'#d1d5db'))+'">'
                 + (pos ? pos+'º' : '—') + '</span></td>').join('');
    } else {
      celdas = _celda(lista.length, _jorDe(c.src, null), true)
             + _temps.map(t => _celda(lista.indexOf(t.label) >= 0 ? 1 : 0, _jorDe(c.src, t), false)).join('');
    }
    h += '<tr class="ficha-fila" style="display:table-row">'
       + '<td style="font-size:11px;color:#6b7280;padding:0;white-space:nowrap">'+c.icon+' '+c.label+'</td>'
       + celdas + '</tr>';
  });

  // Jornadas ganadas: suma de todas las competiciones, por temporada y total.
  const _jorTotal = (t) => TITULOS_COMPETICIONES
    .reduce((acc, c) => acc + (c.src ? _jorDe(c.src, t) : 0), 0);
  h += '<tr class="ficha-fila" style="display:table-row">'
     + '<td style="font-size:11px;color:#1a1a1a;font-weight:600;padding:0;white-space:nowrap">Jornadas ganadas</td>'
     + '<td style="text-align:center;padding:0 6px"><span style="font-size:15px;font-weight:700;color:#1a1a1a">'+_jorTotal(null)+'</span></td>'
     + _temps.map(t => '<td style="text-align:center;padding:0 6px"><span style="font-size:13px;font-weight:700;color:#1a1a1a">'+_jorTotal(t)+'</span></td>').join('')
     + '</tr>';
  h += '</table>';
  h += '<div style="font-size:10px;color:#9ca3af;padding:6px 0 0">Entre paréntesis, jornadas ganadas. En la IRON RACE, el puesto de cada temporada.</div>';
  h += '</div>';         // cierra el bloque de filas
  h += '</div></div>';   // cierra Títulos + columna derecha

  h += '</div>';         // cierra la rejilla

  // Tarjeta de juego, suelta bajo la foto. Aquí irán más datos hoyo a hoyo.
  // ── Ventana activa de la tarjeta de distribución ──
  // 10/20/30 = últimas N vueltas · 'hist' = todas · 'prime' = las 10 que
  // formaban su mejor HCP Global, leídas con el corte de aquella semana.
  // Recuento hoyo a hoyo de todas sus tarjetas. Todos los hoyos son par 3, asi
  // que el golpe firmado define el resultado. La tabla manda: anadir una
  // entrada aqui crea su linea en la ficha sin tocar nada mas.
  // `col` = color del número en la tabla. `tono` = color de su porción en el
  // gráfico, de mejor (oro/verde) a peor (rojo oscuro).
  const TIPOS_HOYO = [
    { k:'HIO',            test: sc => sc === 1, col:'#b45309', tono:'#b45309' },
    { k:'Birdies',        test: sc => sc === 2, col:'#15803d', tono:'#22c55e' },
    { k:'Pares',          test: sc => sc === 3, col:'#1a1a1a', tono:'#cbd5e1' },
    { k:'Bogeys',         test: sc => sc === 4, col:'#2563eb', tono:'#3b82f6' },
    { k:'Dobles',         test: sc => sc === 5, col:'#1e3a8a', tono:'#1e3a8a' },
    { k:'Triple o +',     test: sc => sc >= 6, col:'#dc2626', tono:'#dc2626' },
  ];
  const actsOrd = acts.slice().sort((a,b) => b.fecha - a.fecha);
  let actsDist, hcpDist = null;
  if(_fichaDistVentana === 'prime'){
    // Las 10 vueltas que tenía encima de la mesa el día de su mejor HCP.
    // Se cortan sobre `acts`, que sí llevan el hoyo a hoyo.
    const corte = primeTs ? new Date(primeTs) : null;
    actsDist = corte ? actsOrd.filter(a => a.fecha <= corte).slice(0, VENTANA) : [];
    hcpDist  = prime;
  } else if(_fichaDistVentana === 'hist'){
    actsDist = actsOrd;
  } else {
    actsDist = actsOrd.slice(0, _fichaDistVentana);
    const gV = (typeof calcHandicapGlobal==='function')
      ? calcHandicapGlobal(apodo, null, false, null, null, _fichaDistVentana) : null;
    hcpDist = (gV && typeof gV.hcp === 'number') ? gV.hcp : null;
  }
  let nHoyos = 0;
  const cuentaTipo = TIPOS_HOYO.map(() => 0);
  actsDist.forEach(a => {
    if(!Array.isArray(a.hoyos)) return;
    a.hoyos.forEach(sc => {
      if(sc === null || sc === undefined) return;
      nHoyos++;
      TIPOS_HOYO.forEach((t, i) => { if(t.test(sc)) cuentaTipo[i]++; });
    });
  });


  h += '<div class="ficha-abajo">';
  h += '<div class="ficha-suelta ficha-compacta" style="border:1px solid #e5e7eb;border-radius:14px;padding:6px 14px 8px;background:#fff;box-sizing:border-box">';
  h += '<div style="font-size:10px;font-weight:800;letter-spacing:0.7px;color:#1a1a1a;text-transform:uppercase;padding:6px 0 5px">Distribución de golpes</div>';
  // `apagado` = el botón se ve pero no hace nada (aún no hay dato para él).
  const btnDist = (val, txt, apagado, titulo) => {
    const on = (String(_fichaDistVentana) === val);
    return '<button' + (apagado ? ' disabled' : ' onclick="window.__setFichaDist(\''+val+'\')"')
      + (titulo ? ' title="'+titulo+'"' : '')
      + ' style="'
      + 'font:inherit;font-size:11px;font-weight:'+(on?'700':'500')+';'
      + 'padding:3px 9px;border-radius:999px;'
      + 'cursor:'+(apagado?'default':'pointer')+';'
      + 'opacity:'+(apagado?'0.4':'1')+';'
      + 'border:1px solid '+(on?'#15803d':'#e5e7eb')+';'
      + 'background:'+(on?'#dcfce7':'#fff')+';color:'+(on?'#15803d':'#6b7280')+'">'
      + txt + '</button>';
  };
  h += '<div style="display:flex;gap:5px;flex-wrap:wrap;padding-bottom:8px">'
     + VENTANAS_DIST.map(v => btnDist(String(v), String(v))).join('')
     + btnDist('hist', 'Histórico')
     + btnDist('prime', '⭐', prime === null, prime === null ? 'Sin prime todavía' : 'Las 10 vueltas de su mejor HCP')
     + '</div>';
  h += dato('Vueltas', actsDist.length);
  h += dato('Hoyos', nHoyos);
  TIPOS_HOYO.forEach((t, i) => {
    const n = cuentaTipo[i];
    const pct = (nHoyos > 0 && t.k !== 'HIO') ? ' · ' + (100*n/nHoyos).toFixed(1) + '%' : '';
    h += dato(t.k, n + pct, 'color:' + t.col);
  });
  h += '</div>';

  // Gráfico de anillo con el mismo recuento: se redibuja solo al cambiar de
  // ventana, porque toda la ficha se vuelve a renderizar.
  h += '<div class="ficha-grafico" style="border:1px solid #e5e7eb;border-radius:14px;padding:6px 14px 10px;background:#fff;box-sizing:border-box;display:flex;flex-direction:column">';
  h += '<div style="font-size:10px;font-weight:800;letter-spacing:0.7px;color:#1a1a1a;text-transform:uppercase;padding:6px 0 5px">Reparto</div>';
  if(hcpDist !== null){
    h += '<div style="display:flex;align-items:baseline;gap:7px;padding:0 0 6px">'
       + '<span style="font-size:11px;color:#6b7280">HCP</span>'
       + '<span style="font-size:19px;font-weight:700;color:' + (hcpDist < 0 ? '#15803d' : '#1a1a1a') + '">'
       + fmtH(hcpDist) + '</span>'
       + (_fichaDistVentana === 'prime'
            ? '<span style="font-size:10.5px;color:#9ca3af">⭐ prime · ' + fFecha(primeTs) + '</span>'
            : '<span style="font-size:10.5px;color:#9ca3af">últimas ' + _fichaDistVentana + '</span>')
       + '</div>';
  }
  if(nHoyos === 0){
    h += '<div style="font-size:11.5px;color:#9ca3af;padding:14px 0">Sin hoyos en esta ventana.</div>';
  } else {
    const R = 62, GR = 26, C = 2*Math.PI*R;   // radio, grosor, circunferencia
    let acum = 0, arcos = '';
    TIPOS_HOYO.forEach((t, i) => {
      const n = cuentaTipo[i];
      if(n <= 0) return;
      const frac = n / nHoyos;
      arcos += '<circle cx="90" cy="90" r="'+R+'" fill="none" stroke="'+t.tono+'"'
            + ' stroke-width="'+GR+'"'
            + ' stroke-dasharray="'+(frac*C).toFixed(2)+' '+C.toFixed(2)+'"'
            + ' stroke-dashoffset="'+(-acum*C).toFixed(2)+'"'
            + ' transform="rotate(-90 90 90)"><title>'+t.k+': '+n+' ('+(100*frac).toFixed(1)+'%)</title></circle>';
      acum += frac;
    });
    h += '<div style="display:flex;justify-content:center;padding:2px 0 8px">'
       + '<svg viewBox="0 0 180 180" style="width:100%;max-width:180px;height:auto">'
       + arcos
       + '<text x="90" y="86" text-anchor="middle" style="font-size:22px;font-weight:700;fill:#1a1a1a">'+nHoyos+'</text>'
       + '<text x="90" y="104" text-anchor="middle" style="font-size:10px;fill:#9ca3af">hoyos</text>'
       + '</svg></div>';
    // Leyenda: solo los tipos con datos en esta ventana.
    h += '<div style="display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:center;padding-bottom:4px">';
    TIPOS_HOYO.forEach((t, i) => {
      if(cuentaTipo[i] <= 0) return;
      h += '<span style="display:inline-flex;align-items:center;gap:4px;font-size:10.5px;color:#6b7280">'
         + '<span style="width:9px;height:9px;border-radius:2px;background:'+t.tono+'"></span>'
         + t.k + ' ' + (100*cuentaTipo[i]/nHoyos).toFixed(1) + '%</span>';
    });
    h += '</div>';
  }
  h += '</div>';

  h += '</div>';   // cierra la fila inferior

  // ───────── 📈 Progresión del jugador ─────────
  // Mismo cálculo y mismo gráfico que la Miscelánea, pero solo de él.
  const _prog = (typeof _progVentanasJugador === 'function') ? _progVentanasJugador(apodo) : null;
  h += '<div style="margin-top:14px;border:1px solid #e5e7eb;border-radius:14px;padding:6px 14px 12px;background:#fff;box-sizing:border-box">';
  h += '<div style="display:flex;align-items:baseline;gap:7px;padding:8px 0 4px;flex-wrap:wrap">'
     + '<span style="font-size:10px;font-weight:800;letter-spacing:0.7px;color:#1a1a1a;text-transform:uppercase">📈 Progresión</span>'
     + '<span style="font-size:10px;color:#9ca3af">histórico del HCP Global · ventana móvil de ' + PROG_N + ' actuaciones</span>'
     + '</div>';
  if(!_prog || !_prog.vents.length){
    h += '<div style="font-size:11px;color:#9ca3af;padding:10px 0">'
       + 'Aún no hay serie: hacen falta ' + PROG_N + ' actuaciones. '
       + 'Lleva ' + (_prog ? _prog.n : 0) + '.</div>';
  } else {
    h += '<div style="background:#fafafa;border:1px solid #eee;border-radius:8px;padding:8px 10px 4px;margin-bottom:8px">'
       + _progChartSVG(_prog.vents, '#0f766e', 170) + '</div>';
    h += _progCardsHTML(_prog.vents, null);
    h += '<div style="font-size:10px;color:#bbb;margin-top:8px">'
       + _prog.n + ' actuaciones (sin Canal Olímpic) · ' + _prog.vents.length + ' puntos</div>';
  }
  h += '</div>';

  h += '</div>';
  el.innerHTML = h;
}

function renderEquipo(el){

  function calcEdad(nac){
    if(!nac) return '—';
    const hoy=new Date(), n=new Date(nac);
    let e=hoy.getFullYear()-n.getFullYear();
    if(hoy<new Date(hoy.getFullYear(),n.getMonth(),n.getDate())) e--;
    return e;
  }

  const W={nick:140,nom:240,lic:110,desde:55,edad:50,talla:60,hasta:55};

      t+='<tr style="background:'+bg+';cursor:pointer" onclick="_abrirFicha(\''+p.apodo.replace(/'/g,"\\'")+'\')" title="Ver ficha de '+p.apodo+'">';
      t+='<td style="'+tdL+'">'+badge+'<strong style="border-bottom:1px dotted #9ca3af">'+p.apodo+'</strong></td>';
      t+='<td style="'+tdL+'color:#444">'+p.nombre+'</td>';
      t+='<td style="'+tdL+'font-family:monospace;color:#777">'+p.licencia+'</td>';
      t+='<td style="'+tdC+'">'+p.desde+'</td>';
      t+='<td style="'+tdC+'">'+calcEdad(p.nac)+'</td>';
      t+='<td style="'+tdC+'">'+(p.talla?'<span style="font-size:10px;font-weight:600;color:#6d28d9;background:#f5f3ff;padding:2px 6px;border-radius:8px">'+p.talla+'</span>':'—')+'</td>';
      t+='</tr>';
    });
    return t+'</tbody>';
  }


  const wA=W.nick+W.nom+W.lic+W.desde+W.edad+W.talla;

  const mediaEdad = lista => {
    const e = lista.map(p=>calcEdad(p.nac)).filter(x=>x!=='—');
    return e.length ? (e.reduce((s,x)=>s+x,0)/e.length).toFixed(1) : null;
  };
  const delEquipo = JUGADORES_EQUIPO();
  const socios    = JUGADORES_SOCIOS();

  let h='<div style="overflow-x:auto;border-radius:10px;border:1px solid #ede9fe">';
  h+='<div style="font-size:11px;color:#555;padding:6px 10px;font-weight:600;border-bottom:1px solid #ede9fe">Equipo <span style="font-weight:400;color:#888">· '+delEquipo.length+' · cuota 120 €/año — plantilla elegible para el Interclubs de la temporada</span></div>';
  h+='<table style="border-collapse:collapse;table-layout:fixed;width:'+wA+'px">'+cg(false)+th(false,mediaEdad(delEquipo))+tbodyActivos(delEquipo)+'</table>';
  if(socios.length){
    h+='<div style="font-size:11px;color:#555;background:#faf5ff;padding:6px 10px;font-weight:600;border-top:2px solid #e5e7eb;border-bottom:1px solid #ede9fe">Socios <span style="font-weight:400;color:#888">· '+socios.length+' · cuota 60 €/año — Liga, Copa, Ranking, Tour y Match Play</span></div>';

  h+='</div>';
  el.innerHTML=h;
}

function holeStyle(v){
  if(v===null||v===undefined)return{bg:'transparent',col:'#ccc',fw:400,txt:'—'};
  if(v<=2)return{bg:'#65d000',col:'#fff',fw:700,txt:String(v),round:true};
  if(v===3)return{bg:'#fff',col:'#333',fw:400,txt:'3'};
  if(v===4)return{bg:'#06b6d4',col:'#fff',fw:600,txt:'4'};
  if(v===5)return{bg:'#1e3a8a',col:'#fff',fw:700,txt:'5'};
  return{bg:'#1e3a8a',col:'#fff',fw:700,txt:String(v)};
}

function totalStyle(t){
  if(t<0)return{bg:'#65d000',col:'#fff',txt:String(t)};
  if(t===0)return{bg:'#6b7280',col:'#fff',txt:'par'};
  return{bg:'#1e3a8a',col:'#fff',txt:'+'+t};
}

// ───────────────────────────────────────────────────────────────────────
// Helpers globales para scorecards (compartidos por SR Tabla y Ranking).
// Cualquier pestaña que muestre 18 hoyos+total+stats con el "look" del SR
// debe usar estas funciones; así el formato se mantiene en un solo sitio.
// ───────────────────────────────────────────────────────────────────────
function renderScorecardCell(v){
  const hs = holeStyle(v);
  const inner = hs.round
    ? `<span style="display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:${hs.bg};color:${hs.col};font-weight:${hs.fw};font-size:11px">${hs.txt}</span>`
    : `<span style="color:${hs.col};font-weight:${hs.fw};font-size:11px;display:inline-block;width:18px;height:18px;line-height:18px;border-radius:3px;background:${hs.bg}">${hs.txt}</span>`;
  return `<td style="text-align:center;padding:1px 0;background:#fff;border:1px solid #fff">${inner}</td>`;
}
function renderScorecardCells(arr){
  return arr.map(renderScorecardCell).join('');
}
function renderScorecardTotal(delta){
  const ts = totalStyle(delta);
  const fmtT = ts.txt !== undefined ? ts.txt : (delta === 0 ? 'par' : (delta > 0 ? '+'+delta : ''+delta));
  return `<td style="text-align:center;padding:2px 4px;background:${ts.bg};color:${ts.col};font-weight:700;font-size:12px;border:none;border-radius:4px">${fmtT}</td>`;
}
function renderScorecardStats(cnt){

function countScoresFromArr(arr){
  let bir=0, par=0, bog=0, dbl=0;
  arr.forEach(v => {
    if(v === null || v === undefined) return;
    if(v <= 2) bir++;
    else if(v === 3) par++;
    else if(v === 4) bog++;
    else dbl++;
  });
  return { bir, par, bog, dbl };
}
