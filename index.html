  // ── Partidos seguidos haciendo birdie (todos los contextos) ──────────
  // Birdie = hoyo ≤2 (incluye hole in one). Una actuación con ≥1 birdie
  // mantiene la racha; una sin birdies la rompe. Por fecha, desde 01/01/2026.
  function rachaPartidosBirdie(jugador){
    const acts = _recopilarActuacionesGlobal(jugador)
      .filter(a => !a.abandono && a.fecha instanceof Date && a.fecha >= FECHA_INICIO_GLOBAL_CALC && typeof a.bir === 'number' && !_campoExcluido(a.campo))
      .sort((a,b) => a.fecha - b.fecha);
    if(!acts.length) return { jugador, best:0, desde:null, hasta:null, actual:0 };
    let maxBest=0, maxDesde=null, maxHasta=null, cur=0, curDesde=null;
    acts.forEach(a => {
      if(a.bir > 0){
        cur++;
        if(cur===1) curDesde=a.fecha;
        if(cur>maxBest){ maxBest=cur; maxDesde=curDesde; maxHasta=a.fecha; }
      } else cur=0;
    });
    if(!maxBest) return { jugador, best:0, desde:null, hasta:null, actual:0 };
    let actual=0;
    for(let i=acts.length-1; i>=0; i--){ if(acts[i].bir > 0) actual++; else break; }
    return { jugador, best:maxBest, desde:maxDesde, hasta:maxHasta, actual };
  }
  const partBirdieData = PLAYERS.map(rachaPartidosBirdie).filter(Boolean)
    .sort((a,b) => b.best - a.best || a.jugador.localeCompare(b.jugador));

  // Birdies consecutivos DENTRO de un mismo partido. Birdie = hoyo ≤2.
  // Mejor racha intra-ronda de cada jugador + la ronda donde la logró.
  function rachaBirdiesConsec(jugador){
    const acts = _recopilarActuacionesGlobal(jugador)
      .filter(a => !a.abandono && a.fecha instanceof Date && a.fecha >= FECHA_INICIO_GLOBAL_CALC && Array.isArray(a.hoyos) && !_campoExcluido(a.campo));
    if(!acts.length) return { jugador, best:0, fecha:null, campo:null, ctx:null };
    let best=0, mejorAct=null;
    acts.forEach(a => {
      let max=0, cur=0;
      a.hoyos.forEach(v => { if(v!==null && v<=2){ cur++; if(cur>max) max=cur; } else if(v!==null){ cur=0; } });
      if(max>best || (max===best && mejorAct && a.fecha>mejorAct.fecha)){ best=max; mejorAct=a; }
    });
    return { jugador, best, fecha:mejorAct?mejorAct.fecha:null, campo:mejorAct?(mejorAct.campo||'—'):null, ctx:mejorAct?(CTX_LABEL[mejorAct.src]||mejorAct.src):null };
  }
  // Birdie = hoyo ≤2. Mejor ronda (más birdies) de cada jugador, desde 01/01/2026.
  const masBirdiesData = PLAYERS.map(jugador => {
    const acts = _recopilarActuacionesGlobal(jugador)
      .filter(a => !a.abandono && a.fecha instanceof Date && a.fecha >= FECHA_INICIO_GLOBAL_CALC && typeof a.bir === 'number' && !_campoExcluido(a.campo));
    if(!acts.length) return { jugador, best:0, fecha:null, campo:null, ctx:null };
    let mejor = acts[0];
    acts.forEach(a => { if(a.bir > mejor.bir || (a.bir===mejor.bir && a.fecha>mejor.fecha)) mejor = a; });
    return { jugador, best:mejor.bir, fecha:mejor.fecha, campo:mejor.campo||'—', ctx:CTX_LABEL[mejor.src]||mejor.src };
  }).sort((a,b) => b.best - a.best || a.jugador.localeCompare(b.jugador));
  h += '<div style="margin-bottom:18px">';
  h += '<div style="display:flex;align-items:center;gap:6px;font-weight:500;font-size:12px;margin-bottom:8px"><span style="font-size:14px;line-height:1">🐦</span> Más birdies en un partido <span style="font-weight:400;color:#aaa;font-size:10px;margin-left:4px">· todos los contextos</span></div>';
  masBirdiesData.forEach((p,i) => {
    const info = p.fecha ? fFecha(p.fecha)+' · '+p.campo+' · '+p.ctx : '—';
    h += '<div style="display:flex;align-items:center;gap:8px;padding:7px 10px;background:'+(i===0?'#f0fdf4':'#fff')+';border-radius:7px;margin-bottom:4px;border:1px solid #eee">'
      +'<div style="width:26px;height:26px;border-radius:5px;background:'+(COLORS[p.jugador]||'#eee')+';display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;color:#333;flex-shrink:0">'+p.jugador.slice(0,3)+'</div>'
      +'<div style="flex:1;font-weight:500;font-size:12px">'+p.jugador+'</div>'
      +'<div style="font-size:10px;color:#aaa;margin-right:4px">'+info+'</div>'
      +'<div style="font-weight:700;font-size:16px;color:#15803d;min-width:28px;text-align:right">'+p.best+'</div>'
      +'</div>';
  });
  h += '</div>'; // cierra sección Más birdies en un partido

  // ── 2) Birdies consecutivos (🐦🐦) — DENTRO de un mismo partido ──────
  // No encadena entre partidos: `cur` se reinicia en cada actuación. Es
  // deliberado — en torneos con salida escalonada (shotgun) no se empieza
  // por el hoyo 1, así que encadenar hoyos entre rondas daría rachas falsas.
  {
  const birdiesConsecData = PLAYERS.map(rachaBirdiesConsec).filter(Boolean)
    .sort((a,b) => b.best - a.best || a.jugador.localeCompare(b.jugador));
  h += '<div style="margin-bottom:18px">';
  h += '<div style="display:flex;align-items:center;gap:6px;font-weight:500;font-size:12px;margin-bottom:8px"><span style="font-size:14px;line-height:1">🐦🐦</span> Birdies consecutivos <span style="font-weight:400;color:#aaa;font-size:10px;margin-left:4px">· mismo partido · todos los contextos</span></div>';
  birdiesConsecData.forEach((p,i) => {
    const info = p.fecha ? fFecha(p.fecha)+' · '+p.campo+' · '+p.ctx : '—';
    h += '<div style="display:flex;align-items:center;gap:8px;padding:7px 10px;background:'+(i===0?'#f0fdf4':'#fff')+';border-radius:7px;margin-bottom:4px;border:1px solid #eee">'
      +'<div style="width:26px;height:26px;border-radius:5px;background:'+(COLORS[p.jugador]||'#eee')+';display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;color:#333;flex-shrink:0">'+p.jugador.slice(0,3)+'</div>'
      +'<div style="flex:1;font-weight:500;font-size:12px">'+p.jugador+'</div>'
      +'<div style="font-size:10px;color:#aaa;margin-right:4px">'+info+'</div>'
      +'<div style="font-weight:700;font-size:16px;color:#15803d;min-width:28px;text-align:right">'+p.best+'</div>'
      +'</div>';
  });
  h += '</div>'; // cierra sección Birdies consecutivos
  }

  // ── 3) Partidos seguidos haciendo birdie (🐦⛳) ───────────────────────
  h += '<div style="margin-bottom:18px">';
  h += '<div style="display:flex;align-items:center;gap:6px;font-weight:500;font-size:12px;margin-bottom:8px"><span style="font-size:14px;line-height:1">🐦⛳</span> Partidos seguidos haciendo birdie <span style="font-weight:400;color:#aaa;font-size:10px;margin-left:4px">· todos los contextos · por fecha</span></div>';
  partBirdieData.forEach((p,i) => {
    const actualColor = p.actual>0 ? '#15803d' : '#ccc';
    const rango = p.desde ? fFecha(p.desde) + (p.hasta && +p.hasta!==+p.desde ? '→'+fFecha(p.hasta) : '') : '—';
    h += '<div style="display:flex;align-items:center;gap:8px;padding:7px 10px;background:'+(i===0?'#f0fdf4':'#fff')+';border-radius:7px;margin-bottom:4px;border:1px solid #eee">'
      +'<div style="width:26px;height:26px;border-radius:5px;background:'+(COLORS[p.jugador]||'#eee')+';display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;color:#333;flex-shrink:0">'+p.jugador.slice(0,3)+'</div>'
      +'<div style="flex:1;font-weight:500;font-size:12px">'+p.jugador+'</div>'
      +'<div style="font-size:10px;color:#aaa;margin-right:4px">'+rango+'</div>'
      +'<div style="display:flex;align-items:baseline;gap:4px">'
        +'<div style="font-weight:700;font-size:16px;color:#15803d;min-width:28px;text-align:right">'+p.best+'</div>'
        +'<div style="font-weight:600;font-size:11px;color:'+actualColor+';min-width:16px;text-align:right">'+p.actual+'</div>'
      +'</div>'
      +'</div>';
  });
  h += '</div>'; // cierra sección Partidos seguidos haciendo birdie

  // ── Partidos seguidos sin doble bogey (todos los contextos) ──────────
  // Doble bogey = hoyo ≥5 (par 3). Una actuación con dbl>0 rompe la racha.
  // Se cuenta sobre actuaciones reales (no abandonos) desde 01/01/2026,
  // ordenadas por fecha. Mejor racha histórica + racha actual (cola).
  function rachaSinDobleBogey(jugador){
    const acts = _recopilarActuacionesGlobal(jugador)
      .filter(a => !a.abandono && a.fecha instanceof Date && a.fecha >= FECHA_INICIO_GLOBAL_CALC && typeof a.dbl === 'number' && !_campoExcluido(a.campo))
      .sort((a,b) => a.fecha - b.fecha);
    if(!acts.length) return { jugador, best:0, desde:null, hasta:null, actual:0 };
    let maxBest=0, maxDesde=null, maxHasta=null, cur=0, curDesde=null;
    acts.forEach(a => {
      if(a.dbl === 0){
        cur++;
        if(cur===1) curDesde=a.fecha;
        if(cur>maxBest){ maxBest=cur; maxDesde=curDesde; maxHasta=a.fecha; }
      } else cur=0;
    });
    if(!maxBest) return { jugador, best:0, desde:null, hasta:null, actual:0 };
    let actual=0;
    for(let i=acts.length-1; i>=0; i--){ if(acts[i].dbl === 0) actual++; else break; }
    return { jugador, best:maxBest, desde:maxDesde, hasta:maxHasta, actual };
  }
  const sinDblBogeyData = PLAYERS.map(rachaSinDobleBogey).filter(Boolean)
    .sort((a,b) => b.best - a.best || a.jugador.localeCompare(b.jugador));
  h += '<div style="margin-bottom:18px">';
  h += '<div style="display:flex;align-items:center;gap:6px;font-weight:500;font-size:12px;margin-bottom:8px"><span style="font-size:14px;line-height:1">🚫5️⃣</span> Partidos seguidos sin doble bogey <span style="font-weight:400;color:#aaa;font-size:10px;margin-left:4px">· todos los contextos · por fecha</span></div>';
  if(!sinDblBogeyData.length){
    h += '<div style="font-size:11px;color:#aaa;padding:8px">Sin datos.</div>';
  } else {
    sinDblBogeyData.forEach((p,i) => {
      const actualColor = p.actual>0 ? '#7c3aed' : '#ccc';
      const rango = p.desde ? fFecha(p.desde) + (p.hasta && +p.hasta!==+p.desde ? '→'+fFecha(p.hasta) : '') : '—';
      h += '<div style="display:flex;align-items:center;gap:8px;padding:7px 10px;background:'+(i===0?'#f5f3ff':'#fff')+';border-radius:7px;margin-bottom:4px;border:1px solid #eee">'
        +'<div style="width:26px;height:26px;border-radius:5px;background:'+(COLORS[p.jugador]||'#eee')+';display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;color:#333;flex-shrink:0">'+p.jugador.slice(0,3)+'</div>'
        +'<div style="flex:1;font-weight:500;font-size:12px">'+p.jugador+'</div>'
        +'<div style="font-size:10px;color:#aaa;margin-right:4px">'+rango+'</div>'
        +'<div style="display:flex;align-items:baseline;gap:4px">'
          +'<div style="font-weight:700;font-size:16px;color:#7c3aed;min-width:28px;text-align:right">'+p.best+'</div>'
          +'<div style="font-weight:600;font-size:11px;color:'+actualColor+';min-width:16px;text-align:right">'+p.actual+'</div>'
        +'</div>'
        +'</div>';
    });
  }
  h += '</div>'; // cierra sección Partidos seguidos sin doble bogey


  // ── Más pares o mejor en un partido (3️⃣⛳) ──────────────────────────
  // Par o mejor = hoyo <=3 (par, birdie, hoyo en uno). Mejor ronda de cada jugador + fecha/campo/contexto.
  const masParesData = PLAYERS.map(jugador => {
    const acts = _recopilarActuacionesGlobal(jugador)
      .filter(a => !a.abandono && a.fecha instanceof Date && a.fecha >= FECHA_INICIO_GLOBAL_CALC && Array.isArray(a.hoyos) && !_campoExcluido(a.campo))
      .map(a => ({ ...a, pares: a.hoyos.filter(v => v<=3).length }));
    if(!acts.length) return { jugador, best:0, fecha:null, campo:null, ctx:null };
    let mejor = acts[0];
    acts.forEach(a => { if(a.pares > mejor.pares || (a.pares===mejor.pares && a.fecha>mejor.fecha)) mejor = a; });
    return { jugador, best:mejor.pares, fecha:mejor.fecha, campo:mejor.campo||'—', ctx:CTX_LABEL[mejor.src]||mejor.src };
  }).sort((a,b) => b.best - a.best || a.jugador.localeCompare(b.jugador));
  h += '<div style="margin-bottom:18px">';
  h += '<div style="display:flex;align-items:center;gap:6px;font-weight:500;font-size:12px;margin-bottom:8px"><span style="font-size:14px;line-height:1">3️⃣⛳</span> Más pares o mejor en un partido <span style="font-weight:400;color:#aaa;font-size:10px;margin-left:4px">· todos los contextos</span></div>';
  masParesData.forEach((p,i) => {
    const info = p.fecha ? fFecha(p.fecha)+' · '+p.campo+' · '+p.ctx : '—';
    h += '<div style="display:flex;align-items:center;gap:8px;padding:7px 10px;background:'+(i===0?'#ecfeff':'#fff')+';border-radius:7px;margin-bottom:4px;border:1px solid #eee">'
      +'<div style="width:26px;height:26px;border-radius:5px;background:'+(COLORS[p.jugador]||'#eee')+';display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;color:#333;flex-shrink:0">'+p.jugador.slice(0,3)+'</div>'
      +'<div style="flex:1;font-weight:500;font-size:12px">'+p.jugador+'</div>'
      +'<div style="font-size:10px;color:#aaa;margin-right:4px">'+info+'</div>'
      +'<div style="font-weight:700;font-size:16px;color:#0891b2;min-width:28px;text-align:right">'+p.best+'</div>'
      +'</div>';
  });
  h += '</div>'; // cierra sección Más pares o mejor en un partido


  // ── Hole in one (todos los contextos) ────────────────────────────────
  // Detección automática: cualquier hoyo con valor 1 en cualquier actuación
  // (no abandono, desde 01/01/2026). Si no hay ninguno, estado vacío.
  const acesList = [];
  PLAYERS.forEach(jugador => {
    _recopilarActuacionesGlobal(jugador)
      .filter(a => !a.abandono && a.fecha instanceof Date && a.fecha >= FECHA_INICIO_GLOBAL_CALC && Array.isArray(a.hoyos) && !_campoExcluido(a.campo))
      .forEach(a => {
        a.hoyos.forEach((v, idx) => {
          if(v === 1) acesList.push({ jugador, fecha:a.fecha, campo:a.campo||'—', ctx:CTX_LABEL[a.src]||a.src, hoyo:idx+1 });
        });
      });
  });
  acesList.sort((a,b) => b.fecha - a.fecha);
  h += '<div style="margin-bottom:18px">';
  h += '<div style="display:flex;align-items:center;gap:6px;font-weight:500;font-size:12px;margin-bottom:8px"><span style="font-size:15px;line-height:1">⭐</span> Hole in one <span style="font-weight:400;color:#aaa;font-size:10px;margin-left:4px">· todos los contextos</span></div>';
  if(!acesList.length){
    h += '<div style="font-size:11px;color:#aaa;padding:8px">Todavía nadie ha hecho hoyo en uno. Cuando ocurra, aparecerá aquí automáticamente.</div>';
  } else {
    acesList.forEach(a => {
      h += '<div style="display:flex;align-items:center;gap:10px;padding:7px 10px;background:#fffbeb;border-radius:7px;margin-bottom:4px;border:1px solid #fde68a">'
        +'<div style="width:26px;height:26px;border-radius:5px;background:'+(COLORS[a.jugador]||'#eee')+';display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;color:#333;flex-shrink:0">'+a.jugador.slice(0,3)+'</div>'
        +'<div style="font-weight:500;font-size:12px;min-width:80px">'+a.jugador+'</div>'
        +'<div style="font-size:11px;color:#555">hoyo <b>'+a.hoyo+'</b> · '+a.campo+' · '+a.ctx+' · '+fFecha(a.fecha)+'</div>'
        +'</div>';
    });
  }
  h += '</div>'; // cierra sección Hole in one

  // ── Partidos jugados: TRASLADADO a la pestaña 🗃️ Miscelánea (renderMiscelania) ──

  // ── Abandonos (todos los contextos salvo Super ROC) ──────────────────
  // Lee del array manual ABANDONOS_GLOBAL. Decorativo: no afecta a nada.
  if(typeof ABANDONOS_GLOBAL !== 'undefined' && ABANDONOS_GLOBAL.length > 0){
    h += '<div style="margin-bottom:18px">';
    h += '<div style="font-weight:500;font-size:12px;margin-bottom:4px;display:flex;align-items:center;gap:6px"><span style="font-size:15px;line-height:1">💩</span> Abandonos <span style="font-size:10px;color:#888;font-weight:400">(no afectan a ninguna estadística)</span></div>';
    ABANDONOS_GLOBAL.forEach(a => {
      h += '<div style="display:flex;align-items:center;gap:10px;padding:7px 10px;background:#fff;border-radius:7px;margin-bottom:4px;border:1px solid #eee">'
        +'<div style="width:26px;height:26px;border-radius:5px;background:'+(COLORS[a.jugador]||'#eee')+';display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;color:#333;flex-shrink:0">'+a.jugador.slice(0,3)+'</div>'
        +'<div style="font-weight:500;font-size:12px;min-width:80px">'+a.jugador+'</div>'
        +'<div style="font-size:11px;color:#555">abandonó · <b>'+a.campo+'</b> · '+a.ctx+' · '+a.f+'</div>'
        +'</div>';
    });
    h += '</div>';
  }

  h += '</div>'; // cierra ent-wrap
  el.innerHTML = h;
}

function renderHandicap(el){
  const sorted=[...PLAYERS].filter(p=>HCP_DATA[p]).sort((a,b)=>HCP_DATA[a].current-HCP_DATA[b].current);

  let h=`<div style="font-weight:500;color:#555;margin-bottom:8px;font-size:12px">Clasificación actual</div>`;
  const droppingResult={};
  sorted.forEach(q=>{
    const games=RAW_DATA.filter(r=>r.jugador===q).sort((a,b)=>a.j-b.j);
    const dropIdx=games.length-10;
    droppingResult[q]=dropIdx>=0?games[dropIdx]:null;
  });

  // Solo puntúan en la clasificación quienes lleven >=10 partidos.
  // Los demás se muestran al final, atenuados y sin posición, con su media provisional.
  const conMedia=sorted.filter(p=>HCP_DATA[p].n>=10);
  const sinMedia=sorted.filter(p=>HCP_DATA[p].n<10);

  const filaHcp=(p,pos,provisional)=>{
    const d=HCP_DATA[p];
    const medal=provisional?'':(pos===0?'🥇':pos===1?'🥈':pos===2?'🥉':'');
    const hcpColor=provisional?'#9ca3af':(d.current<=5?'#15803d':d.current<=8?'#0e7490':d.current<=11?'#c2410c':'#991b1b');
    const hist=d.history.filter(x=>x.hcp!==null);
    const trend=hist.length>=2?hist[hist.length-1].hcp-hist[hist.length-2].hcp:0;
    const trendTxt=trend<-0.3?`▼ ${Math.abs(trend).toFixed(1)}`:trend>0.3?`▲ ${trend.toFixed(1)}`:'—';
    const trendColor=trend<-0.3?'#15803d':trend>0.3?'#b91c1c':'#aaa';
    const drop=droppingResult[p];
    const dropTxt=drop?(drop.total>=0?'+'+drop.total:''+drop.total):null;
    const dropLabel=dropTxt?' ('+dropTxt+')':'';
    const sub=provisional
      ? `${d.n}/10 partidas · media provisional`
      : `${d.n} partidos · mejor ${d.best>=0?'+'+d.best:d.best} (${d.best_f})`;
    const bg=provisional?'#fff':(pos<3?'#f0fdfa':'#fff');
    return `<div onclick="window.__mostrarTarjetasSR('${p}')" style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:${bg};border-radius:9px;margin-bottom:5px;border:1px solid #e5e7eb;cursor:pointer;opacity:${provisional?'0.55':'1'};transition:transform 0.1s,box-shadow 0.1s" onmouseenter="this.style.transform='translateX(2px)';this.style.boxShadow='0 2px 6px rgba(0,0,0,0.08)'" onmouseleave="this.style.transform='translateX(0)';this.style.boxShadow='none'">
      <div style="width:22px;font-size:13px;text-align:center;color:#bbb">${provisional?'·':(medal||pos+1)}</div>
      <div style="width:28px;height:28px;border-radius:5px;background:${COLORS[p]||'#eee'};display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;color:#333;flex-shrink:0">${p.slice(0,3)}</div>
      <div style="flex:1"><div style="font-weight:500;font-size:11px">${p}</div><div style="font-size:10px;color:#aaa">${sub}</div></div>
      <div style="font-size:18px;font-weight:500;color:${hcpColor};min-width:42px;text-align:right">${d.current>=0?'+'+d.current.toFixed(1):d.current.toFixed(1)}</div>
      <div style="font-size:11px;font-weight:500;color:${provisional?'#ccc':trendColor};text-align:right">${provisional?'—':trendTxt}<span style="font-size:10px;color:#aaa;font-weight:400">${provisional?'':dropLabel}</span></div>
    </div>`;
  };

  conMedia.forEach((p,i)=>{ h+=filaHcp(p,i,false); });
  if(sinMedia.length){
    h+=`<div style="font-size:10px;color:#aaa;margin:10px 0 5px">Sin hándicap todavía · no puntúan hasta las 10 partidas</div>`;
    sinMedia.forEach(p=>{ h+=filaHcp(p,null,true); });
  }
  // Jornadas como número 1 — calculado desde HCP_DATA history
  const todasJornadas=[...new Set(RAW_DATA.map(r=>r.j))].sort((a,b)=>a-b);
  // J_INICIO: primera jornada en que al menos 3 jugadores han completado 10 partidos
  let J_INICIO=todasJornadas[0];
  for(const j of todasJornadas){
    const con10=PLAYERS.filter(p=>RAW_DATA.filter(r=>r.jugador===p&&r.j<=j).length>=10).length;
    if(con10>=3){J_INICIO=j;break;}
  }
  const jornadasValidas=todasJornadas.filter(j=>j>=J_INICIO);

  // Usamos SOLO el hcp exacto del history en esa jornada (no interpolamos)
  // Si un jugador no tiene punto en esa jornada, usamos el último anterior
  // PERO solo si tiene al menos 10 partidos jugados hasta esa jornada
  function hcpEnJornada(jugador,j){
    const hist=(HCP_DATA[jugador]?.history||[]).filter(h=>h.hcp!==null).sort((a,b)=>a.j-b.j);
    // Necesita haber jugado al menos 10 partidos hasta esa jornada
    const partidosHasta=RAW_DATA.filter(r=>r.jugador===jugador&&r.j<=j).length;
    if(partidosHasta<10)return null;
    let ultimo=null;
    for(const h of hist){if(h.j<=j)ultimo=h.hcp;else break;}
    return ultimo;
  }

  const numUnoMap={};
  const historialN1SR=[];
  jornadasValidas.forEach(j=>{
    let minHcp=Infinity;
    PLAYERS.forEach(p=>{
      const h=hcpEnJornada(p,j);
      if(h!==null&&Math.round(h*100)<Math.round(minHcp*100))minHcp=h;
    });
    if(minHcp===Infinity)return;
    const minRound=Math.round(minHcp*100);
    const n1sJor=[];
    PLAYERS.forEach(p=>{
      const h=hcpEnJornada(p,j);
      if(h!==null&&Math.round(h*100)===minRound){
        if(!numUnoMap[p])numUnoMap[p]={actual:[]};
        numUnoMap[p].actual.push(j);
        n1sJor.push(p);
      }
    });
    const fechaJ=(RAW_DATA.find(r=>r.j===j)||{}).f||'';
    historialN1SR.push({j,n1s:n1sJor,hcp:minHcp,fecha:fechaJ});
  });

  const numUnoCalc=Object.entries(numUnoMap).map(([jugador,d])=>{
    const js=d.actual.sort((a,b)=>a-b);
    // Racha máxima histórica
    let maxConsec=1,cur=1;
    for(let i=1;i<js.length;i++){
      const idxA=todasJornadas.indexOf(js[i-1]);
      const idxB=todasJornadas.indexOf(js[i]);
      if(idxB===idxA+1){cur++;maxConsec=Math.max(maxConsec,cur);}
      else cur=1;
    }
    // Racha actual (desde el final hacia atrás)
    let actualConsec=1;
    for(let i=js.length-1;i>0;i--){
      const idxA=todasJornadas.indexOf(js[i-1]);
      const idxB=todasJornadas.indexOf(js[i]);
      if(idxB===idxA+1)actualConsec++;
      else break;
    }
    // Si la última jornada como nº1 no es la última jornada disputada, racha actual=0
    const ultimaJornada=todasJornadas[todasJornadas.length-1];
    if(js[js.length-1]!==ultimaJornada)actualConsec=0;
    const desde='J'+js[0];
    const hasta='J'+js[js.length-1];
    return{jugador,jornadas:js.length,maxConsec,actualConsec,desde,hasta};
  }).sort((a,b)=>b.jornadas-a.jornadas);

  // Card del nº 1 ACTUAL del SR (HCP SR más bajo hoy)
  const ordenadosHoySR = PLAYERS
    .map(p => ({ jugador:p, hcp: HCP_DATA[p]?.current ?? null, n: HCP_DATA[p]?.n || 0 }))
    .filter(d => d.hcp !== null && d.n >= 10)
    .sort((a,b) => a.hcp - b.hcp);
  const n1HoySR = ordenadosHoySR[0];
  if(n1HoySR){
    const datosN1SR = numUnoCalc.find(p => p.jugador === n1HoySR.jugador);
    const jornadasN1HoySR = datosN1SR?.jornadas ?? 0;
    const recordConsecSR = datosN1SR?.maxConsec ?? 0;
    h += `<div style="margin:16px 0 10px;padding:14px 16px;background:linear-gradient(135deg, #fef9c3, #fef3c7);border:1px solid #fde68a;border-radius:12px;display:flex;align-items:center;gap:14px">`;
    h += `<div style="font-size:30px;line-height:1">👑</div>`;
    h += `<div style="flex:1">`;
    h += `<div style="font-size:10px;color:#854d0e;font-weight:600;text-transform:uppercase;letter-spacing:0.6px">Nº 1 actual</div>`;
    h += `<div style="font-size:18px;font-weight:700;color:#1a1a1a;margin-top:2px">${n1HoySR.jugador} <span style="font-size:13px;color:#854d0e;font-weight:500">· HCP ${(n1HoySR.hcp>=0?'+':'')+n1HoySR.hcp.toFixed(2)}</span></div>`;
    h += `<div style="font-size:11px;color:#92400e;margin-top:2px;font-weight:600">${jornadasN1HoySR} (${recordConsecSR})</div>`;
    h += `</div>`;
    h += `</div>`;
  }

  h += `<div style="margin:0 0 14px"><div style="font-weight:500;color:#555;margin:8px 0 6px;font-size:12px"><span onclick="window._showHistoricoN1SRPopup()" style="cursor:pointer;text-decoration:underline;color:#1e3a8a" title="Ver jornada a jornada">HISTÓRICO</span> <span style="font-size:10px;color:#aaa;font-weight:400">(desde J${J_INICIO})</span></div>`;
  const otrosSR = numUnoCalc.filter(p => !n1HoySR || p.jugador !== n1HoySR.jugador);
  if(otrosSR.length === 0){
    h += `<div style="font-size:11px;color:#9ca3af;padding:6px 0">Aún no ha sido nº1 nadie más.</div>`;
  } else {
    otrosSR.forEach(p => {
      h += `<div style="display:flex;align-items:center;gap:8px;padding:6px 10px;background:#fff;border-radius:8px;margin-bottom:3px;border:1px solid #e5e7eb;font-size:12px">
        <div style="width:22px;height:22px;border-radius:5px;background:${COLORS[p.jugador]||'#eee'};display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;color:#333;flex-shrink:0">${p.jugador.slice(0,3)}</div>
        <div style="flex:1;font-weight:500">${p.jugador}</div>
        <div style="font-weight:700;color:#0f766e">${p.jornadas} <span style="font-weight:400;color:#888;font-size:11px">(${p.maxConsec})</span></div>
      </div>`;
    });
  }
  h += '</div>';

  // ───────── Popup: histórico jornada a jornada del nº 1 SR ─────────
  const filasHistoricoSR = historialN1SR.slice().reverse().map((row, i) => {
    const jug = row.n1s.join(' & ');
    const colorTile = COLORS[row.n1s[0]] || '#eee';
    const hcpStr = (row.hcp >= 0 ? '+' : '') + row.hcp.toFixed(2);
    const bg = i % 2 === 0 ? '#fef9c3' : '#fff';
    const etiquetaIzq = row.fecha ? `J${row.j} · ${row.fecha}` : `J${row.j}`;
    return `<div style="display:flex;align-items:center;gap:10px;padding:8px 10px;background:${bg};border-radius:8px;margin-bottom:4px;border:1px solid #fde68a44">
      <div style="font-size:11px;color:#666;font-family:monospace;min-width:104px">${etiquetaIzq}</div>
      <div style="width:22px;height:22px;border-radius:5px;background:${colorTile};display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;color:#333;flex-shrink:0">${row.n1s[0].slice(0,3)}</div>
      <div style="flex:1;font-size:12px;font-weight:600;color:#1a1a1a">${jug}</div>
      <div style="font-size:12px;font-weight:700;color:#854d0e;font-family:monospace">${hcpStr}</div>
    </div>`;
  }).join('');
  h += `<div id="historico-n1-sr-popup" onclick="this.style.display='none'" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:9999;align-items:center;justify-content:center">
    <div onclick="event.stopPropagation()" style="background:#fff;border-radius:16px;padding:20px;max-width:420px;width:90%;max-height:80vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,0.3)">
      <div style="font-weight:700;font-size:14px;color:#1a1a1a;margin-bottom:14px">👑 Nº 1 SR — jornada a jornada</div>
      <div style="max-height:400px;overflow-y:auto;padding-right:4px">${filasHistoricoSR || '<div style="font-size:12px;color:#9ca3af;padding:10px 0">Aún no hay datos.</div>'}</div>
      <div onclick="document.getElementById('historico-n1-sr-popup').style.display='none'" style="margin-top:14px;text-align:center;padding:8px;background:#f3f4f6;border-radius:8px;font-size:12px;color:#555;cursor:pointer">Cerrar</div>
    </div>
  </div>`;
  window._showHistoricoN1SRPopup = function(){ const p=document.getElementById('historico-n1-sr-popup'); if(p) p.style.display='flex'; };
  // ── Panel análisis records al final ──
  const ultimaJ=Math.max(...RAW_DATA.map(r=>r.j));
  const fechaUltimaJ=(RAW_DATA.find(r=>r.j===ultimaJ)||{}).f||'';
  h+=`<div style="margin-top:18px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:12px 14px">
    <div style="font-weight:600;font-size:12px;color:#1e3a8a;margin-bottom:8px">🔍 Novedades en records — J${ultimaJ} · ${fechaUltimaJ}</div>
    <div id="analisis-records-panel" style="font-size:12px;color:#aaa">Calculando…</div>
  </div>`;

  el.innerHTML='<div style="max-width:600px">'+h+'</div>';
  setTimeout(window._analisisRecords,50);
}

function renderBitacora(el){
  // Helpers (reutilizamos los mismos de calcAnalisisRecords)
  function getPares(jugador,j,hmObj){const s=hmObj[j+'_'+jugador];return s?s.filter(v=>v<=3).length:0;}
  function bestParesHist(jugador,rawData,hmObj){let max=0;rawData.filter(r=>r.jugador===jugador).forEach(r=>{const p=getPares(jugador,r.j,hmObj);if(p>max)max=p;});return max;}
  function bestRachaPar(jugador,rawData,hmObj){const PAR=PAR_HOYO;const partidas=rawData.filter(r=>r.jugador===jugador).sort((a,b)=>a.j-b.j);let maxR=0,cur=0;partidas.forEach(p=>{const scores=hmObj[p.j+'_'+jugador];if(!scores)return;scores.forEach(v=>{if(v===null)return;if(v<=PAR){cur++;if(cur>maxR)maxR=cur;}else cur=0;});});return maxR;}
  function bestRachaSinDbl(jugador,rawData){const partidas=rawData.filter(r=>r.jugador===jugador).sort((a,b)=>a.j-b.j);let maxR=0,cur=0;partidas.forEach(p=>{if(p.total<10){cur++;if(cur>maxR)maxR=cur;}else cur=0;});return maxR;}
  function getRanking(arr){const sorted=[...arr].sort((a,b)=>b.val-a.val);const rank={};sorted.forEach((x,i)=>rank[x.jugador]=i);return rank;}

  // Calcular análisis para cada jornada
  const todasJornadas=[...new Set(RAW_DATA.map(r=>r.j))].sort((a,b)=>a-b);

  function analisisJornada(j){
    const rawJ_all=RAW_DATA.filter(r=>r.j===j);
    const fecha=rawJ_all[0]?.f||'';
    const jugadoresJ=new Set(rawJ_all.map(r=>r.jugador));
    const RAW_prev=RAW_DATA.filter(r=>r.j<j);
    const HM_prev={};Object.keys(HM_DATA).forEach(k=>{if(parseInt(k.split('_')[0])<j)HM_prev[k]=HM_DATA[k];});
    const RAW_hasta=RAW_DATA.filter(r=>r.j<=j);
    const HM_hasta={};Object.keys(HM_DATA).forEach(k=>{if(parseInt(k.split('_')[0])<=j)HM_hasta[k]=HM_DATA[k];});

    const alertas=[];

    jugadoresJ.forEach(jugador=>{
      const rawJug=RAW_DATA.find(r=>r.j===j&&r.jugador===jugador);
      if(!rawJug)return;

      // Score
      const prevBest=RAW_prev.filter(r=>r.jugador===jugador).reduce((m,r)=>Math.min(m,r.total),Infinity);
      if(rawJug.total<prevBest&&prevBest!==Infinity){
        const mejorAbs=RAW_prev.reduce((m,r)=>Math.min(m,r.total),Infinity);
        const exH=PLAYERS.filter(x=>x!==jugador).map(x=>({x,v:RAW_prev.filter(r=>r.jugador===x).reduce((m,r)=>Math.min(m,r.total),Infinity)})).sort((a,b)=>a.v-b.v)[0];
        const ref=exH&&exH.v===prevBest?`${prevBest>=0?'+'+prevBest:prevBest} ${exH.x}`:`${prevBest>=0?'+'+prevBest:prevBest}`;
        if(rawJug.total<mejorAbs) alertas.push({p:0,tipo:'✅ Récord absoluto',jugador,msg:`Nuevo récord absoluto de score: <b>${rawJug.total>=0?'+'+rawJug.total:rawJug.total}</b> (${ref})`});
        else alertas.push({p:2,tipo:'📊 Marca personal',jugador,msg:`Bate su marca personal de score: <b>${rawJug.total>=0?'+'+rawJug.total:rawJug.total}</b> (${ref})`});
      }

      // Pares
      const prevP=bestParesHist(jugador,RAW_prev,HM_prev);
      const nuevoP=getPares(jugador,j,HM_hasta);
      if(nuevoP>prevP){
        const absP=Math.max(0,...PLAYERS.map(x=>bestParesHist(x,RAW_prev,HM_prev)));
        const exH=PLAYERS.filter(x=>x!==jugador).map(x=>({x,v:bestParesHist(x,RAW_prev,HM_prev)})).sort((a,b)=>b.v-a.v)[0];
        const ref=exH&&exH.v===prevP?`${prevP} ${exH.x}`:`${prevP}`;
        if(nuevoP>absP) alertas.push({p:0,tipo:'✅ Récord absoluto',jugador,msg:`Récord absoluto pares en ronda: <b>${nuevoP}</b> (${ref})`});
        else alertas.push({p:2,tipo:'📊 Marca personal',jugador,msg:`Marca personal pares en ronda: <b>${nuevoP}</b> (${ref})`});
      }

      // Racha pares o mejor
      const prevRP=bestRachaPar(jugador,RAW_prev,HM_prev);
      const nuevoRP=bestRachaPar(jugador,RAW_hasta,HM_hasta);
      if(nuevoRP>prevRP){
        const absRP=Math.max(0,...PLAYERS.map(x=>bestRachaPar(x,RAW_prev,HM_prev)));
        const exH=PLAYERS.filter(x=>x!==jugador).map(x=>({x,v:bestRachaPar(x,RAW_prev,HM_prev)})).sort((a,b)=>b.v-a.v)[0];
        const ref=exH&&exH.v===prevRP?`${prevRP} ${exH.x}`:`${prevRP}`;
        if(nuevoRP>absRP) alertas.push({p:0,tipo:'✅ Récord absoluto',jugador,msg:`Récord absoluto racha pares o mejor: <b>${nuevoRP}</b> hoyos (${ref})`});
        else alertas.push({p:2,tipo:'📊 Marca personal',jugador,msg:`Marca personal racha pares o mejor: <b>${nuevoRP}</b> hoyos (${ref})`});
      }

      // Racha sin doble dígito
      const prevRD=bestRachaSinDbl(jugador,RAW_prev);
      const nuevoRD=bestRachaSinDbl(jugador,RAW_hasta);
      if(nuevoRD>prevRD){
        const absRD=Math.max(0,...PLAYERS.map(x=>bestRachaSinDbl(x,RAW_prev)));
        const exH=PLAYERS.filter(x=>x!==jugador).map(x=>({x,v:bestRachaSinDbl(x,RAW_prev)})).sort((a,b)=>b.v-a.v)[0];
        const ref=exH&&exH.v===prevRD?`${prevRD} ${exH.x}`:`${prevRD}`;
        if(nuevoRD>absRD) alertas.push({p:0,tipo:'✅ Récord absoluto',jugador,msg:`Récord absoluto racha sin doble dígito: <b>${nuevoRD}</b> jornadas (${ref})`});
        else alertas.push({p:2,tipo:'📊 Marca personal',jugador,msg:`Marca personal racha sin doble dígito: <b>${nuevoRD}</b> jornadas (${ref})`});
      }
    });

    // Adelantamientos
    const apartados=[
      {nombre:'Pares o mejor en ronda',fn:(jug,raw,hm)=>bestParesHist(jug,raw,hm),usaHM:true},
      {nombre:'Racha pares o mejor',fn:(jug,raw,hm)=>bestRachaPar(jug,raw,hm),usaHM:true},
      {nombre:'Racha sin doble dígito',fn:(jug,raw)=>bestRachaSinDbl(jug,raw),usaHM:false},
    ];
    apartados.forEach(({nombre,fn,usaHM})=>{
      const antes=PLAYERS.filter(x=>HCP_DATA[x]).map(x=>({jugador:x,val:usaHM?fn(x,RAW_prev,HM_prev):fn(x,RAW_prev)}));
      const despues=PLAYERS.filter(x=>HCP_DATA[x]).map(x=>({jugador:x,val:usaHM?fn(x,RAW_hasta,HM_hasta):fn(x,RAW_hasta)}));
      const rA=getRanking(antes),rD=getRanking(despues);
      jugadoresJ.forEach(jug=>{
        if(!HCP_DATA[jug])return;
        if(rD[jug]<rA[jug]){
          const valJug=despues.find(x=>x.jugador===jug).val;
          const adelantados=PLAYERS.filter(x=>HCP_DATA[x]&&x!==jug&&rA[x]<=rA[jug]&&rD[x]>rD[jug]);
          if(adelantados.length){
            const str=adelantados.map(x=>`<b>${x}</b> (${despues.find(d=>d.jugador===x).val})`).join(', ');
            alertas.push({p:1,tipo:'⬆️ Adelantamiento',jugador:jug,msg:`En <i>${nombre}</i> con <b>${valJug}</b> adelanta a: ${str}`});
          }
        }
      });
    });

    alertas.sort((a,b)=>a.p-b.p);

    // Clasificación HCP en esta jornada
    const hcpEnJ={};
    PLAYERS.forEach(jug=>{
      const d=HCP_DATA[jug];
      if(!d)return;
      const hist=[...d.history].filter(x=>x.j<=j);
      if(hist.length) hcpEnJ[jug]=hist[hist.length-1].hcp;
    });
    const clasificacion=Object.entries(hcpEnJ).sort((a,b)=>a[1]-b[1]);

    // Jugadores que jugaron / no jugaron
    const jugaron=[...rawJ_all.map(r=>r.jugador)];
    const noJugaron=PLAYERS.filter(p=>HCP_DATA[p]&&!jugaron.includes(p));

    return{j,fecha,alertas,clasificacion,jugaron,noJugaron};
  }

  function renderClasificacionCompleta(j){
    const isLatest=(j===Math.max(...RAW_DATA.map(r=>r.j)));

    // Calcular HCP en el momento de la jornada j para cada jugador
    function hcpAtJ(jugador,jj){
      const d=HCP_DATA[jugador];
      if(!d)return null;
      const hist=[...d.history].filter(x=>x.hcp!==null&&x.j<=jj);
      if(!hist.length)return null;
      return hist[hist.length-1].hcp;
    }

    // Jugadores con HCP conocido en esta jornada
    const playersWithHcp=PLAYERS.filter(p=>HCP_DATA[p]&&hcpAtJ(p,j)!==null);
    const sorted=[...playersWithHcp].sort((a,b)=>hcpAtJ(a,j)-hcpAtJ(b,j));

    // Partidos jugados hasta j inclusive
    const droppingResult={};
    sorted.forEach(q=>{
      const games=RAW_DATA.filter(r=>r.jugador===q&&r.j<=j).sort((a,b)=>a.j-b.j);
      const dropIdx=games.length-10;
      droppingResult[q]=dropIdx>=0?games[dropIdx]:null;
    });

    const labelClas=isLatest?'Clasificación actual':`Clasificación tras J${j}`;
    let h=`<div style="font-weight:500;color:#555;margin-bottom:8px;font-size:12px">${labelClas}</div>`;
    // Mismo criterio que la pestaña Hándicap SR: solo puntúa quien lleve
    // >=10 partidos EN ESA JORNADA. El resto, al final y sin posición.
    const nHasta=p=>RAW_DATA.filter(r=>r.jugador===p&&r.j<=j).length;
    const conMediaB=sorted.filter(p=>nHasta(p)>=10);
    const sinMediaB=sorted.filter(p=>nHasta(p)<10);

    const filaB=(p,pos,provisional)=>{
      const d=HCP_DATA[p];
      const hcpVal=hcpAtJ(p,j);
      const medal=provisional?'':(pos===0?'🥇':pos===1?'🥈':pos===2?'🥉':'');
      const hcpColor=provisional?'#9ca3af':(hcpVal<=5?'#15803d':hcpVal<=8?'#0e7490':hcpVal<=11?'#c2410c':'#991b1b');
      const histBefore=d.history.filter(x=>x.hcp!==null&&x.j<j);
      const prevHcp=histBefore.length?histBefore[histBefore.length-1].hcp:null;
      const trend=prevHcp!==null?hcpVal-prevHcp:0;
      const trendTxt=trend<-0.3?`▼ ${Math.abs(trend).toFixed(1)}`:trend>0.3?`▲ ${trend.toFixed(1)}`:'—';
      const trendColor=trend<-0.3?'#15803d':trend>0.3?'#b91c1c':'#aaa';
      const nAtJ=nHasta(p);
      const bestAtJ=RAW_DATA.filter(r=>r.jugador===p&&r.j<=j).reduce((m,r)=>Math.min(m,r.total),Infinity);
      const bestStr=bestAtJ===Infinity?'—':(bestAtJ>=0?'+'+bestAtJ:''+bestAtJ);
      const drop=droppingResult[p];
      const dropTxt=drop?(drop.total>=0?'+'+drop.total:''+drop.total):null;
      const dropLabel=dropTxt?' ('+dropTxt+')':'';
      const sub=provisional?`${nAtJ}/10 partidas · media provisional`:`${nAtJ} partidos · mejor ${bestStr}`;
      const bg=provisional?'#fff':(pos<3?'#f0fdfa':'#fff');
      return `<div style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:${bg};border-radius:9px;margin-bottom:5px;border:1px solid #e5e7eb;opacity:${provisional?'0.55':'1'}">
        <div style="width:22px;font-size:13px;text-align:center;color:#bbb">${provisional?'·':(medal||pos+1)}</div>
        <div style="width:28px;height:28px;border-radius:5px;background:${COLORS[p]||'#eee'};display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;color:#333;flex-shrink:0">${p.slice(0,3)}</div>
        <div style="flex:1"><div style="font-weight:500;font-size:11px">${p}</div><div style="font-size:10px;color:#aaa">${sub}</div></div>
        <div style="font-size:18px;font-weight:500;color:${hcpColor};min-width:42px;text-align:right">${hcpVal>=0?'+'+hcpVal.toFixed(1):hcpVal.toFixed(1)}</div>
        <div style="font-size:11px;font-weight:500;color:${provisional?'#ccc':trendColor};text-align:right">${provisional?'—':trendTxt}<span style="font-size:10px;color:#aaa;font-weight:400">${provisional?'':dropLabel}</span></div>
      </div>`;
    };

    conMediaB.forEach((p,i)=>{ h+=filaB(p,i,false); });
    if(sinMediaB.length){
      h+=`<div style="font-size:10px;color:#aaa;margin:10px 0 5px">Sin hándicap todavía · no puntúan hasta las 10 partidas</div>`;
      sinMediaB.forEach(p=>{ h+=filaB(p,null,true); });
    }

    // Jornadas nº1 — calculado hasta la jornada j
    const todasJAll=[...new Set(RAW_DATA.map(r=>r.j))].sort((a,b)=>a-b);
    const todasJHasta=todasJAll.filter(x=>x<=j);
    const J_INICIO=(function(){
      for(const jj of todasJAll){
        const con10=PLAYERS.filter(p=>RAW_DATA.filter(r=>r.jugador===p&&r.j<=jj).length>=10).length;
        if(con10>=3)return jj;
      }
      return todasJAll[0];
    })();
    const jornadasValidas=todasJHasta.filter(x=>x>=J_INICIO);
    function hcpEnJLocal(jugador,jj){
      const hist=(HCP_DATA[jugador]?.history||[]).filter(h=>h.hcp!==null).sort((a,b)=>a.j-b.j);
      const partidos=RAW_DATA.filter(r=>r.jugador===jugador&&r.j<=jj).length;
      if(partidos<10)return null;
      let ultimo=null;
      for(const h of hist){if(h.j<=jj)ultimo=h.hcp;else break;}
      return ultimo;
    }
    const numUnoMap={};
    jornadasValidas.forEach(jj=>{
      let minHcp=Infinity;
      PLAYERS.forEach(p=>{const hh=hcpEnJLocal(p,jj);if(hh!==null&&Math.round(hh*100)<Math.round(minHcp*100))minHcp=hh;});
      if(minHcp===Infinity)return;
      const minR=Math.round(minHcp*100);
      PLAYERS.forEach(p=>{const hh=hcpEnJLocal(p,jj);if(hh!==null&&Math.round(hh*100)===minR){if(!numUnoMap[p])numUnoMap[p]={actual:[]};numUnoMap[p].actual.push(jj);}});
    });
    const ultimaJornada=todasJHasta[todasJHasta.length-1];
    const numUnoCalc=Object.entries(numUnoMap).map(([jugador,d])=>{
      const js=d.actual.sort((a,b)=>a-b);
      let maxConsec=1,cur=1;
      for(let i=1;i<js.length;i++){const iA=todasJAll.indexOf(js[i-1]),iB=todasJAll.indexOf(js[i]);if(iB===iA+1){cur++;maxConsec=Math.max(maxConsec,cur);}else cur=1;}
      let actualConsec=1;
      for(let i=js.length-1;i>0;i--){const iA=todasJAll.indexOf(js[i-1]),iB=todasJAll.indexOf(js[i]);if(iB===iA+1)actualConsec++;else break;}
      if(js[js.length-1]!==ultimaJornada)actualConsec=0;
      return{jugador,jornadas:js.length,maxConsec,actualConsec,desde:'J'+js[0],hasta:'J'+js[js.length-1]};
    }).sort((a,b)=>b.jornadas-a.jornadas);

    h+=`<div style="font-weight:500;color:#555;margin:16px 0 8px;font-size:12px">Jornadas como nº 1 <span style="font-size:10px;color:#aaa;font-weight:400">(desde J${J_INICIO})</span></div>`;
    numUnoCalc.forEach((p,i)=>{
      h+=`<div style="display:flex;align-items:center;gap:8px;padding:7px 10px;background:${i===0?'#f0fdf4':'#fff'};border-radius:9px;margin-bottom:4px;border:1px solid #e5e7eb">
        <div style="width:28px;height:28px;border-radius:5px;background:${COLORS[p.jugador]||'#eee'};display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;color:#333;flex-shrink:0">${p.jugador.slice(0,3)}</div>
        <div style="flex:1;font-weight:500;font-size:11px">${p.jugador}</div>
        <div style="font-size:10px;color:#aaa;margin-right:4px">${p.desde}→${p.hasta}</div>
        <div style="font-weight:700;font-size:16px;color:#0f766e;min-width:28px;text-align:right">${p.jornadas}</div>
        <div style="text-align:right"><div style="font-size:11px;color:#1e40af;font-weight:500">${p.maxConsec} consec. récord</div><div style="font-size:10px;color:#aaa">${p.actualConsec} ahora</div></div>
      </div>`;
    });
    return h;
  }

  // Render
  let h='<div style="max-width:600px">';
  h+=`<div style="font-weight:600;font-size:13px;color:#1a1a1a;margin-bottom:16px">📓 Cuaderno de bitácora — Super ROC</div>`;

  const ultimaJornada=Math.max(...todasJornadas);
  const jornadasInv=[...todasJornadas].reverse();

  jornadasInv.forEach(j=>{
    const{fecha,alertas,clasificacion,jugaron,noJugaron}=analisisJornada(j);

    const tieneNovedades=alertas.length>0;
    const borderColor=tieneNovedades?'#bfdbfe':'#e5e7eb';
    const bgHeader=tieneNovedades?'#1e3a8a':'#6b7280';

    h+=`<div style="border:1px solid ${borderColor};border-radius:12px;margin-bottom:16px;overflow:hidden">`;

    // Cabecera jornada
    const tieneCronica=!!CRONICAS[j];
    h+=`<div style="background:${bgHeader};padding:10px 14px;display:flex;align-items:center;gap:10px">
      <span style="font-size:13px;font-weight:700;color:#fff">J${j}</span>
      <span style="font-size:12px;color:#cbd5e1">${fecha}</span>
      ${tieneCronica?`<span onclick="openCronica(${j})" style="cursor:pointer;font-size:16px;line-height:1;padding:2px 4px;border-radius:4px;background:rgba(255,255,255,0.15);transition:background 0.15s" onmouseover="this.style.background='rgba(255,255,255,0.3)'" onmouseout="this.style.background='rgba(255,255,255,0.15)'" title="Ver crónica">📰</span>`:''}
      <div style="margin-left:auto;display:flex;gap:4px;flex-wrap:wrap">
        ${jugaron.map(jug=>`<span style="font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px;background:${COLORS[jug]||'#eee'};color:#333">${jug}</span>`).join('')}
      </div>
    </div>`;

    // Clasificación — completa para todas las jornadas
    h+=`<div style="padding:10px 14px;border-bottom:1px solid #e5e7eb">${renderClasificacionCompleta(j)}</div>`;

    // Novedades
    if(alertas.length){
      h+=`<div style="padding:10px 14px">`;
      alertas.forEach(a=>{
        const bgAlerta=a.p===0?'#eff6ff':a.p===1?'#f0fdf4':'#fefce8';
        const borderAlerta=a.p===0?'#bfdbfe':a.p===1?'#bbf7d0':'#fde68a';
        h+=`<div style="display:flex;gap:8px;align-items:flex-start;padding:7px 10px;background:${bgAlerta};border:1px solid ${borderAlerta};border-radius:8px;margin-bottom:5px">
          <div style="width:26px;height:26px;border-radius:5px;background:${COLORS[a.jugador]||'#eee'};display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0">${a.jugador.slice(0,3)}</div>
          <div>
            <div style="font-size:10px;font-weight:600;color:#6b7280;margin-bottom:1px">${a.tipo}</div>
            <div style="font-size:11px;color:#111"><b>${a.jugador}</b> — ${a.msg}</div>
          </div>
        </div>`;
      });
      h+=`</div>`;
    } else {
      h+=`<div style="padding:8px 14px;font-size:11px;color:#9ca3af;font-style:italic">Sin novedades en records esta jornada.</div>`;
    }

    // No jugaron
    if(noJugaron.length){
      h+=`<div style="padding:6px 14px 8px;font-size:10px;color:#aaa">❌ No jugaron: ${noJugaron.join(', ')}</div>`;
    }

    h+=`</div>`;
  });

  h+='</div>';
  el.innerHTML=h;
}

// ══════════════════════════════════════════════════════════════════
// ⚡ VERSUS — head-to-head entre dos jugadores.
// Cruza las actuaciones de ambos por fecha exacta (una partida compartida
// = misma fecha en ambos). Gana quien hizo MENOR total ese día; empate si
// igualan. Todo dinámico desde _recopilarActuacionesGlobal (fuente única).
// ══════════════════════════════════════════════════════════════════
const VERSUS_JUGADORES = EQUIPO.map(j => j.apodo);

function _versusFechaKey(a){
  const f = a.fecha instanceof Date ? a.fecha : new Date(a.fecha);
  return isNaN(f) ? String(a.fecha) : f.toISOString().slice(0,10);
}
function _versusFechaTxt(a){
  const f = a.fecha instanceof Date ? a.fecha : new Date(a.fecha);
  if(isNaN(f)) return String(a.fecha);
  const d=String(f.getUTCDate()).padStart(2,'0'), m=String(f.getUTCMonth()+1).padStart(2,'0');
  return `${d}/${m}/${f.getUTCFullYear()}`;
}
// Color de texto legible sobre el pastel de cada jugador
function _versusInk(jug){ return '#1a1a1a'; }

// Empareja actuaciones de A y B por fecha. Devuelve lista de duelos ordenada
// de más reciente a más antigua.
function _versusDuelos(jA, jB){
  if(typeof _recopilarActuacionesGlobal !== 'function') return [];
  // Mismo corte que el HCP Global: solo actuaciones desde 01/01/2026.
  const CORTE = new Date(Date.UTC(2026,0,1));
  const desdeCorte = a => {
    const f = a.fecha instanceof Date ? a.fecha : new Date(a.fecha);
    return !isNaN(f) && f >= CORTE;
  };
  const A = (_recopilarActuacionesGlobal(jA) || []).filter(desdeCorte);
  const B = (_recopilarActuacionesGlobal(jB) || []).filter(desdeCorte);
  // Clave de partida: fecha + fuente + campo. La fuente (src: roc, copa, ent,
  // rkg, ic...) distingue competiciones jugadas el mismo día en el mismo campo
  // (p.ej. un SR y una ronda de Copa ambos en ROC 3). Así cada ronda se empareja
  // solo con la ronda equivalente del rival y no se generan duelos fantasma.
  const pk = a => _versusFechaKey(a) + '|' + (a.src||'') + '|' + (a.campo||'?');
  const mapB = new Map();
  B.forEach(b => { const k=pk(b); if(!mapB.has(k)) mapB.set(k, b); });
  const duelos = [];
  A.forEach(a => {
    const k = pk(a);
    if(mapB.has(k)){
      const b = mapB.get(k);
      const totA = a.abandono ? null : 54 + a.delta;
      const totB = b.abandono ? null : 54 + b.delta;
      let ganador = 'empate';
      if(a.abandono && !b.abandono) ganador = jB;
      else if(b.abandono && !a.abandono) ganador = jA;
      else if(a.abandono && b.abandono) ganador = 'empate';
      else if(totA < totB) ganador = jA;
      else if(totB < totA) ganador = jB;
      duelos.push({
        key:k, fechaTxt:_versusFechaTxt(a),
        campo: a.campo || b.campo || '?',
        src: a.src || b.src || '',
        totA, totB, dA:a.delta, dB:b.delta,
        abdA:!!a.abandono, abdB:!!b.abandono, ganador
      });
    }
  });
  duelos.sort((x,y) => y.key.localeCompare(x.key));
  return duelos;
}

function renderVersus(el){
  // Estado de selección persistente en el propio elemento
  if(!el._vA) el._vA = 'Capi';
  if(!el._vB) el._vB = 'Luiqui';
  _versusPaint(el);
}

function _versusSet(lado, val){
  const el = document.getElementById('tab-versus');
  if(!el) return;
  if(lado==='A') el._vA = val; else el._vB = val;
  _versusPaint(el);
}
function _versusSwap(){
  const el = document.getElementById('tab-versus');
  if(!el) return;
  const t = el._vA; el._vA = el._vB; el._vB = t;
  _versusPaint(el);
}

function _versusPaint(el){
  const jA = el._vA, jB = el._vB;
  const colA = COLORS[jA] || '#eee', colB = COLORS[jB] || '#eee';
  // Paleta de RESULTADO (no de equipo):
  //   selectores/marcador → amarillo neutro (tercer color, evita confusión)
  //   duelos → verde gana / rojo pierde / gris empate
  const V_NEUTRO = '#fef9c3', V_NEUTRO_BD = '#fde68a';   // amarillo clarito
  const V_WIN = '#c8f0dc',  V_WIN_BD = '#4ade80';         // verde
  const V_LOSE = '#f8d0d0', V_LOSE_BD = '#f87171';        // rojo
  const V_TIE = '#e5e7eb',  V_TIE_BD = '#d1d5db';         // gris empate

  const opts = (sel) => VERSUS_JUGADORES.map(j =>
    `<option value="${j}"${j===sel?' selected':''}>${j}</option>`).join('');

  const selectorA = `<div style="position:relative;width:100%">
      <div style="padding:9px 10px;border:2px solid ${V_NEUTRO_BD};border-radius:10px;background:${V_NEUTRO};font-weight:700;font-size:15px;color:#1a1a1a;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${jA} ▾</div>
      <select onchange="_versusSet('A',this.value)" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px">${opts(jA)}</select>
    </div>`;
  const selectorB = `<div style="position:relative;width:100%">
      <div style="padding:9px 10px;border:2px solid ${V_NEUTRO_BD};border-radius:10px;background:${V_NEUTRO};font-weight:700;font-size:15px;color:#1a1a1a;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${jB} ▾</div>
      <select onchange="_versusSet('B',this.value)" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px">${opts(jB)}</select>
    </div>`;

  if(jA === jB){
    el.innerHTML = `
      <div style="max-width:640px;margin:0 auto">
        ${_versusHeaderHtml(selectorA, selectorB)}
        <div style="text-align:center;color:#9ca3af;padding:40px 20px;font-size:14px">
          Elige dos jugadores distintos para ver el cara a cara.
        </div>
      </div>`;
    return;
  }

  const duelos = _versusDuelos(jA, jB);
  const total = duelos.length;
  let winA=0, winB=0, draw=0;
  const porCampo = {};
  duelos.forEach(d => {
    if(d.ganador===jA) winA++; else if(d.ganador===jB) winB++; else draw++;
    if(!porCampo[d.campo]) porCampo[d.campo] = {n:0,a:0,b:0,e:0};
    const pc = porCampo[d.campo]; pc.n++;
    if(d.ganador===jA) pc.a++; else if(d.ganador===jB) pc.b++; else pc.e++;
  });

  // Barra de dominio (proporción de victorias, empates al centro)
  const pctA = total ? (winA/total*100) : 0;
  const pctE = total ? (draw/total*100) : 0;
  const pctB = total ? (winB/total*100) : 0;

  // Mejor resultado de cada uno en estos duelos (delta mínimo)
  let bestA=null, bestB=null;
  duelos.forEach(d => {
    if(!d.abdA && (bestA===null || d.dA<bestA)) bestA=d.dA;
    if(!d.abdB && (bestB===null || d.dB<bestB)) bestB=d.dB;
  });
  const fmtD = v => v===null?'—':(v>0?'+'+v:(v===0?'PAR':''+v));

  // Mejor racha de victorias CONSECUTIVAS de cada uno (el empate corta la racha).
  // duelos viene ordenado de más reciente a más antiguo; recorro en orden
  // cronológico (del más antiguo al más reciente) para que la racha tenga
  // sentido temporal.
  let rachaA=0, rachaB=0, curA=0, curB=0;
  [...duelos].reverse().forEach(d => {
    if(d.ganador===jA){ curA++; curB=0; if(curA>rachaA) rachaA=curA; }
    else if(d.ganador===jB){ curB++; curA=0; if(curB>rachaB) rachaB=curB; }
    else { curA=0; curB=0; } // empate corta ambas
  });

  // Marcador central estilo combate
  const marcador = `
    <div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:18px 0 10px">
      <div style="text-align:center">
        <div style="font-size:44px;font-weight:800;line-height:1;color:#1a1a1a">${winA}</div>
        <div style="font-size:11px;color:#6b7280;margin-top:4px;font-weight:600">${jA.toUpperCase()}</div>
      </div>
      <div style="text-align:center;padding:0 6px">
        <div style="font-size:12px;color:#9ca3af;font-weight:700;letter-spacing:1px">VS</div>
        <div style="font-size:13px;color:#6b7280;margin-top:2px">${draw} <span style="font-size:10px">emp.</span></div>
      </div>
      <div style="text-align:center">
        <div style="font-size:44px;font-weight:800;line-height:1;color:#1a1a1a">${winB}</div>
        <div style="font-size:11px;color:#6b7280;margin-top:4px;font-weight:600">${jB.toUpperCase()}</div>
      </div>
    </div>`;

  const barra = `
    <div style="display:flex;height:44px;border-radius:10px;overflow:hidden;border:1px solid #e5e7eb;margin-bottom:6px">
      <div style="width:${pctA}%;background:${V_WIN};display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#166534">${pctA>=12?pctA.toFixed(0)+'%':''}</div>
      <div style="width:${pctE}%;background:${V_TIE}"></div>
      <div style="width:${pctB}%;background:${V_LOSE};display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#991b1b">${pctB>=12?pctB.toFixed(0)+'%':''}</div>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:11px;color:#9ca3af;margin-bottom:16px">
      <span>${jA}</span><span>${total} duelo${total===1?'':'s'}</span><span>${jB}</span>
    </div>`;

  // Veredicto
  let veredicto;
  if(total===0) veredicto = `Estos dos aún no han coincidido en ninguna partida.`;
  else if(winA>winB) veredicto = `<b>${jA}</b> domina el cara a cara por ${winA}–${winB}${draw?` (${draw} emp.)`:''}.`;
  else if(winB>winA) veredicto = `<b>${jB}</b> domina el cara a cara por ${winB}–${winA}${draw?` (${draw} emp.)`:''}.`;
  else veredicto = `Igualdad absoluta: ${winA}–${winB}${draw?` con ${draw} empate${draw===1?'':'s'}`:''}.`;

  // Desglose por campo
  const campos = Object.entries(porCampo).sort((a,b)=>b[1].n-a[1].n);
  const campoRows = campos.map(([campo,pc]) => `
    <tr>
      <td style="padding:5px 8px;border-bottom:1px solid #f0f0f0;font-size:12px;color:#333">${campo}</td>
      <td style="padding:5px 8px;border-bottom:1px solid #f0f0f0;text-align:center;font-size:12px;color:#6b7280">${pc.n}</td>
      <td style="padding:5px 8px;border-bottom:1px solid #f0f0f0;text-align:center;font-size:12px;font-weight:700;color:#1a1a1a">${pc.a}</td>
      <td style="padding:5px 8px;border-bottom:1px solid #f0f0f0;text-align:center;font-size:12px;color:#9ca3af">${pc.e}</td>
      <td style="padding:5px 8px;border-bottom:1px solid #f0f0f0;text-align:center;font-size:12px;font-weight:700;color:#1a1a1a">${pc.b}</td>
    </tr>`).join('');

  const desgloseCampo = total ? `
    <div style="font-weight:600;font-size:12px;color:#333;margin:20px 0 8px">🗺️ Por campo</div>
    <table style="width:100%;border-collapse:collapse;background:#fff;border:1px solid #eee;border-radius:8px;overflow:hidden">
      <thead>
        <tr style="background:#fafafa">
          <th style="padding:6px 8px;text-align:left;font-size:11px;color:#6b7280;font-weight:600">Campo</th>
          <th style="padding:6px 8px;text-align:center;font-size:11px;color:#6b7280;font-weight:600">Duelos</th>
          <th style="padding:6px 8px;text-align:center;font-size:11px;color:#6b7280;font-weight:600">${jA}</th>
          <th style="padding:6px 8px;text-align:center;font-size:11px;color:#6b7280;font-weight:600">Emp.</th>
          <th style="padding:6px 8px;text-align:center;font-size:11px;color:#6b7280;font-weight:600">${jB}</th>
        </tr>
      </thead>
      <tbody>${campoRows}</tbody>
    </table>` : '';

  // Timeline de rounds
  const rounds = duelos.map((d,i) => {
    const chip = (jug,tot,delta,abd,isWin) => {
      // Color por RESULTADO, no por equipo
      const gano = d.ganador===jug;
      const empate = d.ganador==='empate';
      const bg = empate ? V_TIE : (gano ? V_WIN : V_LOSE);
      const bd = empate ? V_TIE_BD : (gano ? V_WIN_BD : V_LOSE_BD);
      const txt = abd?'ABD':(tot!=null?tot:'—');
      const dtxt = abd?'':(delta>0?'+'+delta:(delta===0?'PAR':''+delta));
      return `<div style="flex:1;text-align:center;padding:6px 4px;background:${bg};border:1px solid ${bd};border-radius:8px;${isWin?'box-shadow:0 0 0 2px #1a1a1a inset':''}">
        <div style="font-size:16px;font-weight:800;color:#1a1a1a">${txt}</div>
        <div style="font-size:10px;color:#6b7280">${dtxt}</div>
      </div>`;
    };
    return `
      <div style="display:flex;align-items:stretch;gap:8px;margin-bottom:8px">
        <div style="width:74px;flex-shrink:0;display:flex;flex-direction:column;justify-content:center">
          <div style="font-size:11px;font-weight:600;color:#333">${d.fechaTxt}</div>
          <div style="font-size:10px;color:#9ca3af">${d.campo}</div>
        </div>
        ${chip(jA,d.totA,d.dA,d.abdA,d.ganador===jA)}
        <div style="width:26px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:#9ca3af;font-weight:700">${d.ganador==='empate'?'=':'›‹'}</div>
        ${chip(jB,d.totB,d.dB,d.abdB,d.ganador===jB)}
      </div>`;
  }).join('');

  const timeline = total ? `
    <div style="font-weight:600;font-size:12px;color:#333;margin:20px 0 10px">📜 Todos los duelos <span style="color:#9ca3af;font-weight:400">(el marco negro = ganador)</span></div>
    ${rounds}` : '';

  const bestBlock = total ? `
    <div style="display:flex;gap:10px;margin-bottom:4px">

// ══════════════════════════════════════════════════════════════════
// 📊 RENDIMIENTO — distribución de resultados por hoyo, por jugador.
// Par-3: 1=HIO, 2=birdie, 3=par, 4=bogey, ≥5=doble+ (las X ya son 5).
// % = veces de cada tipo sobre el total de hoyos jugados en el ámbito.
// Dos versiones: SR (solo Super ROC, HM_DATA, histórico completo) y
// Global (todos los contextos desde 01/01/2026 vía actuaciones globales).
// ══════════════════════════════════════════════════════════════════
const REND_JUGADORES = EQUIPO.map(j => j.apodo);

// Clasifica un valor de hoyo en categoría. Devuelve índice 0..4.
function _rendCategoria(v){
  if(v==null) return -1;
  if(v<=1) return 0;      // HIO
  if(v===2) return 1;     // birdie
  if(v===3) return 2;     // par
  if(v===4) return 3;     // bogey
  return 4;               // doble o más (5, X→5)
}

// Cuenta categorías a partir de un array de arrays de 18 hoyos.
function _rendContar(listaArrays){
  const c = [0,0,0,0,0]; let tot = 0;
  listaArrays.forEach(arr => {
    if(!Array.isArray(arr)) return;
    arr.forEach(v => {
      const cat = _rendCategoria(v);
      if(cat>=0){ c[cat]++; tot++; }
    });
  });
  return { c, tot };
}

// Render común: recibe {jugador -> {c:[5], tot}} y pinta la tabla.
function _rendPintar(el, datos, titulo, subtitulo, hcps, hcpLbl){
  // Guardar estado en el elemento para permitir reordenar sin recalcular
  el._rendHcps = hcps || null;          // {jugador -> número|null} o null = sin columna
  el._rendHcpLbl = hcpLbl || 'HCP';
  el._rendDatos = datos;
  el._rendTit = titulo;
  el._rendSub = subtitulo;
  if(!el._rendSort) el._rendSort = { col:'ofensivo', dir:'desc' }; // por defecto HIO+Birdie desc
  _rendDibujarTabla(el);
}

// (Re)dibuja la tabla según el estado de orden guardado en el elemento.
function _rendDibujarTabla(el){
  const datos = el._rendDatos, titulo = el._rendTit, subtitulo = el._rendSub;
  const sort = el._rendSort;
  const CAT = [
    {k:'HIO',    col:'#7c3aed', bg:'#f5f3ff'},
    {k:'Birdie', col:'#15803d', bg:'#f0fdf4'},
    {k:'Par',    col:'#374151', bg:'#f9fafb'},
    {k:'Bogey',  col:'#c2410c', bg:'#fff7ed'},
    {k:'Doble+', col:'#b91c1b', bg:'#fef2f2'},
  ];
  const hcps = el._rendHcps;
  const filas = REND_JUGADORES.map(j => {
    const d = datos[j];
    if(!d || d.tot===0) return null;
    const pct = d.c.map(x => x/d.tot*100);
    const hcp = hcps ? (typeof hcps[j] === 'number' ? hcps[j] : null) : null;
    return { j, tot:d.tot, pct, c:d.c, ofensivo: pct[0]+pct[1], hcp };
  }).filter(Boolean);

  // Clave de orden: 'ofensivo' (default), 'hcp', o 0..4 (categoría).
  // No hay orden por nº de hoyos: con la ventana fija son los mismos para todos.
  const valorOrden = r => {
    if(sort.col==='ofensivo') return r.ofensivo;
    if(sort.col==='hcp') return r.hcp;
    return r.pct[sort.col];
  };
  filas.sort((a,b) => {
    const va=valorOrden(a), vb=valorOrden(b);
    // Sin hándicap (menos de la ventana completa) siempre al final
    if(va === null && vb === null) return 0;
    if(va === null) return 1;
    if(vb === null) return -1;
    // El hándicap es mejor cuanto más bajo: se ordena al revés que los %
    if(sort.col==='hcp') return sort.dir==='desc' ? va-vb : vb-va;
    return sort.dir==='desc' ? vb-va : va-vb;
  });

  // Formato del hándicap: PAR si es 0, con signo si no.
  const fmtHcpRend = h => {
    if(h === null || h === undefined) return '—';
    const r = Math.round(h * 10) / 10;
    if(r === 0) return 'PAR';
    return (r > 0 ? '+' : '−') + Math.abs(r).toFixed(1);
  };

  const flecha = colKey => {
    if(sort.col!==colKey) return '';
    return sort.dir==='desc' ? ' ▾' : ' ▴';
  };
  const elId = el.id;

  const header = `<tr style="background:#fafafa">
    <th style="padding:6px 8px;text-align:left;font-size:11px;color:#6b7280;font-weight:600">Jugador</th>
    ${hcps ? `<th onclick="_rendSort('${el.id}','hcp')" style="padding:6px 8px;text-align:center;font-size:11px;color:#0f766e;font-weight:600;cursor:pointer;user-select:none">${el._rendHcpLbl}${sort.col==='hcp' ? (sort.dir==='desc'?' ▾':' ▴') : ''}</th>` : ''}
    ${CAT.map((c,ci)=>`<th onclick="_rendSort('${elId}',${ci})" style="padding:6px 6px;text-align:center;font-size:11px;color:${c.col};font-weight:600;cursor:pointer;user-select:none;${sort.col===ci?'background:'+c.bg:''}">${c.k}${flecha(ci)}</th>`).join('')}
  </tr>`;

  const body = filas.map((r,i) => {
    const cells = r.pct.map((p,ci)=>`
      <td style="padding:5px 6px;text-align:center;font-size:12px;background:${CAT[ci].bg}">
        <div style="display:flex;align-items:baseline;justify-content:center;gap:5px">
          <span style="font-weight:700;color:${CAT[ci].col}">${p.toFixed(1)}%</span>
          <span style="font-size:11px;color:#9ca3af;font-weight:400">${r.c[ci]}</span>
        </div>
      </td>`).join('');
    return `<tr style="border-bottom:1px solid #f0f0f0">
      <td style="padding:5px 8px"><div style="display:inline-flex;align-items:center;gap:6px">
        <span style="width:20px;height:20px;border-radius:4px;background:${COLORS[r.j]||'#eee'};display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;color:#333">${r.j.slice(0,3)}</span>
        <span style="font-size:12px;font-weight:500">${r.j}</span>
      </div></td>
      ${hcps ? `<td style="padding:5px 8px;text-align:center;font-size:12px;font-weight:700;color:${r.hcp===null?'#cbd5e1':'#0f766e'};background:#f0fdfa">${fmtHcpRend(r.hcp)}</td>` : ''}
      ${cells}
    </tr>`;
  }).join('');

  el.innerHTML = `
    <div style="max-width:640px">
      <div style="font-weight:600;font-size:13px;color:#1a1a1a;margin-bottom:2px">${titulo}</div>
      <div style="font-size:11px;color:#9ca3af;margin-bottom:12px">${subtitulo}</div>
      <div style="overflow-x:auto">
        <table style="width:100%;border-collapse:collapse;background:#fff;border:1px solid #eee;border-radius:8px;overflow:hidden">
          <thead>${header}</thead>
          <tbody>${body}</tbody>
        </table>
      </div>
      <div style="font-size:10px;color:#cbd5e1;margin-top:10px">Par-3: HIO=1 · Birdie=2 · Par=3 · Bogey=4 · Doble+=5 o más. Toca una columna para ordenar.</div>
    </div>`;
}

// Click en cabecera: fija columna de orden. Si ya era esa, invierte dirección.
function _rendSort(elId, col){
  const el = document.getElementById(elId);
  if(!el || !el._rendSort) return;
  if(el._rendSort.col === col){
    el._rendSort.dir = el._rendSort.dir==='desc' ? 'asc' : 'desc';
  } else {
    el._rendSort.col = col;
    el._rendSort.dir = 'desc';
  }
  _rendDibujarTabla(el);
}


// Versión Super ROC: lee HM_DATA (todas las jornadas SR).
function renderRendimiento(el){
  const datos = {};
  REND_JUGADORES.forEach(j => { datos[j] = { c:[0,0,0,0,0], tot:0 }; });
  Object.keys(HM_DATA).forEach(key => {
    const sep = key.indexOf('_');
    if(sep<0) return;
    const jug = key.slice(sep+1);
    if(!datos[jug]) return;
    const arr = HM_DATA[key];
    if(!Array.isArray(arr)) return;
    const { c, tot } = _rendContar([arr]);
    for(let i=0;i<5;i++) datos[jug].c[i] += c[i];
    datos[jug].tot += tot;
  });
  _rendPintar(el, datos, '📊 Rendimiento · Super ROC',
    'Distribución de resultados por hoyo — histórico completo del Super ROC (ROC 3)');
}

// Ventana móvil del Rendimiento Global: nº de actuaciones más recientes que
// entran en el reparto de bir/par/bog/dbl. Todos los contextos cuentan.
// Es la ventana única del proyecto (la misma del HCP y las clasificaciones).
const REND_GLOBAL_VENTANA = VENTANA;

// ────────────────────────────────────────────────────────────────
// Clave de agrupación campo+recorrido. Dos recorridos del mismo campo NO son
// el mismo campo: el hoyo 7 del B de Can Rafel no es el hoyo 7 del FCPP, así
// que promediarlos juntos no significa nada.
// ────────────────────────────────────────────────────────────────
function _campoKey(a){
  if(!a || !a.campo) return null;
  const r = a.recorrido || 'FCPP';
  return a.campo + ' · ' + r;
}

// Campos (campo+recorrido) que ya tienen recorrido suficiente para filtrar:
// algún jugador con MIN_VUELTAS_CAMPO vueltas o más. Si nadie llega, el campo
// no se ofrece — así no hay opciones que abran una tabla vacía.
function _camposConMuestra(){
  const porJug = {};
  REND_JUGADORES.forEach(j => {
    const acts = (typeof _recopilarActuacionesGlobal==='function' ? _recopilarActuacionesGlobal(j) : []) || [];
    acts.filter(a => !a.abandono && Array.isArray(a.hoyos) && a.hoyos.length===N_HOYOS)
        .forEach(a => {
          const k = _campoKey(a); if(!k) return;
          porJug[k] = porJug[k] || {};
          porJug[k][j] = (porJug[k][j] || 0) + 1;
        });
  });
  return Object.keys(porJug)
    .map(k => ({
      key: k,
      jugadores: Object.values(porJug[k]).filter(n => n >= MIN_VUELTAS_CAMPO).length,
      vueltas: Object.values(porJug[k]).reduce((s,n) => s+n, 0)
    }))
    .filter(x => x.jugadores > 0)
    .sort((a,b) => b.vueltas - a.vueltas);
}

// Versión Global: las REND_GLOBAL_VENTANA últimas actuaciones, todos los
// contextos. Con filtro opcional de campo+recorrido: al elegir uno, la ventana
// son sus REND_GLOBAL_VENTANA últimas vueltas EN ESE campo, y solo aparecen
// los jugadores que ya han completado la ventana allí.
function renderRendimientoGlobal(el){
  const campos = _camposConMuestra();
  const tblId = (el.id || 'rendglobal') + '-tbl';

  let h = '<div style="max-width:640px">';
  h += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap">';
  h += '<span style="font-size:11px;color:#6b7280;font-weight:600">Campo</span>';
  h += '<select id="' + tblId + '-sel" style="font-size:12px;padding:3px 6px;border:1px solid #e5e7eb;border-radius:6px">';
  h += '<option value="">Todos los campos</option>';
  campos.forEach(c => {
    h += '<option value="' + c.key + '">' + c.key + ' (' + c.vueltas + ')</option>';
  });
  h += '</select>';
  h += '</div>';
  h += '<div id="' + tblId + '"></div>';
  h += '</div>';
  el.innerHTML = h;

  const tbl = document.getElementById(tblId);
  const sel = document.getElementById(tblId + '-sel');

  function calcular(campoKey){
    const datos = {}, hcps = {};
    REND_JUGADORES.forEach(j => { datos[j] = { c:[0,0,0,0,0], tot:0 }; hcps[j] = null; });
    REND_JUGADORES.forEach(j => {
      const acts = (typeof _recopilarActuacionesGlobal==='function' ? _recopilarActuacionesGlobal(j) : []) || [];
      const _ts = (a) => (a.fecha instanceof Date ? a.fecha : new Date(a.fecha)).getTime();
      let elegibles = acts.filter(a => !a.abandono && Array.isArray(a.hoyos) && a.hoyos.length===N_HOYOS);
      if(campoKey) elegibles = elegibles.filter(a => _campoKey(a) === campoKey);
      // Con campo elegido, el jugador solo entra si ya tiene la ventana completa
      if(campoKey && elegibles.length < MIN_VUELTAS_CAMPO){ datos[j].tot = 0; return; }
      const arrays = elegibles
        .sort((a,b) => _ts(b) - _ts(a))   // más reciente primero
        .slice(0, REND_GLOBAL_VENTANA)
        .map(a => a.hoyos);
      const { c, tot } = _rendContar(arrays);
      datos[j].c = c; datos[j].tot = tot;
      // Hándicap de la columna:
      //  · Sin campo elegido → el HCP Global (con ajustes de campo y contexto).
      //  · Con campo elegido → media simple de los deltas reales de esas mismas
      //    vueltas. Dentro de un campo y recorrido únicos el ajuste de campo es
      //    constante, así que sumarlo no cambiaría nada: el número es la media
      //    de golpes vs par en ese campo, sin interpretar.
      if(campoKey){
        const usadas = elegibles.sort((a,b) => _ts(b) - _ts(a)).slice(0, REND_GLOBAL_VENTANA);
        hcps[j] = usadas.length >= MIN_VUELTAS_CAMPO
          ? usadas.reduce((acc,a) => acc + a.delta, 0) / usadas.length
          : null;
      } else {
        const g = (typeof calcHandicapGlobal==='function') ? calcHandicapGlobal(j) : null;
        hcps[j] = (g && typeof g.hcp === 'number') ? g.hcp : null;
      }
    });
    const sub = campoKey
      ? 'Distribución de resultados por hoyo — últimas ' + REND_GLOBAL_VENTANA + ' vueltas en ' + campoKey + ', todos los contextos'
      : 'Distribución de resultados por hoyo — últimas ' + REND_GLOBAL_VENTANA + ' actuaciones, todos los contextos';
    _rendPintar(tbl, datos, '📊 Rendimiento · HCP Global', sub, hcps,
      campoKey ? 'HCP campo' : 'HCP');
    if(campoKey && !Object.values(datos).some(d => d.tot > 0)){
      tbl.innerHTML = '<div style="font-size:12px;color:#9ca3af;padding:16px 8px">Nadie ha completado aún ' +
        MIN_VUELTAS_CAMPO + ' vueltas en ' + campoKey + '.</div>';
    }
  }

  sel.addEventListener('change', e => calcular(e.target.value));
  calcular('');
}
