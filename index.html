    html += '<table style="width:100%;border-collapse:collapse;font-size:11.5px">';
    html += '<thead><tr style="background:#f9fafb;color:#6b7280;font-size:10.5px;text-transform:uppercase;letter-spacing:0.4px">';
    html += '<th style="text-align:center;padding:6px 4px;border-bottom:1px solid #e5e7eb;width:24px">#</th>';
    html += '<th style="text-align:left;padding:6px 6px;border-bottom:1px solid #e5e7eb">Fecha</th>';
    html += '<th style="text-align:left;padding:6px 6px;border-bottom:1px solid #e5e7eb">Src</th>';
    html += '<th style="text-align:left;padding:6px 6px;border-bottom:1px solid #e5e7eb">Campo</th>';
    html += '<th style="text-align:right;padding:6px 6px;border-bottom:1px solid #e5e7eb">Δ</th>';
    html += '<th style="text-align:right;padding:6px 6px;border-bottom:1px solid #e5e7eb">+camp</th>';
    html += '<th style="text-align:right;padding:6px 6px;border-bottom:1px solid #e5e7eb">+ctx</th>';
    html += '<th style="text-align:right;padding:6px 6px;border-bottom:1px solid #e5e7eb">Δ efect</th>';
    html += '</tr></thead><tbody>';
    let sumEf = 0;
    data.used.forEach((a, i) => {
      const f = a.fecha instanceof Date ? a.fecha : new Date(a.fecha);
      const fStr = String(f.getDate()).padStart(2,'0')+'/'+String(f.getMonth()+1).padStart(2,'0');
      const bg = i % 2 === 0 ? '#fff' : '#fafafa';
      sumEf += a.deltaEfectivo || 0;
      html += `<tr style="background:${bg}">`;
      html += `<td style="text-align:center;padding:6px 4px;color:#9ca3af">${i+1}</td>`;
      html += `<td style="text-align:left;padding:6px 6px;font-family:monospace">${fStr}</td>`;
      html += `<td style="text-align:left;padding:6px 6px;color:#6b7280">${srcLbl(a.src)}</td>`;
      html += `<td style="text-align:left;padding:6px 6px;color:#374151">${a.campo||'—'}</td>`;
      html += `<td style="text-align:right;padding:6px 6px;font-family:monospace">${fmtHcp(a.delta)}</td>`;
      html += `<td style="text-align:right;padding:6px 6px;font-family:monospace;color:${a.ajusteCampo?'#c2410c':'#9ca3af'}">${a.ajusteCampo?'+'+a.ajusteCampo:'0'}</td>`;
      html += `<td style="text-align:right;padding:6px 6px;font-family:monospace;color:${a.ajusteContexto?'#c2410c':'#9ca3af'}">${a.ajusteContexto?'+'+a.ajusteContexto:'0'}</td>`;
      html += `<td style="text-align:right;padding:6px 6px;font-family:monospace;font-weight:600">${fmtHcp(a.deltaEfectivo)}</td>`;
      html += '</tr>';
    });
    html += '</tbody>';
    const hcpBaseSinAdapt = sumEf / data.used.length;
    const desc = data.descuentoAdapt || 0;
    const ox = data.penalAdd || 0;
    const disp = data.penalDispersion || 0;
    const hayMods = ox > 0 || disp > 0 || desc > 0;
    html += `<tfoot>`;
    html += `<tr style="background:#fef9c3;font-weight:700">`;
    html += `<td colspan="7" style="text-align:right;padding:8px 6px;color:#854d0e">Suma / ${data.used.length} = HCP base</td>`;
    html += `<td style="text-align:right;padding:8px 6px;font-family:monospace;color:#854d0e">${fmtHcp(hcpBaseSinAdapt)}</td>`;
    html += `</tr>`;
    if(ox > 0){
      html += `<tr style="background:#fef3c7">`;
      html += `<td colspan="7" style="text-align:right;padding:8px 6px;color:#854d0e;font-size:11px">Oxidación · ${data.daysOff} días sin jugar</td>`;
      html += `<td style="text-align:right;padding:8px 6px;font-family:monospace;color:#dc2626;font-weight:600">+${ox.toFixed(2)}</td>`;
      html += `</tr>`;
    }
    if(disp > 0){
      html += `<tr style="background:#fef3c7">`;
      html += `<td colspan="7" style="text-align:right;padding:8px 6px;color:#854d0e;font-size:11px">Ventana estirada · ${data.diasVentana} días (umbral ${UMBRAL_DISPERSION_DIAS})</td>`;
      html += `<td style="text-align:right;padding:8px 6px;font-family:monospace;color:#dc2626;font-weight:600">+${disp.toFixed(2)}</td>`;
      html += `</tr>`;
    }
    if(desc > 0){
      html += `<tr style="background:#fef3c7">`;
      html += `<td colspan="7" style="text-align:right;padding:8px 6px;color:#854d0e;font-size:11px">Adaptabilidad · ${data.camposDistintos} campos distintos · descuento</td>`;
      html += `<td style="text-align:right;padding:8px 6px;font-family:monospace;color:#0f766e;font-weight:600">−${(desc*100).toFixed(2)}%</td>`;
      html += `</tr>`;
    }
    if(hayMods){
      html += `<tr style="background:#fde68a;font-weight:700">`;
      html += `<td colspan="7" style="text-align:right;padding:10px 6px;color:#854d0e">HCP final</td>`;
      html += `<td style="text-align:right;padding:10px 6px;font-family:monospace;color:#854d0e;font-size:13px">${fmtHcp(data.hcp)}</td>`;
      html += `</tr>`;
    }
    html += `</tfoot>`;
    html += '</table>';
    document.getElementById('bitacora-ventana-popup-body').innerHTML = html;
    document.getElementById('bitacora-ventana-popup').style.display = 'flex';
  };

  h += '</div>';
  el.innerHTML = h;
}

// ──────────────────────────────────────────────────────────────────────
// renderPrimeGlobal — los 12 jugadores ordenados por su MEJOR ventana
// ──────────────────────────────────────────────────────────────────────
// Sub-tab dentro de la pestaña 🏆 Hándicap Global. Misma estética que
// renderHandicapGlobal (12 cuadraditos), pero el valor mostrado es el MEJOR
// HCP que cada jugador ha tenido en un CIERRE DE DOMINGO (foto semanal de la
// Bitácora, ≥5 jugadores con n≥10). Click en un cuadradito → popup con esas 10 partidas.
// Prime de un campo: la MEJOR ventana de VENTANA vueltas consecutivas que un
// jugador ha firmado en ese campo, medida como media de deltas reales. Dentro
// de un mismo campo y recorrido el ajuste de campo es constante y el contexto
// no se pondera: es golpes vs par, sin interpretar.
function _primePorCampo(campoKey){
  const V = _campoVueltasDe(campoKey);
  const porJug = {};
  V.forEach(v => {
    const tot = v.hoyos.reduce((a,x) => a + (x||0), 0);
    (porJug[v.jugador] = porJug[v.jugador] || []).push({ ord:v.ord, delta: tot - PAR_CAMPO });
  });
  const out = {};
  Object.keys(porJug).forEach(j => {
    const serie = porJug[j].sort((a,b) => a.ord - b.ord);
    if(serie.length < VENTANA){ out[j] = null; return; }
    let mejor = null;
    for(let i = 0; i + VENTANA <= serie.length; i++){
      const win = serie.slice(i, i + VENTANA);
      const avg = win.reduce((a,x) => a + x.delta, 0) / VENTANA;
      if(!mejor || avg < mejor.hcp) mejor = { hcp:avg, ts:win[win.length-1].ord, desde:win[0].ord };
    }
    out[j] = mejor;
  });
  return out;
}

function renderPrimeGlobal(el){
  // Estado del filtro de campo, conservado entre repintados
  if(el._primeCampo === undefined) el._primeCampo = '';
  const campoKey = el._primeCampo;

  const campos = (typeof _camposConMuestra === 'function') ? _camposConMuestra() : [];
  const selId = (el.id || 'primeglobal') + '-sel';
  let selHtml = '<div style="display:flex;align-items:center;gap:8px;margin:0 8px 14px;flex-wrap:wrap">';
  selHtml += '<span style="font-size:11px;color:#6b7280;font-weight:600">Campo</span>';
  selHtml += '<select id="' + selId + '" style="font-size:12px;padding:3px 6px;border:1px solid #e5e7eb;border-radius:6px">';
  selHtml += '<option value=""' + (campoKey ? '' : ' selected') + '>Global</option>';
  campos.forEach(c => {
    selHtml += '<option value="' + c.key + '"' + (campoKey === c.key ? ' selected' : '') + '>' + c.key + ' (' + c.vueltas + ')</option>';
  });
  selHtml += '</select></div>';

  const _montarSelector = () => {
    const sel = document.getElementById(selId);
    if(sel) sel.addEventListener('change', e => { el._primeCampo = e.target.value; renderPrimeGlobal(el); });
  };

  // ── Prime de un campo ──
  if(campoKey){
    const best = _primePorCampo(campoKey);
    const datos = PLAYERS.map(j => ({ jugador:j, hcp: best[j] ? best[j].hcp : null, ts: best[j] ? best[j].ts : null }));
    const conH = datos.filter(d => d.hcp !== null).sort((a,b) => a.hcp - b.hcp);
    const ordenados = conH.concat(datos.filter(d => d.hcp === null));
    const fmt = v => { if(v===null) return '—'; const r=Math.round(v*10)/10; return r===0?'PAR':(r>0?'+':'−')+Math.abs(r).toFixed(1); };
    const fFecha = ts => { const d=new Date(ts); return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getFullYear()).slice(2); };

    let hh = '<div style="max-width:720px;margin:0 auto;padding:20px 12px">';
    hh += '<div style="font-size:11px;color:#6b7280;text-transform:uppercase;letter-spacing:0.6px;font-weight:600;margin-bottom:6px;padding:0 8px">⭐ Prime · ' + campoKey + '</div>';
    hh += '<div style="font-size:13px;color:#374151;margin:0 8px 14px">La mejor racha de ' + VENTANA + ' vueltas seguidas de cada jugador en este campo, en golpes sobre el par. Sin ajustes de campo ni de contexto.</div>';
    hh += selHtml;
    if(conH.length === 0){
      hh += '<div style="font-size:12px;color:#9ca3af;padding:20px 8px">Todavía nadie ha completado ' + VENTANA + ' vueltas aquí.</div></div>';
      el.innerHTML = hh; _montarSelector(); return;
    }
    hh += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 4px">';
    ordenados.forEach(d => {
      const color = COLORS[d.jugador] || '#f3f4f6';
      const tiene = d.hcp !== null;
      const valColor = tiene ? (d.hcp < 0 ? '#15803d' : d.hcp === 0 ? '#1a1a1a' : '#9a3412') : '#9ca3af';
      hh += '<div style="position:relative;background:' + color + ';border-radius:14px;padding:12px 8px 14px;display:flex;flex-direction:column;align-items:center;opacity:' + (tiene?'1':'0.45') + '">'
         + '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:#1a1a1a;margin-bottom:6px">' + d.jugador + '</div>'
         + '<div style="display:flex;align-items:center;justify-content:center"><span style="font-family:\'Fraunces\',serif;font-size:40px;font-weight:700;color:' + valColor + ';line-height:1;letter-spacing:-0.5px">' + fmt(d.hcp) + '</span></div>'
         + '<div style="font-size:9px;color:#6b7280;margin-top:6px;letter-spacing:0.2px">' + (tiene ? fFecha(d.ts) : 'sin ventana') + '</div>'
         + '</div>';
    });
    hh += '</div></div>';
    el.innerHTML = hh;
    _montarSelector();
    return;
  }

  // ── Prime Global (cierre de domingo) ──
  el._primeSelHtml = selHtml;
  el._primeMontarSel = _montarSelector;
  const hist = _calcHistoricoN1Global(UMBRAL_N1);
  if(!hist){
    el.innerHTML = `
      <div style="max-width:600px;margin:0 auto;padding:40px 20px;text-align:center">
        <div style="font-size:48px;margin-bottom:16px">⭐</div>
        <div style="font-size:18px;font-weight:600;color:#1a1a1a;margin-bottom:8px">Prime · HCP Global</div>
        <div style="font-size:13px;color:#6b7280">Se activará cuando 5 jugadores alcancen 10 actuaciones.</div>
      </div>`;
    return;
  }

  // Para cada jugador, recorrer todas las jornadas y encontrar el HCP mínimo.
  // Guarda fecha y ranking de esa jornada óptima.
  const best = {};   // apodo → { hcp, ts }
  hist.historialN1.forEach(row => {
    row.ranking.forEach(r => {
      if(!best[r.jugador] || r.hcp < best[r.jugador].hcp){
        best[r.jugador] = { hcp: r.hcp, ts: row.ts };
      }
    });
  });

  // Construir datos para los 12 jugadores (los que no tienen ventana válida quedan atenuados)
  const datos = PLAYERS.map(j => ({
    jugador: j,
    hcp: best[j] ? best[j].hcp : null,
    ts:  best[j] ? best[j].ts : null,

  const conHcp = datos.filter(d => d.hcp !== null).sort((a,b) => a.hcp - b.hcp);
  const sinHcp = datos.filter(d => d.hcp === null);

  const fmtHcp = (h) => {

    return (r > 0 ? '+' : '') + r.toFixed(1);
  };
  const fmtFecha = (ts) => {
    const d = new Date(ts);
    return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
  };

  let h = '<div style="max-width:720px;margin:0 auto;padding:20px 12px">';
  h += '<div style="font-size:11px;color:#6b7280;text-transform:uppercase;letter-spacing:0.6px;font-weight:600;margin-bottom:6px;padding:0 8px">⭐ Prime · HCP Global</div>';
  h += '<div style="font-size:13px;color:#374151;margin:0 8px 14px">El mejor HCP que cada jugador ha tenido en un cierre de domingo. Click para ver esa ventana de ' + VENTANA + '.</div>';

  // Grid de 12 cuadraditos (misma estética que el HCP Global)

  ordenados.forEach(d => {
    const color = COLORS[d.jugador] || '#f3f4f6';
    const tieneHcp = d.hcp !== null;
    const opacity = tieneHcp ? '1' : '0.45';
    const cursor = tieneHcp ? 'cursor:pointer;transition:transform 0.1s' : '';
    const hover = tieneHcp ? `onmouseenter="this.style.transform='scale(1.02)'" onmouseleave="this.style.transform='scale(1)'"` : '';
    const click = tieneHcp ? `onclick="window._showPrimeVentanaPopup('${d.jugador}',${d.ts})"` : '';
    const valColor = tieneHcp ? (d.hcp < 0 ? '#15803d' : d.hcp === 0 ? '#1a1a1a' : '#9a3412') : '#9ca3af';
    const subText = tieneHcp ? fmtFecha(d.ts) : 'sin ventana';
    h += `
      <div ${click} style="position:relative;background:${color};border-radius:14px;padding:12px 8px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:108px;opacity:${opacity};${cursor}" ${hover}>
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:#1a1a1a;margin-bottom:6px">${d.jugador}</div>
        <div style="display:flex;align-items:center;justify-content:center">
          <span style="font-family:'Fraunces',serif;font-size:40px;font-weight:700;color:${valColor};line-height:1;letter-spacing:-0.5px">${fmtHcp(d.hcp)}</span>
        </div>
        <div style="font-size:9px;color:#6b7280;margin-top:6px;letter-spacing:0.2px">${subText}</div>
      </div>`;
  });
  h += '</div>';

// ──────────────────────────────────────────────────────────────────────
// renderPrime — Prime SR · MEJOR ventana de 10 partidos SR CONSECUTIVOS
// ──────────────────────────────────────────────────────────────────────
// Sub-tab dentro de Super ROC. Misma estética que renderPrimeGlobal (12
// cuadraditos), pero el valor mostrado es la MEJOR media que cada jugador ha
// obtenido en cualquier ventana de 10 partidas SR consecutivas (deslizando la
// ventana por todo su histórico ordenado por jornada). Todo dinámico desde
// RAW_DATA. Click en un cuadradito → popup con esas 10 partidas.
function renderPrime(el){
  // Para cada jugador: ordenar sus partidas SR por jornada y deslizar una
  // ventana de 10 consecutivas, quedándose con la media mínima.
  const best = {};   // apodo → { avg, partidas:[raw...] }
  PLAYERS.forEach(j => {
    const games = RAW_DATA.filter(r => r.jugador === j).sort((a,b) => a.j - b.j);
    if(games.length < 10) return;            // necesita al menos 10 partidas
    let mejorAvg = Infinity, mejorIni = 0;
    for(let i = 0; i <= games.length - 10; i++){
      const ventana = games.slice(i, i + 10);
      const avg = ventana.reduce((s,r) => s + r.total, 0) / 10;
      if(avg < mejorAvg){ mejorAvg = avg; mejorIni = i; }
    }
    best[j] = { avg: Math.round(mejorAvg*100)/100, partidas: games.slice(mejorIni, mejorIni + 10) };
  });

  const datos = PLAYERS.map(j => ({
    jugador: j,
    avg: best[j] ? best[j].avg : null,
    partidas: best[j] ? best[j].partidas : null,
  }));
  const conVent = datos.filter(d => d.avg !== null).sort((a,b) => a.avg - b.avg);
  const sinVent = datos.filter(d => d.avg === null);
  const ordenados = conVent.concat(sinVent);

  const fmtHcp = (v) => {
    if(v === null || v === undefined) return '—';
    const r = Math.round(v * 10) / 10;
    if(r === 0) return 'PAR';
    return (r > 0 ? '+' : '') + r.toFixed(1);
  };

  // Guardar las ventanas para el popup (key = apodo)
  window.__primeSRVentanas = {};
  ordenados.forEach(d => { if(d.partidas) window.__primeSRVentanas[d.jugador] = d; });

  let h = '<div style="max-width:720px;margin:0 auto;padding:20px 12px">';
  h += '<div style="font-size:11px;color:#6b7280;text-transform:uppercase;letter-spacing:0.6px;font-weight:600;margin-bottom:6px;padding:0 8px">⭐ Prime · Super ROC</div>';
  h += '<div style="font-size:13px;color:#374151;margin:0 8px 18px">La mejor media obtenida por cada jugador en una ventana de 10 partidos SR consecutivos. Click para ver esas 10 partidas.</div>';

  // Grid de 12 cuadraditos (misma estética que el HCP SR / Prime Global)
  h += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 4px">';
  ordenados.forEach(d => {
    const color = COLORS[d.jugador] || '#f3f4f6';
    const tiene = d.avg !== null;
    const opacity = tiene ? '1' : '0.45';
    const cursor = tiene ? 'cursor:pointer;transition:transform 0.1s' : '';
    const hover = tiene ? `onmouseenter="this.style.transform='scale(1.02)'" onmouseleave="this.style.transform='scale(1)'"` : '';
    const click = tiene ? `onclick="window._showPrimeSRVentanaPopup('${d.jugador}')"` : '';
    const valColor = tiene ? (d.avg < 0 ? '#15803d' : d.avg === 0 ? '#1a1a1a' : '#9a3412') : '#9ca3af';
    const nPart = RAW_DATA.filter(r => r.jugador === d.jugador).length;
    const subText = tiene ? `J${d.partidas[0].j} → J${d.partidas[9].j}` : `faltan ${Math.max(0,10-nPart)} partidos`;
    h += `
      <div ${click} style="position:relative;background:${color};border-radius:14px;padding:12px 8px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:108px;opacity:${opacity};${cursor}" ${hover}>
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:#1a1a1a;margin-bottom:6px">${d.jugador}</div>
        <div style="display:flex;align-items:center;justify-content:center">
          <span style="font-family:'Fraunces',serif;font-size:40px;font-weight:700;color:${valColor};line-height:1;letter-spacing:-0.5px">${fmtHcp(d.avg)}</span>
        </div>
        <div style="font-size:9px;color:#6b7280;margin-top:6px;letter-spacing:0.2px">${subText}</div>
      </div>`;
  });
  h += '</div>';

  // Popup flotante (misma estética que el de Prime Global, id propio)
  h += `<div id="prime-sr-ventana-popup" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border-radius:14px;padding:20px;max-width:680px;width:94%;max-height:85vh;overflow:hidden;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,0.25),0 0 0 1px rgba(0,0,0,0.08);z-index:9999">
    <div onclick="document.getElementById('prime-sr-ventana-popup').style.display='none'" style="position:absolute;top:10px;right:14px;font-size:18px;color:#9ca3af;cursor:pointer;line-height:1;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#f3f4f6">×</div>
    <div id="prime-sr-ventana-popup-body" style="overflow-y:auto;padding-right:4px;padding-top:4px"></div>
  </div>`;

  window._showPrimeSRVentanaPopup = function(jugador){
    const d = window.__primeSRVentanas[jugador];
    if(!d || !d.partidas) return;
    const fmtT = (v) => (v >= 0 ? '+' : '') + v;
    let html = `<div style="font-weight:700;font-size:14px;color:#1a1a1a;margin-bottom:10px;padding-right:30px">⭐ Mejor ventana · ${jugador} <span style="font-weight:500;color:#6b7280;font-size:12px">· media ${(d.avg>=0?'+':'')+d.avg.toFixed(2)}</span></div>`;
    html += '<table style="width:100%;border-collapse:collapse;font-size:11.5px">';
    html += '<thead><tr style="background:#f9fafb;color:#6b7280;font-size:10.5px;text-transform:uppercase;letter-spacing:0.4px">';
    html += '<th style="text-align:center;padding:6px 4px;border-bottom:1px solid #e5e7eb;width:24px">#</th>';
    html += '<th style="text-align:center;padding:6px 6px;border-bottom:1px solid #e5e7eb">Jor.</th>';
    html += '<th style="text-align:left;padding:6px 6px;border-bottom:1px solid #e5e7eb">Fecha</th>';
    html += '<th style="text-align:right;padding:6px 6px;border-bottom:1px solid #e5e7eb">🐦</th>';
    html += '<th style="text-align:right;padding:6px 6px;border-bottom:1px solid #e5e7eb">✅</th>';
    html += '<th style="text-align:right;padding:6px 6px;border-bottom:1px solid #e5e7eb">❌</th>';
    html += '<th style="text-align:right;padding:6px 6px;border-bottom:1px solid #e5e7eb">Total</th>';
    html += '</tr></thead><tbody>';
    d.partidas.forEach((r, i) => {
      const bg = i % 2 === 0 ? '#fff' : '#fafafa';
      const tc = r.total < 0 ? '#15803d' : r.total === 0 ? '#1a1a1a' : '#9a3412';
      html += `<tr style="background:${bg}">`;
      html += `<td style="text-align:center;padding:6px 4px;color:#9ca3af">${i+1}</td>`;
      html += `<td style="text-align:center;padding:6px 6px;font-family:monospace">J${r.j}</td>`;
      html += `<td style="text-align:left;padding:6px 6px;color:#6b7280">${r.f}</td>`;
      html += `<td style="text-align:right;padding:6px 6px;color:#854d0e">${r.bir}</td>`;
      html += `<td style="text-align:right;padding:6px 6px;color:#374151">${r.par}</td>`;
      html += `<td style="text-align:right;padding:6px 6px;color:#991b1b">${r.bog+r.dbl}</td>`;
      html += `<td style="text-align:right;padding:6px 6px;font-family:monospace;font-weight:600;color:${tc}">${fmtT(r.total)}</td>`;
      html += '</tr>';
    });
    html += '</tbody>';
    const suma = d.partidas.reduce((s,r) => s + r.total, 0);
    html += `<tfoot><tr style="background:#fef9c3;font-weight:700">`;
    html += `<td colspan="6" style="text-align:right;padding:8px 6px;color:#854d0e">Suma / 10 = mejor media</td>`;
    html += `<td style="text-align:right;padding:8px 6px;font-family:monospace;color:#854d0e">${(d.avg>=0?'+':'')+d.avg.toFixed(2)}</td>`;
    html += `</tr></tfoot>`;
    html += '</table>';
    document.getElementById('prime-sr-ventana-popup-body').innerHTML = html;
    document.getElementById('prime-sr-ventana-popup').style.display = 'flex';
  };

  h += '</div>';
  el.innerHTML = h;
}
// Sub-tab dentro de la pestaña 🏆 Hándicap Global.
// Reutiliza los helpers globales del SR (renderScorecardCells, renderScorecardTotal,
// renderScorecardStats) para mantener IDÉNTICO el aspecto visual de hoyos, total
// y stats que la Tabla SR. Añade columnas de contexto, campo y ajustes.
function renderTablaGlobal(el){
  const FECHA_INICIO_GLOBAL_CALC = new Date(2026, 0, 1);

  // Helper local: ajuste de campo (delega en ajusteRecorrido)
  function _ajusteCampo(nombreCampo, recorrido){
    return ajusteRecorrido(nombreCampo, recorrido);
  }
  // Badges de contexto (color + label corto): alias directo de CTX_INFO.
  const ctxBadge = CTX_INFO;

  // Recolectar TODAS las actuaciones de TODOS los activos
  const todasActs = _recopilarActuacionesGlobal()
    .filter(a => a.fecha >= FECHA_INICIO_GLOBAL_CALC)
    .filter(a => PLAYERS.includes(a.jugador));

  todasActs.forEach(a => {
    a.ajCampo = _ajusteCampo(a.campo, a.recorrido);
    a.ajCtx   = ajusteContexto(a.src);
    a.deltaEf = a.delta + a.ajCampo + a.ajCtx;
  });

  // Marcar "en mis 10 últimas" por jugador
  const porJugador = {};
  PLAYERS.forEach(j => porJugador[j] = todasActs.filter(a => a.jugador === j).sort((a,b) => b.fecha - a.fecha));
  PLAYERS.forEach(j => { porJugador[j].slice(0, 10).forEach(a => { a.enTop10 = true; }); });

  // Estado de filtros (cierre)
  let fJugador = '';        // '' = todos
  let fCtx     = '';        // '' = todos
  let fCampo   = '';        // '' = todos
  let fBuscar  = '';
  let fOrden   = 'fecha-desc'; // ← más reciente a más antiguo por defecto (Capi)

  // Anchos coherentes con Tabla SR
  const W = { ctx:34, f:78, p:80, campo:90, h:22, tot:42, stat:28, ajP:30, ef:44 };

  function pintarFilas(){
    let d = todasActs.slice();
    if(fJugador) d = d.filter(a => a.jugador === fJugador);
    if(fCtx)     d = d.filter(a => a.src === fCtx);
    if(fCampo)   d = d.filter(a => a.campo === fCampo);
    if(fBuscar.trim()){
      const q = fBuscar.trim().toLowerCase();
      d = d.filter(a => {
        const fStr = `${String(a.fecha.getDate()).padStart(2,'0')}/${String(a.fecha.getMonth()+1).padStart(2,'0')}/${a.fecha.getFullYear()}`;
        return a.jugador.toLowerCase().includes(q) ||
               (a.campo||'').toLowerCase().includes(q) ||
               fStr.includes(q) ||
               ctxBadge[a.src].lbl.toLowerCase().includes(q);
      });
    }
    if(fOrden === 'fecha-asc')  d.sort((a,b) => a.fecha - b.fecha || a.jugador.localeCompare(b.jugador));
    if(fOrden === 'fecha-desc') d.sort((a,b) => b.fecha - a.fecha || a.jugador.localeCompare(b.jugador));
    if(fOrden === 'ef-asc')     d.sort((a,b) => a.deltaEf - b.deltaEf);
    if(fOrden === 'ef-desc')    d.sort((a,b) => b.deltaEf - a.deltaEf);
    if(fOrden === 'bir-desc')   d.sort((a,b) => (b.bir||0) - (a.bir||0));

    const cnt = document.getElementById('tg-count');
    if(cnt) cnt.textContent = d.length + ' registros';

    const tbody = document.getElementById('tg-body');
    if(!tbody) return;
    tbody.innerHTML = d.map((a, i) => {
      const bg = i % 2 === 0 ? '#fff' : '#fafafa';
      // border-top más grueso al cambiar de fecha
      const prevFecha = i > 0 ? d[i-1].fecha.getTime() : null;
      const fBorder = (prevFecha !== null && prevFecha !== a.fecha.getTime()) ? 'border-top:2px solid #d1d5db' : '';
      // Borde verde a la izquierda si la fila está en "mis 10 últimas" del jugador filtrado
      const top10Mark = (fJugador && a.enTop10) ? 'box-shadow:inset 3px 0 0 #16a34a' : '';
      const b = ctxBadge[a.src];
      const fStr = `${String(a.fecha.getDate()).padStart(2,'0')}/${String(a.fecha.getMonth()+1).padStart(2,'0')}/${a.fecha.getFullYear()}`;
      // Hoyos: array de 18 o relleno con null si la jornada no tiene hm
      const hoyos = a.hoyos || Array(18).fill(null);
      // Stats: si tiene hm los cuenta desde el array (consistencia), si no usa los de RAW (SR)
      const cnts = a.hoyos ? countScoresFromArr(a.hoyos) : { bir:a.bir, par:a.par, bog:a.bog, dbl:a.dbl };

      return `<tr style="background:${bg};${fBorder};${top10Mark}">
        <td style="text-align:center;padding:3px 2px;font-size:11px;border:1px solid #e5e7eb">
          <span style="display:inline-block;background:${b.bg};color:${b.col};font-weight:700;font-size:10px;padding:1px 5px;border-radius:4px">${b.lbl}</span>
        </td>
        <td style="color:#555;padding:3px 4px;font-size:11px;border:1px solid #e5e7eb">${fStr}</td>
        <td style="background:${COLORS[a.jugador]||'#eee'};font-weight:500;color:#333;padding:3px 5px;font-size:11px;border:1px solid #e5e7eb;overflow:hidden;text-overflow:ellipsis">${a.jugador}</td>
        <td style="color:#666;padding:3px 5px;font-size:10px;border:1px solid #e5e7eb;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${a.campo||'-'}</td>
        ${renderScorecardCells(hoyos)}
        ${renderScorecardTotal(a.delta)}
        ${renderScorecardStats(cnts)}
        <td style="text-align:center;padding:2px 1px;color:${a.ajCampo>0?'#854d0e':'#bbb'};font-size:10px;border:1px solid #e5e7eb">${a.ajCampo===0?'·':'+'+a.ajCampo}</td>
        <td style="text-align:center;padding:2px 1px;color:${a.ajCtx>0?'#854d0e':'#bbb'};font-size:10px;border:1px solid #e5e7eb">${a.ajCtx===0?'·':'+'+a.ajCtx}</td>
        <td style="text-align:center;padding:2px 4px;background:#fef9c3;color:#854d0e;font-weight:700;font-size:12px;border:1px solid #fde68a">${a.deltaEf>=0?'+'+a.deltaEf:''+a.deltaEf}</td>
      </tr>`;
    }).join('');
  }

  // Render del wrapper
  let h = '<div><div style="display:flex;gap:5px;margin-bottom:8px;flex-wrap:wrap;align-items:center">';
  h += '<input id="tg-buscar" type="text" placeholder="Buscar…" style="width:100px">';

// ── Records Global ──────────────────────────────────────────────────────
// Recoge TODAS las actuaciones de TODOS los contextos (roc/ent/oficial/rkg/
// ic/copa) vía _recopilarActuacionesGlobal, las ordena POR FECHA y calcula
// la racha. A diferencia del Records de Super ROC (solo martes contexto SR),
// aquí entra todo. Solo cuentan actuaciones desde 01/01/2026, igual que el
// resto del HCP Global. "Doble dígito" = delta >= 10 (mismo criterio que SR,
// solo resultado final, sin hoyo a hoyo).
// Toggle del detalle (fecha · campo · contexto) al pinchar un chip de
// "Han batido el campo". Global para que funcione desde el onclick inline.
function _batidoToggle(el){
  const wrap = el.closest('.bwrap');
  if(!wrap) return;
  const d = wrap.querySelector('.bdet');
  if(!d) return;
  const t = el.dataset.info || '';
  if(d.style.display === 'block' && d.textContent === t){ d.style.display = 'none'; }
  else { d.textContent = t; d.style.display = 'block'; }
}

// ═══════════════════════════════════════════════════════════════════════
// 🗃️ MISCELÁNEA — cajón de sastre del Global
// ═══════════════════════════════════════════════════════════════════════

// ════════════════════════════════════════════════════
// PROGRESIÓN — helpers compartidos
// ════════════════════════════════════════════════════
// Los usan la Miscelánea (progresión del equipo y del jugador) y la ficha del
// jugador. Un único sitio: si cambia el gráfico, cambia en los tres.
const PROG_N = 10;                       // tamaño de la ventana móvil
const FECHA_INICIO_PROG = new Date(2026, 0, 1);
// Canal Olímpic queda FUERA: desvirtúa la serie (mismo criterio que los
// Récords Globales, CAMPOS_EXCLUIDOS_RECORDS).
const CAMPOS_EXCLUIDOS_PROG = ['Canal Olímpic'];

// Serie histórica del HCP Global de un jugador: una ventana por cada fecha en
// la que tuvo al menos PROG_N actuaciones. El último punto usa la fecha de hoy,
// así que sí lleva oxidación.
function _progVentanasJugador(jug){
  const fechas = _recopilarActuacionesGlobal(jug)
    .filter(a => a.fecha instanceof Date && !isNaN(+a.fecha) && a.fecha >= FECHA_INICIO_PROG
                 && !CAMPOS_EXCLUIDOS_PROG.includes(a.campo))
    .map(a => a.fecha)
    .sort((a,b) => a - b);
  const uniq = [];
  fechas.forEach(f => { if(!uniq.length || +uniq[uniq.length-1] !== +f) uniq.push(f); });

  const vents = [];
  uniq.forEach((f, k) => {
    const esUltima = (k === uniq.length - 1);
    const g = esUltima ? calcHandicapGlobal(jug, null, false, undefined, CAMPOS_EXCLUIDOS_PROG)
                       : calcHandicapGlobal(jug, f,    false, undefined, CAMPOS_EXCLUIDOS_PROG);
    if(g.hcp === null || !g.used || g.used.length < PROG_N) return;
    const acts = g.used.slice().reverse().map(a => ({
      fecha:a.fecha, src:a.src, campo:a.campo || '—', delta:a.delta,
      ajCampo:(a.ajusteCampo !== undefined ? a.ajusteCampo : 0),
      ajCtx:(a.ajusteContexto !== undefined ? a.ajusteContexto : 0),
      efectivo:(a.deltaEfectivo !== undefined ? a.deltaEfectivo : a.delta)
    }));
    const base = acts.reduce((s2,a) => s2 + a.efectivo, 0) / acts.length;
    vents.push({ desde:acts[0].fecha, hasta:acts[acts.length-1].fecha, corte:f,
                 v:g.hcp, base, acts,
                 camposDistintos:g.camposDistintos, descuentoAdapt:g.descuentoAdapt,
                 penalAdd:g.penalAdd || 0, penalDispersion:g.penalDispersion || 0,
                 daysOff:g.daysOff || 0 });
  });
  return { jugador:jug, n:fechas.length, vents:vents };
}

// ── Helpers compartidos por Progresión del equipo y Progresión del jugador ──
// Un único sitio para el gráfico y las cards: si se cambia el diseño, cambia
// en los dos sitios a la vez (no duplicar lógica de render).
const _fCortaProg = d => `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getFullYear()).slice(-2)}`;
const _sgProg = v => (v >= 0 ? '+' : '') + v.toFixed(2);

// Gráfico de línea de una serie de ventanas [{desde,hasta,v}].
function _progChartSVG(vents, colLinea, alto){
  const vals = vents.map(x => x.v);
  const vMin = Math.min(...vals), vMax = Math.max(...vals);
  const pad  = Math.max(0.25, (vMax - vMin) * 0.15);
  const yLo  = vMin - pad, yHi = vMax + pad;
  const W = 620, H = alto || 190, ML = 36, MR = 12, MT = 12, MB = 24;
  const px = i => ML + (W - ML - MR) * (vents.length === 1 ? 0.5 : i / (vents.length - 1));
  const py = v => MT + (H - MT - MB) * ((yHi - v) / (yHi - yLo));
  const iMejor = vals.indexOf(Math.min(...vals));
  const iPeor  = vals.indexOf(Math.max(...vals));

  const pts = vents.map((x,i) => px(i).toFixed(1) + ',' + py(x.v).toFixed(1)).join(' ');
  const area = 'M ' + px(0).toFixed(1) + ',' + (H - MB).toFixed(1)
             + ' L ' + vents.map((x,i) => px(i).toFixed(1) + ',' + py(x.v).toFixed(1)).join(' L ')
             + ' L ' + px(vents.length - 1).toFixed(1) + ',' + (H - MB).toFixed(1) + ' Z';

  let svg = '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" xmlns="http://www.w3.org/2000/svg">';
  [0, 0.25, 0.5, 0.75, 1].forEach(t => {
    const v = yHi - (yHi - yLo) * t;
    const y = py(v);
    svg += '<line x1="'+ML+'" y1="'+y.toFixed(1)+'" x2="'+(W-MR)+'" y2="'+y.toFixed(1)+'" stroke="#eee" stroke-width="1"/>';
    svg += '<text x="'+(ML-6)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end" font-size="9" fill="#bbb" font-family="monospace">'+(v>=0?'+':'')+v.toFixed(1)+'</text>';
  });
  svg += '<path d="'+area+'" fill="'+colLinea+'" fill-opacity="0.10"/>';
  svg += '<polyline points="'+pts+'" fill="none" stroke="'+colLinea+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  vents.forEach((x,i) => {
    const esExtremo = (i === iMejor || i === iPeor || i === vents.length - 1);
    const col = i === iMejor ? '#15803d' : (i === iPeor ? '#b91c1c' : colLinea);
    svg += '<circle cx="'+px(i).toFixed(1)+'" cy="'+py(x.v).toFixed(1)+'" r="'+(esExtremo?3.5:2)+'" fill="'+col+'"><title>'+_fCortaProg(x.desde)+' → '+_fCortaProg(x.hasta)+' · '+_sgProg(x.v)+'</title></circle>';
  });
  svg += '<text x="'+px(0).toFixed(1)+'" y="'+(H-8)+'" text-anchor="start" font-size="9" fill="#bbb">'+_fCortaProg(vents[0].hasta)+'</text>';
  if(vents.length > 1)
    svg += '<text x="'+px(vents.length-1).toFixed(1)+'" y="'+(H-8)+'" text-anchor="end" font-size="9" fill="#bbb">'+_fCortaProg(vents[vents.length-1].hasta)+'</text>';
  svg += '</svg>';
  return svg;
}

// Cards Ventana actual / Mejor / Peor / Tendencia. `clickTpl` es la llamada
// JS del onclick con los marcadores {idx} y {tit}; si es null, no son clicables.
function _progCardsHTML(vents, clickTpl){
  const vals   = vents.map(x => x.v);
  const actual = vents[vents.length - 1];
  const previa = vents.length > 1 ? vents[vents.length - 2] : null;
  const iMejor = vals.indexOf(Math.min(...vals));
  const iPeor  = vals.indexOf(Math.max(...vals));
  const mejor  = vents[iMejor], peor = vents[iPeor];
  const dlt    = previa ? actual.v - previa.v : 0;
  const tendIcon = !previa ? '—' : (dlt < -0.005 ? '🔻' : (dlt > 0.005 ? '🔺' : '➖'));
  const tendCol  = !previa ? '#9ca3af' : (dlt < -0.005 ? '#15803d' : (dlt > 0.005 ? '#b91c1c' : '#6b7280'));
  const tendTxt  = !previa ? 'sin ventana previa' : (dlt === 0 ? 'igual que la anterior' : _sgProg(dlt) + ' vs ventana anterior');

  const cards = [
    { lbl:'Ventana actual', val:_sgProg(actual.v), sub:_fCortaProg(actual.desde)+' → '+_fCortaProg(actual.hasta), bg:'#eff6ff', bd:'#bfdbfe', col:'#1e40af', idx:vents.length-1, tit:'Ventana actual' },
    { lbl:'Mejor ventana',  val:_sgProg(mejor.v),  sub:'hasta '+_fCortaProg(mejor.hasta), bg:'#f0fdf4', bd:'#bbf7d0', col:'#15803d', idx:iMejor, tit:'Mejor ventana' },
    { lbl:'Peor ventana',   val:_sgProg(peor.v),   sub:'hasta '+_fCortaProg(peor.hasta),  bg:'#fef2f2', bd:'#fecaca', col:'#b91c1c', idx:iPeor,  tit:'Peor ventana' },
    { lbl:'Tendencia',      val:tendIcon,          sub:tendTxt, bg:'#fafafa', bd:'#e5e5e5', col:tendCol, idx:null }
  ];
  let out = '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">';
  cards.forEach(c => {
    const clicable = (clickTpl && c.idx !== null && c.idx >= 0);
    const call = clicable ? clickTpl.replace('{idx}', c.idx).replace('{tit}', c.tit) : '';
    const extra = clicable
      ? 'cursor:pointer;transition:box-shadow .15s,transform .15s" onclick="'+call+'" onmouseover="this.style.boxShadow=\'0 2px 8px rgba(0,0,0,0.12)\';this.style.transform=\'translateY(-1px)\'" onmouseout="this.style.boxShadow=\'none\';this.style.transform=\'none\''
      : '';
    out += '<div style="flex:1 1 130px;background:'+c.bg+';border:1px solid '+c.bd+';border-radius:7px;padding:7px 9px;'+extra+'">'
      +'<div style="font-size:9px;color:#9ca3af;text-transform:uppercase;letter-spacing:0.4px;margin-bottom:2px">'+c.lbl+(clicable?' <span style="text-transform:none;letter-spacing:0">🔍</span>':'')+'</div>'
      +'<div style="font-weight:700;font-size:18px;color:'+c.col+';line-height:1.1">'+c.val+'</div>'
      +'<div style="font-size:9px;color:#aaa;margin-top:2px">'+c.sub+'</div>'
      +'</div>';
  });
  out += '</div>';
  return out;
}

function renderMiscelania(el){
  let h = '<div class="card"><h3>🗃️ Miscelánea</h3>';

  // ── Partidos jugados por castas ──────────────────────────────────────
  // Cuenta TODAS las actuaciones de cada jugador en cualquier contexto
  // (SR, IC, ENT, Torneos, Copa, Ranking), todos los campos, con abandonos,
  // sin filtro de fecha. Recuento bruto de participación.
  const partidosData = PLAYERS.map(jugador => ({
    jugador,
    n: _recopilarActuacionesGlobal(jugador).filter(a => a.fecha instanceof Date).length
  })).sort((a,b) => b.n - a.n || a.jugador.localeCompare(b.jugador));

  // Castas por umbral fijo. Un jugador cambia de casta automáticamente al
  // cruzar el umbral, sin tocar código.
  const CASTAS = [
    { id:'c100', min:100, max:Infinity, icon:'🏆', titulo:'El club de los 100',
      sub:'100 partidos o más', bg:'#fffbeb', border:'#fde68a', color:'#a16207',
      vacio:'Nadie ha entrado todavía. La puerta sigue cerrada.' },
    { id:'c50',  min:50,  max:99,       icon:'🥈', titulo:'El club de los 50',
      sub:'de 50 a 99 partidos', bg:'#f0f9ff', border:'#bae6fd', color:'#0369a1',
      vacio:'Sala vacía de momento.' },
    { id:'morr', min:0,   max:49,       icon:'🗑️', titulo:'Morralla',
      sub:'menos de 50 partidos', bg:'#fafafa', border:'#e5e5e5', color:'#737373',
      vacio:'Ni morralla queda. Milagro.' }
  ];

  h += '<div style="display:flex;align-items:center;gap:6px;font-weight:500;font-size:12px;margin-bottom:10px"><span style="font-size:15px;line-height:1">⛳</span> Partidos jugados <span style="font-weight:400;color:#aaa;font-size:10px;margin-left:4px">· todos los contextos · total</span></div>';

  CASTAS.forEach(c => {
    const miembros = partidosData.filter(p => p.n >= c.min && p.n <= c.max);
    h += '<div style="margin-bottom:20px">';
    h += '<div style="display:flex;align-items:baseline;gap:7px;padding:6px 10px;background:'+c.bg+';border:1px solid '+c.border+';border-radius:7px;margin-bottom:6px">'
      +'<span style="font-size:15px;line-height:1">'+c.icon+'</span>'
      +'<span style="font-weight:700;font-size:13px;color:'+c.color+'">'+c.titulo+'</span>'
      +'<span style="font-weight:400;font-size:10px;color:#aaa">· '+c.sub+'</span>'
      +'<span style="margin-left:auto;font-size:10px;color:#aaa">'+miembros.length+'</span>'
      +'</div>';
    if(!miembros.length){
      h += '<div style="font-size:11px;color:#aaa;font-style:italic;padding:8px 10px">'+c.vacio+'</div>';
    } else {
      miembros.forEach(p => {
        h += '<div style="display:flex;align-items:center;gap:8px;padding:7px 10px;background:#fff;border-radius:7px;margin-bottom:4px;border:1px solid #eee">'
          +'<div style="width:26px;height:26px;border-radius:5px;background:'+(COLORS[p.jugador]||'#eee')+';display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;color:#333;flex-shrink:0">'+p.jugador.slice(0,3)+'</div>'
          +'<div style="flex:1;font-weight:500;font-size:12px">'+p.jugador+'</div>'
          +'<div style="font-weight:700;font-size:16px;color:'+c.color+';min-width:28px;text-align:right">'+p.n+'</div>'
          +'</div>';
      });
    }
    h += '</div>';
  });

  // ── 🍆 El Fucker — campeonatos de jornada ────────────────────────────
  // Jornada = misma fecha + mismo contexto + mismo campo.
  // Campeón = mejor total real (delta vs par), sin ajustes de campo/contexto.
  // Sólo cuentan las jornadas con 3 participantes o más. Los empates en
  // cabeza suman una corona a cada empatado. Abandonos fuera.
  const MIN_PARTICIPANTES_FUCKER = 3;
  const _fKey = d => `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;

  const grupos = {};
  PLAYERS.forEach(j => {
    _recopilarActuacionesGlobal(j)
      .filter(a => a.fecha && !isNaN(+a.fecha) && !a.abandono)
      .forEach(a => {
        const k = _fKey(a.fecha) + '|' + a.src + '|' + (a.campo || '');
        (grupos[k] = grupos[k] || []).push(a);
      });
  });

  const coronas = {};
  const jornadasJugador = {};   // jugador → [{fecha, gano}] de sus jornadas válidas
  PLAYERS.forEach(j => { coronas[j] = 0; jornadasJugador[j] = []; });
  let jornadasValidas = 0, jornadasDescartadas = 0;
  Object.values(grupos).forEach(arr => {
    if(arr.length < MIN_PARTICIPANTES_FUCKER){ jornadasDescartadas++; return; }
    jornadasValidas++;
    const best = Math.min(...arr.map(a => a.delta));
    arr.forEach(a => {
      const gano = (a.delta === best);
      if(gano) coronas[a.jugador] = (coronas[a.jugador] || 0) + 1;
      if(jornadasJugador[a.jugador]) jornadasJugador[a.jugador].push({ fecha:a.fecha, gano });
    });
  });
  PLAYERS.forEach(j => jornadasJugador[j].sort((a,b) => a.fecha - b.fecha));

  const fuckerData = PLAYERS.map(j => ({ jugador:j, n:coronas[j] || 0, jugadas:jornadasJugador[j].length }))
    .sort((a,b) => b.n - a.n || a.jugador.localeCompare(b.jugador));

  // Posición compartida en caso de empate
  let posActual = 0, prevN = null;
  fuckerData.forEach((p,i) => {
    if(p.n !== prevN){ posActual = i + 1; prevN = p.n; }
    p.pos = posActual;
  });

  h += '<div style="margin-top:26px;border-top:1px solid #eee;padding-top:16px">';
  h += '<div style="display:flex;align-items:baseline;gap:7px;margin-bottom:4px">'
    +'<span style="font-size:16px;line-height:1">🍆</span>'
    +'<span style="font-weight:700;font-size:14px">El Fucker</span>'
    +'<span style="font-weight:400;font-size:10px;color:#aaa">· campeón de jornada · todos los contextos</span>'
    +'</div>';
  h += '<div style="font-size:10px;color:#aaa;margin-bottom:10px">'
    + jornadasValidas + ' jornadas computadas · mínimo ' + MIN_PARTICIPANTES_FUCKER + ' participantes ('
    + jornadasDescartadas + ' descartadas) · empate en cabeza = corona para cada uno</div>';

  fuckerData.forEach(p => {
    const cero = p.n === 0;
    const medalla = p.pos === 1 ? '🥇' : (p.pos === 2 ? '🥈' : (p.pos === 3 ? '🥉' : ''));
    // % de efectividad: coronas sobre las jornadas válidas que él jugó.
    const pct = p.jugadas ? Math.round(p.n / p.jugadas * 100) + '%' : '';
    const pctTip = p.jugadas ? p.n + ' de ' + p.jugadas + ' jornadas jugadas' : 'sin jornadas válidas';
    h += '<div style="display:flex;align-items:center;gap:8px;padding:7px 10px;background:'+(p.pos===1?'#fdf4ff':'#fff')+';border-radius:7px;margin-bottom:4px;border:1px solid '+(p.pos===1?'#f0abfc':'#eee')+';opacity:'+(cero?'0.5':'1')+'">'
      +'<div style="width:22px;font-size:11px;color:#999;text-align:right;flex-shrink:0">'+(medalla || p.pos)+'</div>'
      +'<div style="width:26px;height:26px;border-radius:5px;background:'+(COLORS[p.jugador]||'#eee')+';display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;color:#333;flex-shrink:0">'+p.jugador.slice(0,3)+'</div>'
      +'<div style="flex:1;font-weight:500;font-size:12px">'+p.jugador+'</div>'
      +'<div style="font-size:10px;font-weight:400;color:#c9c9c9;text-align:right;flex-shrink:0" title="'+pctTip+'">'+pct+'</div>'
      +'<div style="font-weight:700;font-size:16px;color:'+(cero?'#bbb':'#a21caf')+';min-width:28px;text-align:right">'+p.n+'</div>'
      +'</div>';
  });
  h += '</div>';

  // ── 🏜️ La Sequía — jornadas sin ganar ───────────────────────────────
  // Se cuenta en JORNADAS del propio jugador, no en días: solo cuentan las
  // jornadas válidas (3+ participantes) en las que él estuvo. Sequía actual =
  // jornadas suyas desde la última corona. Récord = la racha más larga sin
  // ganar, incluida la que esté en curso. Sin corona no hay sequía: fuera.
  const _fCorta = d => `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getFullYear()).slice(-2)}`;

  const sequiaData = PLAYERS.map(j => {
    const js = jornadasJugador[j];
    const idxUlt = js.map(x => x.gano).lastIndexOf(true);
    if(idxUlt === -1) return null;                 // nunca ganó → fuera
    const actual = js.length - 1 - idxUlt;         // jornadas suyas tras la corona
    let record = 0, run = 0;
    js.forEach(x => { if(x.gano){ run = 0; } else { run++; if(run > record) record = run; } });
    return { jugador:j, actual, record, ultima: js[idxUlt].fecha, jugadas: js.length,
             enRecord: actual > 0 && actual >= record };
  }).filter(Boolean)
    .sort((a,b) => b.record - a.record || b.actual - a.actual || a.jugador.localeCompare(b.jugador));

  // Los que aún no han ganado ninguna jornada se citan aparte al final.
  const sinCorona = PLAYERS.filter(j => !jornadasJugador[j].some(x => x.gano));

  h += '<div style="margin-top:26px;border-top:1px solid #eee;padding-top:16px">';
  h += '<div style="display:flex;align-items:baseline;gap:7px;margin-bottom:4px">'
    +'<span style="font-size:16px;line-height:1">🏜️</span>'
    +'<span style="font-weight:700;font-size:14px">La Sequía</span>'
    +'<span style="font-weight:400;font-size:10px;color:#aaa">· jornadas desde la última vez que ganó</span>'
    +'</div>';
  h += '<div style="font-size:10px;color:#aaa;margin-bottom:8px">'
    +'Cuentan sólo las jornadas suyas de 3+ participantes · sólo entran los que han ganado alguna</div>';

  sequiaData.forEach((p,i) => {
    const actualColor = p.actual>0 ? '#b45309' : '#ccc';
    h += '<div style="display:flex;align-items:center;gap:8px;padding:7px 10px;background:'+(i===0?'#fffbeb':'#fff')+';border-radius:7px;margin-bottom:4px;border:1px solid #eee">'
      +'<div style="width:26px;height:26px;border-radius:5px;background:'+(COLORS[p.jugador]||'#eee')+';display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;color:#333;flex-shrink:0">'+p.jugador.slice(0,3)+'</div>'
      +'<div style="flex:1;font-weight:500;font-size:12px">'+p.jugador+'</div>'
      +'<div style="font-size:10px;color:#aaa;margin-right:4px">última corona '+_fCorta(p.ultima)+'</div>'
      +'<div style="display:flex;align-items:baseline;gap:4px">'
        +'<div style="font-weight:700;font-size:16px;color:#b45309;min-width:28px;text-align:right">'+p.record+'</div>'
        +'<div style="font-weight:600;font-size:11px;color:'+actualColor+';min-width:16px;text-align:right">'+p.actual+'</div>'
      +'</div>'
      +'</div>';
  });
  if(sinCorona.length){
    h += '<div style="font-size:10px;color:#bbb;font-style:italic;padding:6px 10px 0 10px">Fuera de la lista por no haber ganado nunca una jornada: '
      + sinCorona.join(', ') + '.</div>';
  }
  h += '</div>';

  // ── 🚩 El Conquistador — campos distintos pisados ────────────────────
  // Cuenta CAMPOS distintos, no recorridos: dos recorridos del mismo campo
  // suman uno. Todos los contextos, todo el histórico. Canal Olímpic cuenta
  // como campo aquí (sólo está excluido de los récords globales).
  // Dos fuentes, porque el recolector global sólo lee los individuales de IC:
  //   INDIS   → _recopilarActuacionesGlobal (SR, ENT, torneos, ranking, copa, IC individual)
  //   PAREJAS → par1/par2 de IC_DATA, que no producen tarjeta individual y por eso
  //             se leen aquí aparte (NO se tocan HCP Global, Rendimiento ni Tabla).
  // TOTAL = unión de ambos conjuntos: un campo pisado de las dos formas cuenta una vez.
  const camposInd = {}, camposPar = {};
  const camposTotales = new Set();
  PLAYERS.forEach(j => {
    const s = new Set();
    _recopilarActuacionesGlobal(j)
      .filter(a => a.fecha && !isNaN(+a.fecha) && a.campo)
      .forEach(a => { s.add(a.campo); camposTotales.add(a.campo); });
    camposInd[j] = s;
    camposPar[j] = new Set();
  });

  if(typeof IC_DATA !== 'undefined' && typeof APODO_A_NOMBRES_IC !== 'undefined'){
    const _apoDeNombre = n => apodoDesdeNombreIC(n);
    Object.values(IC_DATA).forEach(yd => {
      (yd.pruebas || []).forEach(p => {
        if(p.total === null || p.total === undefined || !p.camp) return;
        [p.par1, p.par2].forEach(pr => {
          if(!pr) return;
          [pr[0], pr[1]].forEach(n => {
            const apo = _apoDeNombre(n);
            if(!apo || !PLAYERS.includes(apo)) return;
            camposPar[apo].add(p.camp);
            camposTotales.add(p.camp);
          });
        });
      });
    });
  }

  const totalCampos = camposTotales.size;

  const conquistaData = PLAYERS.map(j => ({
    jugador: j,
    nInd: camposInd[j].size,
    nPar: camposPar[j].size,
    n: new Set([...camposInd[j], ...camposPar[j]]).size
  })).sort((a,b) => b.n - a.n || a.jugador.localeCompare(b.jugador));

  let posConq = 0, prevConq = null;
  conquistaData.forEach((p,i) => {
    if(p.n !== prevConq){ posConq = i + 1; prevConq = p.n; }
    p.pos = posConq;
    p.pleno = (totalCampos > 0 && p.n === totalCampos);
  });

  h += '<div style="margin-top:26px;border-top:1px solid #eee;padding-top:16px">';
  h += '<div style="display:flex;align-items:baseline;gap:7px;margin-bottom:4px">'
    +'<span style="font-size:16px;line-height:1">🗺️</span>'
    +'<span style="font-weight:700;font-size:14px">El Conquistador</span>'
    +'<span style="font-weight:400;font-size:10px;color:#aaa">· campos distintos pisados · todos los contextos</span>'
    +'</div>';
  h += '<div style="font-size:10px;color:#aaa;margin-bottom:8px">'
    + totalCampos + ' campos en el mapa · cuentan campos, no recorridos · '
    + '<b>INDIS + PAREJAS no suma el total</b>: un campo pisado de las dos formas cuenta una vez</div>';

  h += '<div style="display:flex;align-items:center;gap:8px;padding:0 10px 4px 10px">'
    +'<div style="width:22px;flex-shrink:0"></div>'
    +'<div style="width:26px;flex-shrink:0"></div>'
    +'<div style="flex:1"></div>'
    +'<div style="flex:0 0 70px"></div>'
    +'<div style="min-width:28px;text-align:right;font-size:9px;color:#bbb;font-weight:600;letter-spacing:.3px">TOTAL</div>'
    +'<div style="width:44px;text-align:right;font-size:9px;color:#bbb;font-weight:600;letter-spacing:.3px">INDIS</div>'
    +'<div style="width:52px;text-align:right;font-size:9px;color:#bbb;font-weight:600;letter-spacing:.3px">PAREJAS</div>'
    +'</div>';

  conquistaData.forEach(p => {
    const pct = totalCampos ? Math.round(p.n / totalCampos * 100) : 0;
    h += '<div style="display:flex;align-items:center;gap:8px;padding:7px 10px;background:'+(p.pleno?'#fef2f2':'#fff')+';border-radius:7px;margin-bottom:4px;border:1px solid '+(p.pleno?'#fecaca':'#eee')+'">'
      +'<div style="width:22px;font-size:11px;color:#999;text-align:right;flex-shrink:0">'+(p.pleno?'👑':p.pos)+'</div>'
      +'<div style="width:26px;height:26px;border-radius:5px;background:'+(COLORS[p.jugador]||'#eee')+';display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;color:#333;flex-shrink:0">'+p.jugador.slice(0,3)+'</div>'
      +'<div style="flex:1;font-weight:500;font-size:12px">'+p.jugador+'</div>'
      +'<div style="flex:0 0 70px;height:6px;background:#f1f1f1;border-radius:3px;overflow:hidden">'
        +'<div style="width:'+pct+'%;height:100%;background:'+(p.pleno?'#dc2626':'#f59e0b')+'"></div>'
      +'</div>'
      +'<div style="font-weight:700;font-size:16px;color:'+(p.pleno?'#dc2626':'#b45309')+';min-width:28px;text-align:right">'+p.n+'</div>'
      +'<div style="width:44px;text-align:right;font-size:11px;color:#9ca3af">'+p.nInd+'</div>'
      +'<div style="width:52px;text-align:right;font-size:11px;color:#9ca3af">'+p.nPar+'</div>'
      +'</div>';
  });
  // ── Detalle por campo: cuántos jugadores lo han pisado y cuántas jornadas
  // ha ido el equipo. Jornada = misma fecha + mismo contexto en ese campo.
  const detCampos = {};
  const _getCampo = c => (detCampos[c] = detCampos[c] || { jug:new Set(), jorn:new Set() });
  const _fKeyC = d => `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;

  PLAYERS.forEach(j => {
    _recopilarActuacionesGlobal(j)
      .filter(a => a.campo && a.fecha && !isNaN(+a.fecha))
      .forEach(a => {
        const o = _getCampo(a.campo);
        o.jug.add(j);
        o.jorn.add(_fKeyC(a.fecha) + '|' + a.src);
      });
  });

  if(typeof IC_DATA !== 'undefined' && typeof APODO_A_NOMBRES_IC !== 'undefined'){
    const _apoDeNombre2 = n => apodoDesdeNombreIC(n);
    Object.values(IC_DATA).forEach(yd => {
      (yd.pruebas || []).forEach(p => {
        if(p.total === null || p.total === undefined || !p.camp) return;
        [p.par1, p.par2].forEach(pr => {
          if(!pr) return;
          [pr[0], pr[1]].forEach(n => {
            const apo = _apoDeNombre2(n);
            if(!apo || !PLAYERS.includes(apo)) return;
            const o = _getCampo(p.camp);
            o.jug.add(apo);
            o.jorn.add((p.fecha || '?') + '|ic');
          });
        });
      });
    });
  }

  const camposLista = Object.entries(detCampos)
    .map(([campo,o]) => ({ campo, nJug:o.jug.size, nJorn:o.jorn.size }))
    .sort((a,b) => b.nJorn - a.nJorn || b.nJug - a.nJug || a.campo.localeCompare(b.campo));

  h += '<div style="margin-top:16px;padding-top:12px;border-top:1px dashed #eee">';
  h += '<div style="font-size:10px;color:#aaa;margin-bottom:6px">Los ' + camposLista.length + ' campos del mapa</div>';
  h += '<div style="display:flex;align-items:center;gap:8px;padding:0 10px 4px 10px">'
    +'<div style="flex:1"></div>'
    +'<div style="width:64px;text-align:right;font-size:9px;color:#bbb;font-weight:600;letter-spacing:.3px">JORNADAS</div>'
    +'<div style="width:70px;text-align:right;font-size:9px;color:#bbb;font-weight:600;letter-spacing:.3px">JUGADORES</div>'
    +'</div>';
  camposLista.forEach(c => {
    h += '<div style="display:flex;align-items:center;gap:8px;padding:6px 10px;background:#fff;border-radius:7px;margin-bottom:3px;border:1px solid #eee">'
      +'<div style="flex:1;font-size:12px;font-weight:500">'+c.campo+'</div>'
      +'<div style="width:64px;text-align:right;font-size:13px;font-weight:700;color:#b45309">'+c.nJorn+'</div>'
      +'<div style="width:70px;text-align:right;font-size:12px;color:#9ca3af">'+c.nJug+'</div>'
      +'</div>';
  });
  h += '</div>';

  h += '</div>';

  // ── 🎰 El Metrónomo — desviación típica ponderada ────────────────────
  // Lee la σ única de calcHandicapGlobal: ventana de 10, deltas EFECTIVOS
  // (con ajustes de campo y contexto) y pesos α^i con α=0.7. Es exactamente
  // el mismo número que decide el badge 🏰🏠🎪📦 del HCP Global, así que las
  // dos pestañas no pueden contradecirse. Ordena de peor a mejor.
  const dispData = PLAYERS.map(j => {
    if(typeof calcHandicapGlobal !== 'function') return null;
    let g = calcHandicapGlobal(j);
    // Sin ventana completa no hay σ: reintento permitiendo muestra parcial,
    // igual que hace la convocatoria con hcpFallbackMedia.
    if(g.sigma === null || g.sigma === undefined) g = calcHandicapGlobal(j, undefined, true);
    if(g.sigma === null || g.sigma === undefined) return null;
    const u = (g.used || []).filter(a => typeof a.deltaEfectivo === 'number');
    if(!u.length) return null;
    const efec = u.map(a => a.deltaEfectivo);
    return { jugador:j, n:u.length, sd:g.sigma,
             min:Math.min(...efec), max:Math.max(...efec),
             pocos: u.length < 10 };
  }).filter(Boolean).sort((a,b) => {
    if(a.pocos !== b.pocos) return a.pocos ? 1 : -1;   // sin ventana completa, al final
    return b.sd - a.sd || a.jugador.localeCompare(b.jugador);
  });

  const _num = v => (Math.round(v*10)/10).toFixed(1).replace(/\.0$/,'');

  const _refugio = s => (s < 2.5 ? '🏰' : (s < 5 ? '🏠' : (s < 7 ? '🎪' : '📦')));

  h += '<div style="margin-top:26px;border-top:1px solid #eee;padding-top:16px">';
  h += '<div style="display:flex;align-items:baseline;gap:7px;margin-bottom:4px">'
    +'<span style="font-size:16px;line-height:1">🎰</span>'
    +'<span style="font-weight:700;font-size:14px">El Metrónomo</span>'
    +'<span style="font-weight:400;font-size:10px;color:#aaa">· desviación típica · últimas 10 vueltas</span>'
    +'</div>';
  h += '<div style="font-size:10px;color:#aaa;margin-bottom:8px">'
    +'Sobre el resultado efectivo (con ajustes de campo y contexto) y ponderado α=0.7: lo reciente pesa mucho más · misma σ que el refugio del HCP Global</div>';

  dispData.forEach((p,i) => {
    const peor = (i === 0 && !p.pocos);
    h += '<div style="display:flex;align-items:center;gap:8px;padding:7px 10px;background:'+(peor?'#fef2f2':'#fff')+';border-radius:7px;margin-bottom:4px;border:1px solid '+(peor?'#fecaca':'#eee')+';opacity:'+(p.pocos?'0.5':'1')+'">'
      +'<div style="width:26px;height:26px;border-radius:5px;background:'+(COLORS[p.jugador]||'#eee')+';display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;color:#333;flex-shrink:0">'+p.jugador.slice(0,3)+'</div>'
      +'<div style="flex:1;font-weight:500;font-size:12px">'+p.jugador+(p.pocos?' <span style="font-size:9px;color:#bbb">· sólo '+p.n+' vueltas</span>':'')+'</div>'
      +'<div style="font-size:13px;margin-right:2px">'+_refugio(p.sd)+'</div>'
      +'<div style="display:flex;align-items:baseline;gap:5px">'
        +'<div style="font-weight:700;font-size:16px;color:'+(peor?'#b91c1c':'#6b7280')+';min-width:38px;text-align:right">'+p.sd.toFixed(2)+'</div>'
        +'<div style="font-size:11px;color:#9ca3af">('+_num(p.min)+' a '+_num(p.max)+')</div>'
      +'</div>'
      +'</div>';
  });
  h += '</div>';

  // ── 🧨 El Fusible — cada cuántas partidas salta un doble dígito ───────
  // Ratio = partidas / nº de partidas con doble dígito (delta >= 10) sobre la
  // ventana de las ULTIMAS 30 actuaciones. Todos los contextos, desde
  // 01/01/2026, Canal Olimpic fuera (mismo criterio que Records Globales).
  // La racha (actual y record) se calcula sobre TODO 2026, no sobre la ventana.
  // Sin ningun doble digito en la ventana => fusible intacto, va arriba.
  // Todo dinamico desde _recopilarActuacionesGlobal — nada hardcoded.
  const FUS_VENTANA = 30;                      // tamano de la ventana movil
  const FUS_MIN = 10;                          // umbral estandar de actuaciones
  const FUS_INICIO = new Date(2026, 0, 1);
  const FUS_CAMPOS_EXCL = ['Canal Olímpic'];

  const fusData = PLAYERS.map(j => {
    const acts = _recopilarActuacionesGlobal(j)
      .filter(a => !a.abandono && a.fecha instanceof Date && a.fecha >= FUS_INICIO
                   && !FUS_CAMPOS_EXCL.includes(a.campo))
      .sort((a,b) => a.fecha - b.fecha);
    if(!acts.length) return null;
    const vent = acts.slice(-FUS_VENTANA);
    const dd = vent.filter(a => a.delta >= 10).length;
    // rachas sobre todo 2026
    let best = 0, cur = 0;
    acts.forEach(a => { if(a.delta >= 10) cur = 0; else { cur++; if(cur > best) best = cur; } });
    return { jugador:j, n:vent.length, dd,
             ratio: dd === 0 ? Infinity : vent.length / dd,
             actual:cur, best,
             pocos: acts.length < FUS_MIN };
  }).filter(Boolean).sort((a,b) => {
    if(a.pocos !== b.pocos) return a.pocos ? 1 : -1;
    return b.ratio - a.ratio || a.jugador.localeCompare(b.jugador);
  });

  const _fusNum = r => (r === Infinity ? '∞' : (Math.round(r*100)/100).toFixed(2));

  h += '<div style="margin-top:26px;border-top:1px solid #eee;padding-top:16px">';
  h += '<div style="display:flex;align-items:baseline;gap:7px;margin-bottom:4px">'
    +'<span style="font-size:16px;line-height:1">🧨</span>'
    +'<span style="font-weight:700;font-size:14px">El Fusible</span>'
    +'<span style="font-weight:400;font-size:10px;color:#aaa">· cada cuántas partidas salta · últimas '+FUS_VENTANA+'</span>'
    +'</div>';
  h += '<div style="font-size:10px;color:#aaa;margin-bottom:8px">'
    +'Partidas ÷ partidas con doble dígito (+10 o peor) · todos los contextos desde 01/01/2026 · Canal Olímpic fuera · '
    +'entre paréntesis, el récord de racha sin doble dígito de 2026</div>';

  if(!fusData.length){
    h += '<div style="font-size:11px;color:#aaa;padding:8px">Sin datos.</div>';
  } else {
    fusData.forEach((p,i) => {
      const lider = (i === 0 && !p.pocos);
      const viva  = (p.actual > 0 && p.actual === p.best);
      h += '<div style="display:flex;align-items:center;gap:8px;padding:7px 10px;background:'+(lider?'#f0fdf4':'#fff')+';border-radius:7px;margin-bottom:4px;border:1px solid '+(lider?'#bbf7d0':'#eee')+';opacity:'+(p.pocos?'0.5':'1')+'">'
        +'<div style="width:26px;height:26px;border-radius:5px;background:'+(COLORS[p.jugador]||'#eee')+';display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;color:#333;flex-shrink:0">'+p.jugador.slice(0,3)+'</div>'
        +'<div style="flex:1;font-weight:500;font-size:12px">'+p.jugador
          +(p.pocos?' <span style="font-size:9px;color:#bbb">· sólo '+p.n+' partidas</span>':'')+'</div>'
        +'<div style="font-size:10px;color:#bbb;margin-right:4px">'+p.dd+'/'+p.n+'</div>'
        +'<div style="display:flex;align-items:baseline;gap:5px">'
          +'<div style="font-weight:700;font-size:16px;color:'+(lider?'#15803d':'#6b7280')+';min-width:40px;text-align:right">'+_fusNum(p.ratio)+'</div>'
          +'<div style="font-size:11px;color:'+(p.actual>0?'#0f766e':'#ccc')+';min-width:44px;text-align:right">'+p.actual+' ('+p.best+')'+(viva?' 🔥':'')+'</div>'
        +'</div>'
        +'</div>';
    });
  }
  h += '</div>';

  // ── 📈 Progresión del equipo ─────────────────────────────────────────
  // Jornada = misma fecha + mismo contexto + mismo campo (misma clave que
  // El Fucker). Media de jornada = media aritmética del delta EFECTIVO
  // (delta crudo + ajuste de campo + ajuste de contexto) de todos los que
  // jugaron esa jornada; abandonos fuera.
  // Progresión = media de las 10 jornadas de cada ventana móvil, deslizando
  // de 1 en 1 desde la ventana más antigua hasta la última.
  // Todo dinámico desde _recopilarActuacionesGlobal — nada hardcoded.
  const MIN_PART_PROG = 3;          // jornadas con menos participantes se descartan

  const gruposProg = {};
  PLAYERS.forEach(j => {
    _recopilarActuacionesGlobal(j)
      .filter(a => a.fecha instanceof Date && !isNaN(+a.fecha) && !a.abandono && a.fecha >= FECHA_INICIO_PROG
                   && !CAMPOS_EXCLUIDOS_PROG.includes(a.campo))
      .forEach(a => {
        const k = _fKey(a.fecha) + '|' + a.src + '|' + (a.campo || '');
        (gruposProg[k] = gruposProg[k] || []).push(a);
      });
  });

  const jornadasProg = Object.keys(gruposProg).map(k => {
    const arr = gruposProg[k];
    const efec = arr.map(a => a.delta + ajusteRecorrido(a.campo, a.recorrido) + ajusteContexto(a.src));
    return { fecha:arr[0].fecha, src:k.split('|')[1], campo:k.split('|')[2] || '—',
             n:arr.length, media:efec.reduce((s2,v) => s2 + v, 0) / efec.length,
             jugadores:arr.map((a,i) => ({ jugador:a.jugador, delta:a.delta, efectivo:efec[i] }))
                          .sort((a,b) => a.efectivo - b.efectivo) };

  } else {
    h += '<div style="background:#fff;border:1px solid #eee;border-radius:8px;padding:8px 10px 4px">'
      + _progChartSVG(ventanasProg, '#3b82f6') + '</div>';
    h += _progCardsHTML(ventanasProg, "window.__mostrarVentanaProg({idx},'{tit}')");

  // actuaciones (a partir de la 10ª) se llama a calcHandicapGlobal(jugador, fecha)
  // con esa fecha como corte. El resultado es EXACTAMENTE el mismo número que
  // muestra la pestaña Hándicap Global ese día: incluye descuento de
  // adaptabilidad, penalización por inactividad y por ventana estirada.
  // Única diferencia con la pestaña Hándicap Global: aquí se excluye Canal
  // Olímpic (CAMPOS_EXCLUIDOS_PROG), igual que en la progresión del equipo.

  const progJugData = PLAYERS.map(_progVentanasJugador).sort((a,b) => {
    const aOk = a.vents.length > 0, bOk = b.vents.length > 0;
    if(aOk !== bOk) return aOk ? -1 : 1;                 // sin ventana completa, al final
    if(aOk) return a.vents[a.vents.length-1].v - b.vents[b.vents.length-1].v;
    return b.n - a.n || a.jugador.localeCompare(b.jugador);
  });
  // Se expone para el modal de detalle (window.__mostrarVentanaProgJug).
  window.__PROG_JUG = progJugData;

  h += '<div style="margin-top:26px;border-top:1px solid #eee;padding-top:16px">';

    +'<span style="font-weight:400;font-size:10px;color:#aaa">· histórico del HCP Global · ventana móvil de '+PROG_N+' actuaciones</span>'
    +'</div>';

  progJugData.forEach((p, pi) => {

    const prev = (tieneVent && p.vents.length > 1) ? p.vents[p.vents.length-2] : null;
    const dl = prev ? act.v - prev.v : 0;
    const flecha = !prev ? '' : (dl < -0.005 ? '<span style="color:#15803d">🔻</span>' : (dl > 0.005 ? '<span style="color:#b91c1c">🔺</span>' : '<span style="color:#9ca3af">➖</span>'));

    h += '<div style="margin-bottom:4px;opacity:'+(tieneVent?'1':'0.5')+'">';

      +'style="display:flex;align-items:center;gap:8px;padding:7px 10px;background:#fff;border:1px solid #eee;border-radius:7px;'+(tieneVent?'cursor:pointer':'')+'">'

      +'<div style="flex:1;font-weight:500;font-size:12px">'+p.jugador
        +(tieneVent ? ' <span style="font-size:9px;color:#bbb">· '+p.vents.length+' ventanas</span>'
                    : ' <span style="font-size:9px;color:#bbb">· '+p.n+'/'+PROG_N+' actuaciones</span>')+'</div>'
      +(tieneVent ? '<div style="font-size:11px;margin-right:2px">'+flecha+'</div>'
        +'<div style="font-weight:700;font-size:16px;color:'+(act.v<=0?'#15803d':(act.v<=5?'#c2410c':'#991b1b'))+';min-width:46px;text-align:right">'+_sgProg(act.v)+'</div>' : '')
      +'<div class="progj-chev" style="font-size:11px;color:#bbb;width:12px;text-align:center">'+(tieneVent?'▸':'')+'</div>'
      +'</div>';
    // Panel desplegable
    if(tieneVent){

      h += '</div>';
    }
    h += '</div>';
  });
  h += '</div>';

  h += '</div>';
  el.innerHTML = h;
}
