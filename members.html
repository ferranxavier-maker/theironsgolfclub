<style>
  :root {
    --negro: #000000;
    --hueso: #EFEAE1;
    --tinta: #1A1714;
    --gris: #6E665D;
    --linea: #D9D1C4;
    --bronce: #8A6A4E;

    --condensada: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    --sans: "Barlow", "Helvetica Neue", Helvetica, Arial, sans-serif;

    --ancho: 1280px;
    --margen: clamp(20px, 5vw, 72px);
    --franja: 64px;
    box-sizing: border-box;
  }
  *, *::before, *::after { box-sizing: inherit; margin: 0; padding: 0; }
  html { background: var(--hueso); }
  body {
    background: var(--hueso);
    color: var(--tinta);
    font-family: var(--sans);
    font-weight: 400;
    font-size: 17px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  img { display: block; max-width: 100%; height: auto; }
  a { color: inherit; }
  :focus-visible { outline: 1px solid var(--bronce); outline-offset: 4px; }

  .contenedor { max-width: var(--ancho); margin: 0 auto; padding: 0 var(--margen); }

  /* Rótulos: mayúsculas finas y muy espaciadas, como GOLF CLUB en el escudo */
  .rotulo {
    font-family: var(--condensada); font-weight: 500; text-transform: uppercase;
    font-size: 13px; letter-spacing: .38em;
    color: var(--bronce);
  }

  /* ---------- Franja superior (vacía de momento) ---------- */
  .franja {
    background: var(--negro);
    height: calc(var(--franja) + env(safe-area-inset-top, 0px));
    padding-top: env(safe-area-inset-top, 0px);
  }
  .franja .contenedor { height: 100%; display: flex; justify-content: flex-end; align-items: center; }
  .franja nav { display: flex; gap: 40px; }
  .franja a {
    text-decoration: none; color: #C9A887;
    font-family: var(--condensada); font-weight: 500; text-transform: uppercase;
    font-size: 13px; letter-spacing: .38em; margin-right: -.38em; /* compensa el tracking final */
    padding: 8px 0; transition: color .2s;
  }
  .franja a:hover { color: var(--hueso); }
  .franja a:focus-visible { outline-color: #C9A887; }



  /* ---------- Página Members ---------- */
  .members { padding: 64px var(--margen) 96px; }
  .members .interior { max-width: 880px; margin: 0 auto; text-align: center; }
  .members .inicio { display: inline-block; }
  .members .inicio img {
    width: 86px; margin: 0 auto;
    filter: drop-shadow(0 8px 12px rgba(26,23,20,.25));
  }
  .members h1 {
    margin-top: 36px;
    font-family: var(--condensada); font-weight: 700; text-transform: uppercase;
    font-size: clamp(52px, 8vw, 88px); line-height: .95; letter-spacing: .04em; padding-left: .04em;
  }
  .members .intro { max-width: 52ch; margin: 22px auto 0; color: var(--gris); font-size: 18px; }
  .boton {
    display: inline-block; margin-top: 44px; text-decoration: none;
    font-family: var(--condensada); font-weight: 500; text-transform: uppercase;
    font-size: 14px; letter-spacing: .32em;
    padding: 17px 38px 17px calc(38px + .32em);
    background: var(--negro); color: var(--hueso); border: 1px solid var(--negro);
    transition: background-color .2s, color .2s;
  }
  .boton:hover { background: transparent; color: var(--tinta); }


  /* ---------- Portada ---------- */
  .portada {
    min-height: calc(100svh - var(--franja));
    display: grid; place-items: center; text-align: center;
    padding: 72px var(--margen);
  }
  .portada .escudo {
    width: min(380px, 70vw, 52svh); margin: 0 auto;
    filter: drop-shadow(0 22px 28px rgba(26,23,20,.28)) drop-shadow(0 4px 6px rgba(26,23,20,.18));
  }
  .portada .datos {
    white-space: nowrap;
    display: flex; justify-content: center; align-items: center; gap: 22px;
    margin-top: 40px;
  }
  .portada .datos i { width: 44px; height: 1px; background: var(--bronce); opacity: .6; }

  @media (prefers-reduced-motion: no-preference) {
    .portada .escudo { opacity: 0; transform: translateY(8px); animation: entra 1.4s cubic-bezier(.2,.7,.2,1) .15s forwards; }
    .portada .datos { opacity: 0; animation: entra 1s ease 1s forwards; }
  }
  @keyframes entra { to { opacity: 1; transform: none; } }

  /* ---------- Pie ---------- */
  .pie { padding: 36px 0 calc(20px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--linea); }
  .pie .fila { display: grid; grid-template-columns: repeat(3, auto); gap: 40px; justify-content: space-between; }
  .pie h4 { font-family: var(--condensada); font-weight: 600; text-transform: uppercase; font-size: 13px; letter-spacing: .3em; color: var(--bronce); margin-bottom: 10px; }
  .pie h4 a { text-decoration: none; transition: color .2s; }
  .pie h4 a:hover { color: var(--tinta); }
  .pie ul { list-style: none; }
  .pie li { margin-bottom: 8px; font-size: 15px; color: var(--gris); }
  .pie li a { text-decoration: none; transition: color .2s; }
  .pie li a:hover { color: var(--tinta); }
  .legal {
    margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--linea);
    display: flex; justify-content: flex-end;
    font-size: 13px; color: var(--gris);
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 820px) {
    .pie .fila { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 560px) {
    :root { --franja: 56px; }
    .portada .datos { gap: 14px; letter-spacing: .3em; }
    .portada .datos i { width: 22px; }
  }
</style>
</head>
